---
# FileAssert document validation tests for WordSense.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: api-docs, build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: api-docs tests provide OTS evidence for ApiMark and run in the build matrix job,
# immediately after the build that produces the generated API reference.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- API REFERENCE ---
  # ApiMark generates the API reference from the package's XML doc comments during the build,
  # into the project's generated/api folder. These tests assert the real generated output.

  - name: ApiMark_ApiIndex
    description: "WordSense API reference index was generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.WordSense/generated/api/api.md"
        count: 1
        text:
          - contains: "DemaConsulting.WordSense"

  - name: ApiMark_ExampleCodeRendered
    description: "ApiMark rendered a documented example as a fenced code block"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.WordSense/generated/api/DemaConsulting.WordSense/WordLexicon.md"
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_TerminologyDocumented
    description: "The shared terminology remarks survive into the generated API reference"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.WordSense/generated/api/DemaConsulting.WordSense/ClassifyResult.md"
        count: 1
        text:
          - contains: "confidence"

  - name: ApiMark_ModelContractDocumented
    description: "The model contract type is documented and generated with an example"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.WordSense/generated/api/DemaConsulting.WordSense/IWordSenseModel.md
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_MiniLMModelDocumented
    description: "The MiniLM model class is documented and generated with an example"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.WordSense.MiniLM/generated/api/DemaConsulting.WordSense.MiniLM/MiniLMWordSenseModel.md
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_BasicModelDocumented
    description: "The Basic model class (in the core package) is documented and generated with an example"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.WordSense/generated/api/DemaConsulting.WordSense/BasicWordSenseModel.md
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_OnnxModelDocumented
    description: "The shared ONNX model base class is documented and generated with an example"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.WordSense.Onnx/generated/api/DemaConsulting.WordSense.Onnx/OnnxWordSenseModel.md
        count: 1
        text:
          - contains: "```csharp"

  - name: ApiMark_BertBaseCasedModelDocumented
    description: "The BertBaseCased model class is documented and generated with an example"
    tags: [api-docs]
    files:
      - pattern: >-
          src/DemaConsulting.WordSense.BertBaseCased/generated/api/DemaConsulting.WordSense.BertBaseCased/BertBaseCasedWordSenseModel.md
        count: 1
        text:
          - contains: "```csharp"

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/WordSense Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "WordSense"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

