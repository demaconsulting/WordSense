---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en,en-GB

# Project-specific technical terms and tool names
words:
  - tatoeba
  - featurized
  - overcall
  - overstudies
  - udict
  - EBCA
  - ccby
  - realtext
  - Relabeler
  - retag
  - retags
  - retagged
  - pastpart
  - presentpart
  - buildmark
  - DEMA
  - Dema
  - FileAssert
  - fileassert
  - xunit
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - Sarif
  - SARIF
  - sarifmark
  - sonarmark
  - sysml
  - versionmark
  - Weasy
  - WeasyPrint
  - weasyprint
  - netstandard
  - yamlfix
  - onnx
  - huggingface
  - nonspacing
  - onnxruntime
  - ordinally
  - tagless
  - wordsense
  - wsns
  - subword
  - softplus
  - featurize
  - finalizer
  - unregularized
  - disjointness
  - redownloaded
  - unpadded

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/audit-work/**"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  - model/**
  - corpus/**
  - tools/real-text/cache/**
  - tools/tokenizer-fixture/**
  - test/**/Fixtures/**
