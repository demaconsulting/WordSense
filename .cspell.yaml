# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/audit-work/**"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  - model/**
  - corpus/**
  - tools/real-text/cache/**
  - tools/tokenizer-fixture/**
  # Generated from the corpus (lemma inventory and real sentences contain many rare words and names)
  - docs/user_guide/appendix-senses.md
  - test/**/Fixtures/**
