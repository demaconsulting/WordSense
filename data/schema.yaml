---
# WordSense data schema, version 4 (version 3 plus the column kind of sense_group and the group id scheme
# lemma#group:label; version 3 was version 2 without the retired class tables and the form scopes; version 2 was
# version 1 plus the sense inventory: labels, groups, frequencies, respellings).
#
# The committed tables under data/ are the authoritative word data: they are validated by `validate-data`, never
# regenerated over edits. This file is a restricted YAML subset (block mappings, block sequences, flow sequences of
# scalars, comments); see data/README.md and docs/design/word-sense/word-data/data-schema.md.
#
# Column types: text, id (no white space), int (canonical non-negative decimal), enum:<vocabulary>, features
# (set of Feature=Value items joined by '+'). A trailing '?' allows an empty cell (NULL). An empty cell in a primary
# key column is allowed only for a nullable column and sorts first.
# Rows are sorted by the primary key columns in the order listed, by UTF-8 bytes (int columns numerically).
schema_version: 4
data_release: oewn-2025

# First letters whose files are split by the first two letters of the lemma (data/<table>/sa.tsv, s_.tsv, ...).
# Written by `import-oewn`; the validator checks placement against this plan and never infers it.
file_split: [a, b, c, p, s]

vocabularies:
  pos:
    n: noun
    v: verb
    a: adjective
    r: adverb
    u: pronoun
    p: preposition
    c: conjunction
    i: interjection
    d: determiner
    x: auxiliary
  form_provenance:
    oewn_form: a written form listed by the Open English WordNet entry
    irregular_list: a form of a closed list of irregular forms of the language
    rule: a form produced by the regular suffix and spelling rules
    rule_variant: an attested variant produced by the rules or written as a variant in the authored forms
    moby_reverse: a form of the Moby word list that a reverse rule traces to its base word
    contraction: a form of the closed list of contractions
    carried: an analysis kept unchanged from the earlier table because a review depends on it
    hand: a form of a hand-written list of project decisions
    llm: a form written for the project by a language model and checked blind by a second model (forms-authored.tsv)
  synset_pos:
    n: noun
    v: verb
    a: adjective
    r: adverb
    s: adjective satellite
    u: pronoun (a project sense)
    p: preposition (a project sense)
    c: conjunction (a project sense)
    i: interjection (a project sense)
    d: determiner (a project sense)
    x: auxiliary (a project sense)
  label_origin:
    curated: a label chosen by hand for a curated lemma
    generated: a label written by the label generator for a sense of Open English WordNet
    project: the label of a project sense, a sense that Open English WordNet does not provide
  group_origin:
    curated: a group chosen by hand, two or more but not all confusable senses of a lemma and part of speech
  group_kind:
    equivalent: near-duplicate senses, which the source splits finely but which have effectively one meaning
    related: a genuine family of meanings that are close but not one meaning
  frequency_source:
    wn30: the WordNet 3.0 tag count of the sense key
  relation_subtype:
    agent: the agent of an event
    body_part: a body part
    by_means_of: the means by which something is done
    destination: the destination of an event
    event: the event of an agent, state or result
    instrument: the instrument of an event
    location: the location of an event
    material: the material something is made of
    property: the property of a state or attribute
    result: the result of an event
    state: the state of a property
    undergoer: the undergoer of an event
    uses: what something is used for
    vehicle: the vehicle of an event
  synset_relation_type:
    hypernym:
      inverse: hyponym
      symmetric: false
      stored: true
    hyponym:
      inverse: hypernym
      symmetric: false
      stored: false
    mero_member:
      inverse: holo_member
      symmetric: false
      stored: true
    holo_member:
      inverse: mero_member
      symmetric: false
      stored: false
    mero_part:
      inverse: holo_part
      symmetric: false
      stored: true
    holo_part:
      inverse: mero_part
      symmetric: false
      stored: false
    mero_substance:
      inverse: holo_substance
      symmetric: false
      stored: true
    holo_substance:
      inverse: mero_substance
      symmetric: false
      stored: false
    domain_topic:
      inverse: has_domain_topic
      symmetric: false
      stored: true
    has_domain_topic:
      inverse: domain_topic
      symmetric: false
      stored: false
    domain_region:
      inverse: has_domain_region
      symmetric: false
      stored: true
    has_domain_region:
      inverse: domain_region
      symmetric: false
      stored: false
    exemplifies:
      inverse: is_exemplified_by
      symmetric: false
      stored: true
    is_exemplified_by:
      inverse: exemplifies
      symmetric: false
      stored: false
    entails:
      inverse: is_entailed_by
      symmetric: false
      stored: true
    is_entailed_by:
      inverse: entails
      symmetric: false
      stored: false
    causes:
      inverse: is_caused_by
      symmetric: false
      stored: true
    is_caused_by:
      inverse: causes
      symmetric: false
      stored: false
    similar:
      inverse: similar
      symmetric: true
      stored: true
    also:
      inverse: also
      symmetric: true
      stored: true
    attribute:
      inverse: attribute
      symmetric: true
      stored: true
  sense_relation_type:
    antonym:
      inverse: antonym
      symmetric: true
      stored: true
    derivation:
      inverse: derivation
      symmetric: true
      stored: true
    also:
      inverse: also
      symmetric: true
      stored: true
    similar:
      inverse: similar
      symmetric: true
      stored: true
    exemplifies:
      inverse: is_exemplified_by
      symmetric: false
      stored: true
    is_exemplified_by:
      inverse: exemplifies
      symmetric: false
      stored: false
    pertainym:
      inverse: ""
      symmetric: false
      stored: true
    participle:
      inverse: ""
      symmetric: false
      stored: true
    other:
      inverse: ""
      symmetric: false
      stored: true

# The closed feature vocabulary of the analysis (form) table.
features:
  Number: [Sing, Plur]
  Tense: [Pres, Past]
  VerbForm: [Inf, Fin, Part, Ger]
  Person: ["3"]
  Degree: [Pos, Cmp, Sup]
  Poss: ["Yes"]
  Contraction: ["Yes"]
  Capitalization: [Lower, Title, Upper, Exact]

tables:
  source:
    description: The origin of rows (a word-data release or a supplementary source).
    columns:
      source_id: id
      name: text
      license: text
      url: text
      version: text
    primary_key: [source_id]
    partition:
      by: none

  entry:
    description: A lemma with a part of speech and a homograph number (OEWN lexical entry).
    columns:
      entry_id: id
      lemma: text
      pos: enum:pos
      homograph_no: int
      token_count: int
      head_idx: int
      source_id: id
    primary_key: [entry_id]
    unique:
      - [lemma, pos, homograph_no]
    foreign_keys:
      source_id: source.source_id
    partition:
      by: lemma
      column: lemma

  synset:
    description: A set of senses with one meaning (OEWN synset).
    columns:
      synset_id: id
      pos: enum:synset_pos
      head_synset_id: id?
      lexfile: text?
    primary_key: [synset_id]
    foreign_keys:
      head_synset_id: synset.synset_id
    partition:
      by: synset
      column: synset_id

  gloss:
    description: The definition text of a synset (one row per definition).
    columns:
      synset_id: id
      seq: int
      text: text
    primary_key: [synset_id, seq]
    foreign_keys:
      synset_id: synset.synset_id
    partition:
      by: synset
      column: synset_id

  example:
    description: An example phrase of a synset.
    columns:
      synset_id: id
      seq: int
      sense_id: id?
      text: text
    primary_key: [synset_id, seq]
    foreign_keys:
      synset_id: synset.synset_id
      sense_id: sense.sense_id
    partition:
      by: synset
      column: synset_id

  sense:
    description: A lemma-in-a-synset (OEWN sense); its part of speech comes from the synset.
    columns:
      sense_id: id
      sense_key: text?
      entry_id: id
      synset_id: id
      position: int
    primary_key: [sense_id]
    unique:
      - [entry_id, position]
      - [sense_key]
    foreign_keys:
      entry_id: entry.entry_id
      synset_id: synset.synset_id
    partition:
      by: entry
      column: entry_id

  synset_relation:
    description: A relation between synsets, stored in one direction; the inverse is derived.
    columns:
      from_synset: id
      rel: enum:synset_relation_type
      to_synset: id
    primary_key: [from_synset, rel, to_synset]
    foreign_keys:
      from_synset: synset.synset_id
      to_synset: synset.synset_id
    partition:
      by: synset
      column: from_synset

  sense_relation:
    description: A relation between senses, stored in one direction; the inverse is derived.
    columns:
      from_sense: id
      rel: enum:sense_relation_type
      rel_subtype: enum:relation_subtype?
      to_sense: id
    primary_key: [from_sense, rel, rel_subtype, to_sense]
    foreign_keys:
      from_sense: sense.sense_id
      to_sense: sense.sense_id
    partition:
      by: sense
      column: from_sense

  pronunciation:
    description: A pronunciation (IPA) of an entry as given by the source; a hint, not a decision.
    columns:
      entry_id: id
      seq: int
      variety: text?
      text: text
    primary_key: [entry_id, seq]
    foreign_keys:
      entry_id: entry.entry_id
    partition:
      by: entry
      column: entry_id

  id_map:
    description: Maps an identifier of an earlier release to the identifier of a later one.
    columns:
      old_id: id
      new_id: id
      release: text
    primary_key: [old_id, release]
    partition:
      by: none

  form:
    description: One analysis of a written form, with its entry or surface lemma, features, answer rank and provenance.
    columns:
      spelling: text
      rank: int
      entry_id: id?
      features: features?
      source_id: id
      reviewed: int
      lemma: text?
      pos: enum:pos?
      provenance: enum:form_provenance
    primary_key: [spelling, rank]
    foreign_keys:
      entry_id: entry.entry_id
      source_id: source.source_id
    partition:
      by: lemma
      column: spelling

  # ---- the sense inventory: readable labels, groups, frequencies and respellings ----
  # The library classifies single words, so the inventory covers the senses of lemmas of one token (entry.token_count 1)
  # and every project sense. The public id of a sense is lemma#label; the id of a group is lemma#group:label of the
  # group,
  # so a group id can never be the id of a sense. Sense ids are frozen once published; group ids are versioned per data
  # release and are not frozen.

  sense_label:
    description: The readable label of a sense (public id lemma#label), unique in its lemma and frozen once published.
    columns:
      sense_id: id
      label: id
      origin: enum:label_origin
    primary_key: [sense_id]
    foreign_keys:
      sense_id: sense.sense_id
    partition:
      by: sense
      column: sense_id

  sense_label_map:
    description: Renames and retirements of public sense ids (an empty new_id retires the id); an old id is not reused.
    columns:
      old_id: id
      new_id: id?
      release: text
    primary_key: [old_id, release]
    partition:
      by: none

  sense_group:
    description: A curated group of 2+, but not all, confusable senses of a part of speech; id lemma#group:label
    columns:
      group_id: id
      lemma: text
      pos: enum:pos
      label: id
      origin: enum:group_origin
      kind: enum:group_kind
    primary_key: [group_id]
    unique:
      - [lemma, label]
    partition:
      by: lemma
      column: lemma

  group_sense:
    description: Assigns a sense to its group; a sense is in at most one group and needs none.
    columns:
      group_id: id
      sense_id: id
    primary_key: [group_id, sense_id]
    unique:
      - [sense_id]
    foreign_keys:
      group_id: sense_group.group_id
      sense_id: sense.sense_id
    partition:
      by: sense
      column: sense_id

  sense_frequency:
    description: The WordNet 3.0 tag count of a sense key, 0 for a sense that the counts file does not list.
    columns:
      sense_key: text
      tag_count: int
      source: enum:frequency_source
    primary_key: [sense_key]
    foreign_keys:
      sense_key: sense.sense_key
    partition:
      by: key
      column: sense_key

  sense_respelling:
    description: The respelling of a sense whose pronunciation differs from the other senses of its lemma.
    columns:
      sense_id: id
      respelling: text
    primary_key: [sense_id]
    foreign_keys:
      sense_id: sense.sense_id
    partition:
      by: sense
      column: sense_id
