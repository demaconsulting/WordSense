---
# Software System Requirements for WordSenseMiniLM (the package DemaConsulting.WordSense.MiniLM)
#
# These requirements describe the externally visible behavior of the MiniLM model package from the perspective of
# its consumers, without specifying implementation details. The package supplies one encoder model for the core
# package: its model files, the encoder, the download of the model files and the weights table trained for it.

sections:
  - title: MiniLM Package API
    requirements:
      - id: WordSenseMiniLM-Lib-Factory
        title: >-
          The package shall create a ready-to-use classifier that combines the core lexicon, the weights table
          embedded for the MiniLM model and the verified model files, obtaining the model files first when none
          are supplied, and shall reject invalid options before it downloads or reads anything.
        tags: [system]
        justification: |
          Most callers want context answers without wiring tokenizer, encoder, weights and downloader by hand; one
          call that does it, and that fails fast on bad options, keeps the common case simple and safe.
        children:
          - WordSenseMiniLM-Factory-Create
          - WordSenseMiniLM-Factory-Directory
          - WordSenseMiniLM-Factory-Validation
        tests:
          - WordSense_Classifier_EndToEnd_ClassifiesRecord
          - WordSense_Classifier_CreateAsync_ValidatesOptionsBeforeModel

      - id: WordSenseMiniLM-Lib-EmbeddedWeights
        title: >-
          The package shall embed the weights table trained for the MiniLM model, identified by the model
          identifier and the SHA-256 of the model file, and that table shall match the model and the core lexicon.
        tags: [system]
        justification: |
          Embedding the weights makes the package self-contained apart from the model file, and naming the model
          file digest in the table prevents using weights with a model they were not trained for.
        children:
          - WordSenseMiniLM-Factory-Weights
        tests:
          - WordSense_EmbeddedWeights_MatchPinnedModelAndLexicon

      - id: WordSenseMiniLM-Lib-Encoder
        title: The package shall compute contextual embeddings of words in a text with ONNX Runtime.
        tags: [system]
        justification: |
          The embeddings of the surrounding sentence are the evidence for the sense decision; the encoder wraps
          ONNX Runtime and the tokenizer so the core package depends only on a small abstraction.
        children:
          - WordSense-Encoder-Encode
          - WordSense-Encoder-Identity
          - WordSense-Encoder-Validation
          - WordSense-Encoder-Concurrency
          - WordSense-Encoder-LongText
          - WordSense-Tokenizer-Window
          - WordSense-Tokenizer-Spans
          - WordSense-OTS-OnnxRuntime-Inference
        tests:
          - WordSense_Classifier_EndToEnd_ClassifiesRecord

      - id: WordSenseMiniLM-Lib-ModelDownload
        title: The package shall obtain missing model files from ordered sources (mirror, Hugging Face, GitHub LFS).
        tags: [system]
        justification: |
          Users in restricted networks need to supply their own mirror, while everyone else gets
          the files from public hosting. Falling through the list keeps the package working when
          one host is blocked or unavailable.
        children:
          - WordSense-Downloader-Order
          - WordSense-Downloader-Fallthrough
          - WordSense-Downloader-AllFail
          - WordSense-Downloader-Present
          - WordSense-Downloader-Cancel
          - WordSense-Downloader-Progress
          - WordSense-Downloader-Options
          - WordSense-Downloader-Location
          - WordSense-Downloader-StoreRoot
        tests:
          - WordSenseModelDownloader_EnsureModel_MirrorFails_FallsThroughInOrder
          - WordSenseModelDownloader_EnsureModel_NoMirror_HuggingFaceThenLfs

      - id: WordSenseMiniLM-Lib-Mirror
        title: The package shall support a user download mirror set by environment variables or options.
        tags: [system]
        justification: |
          Enterprises and offline users host the model on their own server; environment variables and
          options let a deployment point the package at it without code changes.
        children:
          - WordSense-Mirror-Validation
          - WordSense-Mirror-Environment
          - WordSense-Mirror-Redaction
          - WordSense-Downloader-MirrorConfig
          - WordSense-Downloader-Credentials
        tests:
          - WordSenseModelDownloader_EnsureModel_MirrorFromEnvironment_IsUsedFirst
          - WordSenseModelDownloader_EnsureModel_ProgrammaticMirror_BeatsEnvironment

      - id: WordSenseMiniLM-Lib-Integrity
        title: The package shall verify the SHA-256 digest of every model file against pinned values.
        tags: [system]
        justification: |
          A model file that does not match the pinned digest could silently change results or carry
          malicious content; every source is therefore treated as untrusted until verified.
        children:
          - WordSense-Downloader-Integrity
        tests:
          - WordSenseModelDownloader_EnsureModel_HashMismatch_FallsThroughAndKeepsNothingBad

      - id: WordSenseMiniLM-Lib-Performance
        title: >-
          The package shall classify a sentence with four ambiguous words with a median latency below two seconds,
          with one and with four threads.
        tags: [system]
        justification: |
          Interactive callers need classification latency that does not block a user interface;
          the benchmark enforces the median bound and records the 95th percentile latency for one
          and four threads. The sentence is fixed (four ambiguous words), and the typical latency is a few milliseconds.
        tests:
          - WordSense_Benchmark_ClassifyLatency
