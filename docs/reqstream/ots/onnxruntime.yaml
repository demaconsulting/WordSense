---
# ONNX Runtime OTS Software Requirements
#
# Requirements for the Microsoft.ML.OnnxRuntime runtime dependency.

sections:
  - title: OTS Software Requirements
    sections:
      - title: ONNX Runtime Requirements
        requirements:
          - id: WordSense-OTS-OnnxRuntime-Inference
            title: ONNX Runtime shall execute the pinned quantized transformer model and return its hidden states.
            justification: |
              Microsoft.ML.OnnxRuntime is the only runtime dependency of the library. It loads the
              int8 MiniLM model and computes the contextual embeddings used for the sense decision.
              A passing end-to-end test proves the runtime loads the model and produces usable output
              on the platform under test.
            tags: [ots]
            tests:
              - OnnxWordSenseEncoder_EncodeAsync_ValidIds_ReturnsHiddenStates
              - WordSense_Classifier_EndToEnd_ClassifiesRecord
