---
# Software System Requirements for WordSense
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: Library API
    requirements:
      - id: WordSense-Lib-Classify
        title: The library shall classify the sense of known ambiguous words in free text and tile the whole input.
        tags: [system]
        justification: |
          This is the purpose of the library: given a text, callers learn which sense each
          homograph (for example "record" as noun or verb) carries, while the returned tokens
          still reproduce the input exactly so callers can map results back to the text.
        children:
          - WordSense-Classifier-Tiles
          - WordSense-Classifier-Senses
          - WordSense-Classifier-LongText
          - WordSense-Classifier-Lifetime
          - WordSense-Classifier-Detail
          - WordSense-Sense-Words
        tests:
          - WordSense_Classifier_EndToEnd_ClassifiesRecord
          - WordSense_Classifier_EndToEnd_WordListApi

      - id: WordSense-Lib-Tags
        title: The library shall describe every sense with tags and answer tag-level queries such as noun versus verb.
        tags: [system]
        justification: |
          Callers that need only a coarse property (for example noun versus verb) should not depend on
          the fine sense labels of each lemma, and the coarse answer must be at least as reliable.
        children:
          - WordSense-Sense-Record
          - WordSense-Sense-Tags
          - WordSense-Sense-TagScoring
          - WordSense-Classifier-Tags
          - WordSense-Table-Senses
          - WordSense-Builder-Inventory
          - WordSense-Builder-Provenance
          - WordSense-Builder-AuthoredImport
          - WordSense-Builder-NounVerbImport
        tests:
          - WordSense_Classifier_Holdout_MeetsNounVerbTagGate
          - WordSense_Classifier_Holdout_MeetsGroupGate
          - WordSense_EmbeddedTable_EverySenseHasExactlyOnePartOfSpeech

      - id: WordSense-Lib-Accuracy
        title: >-
          The library shall be at least 96% accurate on the sentences it answers, while answering at least
          85% of the held-out sentences of the labeled corpus, with the pinned model.
        tags: [system]
        justification: |
          Classification quality is the measurable promise of the library. The gate evaluates
          sentences that are never used for training, so a regression in the table, tokenizer or
          model shows up as a failing test.
        children:
          - WordSense-Builder-Corpus
          - WordSense-Builder-Trainer
          - WordSense-Builder-Importer
          - WordSense-Builder-LearningCurve
          - WordSense-Builder-ErrorDiagnosis
          - WordSense-Builder-WeakLemmas
          - WordSense-Tokenizer-Parity
        tests:
          - WordSense_Classifier_Holdout_MeetsAccuracyGate
          - WordSense_EmbeddedTable_EveryCorpusTargetResolvesToItsLemma

      - id: WordSense-Lib-Abstain
        title: >-
          The library shall abstain instead of guessing when the decision margin of a word is below the
          abstention threshold stored in the classifier table for its lemma.
        tags: [system]
        justification: |
          Callers prefer no answer to a wrong answer for ambiguous contexts; a per-lemma margin
          threshold lets the library trade coverage for precision.
        children:
          - WordSense-Classifier-Abstain
          - WordSense-Table-Score
        tests:
          - WordSenseClassifier_ClassifyAsync_LowMargin_Abstains

      - id: WordSense-Lib-Embedded
        title: The library shall embed the trained classifier table and verify that it matches the pinned model.
        tags: [system]
        justification: |
          Embedding the table makes the library self-contained apart from the model file, and the
          pinned model digest in the table prevents using a table with a model it was not trained for.
        children:
          - WordSense-Table-Format
          - WordSense-Table-Integrity
          - WordSense-Table-Embedded
          - WordSense-Classifier-Validation
        tests:
          - WordSense_EmbeddedTable_MatchesPinnedModel

      - id: WordSense-Lib-Encoder
        title: The library shall compute contextual embeddings of tokenized text with ONNX Runtime.
        tags: [system]
        justification: |
          The embeddings of the surrounding sentence are the evidence for the sense decision; the
          encoder wraps ONNX Runtime so the rest of the library depends only on a small interface.
        children:
          - WordSense-Encoder-Encode
          - WordSense-Encoder-Validation
          - WordSense-Tokenizer-Window
          - WordSense-Tokenizer-Spans
          - WordSense-OTS-OnnxRuntime-Inference
        tests:
          - WordSense_Classifier_EndToEnd_ClassifiesRecord

      - id: WordSense-Lib-ModelDownload
        title: The library shall obtain missing model files from ordered sources (mirror, Hugging Face, GitHub LFS).
        tags: [system]
        justification: |
          Users in restricted networks need to supply their own mirror, while everyone else gets
          the files from public hosting. Falling through the list keeps the library working when
          one host is blocked or unavailable.
        children:
          - WordSense-Downloader-Order
          - WordSense-Downloader-Fallthrough
          - WordSense-Downloader-AllFail
          - WordSense-Downloader-Present
          - WordSense-Downloader-Cancel
          - WordSense-Downloader-Progress
          - WordSense-Downloader-Options
          - WordSense-Downloader-Location
          - WordSense-Downloader-StoreRoot
        tests:
          - WordSenseModelDownloader_EnsureModel_MirrorFails_FallsThroughInOrder
          - WordSenseModelDownloader_EnsureModel_NoMirror_HuggingFaceThenLfs

      - id: WordSense-Lib-Mirror
        title: The library shall support a user download mirror set by environment variables or options.
        tags: [system]
        justification: |
          Enterprises and offline users host the model on their own server; the same configuration
          model as the sibling Speech library keeps the experience consistent.
        children:
          - WordSense-Mirror-Validation
          - WordSense-Mirror-Environment
          - WordSense-Mirror-Redaction
          - WordSense-Downloader-MirrorConfig
          - WordSense-Downloader-Credentials
        tests:
          - WordSenseModelDownloader_EnsureModel_MirrorFromEnvironment_IsUsedFirst
          - WordSenseModelDownloader_EnsureModel_ProgrammaticMirror_BeatsEnvironment

      - id: WordSense-Lib-Integrity
        title: The library shall verify the SHA-256 digest of every model file against pinned values.
        tags: [system]
        justification: |
          A model file that does not match the pinned digest could silently change results or carry
          malicious content; every source is therefore treated as untrusted until verified.
        children:
          - WordSense-Downloader-Integrity
        tests:
          - WordSenseModelDownloader_EnsureModel_HashMismatch_FallsThroughAndKeepsNothingBad

      - id: WordSense-Lib-Performance
        title: >-
          The library shall classify a typical sentence with a median latency below two seconds, with one
          and with four threads.
        tags: [system]
        justification: |
          Interactive callers need classification latency that does not block a user interface;
          the benchmark enforces the median bound and records the 95th percentile latency for one
          and four threads. The typical latency is a few milliseconds.
        tests:
          - WordSense_Benchmark_ClassifyLatency

      - id: WordSense-Lib-Reproducible
        title: The table builder shall produce the same table from the same corpus and model.
        tags: [system]
        justification: |
          A reproducible, deterministic build lets reviewers verify that the embedded table was
          trained from the committed corpus.
        children:
          - WordSense-Builder-Trainer
        tests:
          - WordSenseBuilder_LogisticTrainer_SeparatesAndIsDeterministic

      - id: WordSense-Lib-Documentation
        title: >-
          The documentation shall show a README usage sample whose code and output are verified against the library,
          and an appendix that lists every supported lemma with its senses, tags, groups and forms and is never stale.
        tags: [system]
        justification: |
          A usage example that no longer compiles or prints something else misleads new users, and a hand-written
          list of supported words drifts from the trained table. Compiling and running the README sample against
          the committed model, and generating the appendix from the corpus, keep both honest.
        children:
          - WordSense-Builder-Appendix
        tests:
          - WordSense_Readme_CodeBlock_MatchesCompiledSample
          - WordSense_Readme_Output_MatchesReadme
