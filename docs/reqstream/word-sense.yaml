---
# Software System Requirements for WordSense
#
# WordSense is delivered as four layered NuGet packages: the core package (DemaConsulting.WordSense: contracts, the
# word lexicon, the sense catalog and the built-in statistical Basic model), the shared Onnx package and the two encoder
# model packages MiniLM and BertBaseCased. (Before version 1.0 the Basic model was a package of its own; it is part of
# the core package now.) These requirements describe the externally visible behavior of the system
# from the perspective of its consumers, without specifying implementation details. Each requirement is decomposed
# into the subsystem requirements under docs/reqstream/word-sense/.
#
# The sense model is the fine-sense model: every sense is an Open English WordNet (OEWN) sense with a readable id,
# groups exist only where curated (closely related, easily confused senses of one lemma and part of speech), and an
# answer states the level (part of speech, group or sense) at which the model was confident enough to answer, with
# the ranked analyses and, where the model scored them, the ranked senses of each analysis, so that a consumer can
# apply its own grouping.

sections:
  - title: WordSense Requirements
    requirements:
      - id: WordSense-Lib-Classify
        title: >-
          The system shall classify the words of a running text, answering for each word whether it is known, every
          analysis (lemma, part of speech and features) with its probability, the selected analysis, the level that was
          answered (a fine sense, a group of senses or the part of speech alone, none only for an unknown word), a
          confidence at that level and the sense or group id where the level carries one, and return one result per
          input word in the input order.
        tags: [system]
        justification: |
          This is the purpose of the system: given a text, callers learn which sense (for example "bank" as a financial
          institution or as a river side) each word carries and how precisely the model could tell, while the results
          still map one to one onto the words they passed in.
        children:
          - WordSense-Core-Contracts
          - WordSense-Core-Classify
          - WordSense-Onnx-Classify
          - WordSense-Onnx-Levels
        tests:
          - WordSense_Classifier_EndToEnd_ClassifiesRecord
          - WordSense_Classifier_EndToEnd_ResultCarriesAnalysisLevelAndSense

      - id: WordSense-Lib-Lexicon
        title: >-
          The system shall provide an embedded lexicon of English words, with the analyses of each word and of its
          inflected forms, and the sense inventory of every lemma (its fine senses and the group of each), that
          needs no model, no network access and no file outside the package.
        tags: [system]
        justification: |
          Most words of a text are not ambiguous; answering them from a lexicon gives broad coverage at no
          inference cost, and embedding the lexicon and its sense inventory keeps the system self-contained and lets
          every model answer with the same senses.
        children:
          - WordSense-Core-Lexicon
          - WordSense-Core-Senses
        tests:
          - WordLexicon_Lookup_KnownWord_ReturnsItsAnalyses
          - WordLexicon_Lookup_InflectedForm_ReturnsEntryLemmaAndFeatures
          - WordLexicon_Lookup_ClosedClassWord_HasItsPartOfSpeechAlone
          - WordLexicon_SensesOf_LemmaAndPartOfSpeech_ListsInOewnOrder

      - id: WordSense-Lib-Senses
        title: >-
          The system shall identify every sense by a readable, stable id of the form lemma#label that is never
          reused, link each id to exactly one OEWN sense key (or mark it a project sense, without a key, where a use
          of a word has no OEWN sense), and let callers look a sense up by its id or by its OEWN sense key.
        tags: [system]
        justification: |
          Callers store and compare sense ids, so the ids must be readable and must never change meaning; the link to
          the OEWN sense key lets callers attach glosses, thesaurus entries and other WordNet-keyed resources to an
          answer, and project senses let closed-class and discourse uses (for example a preposition or "well" as a
          discourse marker) be answered although OEWN does not list them.
        children:
          - WordSense-Core-Senses
          - WordSense-WordData-Senses
          - WordSense-WordData-ProjectSenses
          - WordSense-WordData-SenseLabelGenerator-Generate
          - WordSense-WordData-SenseLabelGenerator-Preserve
        tests:
          - WordSense_Catalog_SenseIds_AreUniqueAndLinkedToOneKey
          - WordSense_Catalog_ProjectSenses_HaveNoKey
          - WordSense_Catalog_LookupByIdAndByKey_FindTheSameSense

      - id: WordSense-Lib-Groups
        title: >-
          The system shall define a group only where it was curated, as a set of at least two, but not all, of the
          senses of one lemma and part of speech that are closely related in meaning and easily confused, place a sense
          in at most one group, identify each group by a readable id of its own namespace, lemma#group:label, that can
          never equal a sense id, and let callers list the member senses of a group, so that a group answer always
          exposes its member senses; sense ids are frozen, group ids are versioned per data release, and the version of
          the sense inventory is available to callers.
        tags: [system]
        justification: |
          Fine senses are often finer than a caller needs and than a model can tell apart; a group of closely related,
          easily confused senses lets the system answer with a meaning the model is sure of, and lets a caller treat
          those senses alike or degrade the answer to its member senses. A group that held one sense or every sense
          would add nothing, so groups exist only where they separate confusable senses from the rest. A group id that
          can never be mistaken for a sense id can be stored next to one, and because groups are curated again with
          each data release, callers treat group ids as opaque per-release values and save them with the inventory
          version.
        children:
          - WordSense-Core-Senses
          - WordSense-WordData-Groups
        tests:
          - WordSense_Catalog_EverySense_BelongsToAtMostOneGroup
          - WordSense_Catalog_Group_ListsItsSenses
          - WordLexicon_Groups_EveryGroupId_HasGroupMarkerAndNeverEqualsASenseId
          - WordLexicon_Version_IsStableLowerCaseHex

      - id: WordSense-Lib-AnswerLevel
        title: >-
          The system shall answer a word with several senses at the finest level that the model is confident in: the
          fine sense when it is, otherwise the group of the senses it is unsure between when they share a group,
          otherwise the part of speech of the selected analysis; the levels nest as part of speech, group (only where
          one exists) and sense, a known word shall never be answered at level none, and the result shall state the
          level.
        tags: [system]
        justification: |
          A model that is sure only of the group, or only of the part of speech, is more useful when it says so than
          when it names a fine sense that is a guess; when a model is unsure between senses it steps up to the next
          level that exists, their shared group or else the part of speech. The level lets callers use each answer for
          what it is worth, for example to choose a pronunciation only where the group fixes it.
        children:
          - WordSense-Core-Contracts
          - WordSense-Core-Classify
          - WordSense-Onnx-Levels
          - WordSense-Onnx-Untrained
        tests:
          - WordSense_Classifier_EndToEnd_AnswersAtTheFinestConfidentLevel
          - WordSense_Classifier_EndToEnd_UntrainedWord_AnswersPartOfSpeech

      - id: WordSense-Lib-Candidates
        title: >-
          The system shall list, for every known word, its analyses ranked by probability, the probabilities summing to
          one and none left out, and, for each analysis whose senses the model scores, the senses ranked by their
          probability given the analysis, summing to one, so that a consumer can apply its own grouping of the senses,
          and shall list no senses for an analysis whose senses the model does not score, except that an analysis whose
          lemma and part of speech have exactly one sense lists that sense with probability 1 even where the model
          does not score it.
        tags: [system]
        justification: |
          A model that answers at the part-of-speech or the group level still knows how likely each analysis and each
          fine sense is, and a consumer may group the senses differently from the curated groups: a consumer that maps
          senses to its own categories sums analysis.Probability times sense.Probability per category (for example 0.48
          for one sense of bow and 0.41 for another sense that the consumer puts in the same category give 0.89 for
          that category), which no single answered sense could tell it. Listing every analysis, never a truncated
          list, makes the result the single source of truth from which the summary is derived.
        children:
          - WordSense-Core-Contracts
          - WordSense-Core-Candidates
          - WordSense-Onnx-Candidates
        tests:
          - WordSense_Classifier_EndToEnd_AnalysesAreRankedAndSumToOne
          - WordSense_Classifier_EndToEnd_SensesAreRankedAndSumToOne

      - id: WordSense-Lib-Fallback
        title: >-
          The system shall let two models be composed so that each word is answered by the first model where it scored
          senses for the word and otherwise by the second, with the complete result of one model and never a mixture,
          and the encoder model packages shall answer, by default, with their encoder model composed with the Basic
          model of the core package, so that every ambiguous word that the encoder does not score is answered at the
          part of speech level by the Basic model.
        tags: [system]
        justification: |
          An encoder scores fine senses only for the lemmas it was trained for, while the Basic model chooses the part
          of speech of every ambiguous word; composing them gives callers one model that answers every word as
          precisely as its evidence allows, and a result that belongs completely to one model keeps its
          probabilities, level and confidence consistent.
        children:
          - WordSense-Core-Fallback
          - WordSense-MiniLM-Composition
          - WordSense-BertBaseCased-Composition
        tests:
          - WordSenseContracts_FallbackWordSenseModel_PrimaryScoredSenses_UsesPrimary
          - WordSenseContracts_FallbackWordSenseModel_PrimaryChoseOnlyAnalysis_UsesFallback
          - MiniLMWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback
          - BertBaseCasedWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback

      - id: WordSense-Lib-Data
        title: >-
          The system shall keep the word data of the library as validated, deterministic, human-editable TSV tables
          under data/, imported once from Open English WordNet (CC BY 4.0, derived from Princeton WordNet) with the
          WordNet 3.0 sense frequency counts for the usage prior, with attribution, so that a data change (a sense
          label, a group or a project sense) is a reviewable text change that needs no code.
        tags: [system]
        justification: |
          Data that is plain, validated text lets contributors correct and extend the lexicon and the sense inventory
          with the same review process as code, and is the base for later builds of the shipped lexicon; the
          frequency counts rank the senses of a lemma and size the training data of each sense.
        children:
          - WordSense-WordData-Schema
          - WordSense-WordData-Layout
          - WordSense-WordData-Import
          - WordSense-WordData-Validation
          - WordSense-WordData-Attribution
          - WordSense-WordData-Forms
          - WordSense-WordData-Senses
          - WordSense-WordData-Groups
          - WordSense-WordData-Frequency
          - WordSense-WordData-ProjectSenses
        tests:
          - WordSenseBuilder_DataEndToEnd_CommittedData_IsValid
          - WordSenseBuilder_DataCommands_ImportThenValidate_Succeeds
          - WordSenseBuilder_DataEndToEnd_CommittedData_HasSenseLabelsAndGroups

      - id: WordSense-Lib-Layered
        title: >-
          The system shall be delivered as four layered packages, in which the core package carries the lexicon, the
          sense catalog, the contracts and the built-in statistical Basic model and no ONNX Runtime, encoder weights
          or vector dependency, the Onnx package depends only on the core package, and the MiniLM and BertBaseCased
          packages depend on the core and Onnx packages.
        tags: [system]
        justification: |
          Callers that need only the lexicon, the statistical Basic model or the bare encoder model must not pay for
          anything they do not use (a native runtime, a model file, another model); layering lets each caller take
          exactly the packages it needs, and lets a third party implement the core contracts with its own model. The
          core package answers every word with the Basic model by itself, so a caller that cannot download a model
          needs nothing else; the encoder models answer words they were not trained for with that Basic model, so the
          two model packages that ship an encoder compose it with their encoder, while the Onnx package itself stays
          independent of it.
        children:
          - WordSense-Core-Independent
          - WordSense-Core-Offline
          - WordSense-Onnx-Lifecycle
          - WordSense-Onnx-Untrained
          - WordSense-MiniLM-Composition
          - WordSense-BertBaseCased-Composition
          - WordSense-MiniLM-Model
          - WordSense-BertBaseCased-Model
        tests:
          - WordSenseContracts_CoreAssembly_HasNoOnnxOrWeightsReferences
          - OnnxWordSense_Assembly_ReferencesOnlyCore
          - MiniLMWordSenseModel_Assembly_ReferencesCoreAndOnnx
          - BertBaseCasedWordSenseModel_Assembly_ReferencesCoreAndOnnx
          - WordSense_Classifier_EndToEnd_ClassifiesRecord

      - id: WordSense-Lib-BasicModel
        title: >-
          The system shall provide a statistical model that chooses the analysis (part of speech and features) of an
          ambiguous word from the cues in its sentence, answers every ambiguous word with a probability for each of
          its analyses, answers the sense only where the selected analysis has one sense, is deterministic and
          thread-safe, and needs no model file, no network access and no native runtime.
        tags: [system]
        justification: |
          A small, fast and dependency-free model serves callers that accept lower accuracy; the probabilities let
          them decide which answers to trust, and stating the part of speech level honestly keeps it from naming fine
          senses it cannot tell apart.
        children:
          - WordSense-Core-Classify
          - WordSense-Core-Tagger
          - WordSense-Core-Cues
          - WordSense-Core-Fusion
          - WordSense-Core-Deterministic
          - WordSense-Core-Offline
        tests:
          - BasicClassifier_ClassifyAsync_Context_ChoosesPartOfSpeech
          - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability
          - BasicClassifier_ClassifyAsync_AmbiguousWord_AnswersPartOfSpeechLevel

      - id: WordSense-Lib-EncoderModels
        title: >-
          The system shall provide encoder-based models, the all-MiniLM-L6-v2 model (uncased) and the
          bert-base-cased model (cased), that choose among the fine senses of the trained lemmas from the sentence
          context with trained per-lemma weights and per-lemma confidence thresholds embedded in the package, whose
          sense probabilities reflect how often the senses are used, and that answer the other ambiguous words at the
          part of speech level.
        tags: [system]
        justification: |
          Context-aware models are more accurate than a dictionary alone; two encoders let callers trade size and
          speed (MiniLM) against accuracy and case sensitivity (BERT base cased), and embedding the weights keeps each
          package self-contained apart from the model files. Per-lemma thresholds make every lemma answer at the level
          its own evidence supports. Probabilities that reflect the usage of the senses make the usual sense the
          answer when the context does not say otherwise.
        children:
          - WordSense-Onnx-Classify
          - WordSense-Onnx-Levels
          - WordSense-Onnx-Untrained
          - WordSense-Onnx-Weights
          - WordSense-Onnx-Encoder
          - WordSense-MiniLM-Model
          - WordSense-BertBaseCased-Model
          - WordSense-MiniLM-Composition
          - WordSense-BertBaseCased-Composition
          - WordSense-WordSenseBuilder-UsagePrior
        tests:
          - OnnxEncoder_EncodeAsync_ValidTargets_ReturnsDeterministicVectors
          - BertBaseCasedWordSenseModel_Classify_AmbiguousWord_ReturnsBestSense
          - WordSense_Classifier_EndToEnd_AnswersAtTheFinestConfidentLevel

      - id: WordSense-Lib-Confidence
        title: >-
          The system shall report a confidence between 0 and 1 with every result that is the probability of the answer
          at the level answered (the probability of the lemma and part of speech of the selected analysis, which the
          feature variants of that lemma and part of speech share and never lower, times the probability of the
          answered sense or the summed probability of the member senses of the answered group within it), shall report a
          known word that the model is unsure about at the part of speech level or finer with a low confidence rather
          than as unknown, and shall report no details, level none and confidence 0 only for a word it does not know.
        tags: [system]
        justification: |
          Callers apply their own confidence policy; a monotonic, bounded confidence defined from the probabilities
          that the result also lists, and a clear distinction between low confidence (a known word that is hard) and
          no decision (an unknown word), let them do so. The scale is not calibrated across models, words or levels,
          so each caller tunes its own threshold per model and level.
        children:
          - WordSense-Core-Fusion
          - WordSense-Core-BasicClassifier-Unknown
          - WordSense-Onnx-Confidence
          - WordSense-Core-Contracts
        tests:
          - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability
          - OnnxClassifier_ClassifyAsync_LargerMargin_GivesHigherConfidence
          - WordSenseContracts_ClassifyResult_LevelDecidesWhichIdsAreSet

      - id: WordSense-Lib-Measured
        title: >-
          The system shall measure each model on independent, human-annotated real text that is never used for
          training or tuning (sense accuracy at each level on SemCor, and part-of-speech accuracy on running text),
          and publish the results, with the share answered at each level.
        tags: [system]
        justification: |
          Accuracy measured on sentences written by the same generator as the training data is optimistic; published
          figures from independent text, reported per level, are the honest evidence of what each model can do, and
          never using that text for training or tuning keeps them honest.
        children:
          - WordSense-WordSenseBuilder-Evaluate
          - WordSense-WordSenseBuilder-SenseEval
          - WordSense-WordSenseBuilder-RunningText
          - WordSense-WordSenseBuilder-Suite
        tests:
          - ModelTable_Readme_MatchesGeneratedFile
          - ModelTable_GeneratedFile_HasRowForEachModel
          - WordSenseBuilder_ModelTable_BasicRow_MatchesEvaluation
          - BasicSuite_ExpectedPasses_StillPass
          - MiniLMSuite_ExpectedPasses_StillPass
          - BertBaseCasedSuite_ExpectedPasses_StillPass

      - id: WordSense-Lib-ModelFiles
        title: >-
          The system shall obtain the files of an encoder model on first use (or when the caller ensures the model
          up front with DownloadOptions) from a user-supplied mirror or the
          public repository copy, verify each against its pinned SHA-256 digest, store them in a per-user location
          and use them offline afterwards.
        tags: [system]
        justification: |
          Encoder model files are too large to embed; users in restricted networks need their own mirror, everyone
          else gets the public copy, and no file is used unless it is verified.
        children:
          - WordSense-Onnx-ModelFiles
          - WordSense-Onnx-Mirror
        tests:
          - ModelDownloader_EnsureAsync_MirrorFails_FallsBackToGitHub
          - ModelDownloader_EnsureAsync_HashMismatch_FallsThroughAndKeepsNothingBad

      - id: WordSense-Lib-Failures
        title: >-
          The system shall report a model whose files cannot be obtained, fail verification or are configured wrongly
          with typed exceptions that derive from one base exception and keep the original exception as inner
          exception.
        tags: [system]
        justification: |
          Callers of any model package handle the failures of the model files and of the download settings by cause,
          in one place, without depending on the platform exception types of the sources.
        children:
          - WordSense-Core-Failures
          - WordSense-Onnx-Failures
        tests:
          - MiniLMWordSenseModel_EnsureModelAsync_MissingDirectory_ThrowsModelUnavailable
          - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity
          - OnnxWordSenseModel_EnsureModelAsync_InvalidOptions_ThrowsDownloadConfiguration

      - id: WordSense-Lib-ReproducibleBuild
        title: >-
          The build-time tool shall produce the same lexicon, weights, thresholds and reports from the same corpus
          and models, and shall never be shipped in a package.
        tags: [system]
        justification: |
          A reproducible build lets reviewers verify that the shipped lexicon and weights come from the committed
          corpus; keeping the tool out of the packages keeps training code out of consumers' dependency graphs.
        children:
          - WordSense-WordSenseBuilder-Words
          - WordSense-WordSenseBuilder-ImageFormat
          - WordSense-WordSenseBuilder-ImportDictionary
          - WordSense-WordSenseBuilder-Weights
          - WordSense-WordSenseBuilder-FormChoosers
          - WordSense-WordSenseBuilder-Thresholds
          - WordSense-WordSenseBuilder-RealCalibration
          - WordSense-WordSenseBuilder-CalibrationShift
          - WordSense-WordSenseBuilder-Tiers
          - WordSense-WordSenseBuilder-EmbeddingCache
          - WordSense-WordSenseBuilder-FitCache
          - WordSense-WordSenseBuilder-FrozenMean
          - WordSense-WordSenseBuilder-Evaluate
          - WordSense-WordSenseBuilder-OpenCounts
          - WordSense-WordSenseBuilder-TrainBasic
          - WordSense-WordSenseBuilder-TuneBasic
          - WordSense-WordSenseBuilder-EvaluateTagger
          - WordSense-WordSenseBuilder-Hyperparameters
          - WordSense-WordSenseBuilder-Appendix
          - WordSense-WordSenseBuilder-Coverage
          - WordSense-WordSenseBuilder-Corpus
          - WordSense-WordSenseBuilder-CorpusLicenses
          - WordSense-WordSenseBuilder-Usage
          - WordSense-WordData-FormGenerator-Reproducible
          - WordSense-WordData-SenseLabelGenerator-Reproducible
        tests:
          - WordSenseBuilder_ImageCompiler_Build_IsDeterministic
          - WordSenseBuilder_Appendix_Committed_MatchesCorpus
          - WordSenseBuilder_FormGenerator_Run_SameInputs_GiveIdenticalBytes
          - WordSenseBuilder_SenseLabelGenerator_Run_SameInputs_GiveIdenticalBytes

      - id: WordSense-Lib-Packaging
        title: >-
          Each of the four packages shall ship XML documentation with a namespace summary and verified examples,
          NuGet metadata and a README; each package that embeds derived data carries the credits and licenses in its
          package readme and in a packed NOTICE file, and declares the license expression that covers the embedded
          data (the core, MiniLM and BertBaseCased packages MIT AND CC-BY-4.0). The core package embeds Open English
          WordNet 2025 (CC BY 4.0, with the Princeton WordNet notice that it requires), the Moby Part-of-Speech List
          (public domain), the forms authored by the project (CC0 1.0), the statistics of its built-in model (CC0 1.0)
          and the other project data (MIT), and its notice names the tagged tokens of the open corpus (CC0 1.0) as a
          corroborating source of the generated forms at build time; the WordNet 3.0 counts feed only the usage prior of
          the encoder models, whose packages add the WordNet 3.0 notice.
        tags: [system]
        justification: |
          Consumers learn the API from the package itself; examples that are compiled by the test suite cannot go
          stale (the tests verify the documentation examples; NuGet metadata and the package readme are produced
          and checked by the pack step), and the credits, notices and license expressions in the package satisfy the
          licenses of the embedded data (Open English WordNet and its Princeton WordNet notice in the core package;
          the Moby list is public domain; the forms authored by the project and the tables of the built-in model come
          from our own CC0 work) and models.
        children:
          - WordSense-Core-Packaging
          - WordSense-Onnx-Packaging
          - WordSense-MiniLM-Packaging
          - WordSense-BertBaseCased-Packaging
        tests:
          - WordSense_XmlDocExamples_Compile
          - OnnxWordSense_XmlDocExamples_Compile
          - MiniLMWordSense_XmlDocExamples_Compile
          - BertBaseCasedWordSense_XmlDocExamples_Compile

      - id: WordSense-Lib-Documentation
        title: >-
          The documentation shall show a README usage sample whose code and output for each model are verified against
          the library, README samples for the optional preparation step of a model (called on the concrete model type
          and through the capability interface) that are compiled against the library, and an appendix that lists
          every trained lemma with its senses (id, group, OEWN key and gloss) and the forms of the lemma, and is never
          stale.
        tags: [system]
        justification: |
          A usage example that no longer compiles or prints something else misleads new users, and a hand-written
          list of supported words drifts from the corpus. Compiling and running the README sample, and generating the
          appendix from the data and the corpus, keep both honest.
        children:
          - WordSense-WordSenseBuilder-Appendix
        tests:
          - WordSense_Readme_CodeBlocks_MatchCompiledSamples
          - WordSense_Readme_DownloadBlock_MatchesCompiledSample
          - WordSense_Readme_CapabilityBlock_MatchesCompiledSample
          - WordSense_Readme_BasicOutput_MatchesReadme
          - WordSense_Readme_MiniLMOutput_MatchesReadme
          - WordSense_Readme_BertBaseCasedOutput_MatchesReadme
          - WordSense_Readme_CommentedAlternatives_NameExistingModels
          - WordSense_Readme_SampleMarkers_AreAllChecked
