---
# Basic subsystem requirements (the package DemaConsulting.WordSense.Basic)

sections:
  - title: WordSense Requirements
    sections:
      - title: Basic Requirements
        requirements:
          - id: WordSense-Basic-Classify
            title: >-
              The Basic subsystem shall classify words from the core lexicon statistically: an unknown word as
              unknown, with no analysis, and every known word with all its analyses and their probabilities, the
              analysis that the sentence context makes most probable selected, at the part of speech level, or at the
              sense level where the selected analysis has exactly one sense.
            tags: [subsystem]
            justification: |
              A lexicon lookup decides most words; the part of speech and the context cues in the sentence decide the
              rest without a model. Without fine-sense evidence the model states only what it can tell, the analysis
              and its probability, and names a sense only where the lemma and part of speech have no other.
            children:
              - WordSense-Basic-BasicWordSenseModel-Classify
              - WordSense-Basic-BasicWordSenseModel-Dispose
              - WordSense-Basic-BasicClassifier-Unknown
              - WordSense-Basic-BasicClassifier-SingleSense
              - WordSense-Basic-BasicClassifier-Resolve
              - WordSense-Basic-BasicClassifier-Level
              - WordSense-Basic-BasicClassifier-Segments
              - WordSense-Basic-BasicClassifier-Normalization
              - WordSense-Basic-BasicClassifier-Validation
            tests:
              - BasicClassifier_ClassifyAsync_Context_ChoosesPartOfSpeech
              - BasicClassifier_ClassifyAsync_Context_SelectsTheMostProbableAnalysis

          - id: WordSense-Basic-Candidates
            title: >-
              The Basic subsystem shall list, for every known word, all its analyses with probabilities that sum to
              one, the largest first and, on a tie, in lexicon order, and shall list senses only inside an analysis
              whose lemma and part of speech have exactly one sense (that sense with probability 1), and no senses for
              any other analysis, because it scores analyses and not fine senses.
            tags: [subsystem]
            justification: |
              A consumer that reads the analyses must be able to tell a model without sense scores from one that scores
              senses; empty sense lists for the ambiguous analyses say that the Basic model has none, while the one
              sense of a single-sense analysis is certain and needs no evidence.
            children:
              - WordSense-Basic-BasicClassifier-Candidates
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_ListsAnalysesAndNoSenses
              - BasicClassifier_ClassifyAsync_SingleSenseAnalysis_ListsThatSenseWithProbabilityOne
              - BasicClassifier_ClassifyAsync_TiesKeepLexiconOrder

          - id: WordSense-Basic-Tagger
            title: >-
              The Basic subsystem shall estimate, for every word of a sentence segment, the probability of each part
              of speech from the whole segment, using embedded statistics only.
            tags: [subsystem]
            justification: |
              The part of speech of an ambiguous word depends on the words around it on both sides, so the estimate
              must weigh the whole segment rather than a fixed window.
            children:
              - WordSense-Basic-BasicTables-Load
              - WordSense-Basic-PosTagger-Posteriors
              - WordSense-Basic-PosTagger-UnknownWords
            tests:
              - PosTagger_Posteriors_AfterDeterminer_PrefersNoun

          - id: WordSense-Basic-Cues
            title: >-
              The Basic subsystem shall separate analyses of one form that share a part of speech (the past and the
              present of read, or the lemmas of a form such as left) by scoring context cues taken from the words
              around the target against the cue statistics of the form or of its lemma, whose columns are analyses.
            tags: [subsystem]
            justification: |
              Part of speech alone cannot choose between the analyses of one part of speech; the neighboring words
              can.
            children:
              - WordSense-Basic-CueModel-Extract
              - WordSense-Basic-CueModel-Score
            tests:
              - BasicClassifier_ClassifyAsync_SamePartOfSpeechAnalyses_UsesCues

          - id: WordSense-Basic-Fusion
            title: >-
              The Basic subsystem shall combine the part-of-speech probabilities and the cue scores into one
              probability for every analysis of an ambiguous word, each greater than 0 and the probabilities summing to
              one, so that the confidence of the answer, the probability of the selected analysis, is greater than 0
              and at most 1.
            tags: [subsystem]
            justification: |
              Callers apply their own confidence policy; an answer with an honest probability for every ambiguous word
              lets them do so without a separate abstention path.
            children:
              - WordSense-Basic-SenseFusion-Fuse
              - WordSense-Basic-SenseFusion-Stable
              - WordSense-Basic-BasicClassifier-Resolve
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability

          - id: WordSense-Basic-Deterministic
            title: >-
              The Basic subsystem shall give the same results for the same input on every call and every thread.
            tags: [subsystem]
            justification: |
              Reproducible results make behavior testable and allow one classifier to serve concurrent callers.
            children:
              - WordSense-Basic-BasicClassifier-Deterministic
              - WordSense-Basic-PosTagger-Deterministic
              - WordSense-Basic-BasicWordSenseModel-Classify
            tests:
              - BasicClassifier_ClassifyAsync_IsDeterministicAndThreadSafe

          - id: WordSense-Basic-Offline
            title: >-
              The Basic subsystem shall use only statistics embedded in the package, and need no model file, no
              network access and no native runtime, and its preparation step shall complete immediately.
            tags: [subsystem]
            justification: |
              The package exists for callers that cannot or will not download or ship a model.
            children:
              - WordSense-Basic-BasicWordSenseModel-NoFiles
              - WordSense-Basic-BasicTables-Load
              - WordSense-Basic-BasicTables-Embedded
            tests:
              - BasicWordSenseModel_EnsureModelAsync_CompletesWithoutFiles
              - BasicTables_Default_LoadsEmbeddedTable

          - id: WordSense-Basic-Packaging
            title: >-
              The Basic package shall ship its XML documentation with a namespace summary and verified examples, its
              NuGet metadata with the license expression MIT AND CC-BY-SA-4.0, and a README and a packed NOTICE file
              that carry the credits and license of the statistics it embeds (derived from UD English-EWT under
              CC BY-SA 4.0).
            tags: [subsystem]
            justification: |
              The embedded statistics are trained on a share-alike treebank, whose license requires attribution and
              is carried by the package; consumers learn the API from the package, and verified examples cannot go
              stale.
            tests:
              - BasicWordSense_XmlDocExamples_Compile
