---
# WordPieceTokenizer unit requirements

sections:
  - title: WordPieceTokenizer Requirements
    requirements:
      - id: WordSense-Tokenizer-Parity
        title: The tokenizer shall produce the same ids and character offsets as the reference BERT uncased tokenizer.
        tags: [unit]
        justification: |
          The classifier table was trained on embeddings of ids produced by the reference
          tokenizer; any difference changes the embeddings and degrades accuracy.
        tests:
          - WordPieceTokenizer_Tokenize_Fixture_MatchesReferenceTokenizer
          - WordPieceTokenizer_Tokenize_SmallVocabulary_SplitsIntoWordPieces
          - WordPieceTokenizer_Tokenize_EmptyText_ReturnsNoTokens

      - id: WordSense-Tokenizer-Spans
        title: The tokenizer shall tokenize a list of words and return the range of word pieces belonging to each word.
        tags: [unit]
        justification: |
          The classifier pools the hidden states of the word pieces of a target word.
        tests:
          - WordPieceTokenizer_TokenizeWords_ReturnsPieceRangePerWord
          - WordPieceTokenizer_TokenizeWords_NoWords_ReturnsNoTokens

      - id: WordSense-Tokenizer-Window
        title: The tokenizer shall build a model input window that fits the maximum length and holds the target.
        tags: [unit]
        justification: |
          The model accepts a limited sequence length, but long texts must still be classified.
        tests:
          - WordPieceTokenizer_BuildWindow_ShortText_ContainsWholeText
          - WordPieceTokenizer_BuildWindow_LongText_KeepsTargetInsideWindow
