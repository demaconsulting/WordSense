---
# BertBaseCasedWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: BertBaseCased Requirements
        sections:
          - title: BertBaseCasedWordSenseModel Requirements
            requirements:
              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Identity
                title: >-
                  BertBaseCasedWordSenseModel shall identify itself as bert-base-cased-int8 with hidden size 768 and use
                  a cased vocabulary.
                tags: [unit]
                justification: |
                  The identifier names the model's folder in the repository, on a mirror and in the store, and the
                  weights were trained for exactly this cased encoder.
                tests:
                  - BertBaseCasedWordSenseModel_Identity_IsCased
                  - BertBaseCasedWordSenseModel_Identity_IsPinned

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Files
                title: >-
                  BertBaseCasedWordSenseModel shall require the files model_int8.onnx, vocab.txt, config.json and
                  tokenizer.json, each pinned by its SHA-256 digest.
                tags: [unit]
                justification: |
                  A model file that does not match the pinned digest could silently change results.
                tests:
                  - BertBaseCasedWordSenseModel_Files_ArePinnedBySha256
                  - BertBaseCasedWordSenseModel_EnsureModelAsync_ModelDirectory_VerifiesPinnedFiles
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Weights
                title: >-
                  BertBaseCasedWordSenseModel shall use the trained weights and thresholds embedded in its assembly and
                  answer the ambiguous words of the trained lemmas with them, each at the level its thresholds allow.
                tags: [unit]
                justification: |
                  Embedded weights make the package self-contained apart from the model files.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_AmbiguousWord_ReturnsBestSense
                  - BertBaseCasedWordSenseModel_Classify_TrainedLemma_AnswersAtASenseOrGroupLevel

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Composition
                title: >-
                  BertBaseCasedWordSenseModel shall wrap a FallbackWordSenseModel of its encoder model (primary) and a
                  BasicWordSenseModel (fallback), answer every ambiguous word that the encoder does not score with the
                  complete result of the Basic model (the analyses chosen in context, at the part of speech level or at
                  the sense level when the selected analysis has exactly one sense), implement
                  IDownloadableWordSenseModel so that EnsureModelAsync ensures the encoder files (the Basic model needs
                  none) and reports its failures with the typed exceptions of the encoder, and make Dispose dispose both
                  models.
                tags: [unit]
                justification: |
                  Every word of a text must be answered, not only the lemmas the weights were trained for; the
                  composition lives in the model package so that the encoder base class needs no Basic model.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback
                  - BertBaseCasedWordSenseModel_Assembly_ReferencesCoreAndOnnx
                  - BertBaseCasedWordSenseModel_Dispose_DisposesEncoderAndFallback
                  - BertBaseCasedWordSenseModel_IsDownloadable
                  - BertBaseCasedWordSenseModel_EnsureModelAsync_MissingDirectory_ThrowsModelUnavailable

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-PartOfSpeechKept
                title: >-
                  BertBaseCasedWordSenseModel shall answer a word that its encoder leaves at the part-of-speech level
                  with the slot probabilities of the encoder, never combined with those of the Basic model.
                tags: [unit]
                justification: |
                  BERT base cased beats the Basic tagger on the part-of-speech heteronyms (99.2% against 94.0% on the
                  English EWT treebank) and combining the two lost on them (the benchmark of a weight 0.6 for the
                  encoder gave 98.8%), while the gain on running text was at most 0.15 points on the development
                  splits; a model that must never lose keeps its own part of speech.
                tests:
                  - BertBaseCasedWordSenseModel_PartOfSpeechAnswer_KeepsTheEncoderSlotProbabilities

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior
                title: >-
                  BertBaseCasedWordSenseModel shall list, in the selected analysis of a word whose lemma the encoder has
                  no weights for and whose lemma and part of speech have two or more senses, those senses ranked by the
                  usage prior of the Basic model.
                tags: [unit]
                justification: |
                  About 83 percent of the ambiguous words of running text have no trained weights; the ranking gives a
                  consumer the likely senses of them.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_ListsSensesRankedByUsagePrior

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior-Level
                title: >-
                  BertBaseCasedWordSenseModel shall answer a word whose lemma the encoder has no weights for and that
                  has two or more senses at the part of speech level, with no sense id and no group id.
                tags: [unit]
                justification: |
                  The answer level stays honest because the ranking is evidence about the lemma and never an answer.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_AnswersPartOfSpeechLevelWithoutSenseOrGroup

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior-Key
                title: >-
                  The key of the result of BertBaseCasedWordSenseModel for a word whose lemma the encoder has no weights
                  for and that has two or more senses shall carry the label of the top-ranked sense of the selected
                  analysis.
                tags: [unit]
                justification: |
                  The ranking gives the key of such a word a label, so that a consumer can look up a resource by it.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_KeyCarriesTheLabelOfTheTopRankedSense

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Options
                title: >-
                  BertBaseCasedWordSenseModel shall accept an optional model directory and a maximum sequence length
                  that defaults to 128.
                tags: [unit]
                justification: |
                  Offline callers supply their own copy of the files; the weights were trained with the default length.
                tests:
                  - BertBaseCasedWordSenseModel_Constructor_Defaults_UseStoreAnd128
                  - BertBaseCasedWordSenseModel_Constructor_SequenceLengthOutOfRange_Throws
