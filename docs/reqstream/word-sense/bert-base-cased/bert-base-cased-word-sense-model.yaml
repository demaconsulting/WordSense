---
# BertBaseCasedWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: BertBaseCased Requirements
        sections:
          - title: BertBaseCasedWordSenseModel Requirements
            requirements:
              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Identity
                title: >-
                  BertBaseCasedWordSenseModel shall identify itself as bert-base-cased-int8 with hidden size 768 and use
                  a cased vocabulary.
                tags: [unit]
                justification: |
                  The identifier names the model's folder in the repository, on a mirror and in the store, and the
                  weights were trained for exactly this cased encoder.
                tests:
                  - BertBaseCasedWordSenseModel_Identity_IsCased
                  - BertBaseCasedWordSenseModel_Identity_IsPinned

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Files
                title: >-
                  BertBaseCasedWordSenseModel shall require the files model_int8.onnx, vocab.txt, config.json and
                  tokenizer.json, each pinned by its SHA-256 digest.
                tags: [unit]
                justification: |
                  A model file that does not match the pinned digest could silently change results.
                tests:
                  - BertBaseCasedWordSenseModel_Files_ArePinnedBySha256
                  - BertBaseCasedWordSenseModel_EnsureModelAsync_ModelDirectory_VerifiesPinnedFiles
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Weights
                title: >-
                  BertBaseCasedWordSenseModel shall use the trained weights and thresholds embedded in its assembly and
                  answer the ambiguous words of the trained lemmas with them, each at the level its thresholds allow.
                tags: [unit]
                justification: |
                  Embedded weights make the package self-contained apart from the model files.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_AmbiguousWord_ReturnsBestSense
                  - BertBaseCasedWordSenseModel_Classify_TrainedLemma_AnswersAtASenseOrGroupLevel

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Head
                title: >-
                  The encoder model of BertBaseCasedWordSenseModel shall load the part-of-speech head embedded in its
                  assembly, bound to the pinned bert-base-cased ONNX file, hidden size 768, the feature layout and the
                  parts of speech of the library, without any model file, and shall use it (the model description
                  declares the head in use).
                tags: [unit]
                justification: |
                  The head was trained on the vectors of this exact encoder file and these classes; the model answers
                  the part of speech of every word of several parts of speech with it.
                tests:
                  - BertBaseCasedWordSenseModel_EmbeddedHead_MatchesEncoderAndClasses
                  - BertBaseCasedWordSenseModel_PartOfSpeechAnswer_ReweighsTheHeadAgainstBasic

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-HeadRejected
                title: >-
                  The embedded part-of-speech head of BertBaseCasedWordSenseModel shall be rejected as invalid data when
                  it is read against another encoder file or another model identifier.
                tags: [unit]
                justification: |
                  A changed encoder file must fail loudly at load instead of feeding the head other vectors.
                tests:
                  - BertBaseCasedWordSenseModel_EmbeddedHead_AgainstAnotherEncoderFile_IsRejected

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-TenseHead
                title: >-
                  The encoder model of BertBaseCasedWordSenseModel shall find a tense head with the neighbor layout in
                  the head file embedded in its assembly, without any model file, and shall use it (the model
                  description declares the tense head in use).
                tags: [unit]
                justification: |
                  The tense head was trained on the vectors of this exact encoder file; a head file without it must not
                  load silently as a model that gives no tense.
                tests:
                  - BertBaseCasedWordSenseModel_EmbeddedHead_HasATenseHead

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-TenseReweighed
                title: >-
                  BertBaseCasedWordSenseModel shall give the past analyses of a same-spelling verb the share of the verb
                  that the composition computes from the probability of past of the tense head of its encoder and the
                  past share of the Basic model, as the weighted sum of their log odds with the weight of 0.9 for the
                  head, and shall allow an explicit weight from 0 to 1 and reject any other.
                tags: [unit]
                justification: |
                  The head reads the sentence, which the lexicon cannot, and the Basic model corrects it where the head
                  has little evidence. The weight is the specification constant that was chosen on the development
                  split of the open corpus, never on a test split.
                tests:
                  - BertBaseCased_Classifier_EndToEnd_SameSpellingVerb_TenseFollowsTheContext
                  - FallbackWordSenseModel_TenseEvidence_SetsThePastShareFromTheHead
                  - FallbackWordSenseModel_Constructor_TenseWeightOutOfRange_Throws

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Composition
                title: >-
                  BertBaseCasedWordSenseModel shall wrap a FallbackWordSenseModel of its encoder model (primary) and a
                  BasicWordSenseModel (fallback), answer every ambiguous word that the encoder does not score with the
                  senses, level and ids of the result of the Basic model (the analyses chosen in context, at the part
                  of speech level or at the sense level when the selected analysis has exactly one sense and the
                  confidence reaches 0.97), the slot probabilities being reweighed as
                  WordSense-BertBaseCased-BertBaseCasedWordSenseModel-PartOfSpeechReweighed states, implement
                  IDownloadableWordSenseModel so that EnsureModelAsync ensures the encoder files (the Basic model needs
                  none) and reports its failures with the typed exceptions of the encoder, and make Dispose dispose both
                  models.
                tags: [unit]
                justification: |
                  Every word of a text must be answered, not only the lemmas the weights were trained for; the
                  composition lives in the model package so that the encoder base class needs no Basic model.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersAtThePartOfSpeechLevel
                  - BertBaseCasedWordSenseModel_Assembly_ReferencesCoreAndOnnx
                  - BertBaseCasedWordSenseModel_Dispose_DisposesEncoderAndFallback
                  - BertBaseCasedWordSenseModel_IsDownloadable
                  - BertBaseCasedWordSenseModel_EnsureModelAsync_MissingDirectory_ThrowsModelUnavailable

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-PartOfSpeechReweighed
                title: >-
                  BertBaseCasedWordSenseModel shall give a word of two or more parts of speech the slot probabilities
                  that the composition computes from those of the part-of-speech head of its encoder and those of the
                  Basic model, proportional to p_head^w times p_basic^(1-w) with the weight w of 0.8, at every level of
                  the answer, and shall allow an explicit weight from 0 to 1 and reject any other.
                tags: [unit]
                justification: |
                  The head reads the sentence and is the primary estimate of the part of speech; the Basic tagger
                  corrects it where the head has little evidence. The weight is the specification constant that was
                  chosen on the development splits of the open corpus, never on a test split.
                tests:
                  - BertBaseCasedWordSenseModel_PartOfSpeechAnswer_ReweighsTheHeadAgainstBasic
                  - BertBaseCasedWordSenseModel_PrimaryWeight_DefaultIsTunedAndAnExplicitWeightReachesTheComposition

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Lazy
                title: >-
                  BertBaseCasedWordSenseModel shall ensure its encoder files lazily on the first text that contains a
                  word of several parts of speech, a same-spelling verb or a word with scored senses, and shall classify
                  a text of words that need none of these (unknown words, known words of one part of speech whose
                  senses are not scored) without touching any model file.
                tags: [unit]
                justification: |
                  A text of words that need no context must cost no download and no inference; a text with a word of
                  several parts of speech or a same-spelling verb needs the encoder for its heads.
                tests:
                  - BertBaseCasedWordSenseModel_ClassifyAsync_LexiconOnly_NeedsNoEnsure
                  - OnnxWordSenseModel_ClassifyAsync_WordOfSeveralPartsOfSpeech_NeedsTheEncoder

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior
                title: >-
                  BertBaseCasedWordSenseModel shall list, in the selected analysis of a word whose lemma the encoder has
                  no weights for and whose lemma and part of speech have two or more senses, those senses ranked by the
                  usage prior of the Basic model.
                tags: [unit]
                justification: |
                  About 56 percent of the ambiguous words of running text have no trained weights; the ranking gives a
                  consumer the likely senses of them.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_ListsSensesRankedByUsagePrior

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior-Level
                title: >-
                  BertBaseCasedWordSenseModel shall answer a word whose lemma the encoder has no weights for and that
                  has two or more senses at the part of speech level, with no sense id and no group id.
                tags: [unit]
                justification: |
                  The answer level stays honest because the ranking is evidence about the lemma and never an answer.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_AnswersPartOfSpeechLevelWithoutSenseOrGroup

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-UsagePrior-Key
                title: >-
                  The key of the result of BertBaseCasedWordSenseModel for a word whose lemma the encoder has no weights
                  for and that has two or more senses shall carry the label of the top-ranked sense of the selected
                  analysis.
                tags: [unit]
                justification: |
                  The ranking gives the key of such a word a label, so that a consumer can look up a resource by it.
                tests:
                  - BertBaseCasedWordSenseModel_Classify_UntrainedPolysemousWord_KeyCarriesTheLabelOfTheTopRankedSense

              - id: WordSense-BertBaseCased-BertBaseCasedWordSenseModel-Options
                title: >-
                  BertBaseCasedWordSenseModel shall accept an optional model directory and a maximum sequence length
                  that defaults to 128.
                tags: [unit]
                justification: |
                  Offline callers supply their own copy of the files; the weights were trained with the default length.
                tests:
                  - BertBaseCasedWordSenseModel_Constructor_Defaults_UseStoreAnd128
                  - BertBaseCasedWordSenseModel_Constructor_SequenceLengthOutOfRange_Throws
