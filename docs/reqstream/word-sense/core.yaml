---
# Core subsystem requirements (the package DemaConsulting.WordSense: the lexicon, the sense catalog, the contracts and
# the built-in statistical model, which was the separate Basic package before version 1.0)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        requirements:
          - id: WordSense-Core-Lexicon
            title: >-
              The core subsystem shall provide the embedded word lexicon: for each known word, including inflected
              forms, determiners, conjunctions and interjections, the analyses (lemma, part of speech and features) it
              can have, resolving cased and inflected spellings like their base form.
            tags: [subsystem]
            justification: |
              Every model package starts from the same lexicon of analyses, so it is provided once, in the package that
              all others reference.
            children:
              - WordSense-Core-WordLexicon-Words
              - WordSense-Core-WordLexicon-CaseCandidates
              - WordSense-Core-WordLexicon-Possessives
              - WordSense-Core-WordLexicon-Numerals
              - WordSense-Core-WordLexicon-Facts
              - WordSense-Core-WordLexicon-Complete
              - WordSense-Core-WordLexicon-Embedded
              - WordSense-Core-WordLexicon-LazyLoad
              - WordSense-Core-WordLexicon-Format
            tests:
              - WordLexicon_Lookup_KnownWord_ReturnsItsAnalyses

          - id: WordSense-Core-Senses
            title: >-
              The core subsystem shall provide the sense catalog: look a sense up by its id or by its OEWN sense key,
              list the senses of a lemma and part of speech in the order of Open English WordNet, look a group up by
              its id and list the senses of a group, and identify the sense inventory of the embedded image by a
              version string.
            tags: [subsystem]
            justification: |
              Every model answers with senses from the same inventory, and callers resolve an answer's ids (and attach
              WordNet-keyed resources through the sense key) without a model. A group answer always leads to its member
              senses through the group lookup, and the version lets a caller that stores group ids, which are versioned
              per data release, detect a changed catalog.
            children:
              - WordSense-Core-WordLexicon-Senses
              - WordSense-Core-WordLexicon-SenseLookup
              - WordSense-Core-WordLexicon-Groups
              - WordSense-Core-WordLexicon-Version
              - WordSense-Core-WordSenseContracts-SenseInfo
            tests:
              - WordLexicon_SensesOf_LemmaAndPartOfSpeech_ListsInOewnOrder
              - WordLexicon_TryGetSense_ById_FindsSense
              - WordLexicon_TryGetGroup_ById_ListsMemberSenses
              - WordLexicon_Version_IsStableLowerCaseHex

          - id: WordSense-Core-Contracts
            title: >-
              The core subsystem shall define the public contracts through which callers classify words with a
              model and receive results: one result per word with the analyses of the word and their probabilities
              (and, where scored, the probabilities of the senses inside each analysis), the selected analysis, the
              level at which the word was answered, its group and sense ids and its confidence, the records that
              describe a sense and a group, the optional capability that prepares the files of a model up front and
              the options that describe a download.
            tags: [subsystem]
            justification: |
              Callers program against one small set of contracts and can swap model packages, or supply their own
              model, without changing their code.
            children:
              - WordSense-Core-WordSenseContracts-Classify
              - WordSense-Core-WordSenseContracts-Result
              - WordSense-Core-WordSenseContracts-Level
              - WordSense-Core-WordSenseContracts-Confidence
              - WordSense-Core-WordSenseContracts-Candidates
              - WordSense-Core-WordSenseContracts-Model
              - WordSense-Core-WordSenseContracts-Downloadable
              - WordSense-Core-WordSenseContracts-DownloadOptions
              - WordSense-Core-WordSenseContracts-Details
              - WordSense-Core-WordSenseContracts-SenseInfo
            tests:
              - WordSenseContracts_ClassifyResult_SameValues_AreEqual
              - WordSenseContracts_SenseLevel_Values_AreTheFourLevels
              - WordSenseContracts_ClassifyResult_Analyses_AreKeptInOrder
              - WordSenseContracts_IDownloadableWordSenseModel_ExtendsIWordSenseModel

          - id: WordSense-Core-Fallback
            title: >-
              The core subsystem shall provide a public composite model that combines two models, answering each word
              with the result of the primary model (with the proportions of the fallback model for the tied variants
              of one of its slots, and, for a primary weight below 1, with the slot probabilities of both models
              combined where the primary result stays at the part-of-speech level) where it scored senses for the word
              and otherwise with the complete result of the fallback model, preparing the members that can be prepared,
              and owning the lifetime of both.
            tags: [subsystem]
            justification: |
              Model packages differ in what they can score; a composite in the core package lets any pair of
              models, including a third-party model, be combined without a package depending on another model
              package, and lets the encoder packages offer one model that answers every word.
            children:
              - WordSense-Core-WordSenseContracts-Fallback
              - WordSense-Core-WordSenseContracts-FallbackSlotSplit
              - WordSense-Core-WordSenseContracts-FallbackReconcile
              - WordSense-Core-WordSenseContracts-FallbackEnsure
            tests:
              - WordSenseContracts_FallbackWordSenseModel_PrimaryScoredSenses_UsesPrimary
              - WordSenseContracts_FallbackWordSenseModel_PrimaryChoseOnlyAnalysis_UsesFallback
              - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_EnsuresBoth
              - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_OnlyCapableMemberEnsured
              - WordSenseContracts_FallbackWordSenseModel_Dispose_DisposesBothOnce
              - WordSenseContracts_FallbackWordSenseModel_TiedVariantsOfASlot_TakeTheProportionsOfTheFallback
              - WordSenseCore_Fallback_PartOfSpeechLevelPrimary_IsReconciledWithTheBasicModel

          - id: WordSense-Core-Candidates-RankingKind
            title: >-
              The core subsystem shall tell a ranking of senses by usage from a score of senses in context on every
              analysis it lists: the contracts expose the kind, the Basic model marks its usage ranking, and a candidate
              built without the mark counts as scored in context.
            tags: [subsystem]
            justification: |
              The composite model and the consumers must not take a context-free base rate for evidence of the context.
            children:
              - WordSense-Core-WordSenseContracts-Candidates-RankingKind
              - WordSense-Core-WordSenseContracts-Candidates-RankingKind-Default
              - WordSense-Core-WordSenseContracts-Candidates-RankingKind-Equality
              - WordSense-Core-BasicClassifier-UsagePrior-Marked
              - WordSense-Core-BasicClassifier-UsagePrior-Marked-Other
              - WordSense-Core-BasicClassifier-UsagePrior-ShortRanking
            tests:
              - WordSenseContracts_AnalysisCandidate_SensesRankedByUsage_DefaultsToContextScored
              - BasicClassifier_ClassifyAsync_UsagePrior_MarksTheSensesAsRankedByUsage

          - id: WordSense-Core-Fallback-UsageRanking
            title: >-
              The core composite model shall not take a ranking of senses by usage for a score of the senses: it shall
              answer with the fallback result a word whose primary result only ranks the senses by usage, keep using
              (and refining and reconciling) a primary result whose senses are scored in context, and keep the kind of
              ranking of every analysis it combines.
            tags: [subsystem]
            justification: |
              The Basic model lists context-free, usage-ranked senses for untrained polysemous words; a composite whose
              primary model ranks by a prior must not enter the refinement and the reconciliation as if the primary
              model had scored the senses in context.
            children:
              - WordSense-Core-WordSenseContracts-FallbackUsage
              - WordSense-Core-WordSenseContracts-FallbackScored
              - WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Kind
            tests:
              - WordSenseContracts_FallbackWordSenseModel_BasicAsPrimary_UsageRankedSenses_AreNotRefinedOrReconciled
              - WordSenseContracts_FallbackWordSenseModel_PrimaryWithContextScoredSenses_StillReconciled
              - WordSenseContracts_FallbackWordSenseModel_Reconcile_KeepsTheRankingKindOfEveryAnalysis

          - id: WordSense-Core-Failures
            title: >-
              The core subsystem shall define the typed exceptions for failures of model files and download
              settings and shall report a missing or damaged embedded resource (the word image, the statistics table of
              the built-in model) as ModelIntegrityException that carries the original exception.
            tags: [subsystem]
            justification: |
              Callers handle failures by type, not by message; the embedded resources are part of the model, so a
              damaged package surfaces as the same integrity failure as a damaged model file.
            children:
              - WordSense-Core-WordSenseContracts-Exceptions
              - WordSense-Core-WordLexicon-Integrity
              - WordSense-Core-BasicTables-Integrity
            tests:
              - WordSenseExceptions_Hierarchy_DerivesFromWordSenseException
              - WordLexicon_OpenImage_MissingResource_ThrowsModelIntegrity
              - BasicTables_LoadEmbedded_MissingResource_ThrowsModelIntegrity

          - id: WordSense-Core-Classify
            title: >-
              The core subsystem shall classify words from the core lexicon statistically, with no model download: an
              unknown word as unknown, with no analysis, and every known word with all its analyses and their
              probabilities, the analysis that the sentence context (the tense of a verb whose past and non-past share a
              spelling included and, for a form that has a capitalized and a
              lower-case lemma, the case of the written word) makes most probable selected, at the part of speech
              level, or at the sense level where the selected analysis has exactly one sense.
            tags: [subsystem]
            justification: |
              A lexicon lookup decides most words; the part of speech and the context cues in the sentence decide the
              rest without a model. Without fine-sense evidence the built-in model states only what it can tell, the
              analysis and its probability, and names a sense only where the lemma and part of speech have no other.
              Every caller therefore gets an answer for every word from the core package alone, and the encoder
              packages build on it.
            children:
              - WordSense-Core-BasicWordSenseModel-Classify
              - WordSense-Core-BasicWordSenseModel-Dispose
              - WordSense-Core-BasicClassifier-Unknown
              - WordSense-Core-BasicClassifier-Known
              - WordSense-Core-BasicClassifier-SingleSense
              - WordSense-Core-BasicClassifier-Resolve
              - WordSense-Core-BasicClassifier-Level
              - WordSense-Core-BasicClassifier-Segments
              - WordSense-Core-BasicClassifier-Case
              - WordSense-Core-BasicClassifier-Tense
              - WordSense-Core-BasicClassifier-Normalization
              - WordSense-Core-BasicClassifier-Validation
            tests:
              - BasicClassifier_ClassifyAsync_Context_ChoosesPartOfSpeech
              - BasicClassifier_ClassifyAsync_Context_SelectsTheMostProbableAnalysis
              - BasicWordSenseModel_ClassifyAsync_CaseOfWord_ChoosesTheLemma
              - BasicWordSenseModel_ClassifyAsync_SameSpellingVerb_TenseFollowsTheContext

          - id: WordSense-Core-Candidates
            title: >-
              The core subsystem shall list, for every known word, all its analyses with probabilities that sum to
              one, the lemmas and parts of speech by the sum of their probabilities, the largest first, and inside
              one of them the feature variants by their own probability, the largest first and, on a tie, in lexicon
              order.
            tags: [subsystem]
            justification: |
              A consumer that reads the analyses needs every reading of the word with an honest probability, in an
              order that puts the selected analysis first.
            children:
              - WordSense-Core-BasicClassifier-Candidates
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_ListsAnalysesAndNoSenses
              - BasicClassifier_ClassifyAsync_TiesKeepLexiconOrder
              - BasicClassifier_ClassifyAsync_VariantsOfASlot_ShareItsProbabilityAndStayTogether

          - id: WordSense-Core-Candidates-OneSense
            title: >-
              The core subsystem shall list in an analysis whose lemma and part of speech have exactly one sense that
              sense with probability 1.
            tags: [subsystem]
            justification: |
              The one sense of a single-sense analysis is certain and needs no evidence.
            children:
              - WordSense-Core-BasicClassifier-Candidates-SingleSense
            tests:
              - BasicClassifier_ClassifyAsync_SingleSenseAnalysis_ListsThatSenseWithProbabilityOne

          - id: WordSense-Core-Candidates-RankedSenses
            title: >-
              The core subsystem shall list in an analysis whose lemma and part of speech have two or more senses
              those senses ranked by the usage prior.
            tags: [subsystem]
            justification: |
              About 83 percent of the ambiguous words of running text have a lemma that no encoder was trained for; the
              usage of the senses is the one piece of evidence that exists for every lemma, so ranking by it gives a
              consumer the likely senses.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior
              - WordSense-Core-BasicClassifier-UsagePrior-Slots
              - WordSense-Core-BasicClassifier-UsagePrior-FewerSenses
            tests:
              - BasicClassifier_ClassifyAsync_PolysemousWord_ListsTheSensesRankedByUsage
              - BasicClassifier_ClassifyAsync_PriorIsAskedOnlyForSlotsWithTwoOrMoreSenses

          - id: WordSense-Core-Candidates-UsageProbability
            title: >-
              The core subsystem shall give each ranked sense of the usage prior the probability of its WordNet 3.0 tag
              count plus the smoothing constant over the sum of that over the senses of the lemma and part of speech.
            tags: [subsystem]
            justification: |
              Add-k smoothing keeps a sense that was never tagged possible while the counts decide the probabilities.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-Formula
              - WordSense-Core-BasicClassifier-UsagePrior-Normalized
              - WordSense-Core-BasicClassifier-UsagePrior-ProjectSense
            tests:
              - UsagePrior_RankOf_UsesTheSmoothingConstantOne
              - UsagePrior_RankOf_PolysemousLemma_RanksEverySenseOfTheSlot

          - id: WordSense-Core-Candidates-UsageOrder
            title: >-
              The core subsystem shall list the senses of the usage prior sorted by probability, the largest first, with
              senses of equal probability in the inventory order of the lemma.
            tags: [subsystem]
            justification: |
              The inventory order is the order of Open English WordNet, which puts the common senses first, so it
              decides among equal counts and for a lemma without any count.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-Order
              - WordSense-Core-BasicClassifier-UsagePrior-Ties
              - WordSense-Core-BasicClassifier-UsagePrior-Smoothing
              - WordSense-Core-BasicClassifier-UsagePrior-Stable
              - WordSense-Core-BasicClassifier-UsagePrior-ContextFree
            tests:
              - UsagePrior_RankOf_PolysemousLemma_RanksEverySenseOfTheSlot
              - BasicClassifier_ClassifyAsync_RankingDoesNotDependOnContext

          - id: WordSense-Core-Candidates-NoSenses
            title: >-
              The core subsystem shall list no senses in an analysis whose lemma and part of speech have none.
            tags: [subsystem]
            justification: |
              An empty sense list says that nothing was ranked; inventing senses for a lemma without any would mislead a
              consumer.
            children:
              - WordSense-Core-BasicClassifier-Candidates-NoSenses
            tests:
              - BasicClassifier_ClassifyAsync_AnalysisWithoutSenses_ListsNoSenses

          - id: WordSense-Core-Candidates-NoAnswer
            title: >-
              The core subsystem shall never answer a sense or a group from the usage prior: the level, the confidence,
              the sense id and the group id of a result shall be those of the classifier without the prior.
            tags: [subsystem]
            justification: |
              The ranking is evidence about the lemma and not about the sentence; claiming a sense answer from it would
              turn a base rate into a false decision.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-NoAnswer
            tests:
              - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheAnswer
              - BasicClassifier_ClassifyAsync_PolysemousWord_AnswersAtThePartOfSpeechLevelWithoutSenseOrGroup

          - id: WordSense-Core-Candidates-NoAnalysisChange
            title: >-
              The core subsystem shall keep the selected analysis and the probability of every analysis of a result
              those of the classifier without the usage prior.
            tags: [subsystem]
            justification: |
              Only the sense lists of the analyses gain content, so every consumer of the analyses sees the same
              distribution as before.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-NoAnswer-Selection
              - WordSense-Core-BasicClassifier-UsagePrior-NoAnswer-Probabilities
            tests:
              - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheSelectedAnalysis
              - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheAnalysisProbabilities

          - id: WordSense-Core-Candidates-Key
            title: >-
              The core subsystem shall give the key of the result of a polysemous word the label of the top-ranked sense
              of the selected analysis.
            tags: [subsystem]
            justification: |
              The key names the meaning where a model ranked one, so the ranking by usage gives a key with a label.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-Key
            tests:
              - BasicClassifier_ClassifyAsync_PolysemousWord_KeyCarriesTheLabelOfTheTopRankedSense

          - id: WordSense-Core-Candidates-KeyEnumerated
            title: >-
              The key of the result of a polysemous word shall be a member of the keys that the core subsystem
              enumerates.
            tags: [subsystem]
            justification: |
              The keys of all senses are in the enumeration, so the guarantee that every key a model gives is enumerated
              still holds with the ranking.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-Key-Enumerated
            tests:
              - BasicClassifier_ClassifyAsync_PolysemousWord_KeyIsOneOfTheEnumeratedKeys
              - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated

          - id: WordSense-Core-UsagePrior-Validation
            title: >-
              The core subsystem shall reject invalid arguments when it ranks senses by the usage prior.
            tags: [subsystem]
            justification: |
              A wrong constant or count would rank by wrong numbers without any sign of it.
            children:
              - WordSense-Core-BasicClassifier-UsagePrior-Validation-Smoothing
              - WordSense-Core-BasicClassifier-UsagePrior-Validation-Count
              - WordSense-Core-BasicClassifier-UsagePrior-Validation-MissingList
              - WordSense-Core-BasicClassifier-UsagePrior-Validation-MissingLemma
            tests:
              - UsagePrior_Rank_SmoothingNotPositive_Throws
              - UsagePrior_Rank_NegativeCount_Throws
              - UsagePrior_Rank_MissingList_Throws
              - UsagePrior_RankOf_MissingLemma_Throws

          - id: WordSense-Core-SenseFrequency
            title: >-
              The core subsystem shall carry the WordNet 3.0 tag count of every sense of its catalog.
            tags: [subsystem]
            justification: |
              The usage prior that ranks the senses of the lemmas no model scores needs the counts at run time, and the
              core package has no files.
            children:
              - WordSense-Core-WordLexicon-SenseFrequency
              - WordSense-Core-WordLexicon-SenseFrequency-ProjectSense
            tests:
              - WordLexicon_Image_SenseFrequency_HasACountForEverySense
              - WordLexicon_Image_UsageOf_ProjectSense_HasTagCountZero

          - id: WordSense-Core-SenseFrequency-Access
            title: >-
              The core subsystem shall list the senses of a lemma and part of speech with their tag counts in inventory
              order.
            tags: [subsystem]
            justification: |
              The usage prior ranks the senses of one lemma and part of speech and breaks ties by the inventory order.
            children:
              - WordSense-Core-WordLexicon-SenseFrequency-Access
            tests:
              - WordLexicon_Image_UsageOf_ListsTheSensesInInventoryOrderWithTheirTagCounts

          - id: WordSense-Core-SenseFrequency-InventoryHash
            title: >-
              The inventory hash of the sense catalog shall not depend on the tag counts.
            tags: [subsystem]
            justification: |
              The counts say how often the senses are used, not which senses exist; keeping them out of the identity of
              the inventory means that adding or correcting the counts needs no training of the models.
            children:
              - WordSense-Core-WordLexicon-SenseFrequency-InventoryHash
            tests:
              - WordLexicon_Image_TagCounts_AreNotPartOfTheInventoryHash

          - id: WordSense-Core-SenseFrequency-Integrity
            title: >-
              The core subsystem shall reject a sense catalog whose sense frequency section is damaged.
            tags: [subsystem]
            justification: |
              A damaged section must fail loudly instead of ranking the senses by wrong counts.
            children:
              - WordSense-Core-WordLexicon-SenseFrequency-Missing
              - WordSense-Core-WordLexicon-SenseFrequency-Length
              - WordSense-Core-WordLexicon-SenseFrequency-Keyless
            tests:
              - WordLexicon_Image_SenseFrequencySectionMissing_IsRejected
              - WordLexicon_Image_SenseFrequencyWrongLength_IsRejected
              - WordLexicon_Image_TagCountOnASenseWithoutAKey_IsRejected

          - id: WordSense-Core-Tagger
            title: >-
              The core subsystem shall estimate, for every word of a sentence segment, the probability of each part
              of speech from the whole segment, using embedded statistics only.
            tags: [subsystem]
            justification: |
              The part of speech of an ambiguous word depends on the words around it on both sides, so the estimate
              must weigh the whole segment rather than a fixed window. The clause of the word, a gerund that opens
              the segment and a possessive written as one token refine the estimate; each is its own requirement
              below.
            children:
              - WordSense-Core-BasicTables-Load
              - WordSense-Core-PosTagger-Posteriors
              - WordSense-Core-PosTagger-UnknownWords
              - WordSense-Core-Tagger-ClauseVerb
              - WordSense-Core-Tagger-ClauseBreak
              - WordSense-Core-Tagger-NonFiniteStart
              - WordSense-Core-Tagger-Possessive
              - WordSense-Core-Tagger-WordPrior
              - WordSense-Core-Tagger-WordPrior-Counts
              - WordSense-Core-Tagger-WordPrior-Unknown
              - WordSense-Core-Tagger-WordPrior-Disabled
              - WordSense-Core-Tagger-WordPrior-Invalid
              - WordSense-Core-Tagger-WordPrior-Format
              - WordSense-Core-Tagger-NounVerb
            tests:
              - PosTagger_Posteriors_AfterDeterminer_PrefersNoun

          - id: WordSense-Core-Tagger-WordPrior
            title: >-
              The core subsystem shall tag an ambiguous word that has no training counts with the part of speech that
              the sense catalog of the embedded lexicon shows as more frequent for it.
            tags: [subsystem]
            justification: |
              Most ambiguous words do not occur in the training text, so the tagger has no evidence of its own about
              them. The catalog ships with the library and shows, for example, that rank is a noun far more often than
              a verb.
            children:
              - WordSense-Core-PosTagger-WordPrior-NoCounts
              - WordSense-Core-PosTagger-Support-Totals
              - WordSense-Core-PosTagger-Support-OnePair
              - WordSense-Core-PosTagger-Support-ClosedClass
              - WordSense-Core-PosTagger-Support-Distribution
              - WordSense-Core-PosTagger-Support-Uncovered
              - WordSense-Core-PosTagger-Support-Exponent
              - WordSense-Core-PosTagger-Support-SenseWeight
              - WordSense-Core-PosTagger-Support-NoEvidence
              - WordSense-Core-PosTagger-Support-LargeExponent
              - WordSense-Core-PosTagger-Support-NonFinite
              - WordSense-Core-PosTagger-Support-Image
              - WordSense-Core-BasicClassifier-WordPrior-Support-Ambiguous
              - WordSense-Core-BasicTables-Prior-Share
              - WordSense-Core-BasicTables-Prior-Smoothing
              - WordSense-Core-BasicTables-Prior-Senses
              - WordSense-Core-BasicTables-Prior-Exponent
            tests:
              - PosTagger_Posteriors_WordWithoutCounts_FollowsTheCatalogPrior

          - id: WordSense-Core-Tagger-WordPrior-Counts
            title: >-
              The core subsystem shall tag a word that has many training counts with the part of speech of its
              counts, whatever the sense catalog shows.
            tags: [subsystem]
            justification: |
              The counts of the word itself are better evidence than a dictionary that comes from other texts.
            children:
              - WordSense-Core-PosTagger-WordPrior-ManyCounts
              - WordSense-Core-PosTagger-WordPrior-FewCounts
            tests:
              - PosTagger_Posteriors_ManyCounts_OutweighTheCatalogPrior

          - id: WordSense-Core-Tagger-WordPrior-Unknown
            title: >-
              The core subsystem shall not let the sense catalog change the tag of a word that the catalog has no
              sense for.
            tags: [subsystem]
            justification: |
              A word without catalog evidence must be tagged from its counts and its context alone, so that the
              catalog does not invent evidence.
            children:
              - WordSense-Core-PosTagger-WordPrior-NoSupport
              - WordSense-Core-PosTagger-Support-NoSenses
              - WordSense-Core-PosTagger-Support-NoAnalyses
              - WordSense-Core-BasicClassifier-WordPrior-Support-Single
              - WordSense-Core-BasicClassifier-WordPrior-Support-Unknown
            tests:
              - PosTagger_Posteriors_NoSupport_IgnoresThePrior

          - id: WordSense-Core-Tagger-WordPrior-Disabled
            title: >-
              The core subsystem shall not let the sense catalog change the tag of any word when the table of the
              model switches the word prior off.
            tags: [subsystem]
            justification: |
              A table without a word prior must tag from its counts and its context alone, so that the prior can be
              switched off and its effect measured.
            children:
              - WordSense-Core-PosTagger-WordPrior-Disabled
            tests:
              - PosTagger_Posteriors_NoShare_IgnoresThePrior

          - id: WordSense-Core-Tagger-WordPrior-Invalid
            title: >-
              The core subsystem shall reject a table of the model whose word prior values are outside their valid
              ranges.
            tags: [subsystem]
            justification: |
              A word prior with a value outside its range would give a wrong emission for every word; such a table is
              damage, not data.
            children:
              - WordSense-Core-BasicTables-Prior-ShareInvalid
              - WordSense-Core-BasicTables-Prior-SmoothingInvalid
              - WordSense-Core-BasicTables-Prior-SensesInvalid
              - WordSense-Core-BasicTables-Prior-ExponentInvalid
              - WordSense-Core-BasicTables-Prior-WeightInvalid
            tests:
              - BasicTables_Load_PriorOnWithoutWeight_Throws

          - id: WordSense-Core-Tagger-WordPrior-Format
            title: >-
              The core subsystem shall reject a table of the model in the format WSB5, which has no word prior.
            tags: [subsystem]
            justification: |
              A table in a format that has no word prior must fail loudly, not be read as a current one.
            children:
              - WordSense-Core-BasicTables-Wsb5
            tests:
              - BasicTables_Load_PreviousFormatWsb5_ThrowsUnknownFormat

          - id: WordSense-Core-Tagger-NounVerb
            title: >-
              The core subsystem shall answer the part of speech Noun, not Verb, for a word that is mostly a verb when
              it ends a noun compound after a determiner and a modifier noun (`call` in `Make a courtesy call to the
              hotel .`, `sweep` in `Do a safety sweep of the room .`).
            tags: [subsystem]
            justification: |
              The word itself weighs how often it is a verb, and a verb-dominant word keeps that weight in a context
              that says noun. The words around it say more than the word does for a word that is rarely seen as a
              noun, with a model that is shared by all such words and reads no word list.
            tests:
              - WordSenseCore_Tagger_VerbDominantWordEndingACompound_IsNoun
            children:
              - WordSense-Core-BasicClassifier-NounVerb
              - WordSense-Core-BasicTables-NounVerb
              - WordSense-Core-CueModel-NounVerb

          - id: WordSense-Core-Tagger-ClauseVerb
            title: >-
              The core subsystem shall estimate the part of speech of a word with regard to whether the clause of the
              word already has a verb, so that a word that could be a noun or a verb and follows a determiner and a
              noun is a noun when the clause already has a verb.
            tags: [subsystem]
            justification: |
              A clause has one finite verb, so in a clause that has one the word after a determiner and a noun
              is the second noun of a compound (the door handle), not a second verb.
            children:
              - WordSense-Core-PosTagger-ClauseVerb
              - WordSense-Core-BasicTables-Clause
            tests:
              - BasicWordSenseModel_ClassifyAsync_NounAfterNounInClauseWithVerb_IsNoun

          - id: WordSense-Core-Tagger-ClauseBreak
            title: >-
              The core subsystem shall start a new clause after a punctuation token and after a conjunction, so that
              a word that could be a noun or a verb and follows a determiner and a noun there is a verb again
              although the earlier clause had a verb.
            tags: [subsystem]
            justification: |
              The verb of the previous clause must not suppress the verb of the next one.
            children:
              - WordSense-Core-PosTagger-ClauseBreak
            tests:
              - BasicWordSenseModel_ClassifyAsync_VerbAfterClauseBreak_IsVerb

          - id: WordSense-Core-Tagger-NonFiniteStart
            title: >-
              The core subsystem shall not take a first word of a sentence segment that the dictionary lists as a
              verb only in non-finite forms (a gerund, or a participle that is not also a past tense) as the verb of
              its clause, so that such a word before a determiner is still read as a verb.
            tags: [subsystem]
            justification: |
              A gerund that opens a sentence (Resolving this issue requires care) is not the verb of its clause; the
              verb of the clause is still to come, and an imperative must keep the verb of its clause.
            children:
              - WordSense-Core-PosTagger-NonFiniteStart
              - WordSense-Core-BasicClassifier-NonFinite-Flag
              - WordSense-Core-BasicClassifier-NonFinite-NoFlag
            tests:
              - BasicWordSenseModel_ClassifyAsync_GerundAtTheStart_IsStillAVerb

          - id: WordSense-Core-Tagger-Possessive
            title: >-
              The core subsystem shall estimate the part of speech of the word after a possessive that is written as
              one token (technician's) as it does after a noun and a separate possessive marker, so that the word after
              the possessive is a noun.
            tags: [subsystem]
            justification: |
              The statistics come from text with a separate marker while the documented input keeps the marker inside
              the token, so reading the stem and the marker shows the tagger the pattern it knows.
            children:
              - WordSense-Core-PosTagger-Possessive-Expansion
              - WordSense-Core-PosTagger-Possessive-Rows
              - WordSense-Core-BasicClassifier-Possessive-Stem
              - WordSense-Core-BasicClassifier-Possessive-Whole
              - WordSense-Core-BasicClassifier-Possessive-Rows
            tests:
              - BasicWordSenseModel_ClassifyAsync_PossessiveToken_ReadsTheNextWordAsNoun

          - id: WordSense-Core-Cues
            title: >-
              The core subsystem shall separate analyses of one form that share a part of speech (the past and the
              present of read, or the lemmas of a form such as left) by scoring context cues taken from the words
              around the target against the cue statistics of the form or of its lemma, whose columns are analyses.
            tags: [subsystem]
            justification: |
              Part of speech alone cannot choose between the analyses of one part of speech; the neighboring words
              can.
            children:
              - WordSense-Core-CueModel-Extract
              - WordSense-Core-CueModel-Score
              - WordSense-Core-CueModel-Tense
              - WordSense-Core-BasicTables-Tense
              - WordSense-Core-Cues-Reliability
            tests:
              - BasicClassifier_ClassifyAsync_SamePartOfSpeechAnalyses_UsesCues

          - id: WordSense-Core-Cues-Reliability
            title: >-
              The core subsystem shall scale the cue scores of a cue table by the reliability that the table carries.
            tags: [subsystem]
            justification: |
              A cue table is trained on a small, balanced sample of the senses of one word, and some tables predict
              poorly. The builder stores a reliability with each table (see the builder requirements on the held-out
              measurement), and a table of low reliability must count for less than the tagger.
            children:
              - WordSense-Core-BasicTables-Reliability
              - WordSense-Core-BasicClassifier-CueReliability-Zero
              - WordSense-Core-BasicClassifier-CueReliability-ZeroIsNoTable
              - WordSense-Core-BasicClassifier-CueReliability-Full
              - WordSense-Core-BasicClassifier-CueReliability-Partial
            tests:
              - BasicClassifier_ClassifyAsync_CueReliability_ScalesTheCueScores

          - id: WordSense-Core-Fusion
            title: >-
              The core subsystem shall combine the part-of-speech probabilities and the cue scores into one
              probability for every analysis of an ambiguous word, each greater than 0 and the probabilities summing to
              one, so that the confidence of the answer, the probability of the lemma and part of speech of the
              selected analysis, is greater than 0
              and at most 1.
            tags: [subsystem]
            justification: |
              Callers apply their own confidence policy; an answer with an honest probability for every ambiguous word
              lets them do so without a separate abstention path.
            children:
              - WordSense-Core-SenseFusion-Fuse
              - WordSense-Core-SenseFusion-Stable
              - WordSense-Core-BasicClassifier-Resolve
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability

          - id: WordSense-Core-Deterministic
            title: >-
              The core subsystem shall give the same results for the same input on every call and every thread.
            tags: [subsystem]
            justification: |
              Reproducible results make behavior testable and allow one classifier to serve concurrent callers.
            children:
              - WordSense-Core-BasicClassifier-Deterministic
              - WordSense-Core-PosTagger-Deterministic
              - WordSense-Core-BasicWordSenseModel-Classify
              - WordSense-Core-BasicTables-Immutable
            tests:
              - BasicClassifier_ClassifyAsync_IsDeterministicAndThreadSafe

          - id: WordSense-Core-Offline
            title: >-
              The core subsystem shall use only statistics embedded in the package, and need no model file, no
              network access and no native runtime, and its built-in model shall need no preparation step.
            tags: [subsystem]
            justification: |
              The core package exists for callers that cannot or will not download or ship a model; the encoder
              packages add models for callers that can.
            children:
              - WordSense-Core-BasicWordSenseModel-NoFiles
              - WordSense-Core-BasicTables-Load
              - WordSense-Core-BasicTables-Embedded
            tests:
              - BasicWordSenseModel_IsNotDownloadable
              - BasicTables_Default_LoadsEmbeddedTable

          - id: WordSense-Core-Keys-Format
            title: >-
              The core subsystem shall give a known word with a selected analysis one stable string key of the format
              {spelling}|{lemma}/{Part}[/{Features}][#{label}] that names its analysis and, where known, its sense, and
              that is derived from the result alone.
            tags: [subsystem]
            justification: |
              A consumer that attaches its own data to the meaning of a word (WordSense never carries phonemes)
              needs one key for each answer.
            children:
              - WordSense-Core-WordSenseContracts-Key-Format
              - WordSense-Core-WordSenseContracts-Key-Label
              - WordSense-Core-WordSenseContracts-WordKey-Text
            tests:
              - ClassifyResult_Key_SenseLevel_HasTheLabelOfTheAnsweredSense
              - ClassifyResult_Key_RankedSenses_FallBackToTheTopRankedSense
              - WordKey_ToString_SeparatorsInParts_AreEscaped

          - id: WordSense-Core-Keys-Null
            title: >-
              The core subsystem shall give an unknown word and a result without a selected analysis no key (null),
              and every known answered word a key.
            tags: [subsystem]
            justification: |
              A consumer must be able to tell a word that has a meaning to map from one that has none.
            children:
              - WordSense-Core-WordSenseContracts-Key-Null
              - WordSense-Core-WordSenseContracts-KeyCompleteness-KnownHasKey
            tests:
              - ClassifyResult_Key_UnknownOrUnanswered_IsNull
              - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated

          - id: WordSense-Core-Keys-BuildAndParse
            title: >-
              The core subsystem shall let callers build a key as an immutable value, and parse the text of a key back
              into its parts exactly, accepting canonical text only.
            tags: [subsystem]
            justification: |
              A consumer that stores keys parses them to read the analysis and the sense.
            children:
              - WordSense-Core-WordSenseContracts-WordKey-Value
              - WordSense-Core-WordSenseContracts-WordKey-Parse
              - WordSense-Core-WordSenseContracts-WordKey-CanonicalOnly
            tests:
              - WordKey_Value_SameParts_AreEqual
              - WordKey_TryParse_ValidKey_RoundTrips
              - WordKey_TryParse_NotAKey_IsRefused

          - id: WordSense-Core-Keys-Enumeration
            title: >-
              The core subsystem shall let callers enumerate every key that any model can return: the key of every
              analysis of every normalized spelling and of every catalog sense of the lemma and part of speech of
              the analysis, the possessive spellings included.
            tags: [subsystem]
            justification: |
              A consumer that builds a map from key to its own data must know every key in advance. The guarantee holds
              by construction (the key of a result and the enumeration are built from the same analyses and catalog
              senses); the model-level tests check it on a sample.
            children:
              - WordSense-Core-WordLexicon-Keys-Analyses
              - WordSense-Core-WordLexicon-Keys-Senses
              - WordSense-Core-WordLexicon-Keys-Possessive
              - WordSense-Core-WordSenseContracts-KeyCompleteness-Sample
            tests:
              - WordLexicon_Keys_LookedUpWord_HasAKeyForEachAnalysisAndSense
              - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated

          - id: WordSense-Core-Keys-EnumerationOrder
            title: >-
              The core subsystem shall enumerate the keys with deferred execution, each key once and in canonical
              form, in the same order on every enumeration.
            tags: [subsystem]
            justification: |
              A reproducible, duplicate-free enumeration is what a key export and a consumer's map need.
            children:
              - WordSense-Core-WordLexicon-Keys-Unique
              - WordSense-Core-WordLexicon-Keys-WellFormed
              - WordSense-Core-WordLexicon-Keys-Order
            tests:
              - WordLexicon_Keys_Enumeration_ListsNoKeyTwice
              - WordLexicon_Keys_EveryKey_ParsesBackToItselfWithANormalizedSpelling
              - WordLexicon_Keys_Enumeration_IsDeferredAndRepeatable

          - id: WordSense-Core-Independent
            title: >-
              The core subsystem shall not depend on ONNX Runtime, encoder weights or vector mathematics.
            tags: [subsystem]
            justification: |
              The core package must stay small and free of native dependencies so that every layer above it, and
              callers that use only the lexicon or the built-in statistical model, can take it without extra cost.
              The embedded statistical tables of the built-in model are counts, not encoder weights.
            children:
              - WordSense-Core-WordSenseContracts-Independent
            tests:
              - WordSenseContracts_CoreAssembly_HasNoOnnxOrWeightsReferences

          - id: WordSense-Core-Packaging
            title: >-
              The core package shall ship its XML documentation with a namespace summary and verified examples, its
              NuGet metadata with the license expression MIT AND CC-BY-4.0, and a README and a packed NOTICE file that
              carry the credits and licenses of the third-party word data it embeds (Open English WordNet 2025 under
              CC BY 4.0 with the Princeton WordNet notice that it requires) and of the statistics of its built-in
              model (derived from the CC0 open part-of-speech corpus and the CC0 sentence corpus of this project, with
              no share-alike or other attribution-bound text) and of the CC0 forms authored by the project.
            tags: [subsystem]
            justification: |
              The embedded lexicon and sense inventory derive from Open English WordNet and, through its sense
              frequencies, from Princeton WordNet 3.0, whose licenses require attribution, and consumers learn the API
              from the documentation that ships with the package. The embedded statistics are trained on our own CC0
              corpora, so they add no license obligation; the notice records where they come from and that no
              treebank was used.
            tests:
              - WordSense_XmlDocExamples_Compile
