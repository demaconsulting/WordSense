---
# Core subsystem requirements (the package DemaConsulting.WordSense: the lexicon, the sense catalog, the contracts and
# the built-in statistical model, which was the separate Basic package before version 1.0)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        requirements:
          - id: WordSense-Core-Lexicon
            title: >-
              The core subsystem shall provide the embedded word lexicon: for each known word, including inflected
              forms, determiners, conjunctions and interjections, the analyses (lemma, part of speech and features) it
              can have, resolving cased and inflected spellings like their base form.
            tags: [subsystem]
            justification: |
              Every model package starts from the same lexicon of analyses, so it is provided once, in the package that
              all others reference.
            children:
              - WordSense-Core-WordLexicon-Words
              - WordSense-Core-WordLexicon-Possessives
              - WordSense-Core-WordLexicon-Facts
              - WordSense-Core-WordLexicon-Complete
              - WordSense-Core-WordLexicon-Embedded
              - WordSense-Core-WordLexicon-LazyLoad
              - WordSense-Core-WordLexicon-Format
            tests:
              - WordLexicon_Lookup_KnownWord_ReturnsItsAnalyses

          - id: WordSense-Core-Senses
            title: >-
              The core subsystem shall provide the sense catalog: look a sense up by its id or by its OEWN sense key,
              list the senses of a lemma and part of speech with the most frequent first, look a group up by its id and
              list the senses of a group, and identify the sense inventory of the embedded image by a version string.
            tags: [subsystem]
            justification: |
              Every model answers with senses from the same inventory, and callers resolve an answer's ids (and attach
              WordNet-keyed resources through the sense key) without a model. A group answer always leads to its member
              senses through the group lookup, and the version lets a caller that stores group ids, which are versioned
              per data release, detect a changed catalog.
            children:
              - WordSense-Core-WordLexicon-Senses
              - WordSense-Core-WordLexicon-SenseLookup
              - WordSense-Core-WordLexicon-Groups
              - WordSense-Core-WordLexicon-Version
              - WordSense-Core-WordSenseContracts-SenseInfo
            tests:
              - WordLexicon_SensesOf_LemmaAndPartOfSpeech_ListsMostFrequentFirst
              - WordLexicon_TryGetSense_ById_FindsSense
              - WordLexicon_TryGetGroup_ById_ListsMemberSenses
              - WordLexicon_Version_IsStableLowerCaseHex

          - id: WordSense-Core-Contracts
            title: >-
              The core subsystem shall define the public contracts through which callers classify words with a
              model and receive results: one result per word with the analyses of the word and their probabilities
              (and, where scored, the probabilities of the senses inside each analysis), the selected analysis, the
              level at which the word was answered, its group and sense ids and its confidence, and the records that
              describe a sense and a group.
            tags: [subsystem]
            justification: |
              Callers program against one small set of contracts and can swap model packages, or supply their own
              model, without changing their code.
            children:
              - WordSense-Core-WordSenseContracts-Classify
              - WordSense-Core-WordSenseContracts-Result
              - WordSense-Core-WordSenseContracts-Level
              - WordSense-Core-WordSenseContracts-Confidence
              - WordSense-Core-WordSenseContracts-Candidates
              - WordSense-Core-WordSenseContracts-Model
              - WordSense-Core-WordSenseContracts-Mirror
              - WordSense-Core-WordSenseContracts-Details
              - WordSense-Core-WordSenseContracts-SenseInfo
            tests:
              - WordSenseContracts_ClassifyResult_SameValues_AreEqual
              - WordSenseContracts_SenseLevel_Values_AreTheFourLevels
              - WordSenseContracts_ClassifyResult_Analyses_AreKeptInOrder

          - id: WordSense-Core-Fallback
            title: >-
              The core subsystem shall provide a public composite model that combines two models, answering each word
              with the complete result of the primary model where it scored senses for the word and otherwise with
              the complete result of the fallback model, and owning the lifetime of both.
            tags: [subsystem]
            justification: |
              Model packages differ in what they can score; a composite in the core package lets any pair of
              models, including a third-party model, be combined without a package depending on another model
              package, and lets the encoder packages offer one model that answers every word.
            children:
              - WordSense-Core-WordSenseContracts-Fallback
            tests:
              - WordSenseContracts_FallbackWordSenseModel_PrimaryScoredSenses_UsesPrimary
              - WordSenseContracts_FallbackWordSenseModel_PrimaryChoseOnlyAnalysis_UsesFallback

          - id: WordSense-Core-Classify
            title: >-
              The core subsystem shall classify words from the core lexicon statistically, with no model download: an
              unknown word as unknown, with no analysis, and every known word with all its analyses and their
              probabilities, the analysis that the sentence context makes most probable selected, at the part of speech
              level, or at the sense level where the selected analysis has exactly one sense.
            tags: [subsystem]
            justification: |
              A lexicon lookup decides most words; the part of speech and the context cues in the sentence decide the
              rest without a model. Without fine-sense evidence the built-in model states only what it can tell, the
              analysis and its probability, and names a sense only where the lemma and part of speech have no other.
              Every caller therefore gets an answer for every word from the core package alone, and the encoder
              packages build on it.
            children:
              - WordSense-Core-BasicWordSenseModel-Classify
              - WordSense-Core-BasicWordSenseModel-Dispose
              - WordSense-Core-BasicClassifier-Unknown
              - WordSense-Core-BasicClassifier-SingleSense
              - WordSense-Core-BasicClassifier-Resolve
              - WordSense-Core-BasicClassifier-Level
              - WordSense-Core-BasicClassifier-Segments
              - WordSense-Core-BasicClassifier-Normalization
              - WordSense-Core-BasicClassifier-Validation
            tests:
              - BasicClassifier_ClassifyAsync_Context_ChoosesPartOfSpeech
              - BasicClassifier_ClassifyAsync_Context_SelectsTheMostProbableAnalysis

          - id: WordSense-Core-Candidates
            title: >-
              The core subsystem shall list, for every known word, all its analyses with probabilities that sum to
              one, the lemmas and parts of speech by the sum of their probabilities, the largest first, and inside
              one of them the feature variants by their own probability, the largest first and, on a tie, in lexicon
              order, and shall list senses only inside an analysis
              whose lemma and part of speech have exactly one sense (that sense with probability 1), and no senses for
              any other analysis, because the built-in model scores analyses and not fine senses.
            tags: [subsystem]
            justification: |
              A consumer that reads the analyses must be able to tell a model without sense scores from one that scores
              senses; empty sense lists for the ambiguous analyses say that the built-in model has none, while the one
              sense of a single-sense analysis is certain and needs no evidence.
            children:
              - WordSense-Core-BasicClassifier-Candidates
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_ListsAnalysesAndNoSenses
              - BasicClassifier_ClassifyAsync_SingleSenseAnalysis_ListsThatSenseWithProbabilityOne
              - BasicClassifier_ClassifyAsync_TiesKeepLexiconOrder
              - BasicClassifier_ClassifyAsync_VariantsOfASlot_ShareItsProbabilityAndStayTogether

          - id: WordSense-Core-Tagger
            title: >-
              The core subsystem shall estimate, for every word of a sentence segment, the probability of each part
              of speech from the whole segment, using embedded statistics only.
            tags: [subsystem]
            justification: |
              The part of speech of an ambiguous word depends on the words around it on both sides, so the estimate
              must weigh the whole segment rather than a fixed window.
            children:
              - WordSense-Core-BasicTables-Load
              - WordSense-Core-PosTagger-Posteriors
              - WordSense-Core-PosTagger-UnknownWords
            tests:
              - PosTagger_Posteriors_AfterDeterminer_PrefersNoun

          - id: WordSense-Core-Cues
            title: >-
              The core subsystem shall separate analyses of one form that share a part of speech (the past and the
              present of read, or the lemmas of a form such as left) by scoring context cues taken from the words
              around the target against the cue statistics of the form or of its lemma, whose columns are analyses.
            tags: [subsystem]
            justification: |
              Part of speech alone cannot choose between the analyses of one part of speech; the neighboring words
              can.
            children:
              - WordSense-Core-CueModel-Extract
              - WordSense-Core-CueModel-Score
            tests:
              - BasicClassifier_ClassifyAsync_SamePartOfSpeechAnalyses_UsesCues

          - id: WordSense-Core-Fusion
            title: >-
              The core subsystem shall combine the part-of-speech probabilities and the cue scores into one
              probability for every analysis of an ambiguous word, each greater than 0 and the probabilities summing to
              one, so that the confidence of the answer, the probability of the lemma and part of speech of the
              selected analysis, is greater than 0
              and at most 1.
            tags: [subsystem]
            justification: |
              Callers apply their own confidence policy; an answer with an honest probability for every ambiguous word
              lets them do so without a separate abstention path.
            children:
              - WordSense-Core-SenseFusion-Fuse
              - WordSense-Core-SenseFusion-Stable
              - WordSense-Core-BasicClassifier-Resolve
            tests:
              - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability

          - id: WordSense-Core-Deterministic
            title: >-
              The core subsystem shall give the same results for the same input on every call and every thread.
            tags: [subsystem]
            justification: |
              Reproducible results make behavior testable and allow one classifier to serve concurrent callers.
            children:
              - WordSense-Core-BasicClassifier-Deterministic
              - WordSense-Core-PosTagger-Deterministic
              - WordSense-Core-BasicWordSenseModel-Classify
            tests:
              - BasicClassifier_ClassifyAsync_IsDeterministicAndThreadSafe

          - id: WordSense-Core-Offline
            title: >-
              The core subsystem shall use only statistics embedded in the package, and need no model file, no
              network access and no native runtime, and the preparation step of its built-in model shall complete
              immediately.
            tags: [subsystem]
            justification: |
              The core package exists for callers that cannot or will not download or ship a model; the encoder
              packages add models for callers that can.
            children:
              - WordSense-Core-BasicWordSenseModel-NoFiles
              - WordSense-Core-BasicTables-Load
              - WordSense-Core-BasicTables-Embedded
            tests:
              - BasicWordSenseModel_EnsureModelAsync_CompletesWithoutFiles
              - BasicTables_Default_LoadsEmbeddedTable

          - id: WordSense-Core-Independent
            title: >-
              The core subsystem shall not depend on ONNX Runtime, encoder weights or vector mathematics.
            tags: [subsystem]
            justification: |
              The core package must stay small and free of native dependencies so that every layer above it, and
              callers that use only the lexicon or the built-in statistical model, can take it without extra cost.
              The embedded statistical tables of the built-in model are counts, not encoder weights.
            children:
              - WordSense-Core-WordSenseContracts-Independent
            tests:
              - WordSenseContracts_CoreAssembly_HasNoOnnxOrWeightsReferences

          - id: WordSense-Core-Packaging
            title: >-
              The core package shall ship its XML documentation with a namespace summary and verified examples, its
              NuGet metadata with the license expression MIT AND CC-BY-4.0, and a README and a packed NOTICE file that
              carry the credits and licenses of the third-party word data it embeds (Open English WordNet 2025 under
              CC BY 4.0, and the Princeton WordNet 3.0 notice) and of the statistics of its built-in model (derived
              from the CC0 open part-of-speech corpus and the CC0 sentence corpus of this project, with no share-alike
              or other attribution-bound text).
            tags: [subsystem]
            justification: |
              The embedded lexicon and sense inventory derive from Open English WordNet and, through its sense
              frequencies, from Princeton WordNet 3.0, whose licenses require attribution, and consumers learn the API
              from the documentation that ships with the package. The embedded statistics are trained on our own CC0
              corpora, so they add no license obligation; the notice records where they come from and that no
              treebank was used.
            tests:
              - WordSense_XmlDocExamples_Compile
