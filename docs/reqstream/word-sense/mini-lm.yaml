---
# MiniLM subsystem requirements (the package DemaConsulting.WordSense.MiniLM)

sections:
  - title: WordSense Requirements
    sections:
      - title: MiniLM Requirements
        requirements:
          - id: WordSense-MiniLM-Model
            title: >-
              The MiniLM subsystem shall provide a word-sense model on the all-MiniLM-L6-v2 (int8) encoder, an uncased
              model with hidden size 384, with its trained fine-sense weights and per-lemma thresholds, calibrated for
              this encoder, embedded in the package.
            tags: [subsystem]
            justification: |
              MiniLM is the small, fast encoder: its 22 MiB model file and low latency suit interactive callers, and
              embedding the weights leaves only the model file to be obtained; its thresholds are measured on its own
              embeddings, so its levels are decided for this encoder.
            children:
              - WordSense-MiniLM-MiniLMWordSenseModel-Identity
              - WordSense-MiniLM-MiniLMWordSenseModel-Files
              - WordSense-MiniLM-MiniLMWordSenseModel-Weights
              - WordSense-MiniLM-MiniLMWordSenseModel-Options
            tests:
              - MiniLMWordSenseModel_Classify_AmbiguousWord_ReturnsDeterministicResults
              - WordSense_Classifier_EndToEnd_ClassifiesRecord
              - MiniLMWordSenseModel_Classify_TrainedLemma_AnswersAtASenseOrGroupLevel

          - id: WordSense-MiniLM-Composition
            title: >-
              The MiniLM package shall depend on the core, Onnx and Basic packages, and its public model shall be the
              core FallbackWordSenseModel of its own encoder model (primary) and the Basic model (fallback), so that
              every ambiguous word that the encoder does not score is answered by the Basic model, and shall ensure and
              dispose both models.
            tags: [subsystem]
            justification: |
              The encoder scores fine senses only for the lemmas it was trained for; pairing it with the Basic model
              inside the package gives callers one model that answers every word, while the Onnx package itself stays
              free of a dependency on the Basic package.
            children:
              - WordSense-MiniLM-MiniLMWordSenseModel-Composition
            tests:
              - MiniLMWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback
              - MiniLMWordSenseModel_Assembly_ReferencesCoreOnnxAndBasic

          - id: WordSense-MiniLM-Packaging
            title: >-
              The MiniLM package shall ship its XML documentation with a namespace summary and verified examples, its
              NuGet metadata, and a README that carries the credits and licenses of the model it describes.
            tags: [subsystem]
            justification: |
              The model carries its own license and attribution; consumers learn the API from the package.
            tests:
              - MiniLMWordSense_XmlDocExamples_Compile
