---
# OnnxWordSenseEncoder unit requirements

sections:
  - title: OnnxWordSenseEncoder Requirements
    requirements:
      - id: WordSense-Encoder-Encode
        title: The encoder shall return one hidden-state vector per input id, deterministically.
        tags: [unit]
        justification: |
          The classifier needs per-token hidden states and the digest to verify the table.
        tests:
          - OnnxWordSenseEncoder_EncodeAsync_ValidIds_ReturnsHiddenStates

      - id: WordSense-Encoder-Identity
        title: The encoder shall report the SHA-256 digest of its model file and the hidden size of its output.
        tags: [unit]
        justification: |
          The classifier compares the digest and the hidden size with the classifier table, so a table is never
          used with a model it was not trained for.
        tests:
          - OnnxWordSenseEncoder_EncodeAsync_ValidIds_ReturnsHiddenStates

      - id: WordSense-Encoder-Validation
        title: The encoder shall reject invalid arguments, cancelled calls and use after disposal.
        tags: [unit]
        justification: |
          Misuse must fail fast with a documented exception.
        tests:
          - OnnxWordSenseEncoder_EncodeAsync_InvalidUse_Throws
          - OnnxWordSenseEncoder_Constructor_InvalidModelFile_Throws

      - id: WordSense-Encoder-Concurrency
        title: >-
          The encoder shall allow concurrent encode calls on one instance and return the same results as
          sequential calls.
        tags: [unit]
        justification: |
          Services share one encoder between many threads; a concurrent call must neither fail nor return
          values that differ from those of a sequential call.
        tests:
          - OnnxWordSenseEncoder_EncodeAsync_Concurrent_MatchesSequentialResults
