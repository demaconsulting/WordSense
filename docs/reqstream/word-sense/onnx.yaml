---
# Onnx subsystem requirements (the package DemaConsulting.WordSense.Onnx)

sections:
  - title: WordSense Requirements
    sections:
      - title: Onnx Requirements
        requirements:
          - id: WordSense-Onnx-Classify
            title: >-
              The Onnx subsystem shall classify words from the core lexicon: an unknown word as unknown, a word with
              one analysis and one sense directly with that sense, a known word whose senses it does not score from the
              lexicon alone (with the probabilities of the part-of-speech head when the word has several parts of
              speech and the model uses a head), and a word whose lemma has trained weights and several senses by
              running the encoder, scoring only the fine senses of the word's own analyses, giving each analysis a
              probability per lemma and part of speech (the feature variants of one sharing it)
              and choosing the analysis of a form that belongs to several lemmas or tenses from its context (a form of
              several lemmas without a chooser is answered from the lexicon alone), and shall run the encoder only
              for a text that has such a word or, with a head, a word of several parts of speech.
            tags: [subsystem]
            justification: |
              Encoder inference is the expensive step; running it only for words that need context keeps
              classification fast, and scoring only the senses of the word's own analyses keeps answers consistent with
              the lexicon.
            children:
              - WordSense-Onnx-OnnxClassifier-Lookup
              - WordSense-Onnx-OnnxClassifier-Encode
              - WordSense-Onnx-OnnxClassifier-AnalysisSenses
              - WordSense-Onnx-OnnxClassifier-AnalysisProbability
              - WordSense-Onnx-OnnxClassifier-ClosedClass
              - WordSense-Onnx-OnnxClassifier-SharedCandidates
              - WordSense-Onnx-OnnxClassifier-SharedOutcome
              - WordSense-Onnx-OnnxClassifier-Slots
              - WordSense-Onnx-OnnxClassifier-SingleSense
              - WordSense-Onnx-OnnxClassifier-MultiLemmaForm
              - WordSense-Onnx-OnnxClassifier-Validation
              - WordSense-Onnx-OnnxWordSenseModel-Classify
            tests:
              - OnnxClassifier_ClassifyAsync_OnlyAmbiguousWordsAreEncoded
              - OnnxClassifier_ClassifyAsync_FormOfTwoLemmas_ChoosesTheLemmaFromContext

          - id: WordSense-Onnx-PartOfSpeech
            title: >-
              The Onnx subsystem shall, for a model that uses its part-of-speech head, give every known word of two or
              more distinct parts of speech, whatever its lemma and including the closed classes, the probability of
              each part of speech from the head, read from the whole sentence and restricted to the parts of speech
              of the lexicon, shall give each lemma and part of speech the share of the mass of its senses among
              those of its part of speech (equal when none is scored), and shall leave the scores of the senses and the
              sense and group of an answer independent of the head, an answer whose best sense lies in a part of speech
              that the head does not rank first being given at the part-of-speech level.
            tags: [subsystem]
            justification: |
              The part of speech of a word is decided by its sentence, not by the mass of the senses of its lemma, and
              the encoder is the evidence for the sentence; the senses keep the thresholds that were calibrated for
              them.
            children:
              - WordSense-Onnx-OnnxClassifier-PartOfSpeech
              - WordSense-Onnx-OnnxClassifier-PartOfSpeechClosedClass
              - WordSense-Onnx-OnnxClassifier-PartOfSpeechSenses
              - WordSense-Onnx-OnnxClassifier-PartOfSpeechContext
              - WordSense-Onnx-OnnxClassifier-PartOfSpeechVector

          - id: WordSense-Onnx-Tense
            title: >-
              The Onnx subsystem shall, for a model that uses its tense head, give every known word that is a
              same-spelling verb (a verb with a past and a non-past analysis) and has a usable vector the probability
              that it is past, read from the whole sentence, beside the results of the classification and without
              changing them, and no probability for any other word.
            tags: [subsystem]
            justification: |
              The tense of read, put and found is decided by the sentence, which the lexicon cannot see; the composite
              model combines the probability with the tense split of the Basic model.
            children:
              - WordSense-Onnx-OnnxClassifier-Tense
              - WordSense-Onnx-OnnxClassifier-TenseEncoder

          - id: WordSense-Onnx-LazyEncoding
            title: >-
              The Onnx subsystem shall require the encoder, and so the model files, only for a text that has a word
              with scored senses or, for a model that uses its part-of-speech head, a known word of two or more distinct
              parts of speech or, for a model that uses its tense head, a same-spelling verb, shall ensure the files
              lazily on the first such text, shall not touch a model file for
              any other text, and shall load and check an embedded head whenever its model description names one,
              whether or not the model uses it.
            tags: [subsystem]
            justification: |
              A text of words that need no context must cost no download and no inference; the head and the weights are
              embedded, so deciding the need touches no file.
            children:
              - WordSense-Onnx-OnnxClassifier-Encode
              - WordSense-Onnx-OnnxClassifier-TenseEncoder
              - WordSense-Onnx-OnnxWordSenseModel-Classify
              - WordSense-Onnx-OnnxWordSenseModel-HeadInUse
            tests:
              - OnnxWordSenseModel_ClassifyAsync_WordOfSeveralPartsOfSpeech_NeedsTheEncoder
              - OnnxWordSenseModel_ClassifyAsync_NoHead_UntrainedAmbiguousWords_AnswerPartOfSpeechWithoutModelFiles

          - id: WordSense-Onnx-Levels
            title: >-
              The Onnx subsystem shall answer a word whose lemma has trained weights at the finest level that passes
              the lemma's own threshold for that level: the fine sense when the fine threshold is met, otherwise, for a
              lemma that has groups and a best sense in a group, the group when the group threshold is met, and
              otherwise the part of speech; it shall never answer at a level whose threshold is not met, never at the
              group level for a lemma without groups, and never as unknown for a known word.
            tags: [subsystem]
            justification: |
              Each lemma has senses that are easy and senses that are hard to tell apart; per-lemma thresholds let each
              lemma answer as precisely as its own evidence allows, and the level tells the caller which precision
              target was reached. Groups exist only where curated, so a model unsure between senses steps up to their
              shared group when there is one and the evidence supports it, and otherwise to the part of speech, with
              the ranked senses still listed.
            children:
              - WordSense-Onnx-OnnxClassifier-FineThreshold
              - WordSense-Onnx-OnnxClassifier-GroupThreshold
              - WordSense-Onnx-OnnxClassifier-StepToPartOfSpeech
              - WordSense-Onnx-LemmaWeights-Thresholds
            tests:
              - OnnxClassifier_ClassifyAsync_MarginAboveFineThreshold_AnswersSense
              - OnnxClassifier_ClassifyAsync_FineBelowAndGroupAboveThreshold_AnswersGroup
              - OnnxClassifier_ClassifyAsync_BothBelowThreshold_AnswersPartOfSpeech
              - OnnxClassifier_ClassifyAsync_LemmaWithoutGroups_StepsFromSenseToPartOfSpeech

          - id: WordSense-Onnx-Candidates
            title: >-
              The Onnx subsystem shall list, for a trained lemma, in the Senses of every analysis of the word the ranked
              senses of the analysis with probabilities given the analysis that sum to one, whatever the level
              answered, so that a result with scored senses makes a composite model use the encoder, and shall list no
              scored senses for a word without trained weights (a lexical singleton, the one sense of an analysis whose
              lemma and part of speech have exactly one sense, is listed with probability 1 although the encoder did
              not score it).
            tags: [subsystem]
            justification: |
              The fine scores are computed for every decision; exposing them ranked lets a consumer group the senses
              its own way, for example by summing, over the analyses, the products of analysis and sense probabilities
              of
              the senses it treats as one category.
            children:
              - WordSense-Onnx-OnnxClassifier-Candidates
              - WordSense-Onnx-OnnxClassifier-BestCandidate
            tests:
              - OnnxClassifier_ClassifyAsync_TrainedLemma_ListsRankedCandidatesSummingToOne
              - OnnxClassifier_ClassifyAsync_SingleSenseWord_ListsItsOneUnscoredSense
              - OnnxClassifier_ClassifyAsync_LemmaWithoutWeights_ListsNoCandidates

          - id: WordSense-Onnx-Untrained
            title: >-
              The Onnx subsystem shall answer a known word whose senses it does not score (its lemma has no usable
              trained weights, or the encoder produced no usable vector) from the lexicon, with its analyses (a
              single analysis with probability 1, several lemmas and parts of speech with equal probabilities, or with
              the probabilities of the part-of-speech head for the parts of speech of a model that uses a head, the
              feature variants of one sharing its probability), no encoder-scored senses and the part of speech
              level, and never with a guessed fine sense, leaving the choice between the senses to the fallback
              model of a composition, and shall not depend on any other model package. The one exception is a lexical
              singleton: a word with a single analysis whose lemma and part of speech have exactly one sense is
              answered at the sense level with that sense listed with probability 1, which no encoder scored.
            tags: [subsystem]
            justification: |
              A word must never vanish because a model was not trained for it, and a first-sense guess dressed as a
              sense is worse than an honest part of speech; the Onnx package builds on the core contracts only, so the
              statistical choice of the analysis is made by the model that a composition pairs it with.
            children:
              - WordSense-Onnx-OnnxClassifier-Untrained
              - WordSense-Onnx-OnnxClassifier-NoVector
              - WordSense-Onnx-OnnxWordSenseModel-Classify
            tests:
              - OnnxClassifier_ClassifyAsync_LemmaWithoutWeights_AnswersAnalysesWithoutScoredSenses
              - OnnxWordSense_Assembly_ReferencesOnlyCore

          - id: WordSense-Onnx-Confidence
            title: >-
              The Onnx subsystem shall report a confidence that is the probability of the answered level (the
              probability of the lemma and part of speech of the selected analysis, which its feature variants share,
              times the probability of the answered sense, or of the answered
              group, within it), from 0 to 1, growing monotonically with the score margin, shall keep the
              best sense and group visible in the ranked senses even when the confidence is low, and shall answer with
              the lexicon analyses, not as unknown, when the encoder produced no usable vector.
            tags: [subsystem]
            justification: |
              A monotonic, bounded confidence lets callers apply a threshold; keeping the ranked senses even at low
              confidence lets them still use them, and a word that the encoder cannot judge still gets its analyses
              instead of vanishing.
            children:
              - WordSense-Onnx-OnnxClassifier-Confidence
              - WordSense-Onnx-OnnxClassifier-BestCandidate
              - WordSense-Onnx-OnnxClassifier-NoVector
              - WordSense-Onnx-LemmaWeights-Scoring
              - WordSense-Onnx-LemmaWeights-Feature
            tests:
              - OnnxClassifier_ClassifyAsync_LargerMargin_GivesHigherConfidence

          - id: WordSense-Onnx-Weights
            title: >-
              The Onnx subsystem shall read trained per-lemma weights from a binary blob embedded in the model
              package (the fine senses of the lemma, its thresholds (a group threshold only for a lemma that has
              groups) and, where needed, its form chooser) and match
              each lemma to the sense catalog by its sense and group ids, keeping the weights of a lemma only when its
              senses are the senses of the catalog.
            tags: [subsystem]
            justification: |
              A stale or mismatched weights blob must never give a wrong answer; matching against the catalog turns
              any mismatch into a load failure instead of a wrong sense.
            children:
              - WordSense-Onnx-LemmaWeights-Format
              - WordSense-Onnx-LemmaWeights-Integrity
              - WordSense-Onnx-LemmaWeights-Match
              - WordSense-Onnx-LemmaWeights-Read
              - WordSense-Onnx-LemmaWeights-Scoring
              - WordSense-Onnx-LemmaWeights-Thresholds
              - WordSense-Onnx-LemmaWeights-Embedded
            tests:
              - EmbeddedWeights_MiniLM_MatchesWordImage
              - EmbeddedWeights_BertBaseCased_MatchesWordImage

          - id: WordSense-Onnx-Head-Read
            title: >-
              The Onnx subsystem shall read a trained part-of-speech head from a binary blob that is embedded in the
              model package.
            tags: [subsystem]
            justification: |
              The trained head ships as one compact blob per encoder model; the subsystem must reproduce what the
              build tool wrote.
            children:
              - WordSense-Onnx-PosHead-Format
              - WordSense-Onnx-PosHead-Classes
              - WordSense-Onnx-PosHead-SectionsOptional
              - WordSense-Onnx-PosHead-SectionsRequired

          - id: WordSense-Onnx-Head-Integrity
            title: >-
              The Onnx subsystem shall reject a damaged or malformed part-of-speech head blob as invalid data.
            tags: [subsystem]
            justification: |
              A damaged head must fail loudly at load instead of producing silently wrong probabilities.
            children:
              - WordSense-Onnx-PosHead-Magic
              - WordSense-Onnx-PosHead-Checksum
              - WordSense-Onnx-PosHead-Structure
              - WordSense-Onnx-PosHead-Values
              - WordSense-Onnx-PosHead-Bounds
              - WordSense-Onnx-PosHead-Varint

          - id: WordSense-Onnx-Head-Binding
            title: >-
              The Onnx subsystem shall bind a part-of-speech head to the pinned encoder file, the hidden size, the model
              identifier, the feature layout and the parts of speech of the library, and reject a head that does not
              match.
            tags: [subsystem]
            justification: |
              A head fitted on the vectors of one exact encoder file is meaningless for any other file; binding it at
              load turns a stale or foreign head into a failure instead of a wrong answer.
            children:
              - WordSense-Onnx-PosHead-Binding
              - WordSense-Onnx-PosHead-BindingEncoder
              - WordSense-Onnx-PosHead-BindingClasses
              - WordSense-Onnx-PosHead-BindingIdentity
              - WordSense-Onnx-PosHead-BindingMissing

          - id: WordSense-Onnx-Head-Posterior
            title: >-
              The Onnx subsystem shall compute from a part-of-speech head and the pooled vectors of a word and of its
              neighbors a probability for every part of speech, with the same bits on every call.
            tags: [subsystem]
            justification: |
              The head predicts the part of speech of a word from its context; its result must be a function of its
              input only.
            children:
              - WordSense-Onnx-PosHead-Posterior
              - WordSense-Onnx-PosHead-PosteriorMissing
              - WordSense-Onnx-PosHead-PosteriorLength
              - WordSense-Onnx-PosHead-Deterministic

          - id: WordSense-Onnx-Head-Restrict
            title: >-
              The Onnx subsystem shall restrict the probabilities of a part-of-speech head to a given set of parts of
              speech.
            tags: [subsystem]
            justification: |
              A spelling can only have the parts of speech that the lexicon lists for it.
            children:
              - WordSense-Onnx-PosHead-Restrict
              - WordSense-Onnx-PosHead-RestrictFallback

          - id: WordSense-Onnx-Head-Tense
            title: >-
              The Onnx subsystem shall read the optional tense head of a head blob (a binary logistic classifier
              over the pooled vectors of a verb), reject a malformed tense section as invalid data, and compute from
              the vectors the probability that a verb is past, deterministically.
            tags: [subsystem]
            justification: |
              The tense head ships in the same file as the part-of-speech head, and a result that does not depend on
              the hardware can be reproduced and compared.
            children:
              - WordSense-Onnx-PosHead-TenseSection
              - WordSense-Onnx-PosHead-TenseStructure
              - WordSense-Onnx-PosHead-TensePastProbability

          - id: WordSense-Onnx-Head-Load
            title: >-
              The Onnx subsystem shall load and check the part-of-speech head of a model with its embedded weights,
              whenever the model description names one and whether or not the model uses it, reporting a damaged,
              missing or mismatched head as a load failure.
            tags: [subsystem]
            justification: |
              The head and the weights are shipped in the package, so a defect in either must surface at load.
            children:
              - WordSense-Onnx-OnnxWordSenseModel-Head
              - WordSense-Onnx-OnnxWordSenseModel-HeadNone
              - WordSense-Onnx-OnnxWordSenseModel-HeadIntegrity

          - id: WordSense-Onnx-Encoder
            title: >-
              The Onnx subsystem shall compute contextual embeddings of the words of a text with ONNX Runtime and a
              WordPiece tokenizer, with a cased or an uncased vocabulary, including texts longer than the model input.
            tags: [subsystem]
            justification: |
              The embeddings of the surrounding text are the evidence for the sense decision; one shared encoder
              serves every model package.
            children:
              - WordSense-Onnx-OnnxEncoder-Encode
              - WordSense-Onnx-OnnxEncoder-AllWords
              - WordSense-Onnx-OnnxEncoder-AllWordsWindows
              - WordSense-Onnx-OnnxEncoder-PossessiveView
              - WordSense-Onnx-OnnxEncoder-Concurrency
              - WordSense-Onnx-OnnxEncoder-LongText
              - WordSense-Onnx-OnnxEncoder-Threads
              - WordSense-Onnx-OnnxEncoder-Validation
              - WordSense-Onnx-WordPieceTokenizer-Parity
              - WordSense-Onnx-WordPieceTokenizer-Cased
              - WordSense-Onnx-WordPieceTokenizer-Spans
              - WordSense-Onnx-WordPieceTokenizer-Window
              - WordSense-OTS-OnnxRuntime-Inference
            tests:
              - OnnxEncoder_EncodeAsync_ValidTargets_ReturnsDeterministicVectors

          - id: WordSense-Onnx-ModelFiles
            title: >-
              The Onnx subsystem shall make the files of a model available by using verified files already present,
              or otherwise downloading them from the mirror and then the public repository copy, verifying every
              file against its pinned SHA-256 digest and storing it atomically in the model's folder of the store.
            tags: [subsystem]
            justification: |
              Users in restricted networks need to supply their own mirror, while everyone else gets the files from
              public hosting; verification and atomic storage guarantee that only intact files are ever used.
            children:
              - WordSense-Onnx-ModelDownloader-Order
              - WordSense-Onnx-ModelDownloader-Fallthrough
              - WordSense-Onnx-ModelDownloader-Integrity
              - WordSense-Onnx-ModelDownloader-Atomic
              - WordSense-Onnx-ModelDownloader-Location
              - WordSense-Onnx-ModelDownloader-StoreRoot
              - WordSense-Onnx-ModelDownloader-AllFail
              - WordSense-Onnx-ModelDownloader-Present
              - WordSense-Onnx-ModelDownloader-Cancel
              - WordSense-Onnx-ModelDownloader-Options
              - WordSense-Onnx-OnnxWordSenseModel-Ensure
              - WordSense-Onnx-OnnxWordSenseModel-Concurrent
              - WordSense-Onnx-OnnxWordSenseModel-Downloadable
            tests:
              - ModelDownloader_EnsureAsync_MirrorFails_FallsBackToGitHub
              - ModelDownloader_EnsureAsync_HashMismatch_FallsThroughAndKeepsNothingBad

          - id: WordSense-Onnx-Failures
            title: >-
              The Onnx subsystem shall report a failure to obtain, verify or configure the files of a model with the
              typed exceptions of the core package (ModelUnavailableException, ModelIntegrityException and
              DownloadConfigurationException), keeping the original exception as inner exception.
            tags: [subsystem]
            justification: |
              Callers of the encoder packages handle the failures of the download by cause, without catching the
              platform exception types of each source, and without losing the detail of what went wrong.
            children:
              - WordSense-Onnx-OnnxWordSenseModel-Failures
            tests:
              - OnnxWordSenseModel_EnsureModelAsync_AllSourcesFail_ThrowsModelUnavailable
              - OnnxWordSenseModel_EnsureModelAsync_InvalidOptions_ThrowsDownloadConfiguration

          - id: WordSense-Onnx-Mirror
            title: >-
              The Onnx subsystem shall support a user download mirror, set by DownloadOptions or the WORDSENSE_MIRROR_*
              environment variables, laid out as the mirror address followed by the model identifier and the file
              name, and shall send mirror credentials only to the mirror's own origin.
            tags: [subsystem]
            justification: |
              Enterprises and offline users host the model on their own server; environment variables and options
              let a deployment point the package at it without code changes, and credentials must never reach a
              public host.
            children:
              - WordSense-Onnx-DownloadMirror-Validation
              - WordSense-Onnx-DownloadMirror-Environment
              - WordSense-Onnx-DownloadMirror-Redaction
              - WordSense-Onnx-ModelDownloader-MirrorConfig
              - WordSense-Onnx-ModelDownloader-MirrorLayout
              - WordSense-Onnx-ModelDownloader-Credentials
            tests:
              - ModelDownloader_EnsureModel_MirrorFromEnvironment_IsUsedFirst
              - ModelDownloader_EnsureModel_ProgrammaticMirror_BeatsEnvironment

          - id: WordSense-Onnx-Lifecycle
            title: >-
              The Onnx subsystem shall provide one abstract, disposable base class for encoder models, usable on its
              own as a word-sense model, with the model identifier and hidden size known before any download, with the
              encoder session that it owns released on disposal, and with no reference to any package other than the
              core package.
            tags: [subsystem]
            justification: |
              The model packages differ only in their model description; a shared base keeps their behavior
              identical, and disposal releases the native session. The base answers from the lexicon and the encoder
              alone, so it composes with any other model (the packages MiniLM and BertBaseCased pair it with the Basic
              model) without the Onnx package depending on one.
            children:
              - WordSense-Onnx-OnnxWordSenseModel-Dispose
              - WordSense-Onnx-OnnxWordSenseModel-Identity
              - WordSense-Onnx-OnnxWordSenseModel-Options
            tests:
              - OnnxWordSenseModel_Dispose_CalledTwice_IsHarmless
              - OnnxWordSenseModel_Dispose_DuringEnsure_CancelsDownload
              - OnnxWordSense_Assembly_ReferencesOnlyCore

          - id: WordSense-Onnx-Packaging
            title: >-
              The Onnx package shall ship its XML documentation with a namespace summary and verified examples, its
              NuGet metadata, and a README.
            tags: [subsystem]
            justification: |
              Consumers learn the API from the package; verified examples cannot go stale.
            tests:
              - OnnxWordSense_XmlDocExamples_Compile
