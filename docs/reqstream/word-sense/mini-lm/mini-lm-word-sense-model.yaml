---
# MiniLMWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: MiniLM Requirements
        sections:
          - title: MiniLMWordSenseModel Requirements
            requirements:
              - id: WordSense-MiniLM-MiniLMWordSenseModel-Identity
                title: >-
                  MiniLMWordSenseModel shall identify itself as all-MiniLM-L6-v2-int8 with hidden size 384 and use an
                  uncased vocabulary.
                tags: [unit]
                justification: |
                  The identifier names the model's folder in the repository, on a mirror and in the store, and the
                  weights were trained for exactly this encoder.
                tests:
                  - MiniLMWordSenseModel_Identity_IsPinned

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Files
                title: >-
                  MiniLMWordSenseModel shall require the files model_int8.onnx and vocab.txt, each pinned by its SHA-256
                  digest.
                tags: [unit]
                justification: |
                  A model file that does not match the pinned digest could silently change results.
                tests:
                  - MiniLMWordSenseModel_Files_ArePinnedBySha256
                  - MiniLMWordSenseModel_EnsureModelAsync_ModelDirectory_VerifiesPinnedFiles
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Weights
                title: >-
                  MiniLMWordSenseModel shall use the trained weights and thresholds embedded in its assembly and answer
                  the ambiguous words of the trained lemmas with them, each at the level its thresholds allow.
                tags: [unit]
                justification: |
                  Embedded weights make the package self-contained apart from the model file.
                tests:
                  - MiniLMWordSenseModel_Classify_AmbiguousWord_ReturnsDeterministicResults
                  - MiniLMWordSenseModel_Classify_TrainedLemma_AnswersAtASenseOrGroupLevel
                  - WordSense_Classifier_EndToEnd_ClassifiesRecord

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Head
                title: >-
                  The encoder model of MiniLMWordSenseModel shall load and check the part-of-speech head embedded in its
                  assembly, bound to the pinned all-MiniLM-L6-v2 ONNX file, hidden size 384, the feature layout and the
                  parts of speech of the library, without any model file, and shall not use it: the model description
                  declares the head not in use, so the model answers as a model without a head (it needs the encoder
                  only for a word with scored senses, and its slot probability is the mass of its senses).
                tags: [unit]
                justification: |
                  The head was trained on the vectors of this exact encoder file and these classes; it is validated so
                  that a defective package fails at load, and it is not used, so that the behavior of the model does not
                  depend on it.
                tests:
                  - MiniLMWordSenseModel_EmbeddedHead_MatchesEncoderAndClasses
                  - MiniLMWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback

              - id: WordSense-MiniLM-MiniLMWordSenseModel-HeadRejected
                title: >-
                  The embedded part-of-speech head of MiniLMWordSenseModel shall be rejected as invalid data when it is
                  read against another encoder file or another model identifier.
                tags: [unit]
                justification: |
                  A changed encoder file must fail loudly at load instead of feeding the head other vectors.
                tests:
                  - MiniLMWordSenseModel_EmbeddedHead_AgainstAnotherEncoderFile_IsRejected

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Composition
                title: >-
                  MiniLMWordSenseModel shall wrap a FallbackWordSenseModel of its encoder model (primary) and a
                  BasicWordSenseModel (fallback), answer every ambiguous word that the encoder does not score with the
                  complete result of the Basic model (the analyses chosen in context, at the part of speech level or at
                  the sense level when the selected analysis has exactly one sense), implement
                  IDownloadableWordSenseModel so that EnsureModelAsync ensures the encoder files (the Basic model needs
                  none) and reports its failures with the typed exceptions of the encoder, and make Dispose dispose both
                  models.
                tags: [unit]
                justification: |
                  Every word of a text must be answered, not only the lemmas the weights were trained for; the
                  composition lives in the model package so that the encoder base class needs no Basic model.
                tests:
                  - MiniLMWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback
                  - MiniLMWordSenseModel_Assembly_ReferencesCoreAndOnnx
                  - MiniLMWordSenseModel_Dispose_DisposesEncoderAndFallback
                  - MiniLMWordSenseModel_IsDownloadable
                  - MiniLMWordSenseModel_EnsureModelAsync_MissingDirectory_ThrowsModelUnavailable

              - id: WordSense-MiniLM-MiniLMWordSenseModel-PartOfSpeechBlend
                title: >-
                  MiniLMWordSenseModel shall answer a word that its encoder leaves at the part-of-speech level with
                  the slot probabilities of the encoder and of the Basic model combined.
                tags: [unit]
                justification: |
                  The slot probability of the encoder is the mass of its senses, not a part-of-speech estimate: the
                  encoder alone calls many verb uses of "use" a noun at the part-of-speech level, a mistake that the
                  Basic tagger rarely makes. Combining the two estimates with a weight of 0.6, the optimum of the
                  development splits (the open corpus dev split and the EWT dev file, never the test splits), repairs
                  most of those errors. The reviewed suite holds the rows that depend on the blend.
                tests:
                  - MiniLMWordSenseModel_Classify_VerbUse_IsAnsweredWithTheCombinedSlotProbabilities

              - id: WordSense-MiniLM-MiniLMWordSenseModel-SenseAnswerKept
                title: >-
                  MiniLMWordSenseModel shall answer a word that its encoder names at the sense or the group level
                  exactly with the level, confidence and ids of the encoder.
                tags: [unit]
                justification: |
                  The sense and group figures of the encoder, the real-text sense figures and the SemCor share and
                  precision must not move when only the part of speech of an undecided word is repaired.
                tests:
                  - MiniLMWordSenseModel_Classify_SenseOrGroupAnswer_IsTheEncodersAnswer

              - id: WordSense-MiniLM-MiniLMWordSenseModel-UsagePrior
                title: >-
                  MiniLMWordSenseModel shall list, in the selected analysis of a word whose lemma the encoder has no
                  weights for and whose lemma and part of speech have two or more senses, those senses ranked by the
                  usage prior of the Basic model.
                tags: [unit]
                justification: |
                  About 56 percent of the ambiguous words of running text have no trained weights; the ranking gives a
                  consumer the likely senses of them.
                tests:
                  - MiniLMWordSenseModel_Classify_UntrainedPolysemousWord_ListsSensesRankedByUsagePrior

              - id: WordSense-MiniLM-MiniLMWordSenseModel-UsagePrior-Level
                title: >-
                  MiniLMWordSenseModel shall answer a word whose lemma the encoder has no weights for and that has
                  two or more senses at the part of speech level, with no sense id and no group id.
                tags: [unit]
                justification: |
                  The answer level stays honest because the ranking is evidence about the lemma and never an answer.
                tests:
                  - MiniLMWordSenseModel_Classify_UntrainedPolysemousWord_AnswersPartOfSpeechLevelWithoutSenseOrGroup

              - id: WordSense-MiniLM-MiniLMWordSenseModel-UsagePrior-Key
                title: >-
                  The key of the result of MiniLMWordSenseModel for a word whose lemma the encoder has no weights for
                  and that has two or more senses shall carry the label of the top-ranked sense of the selected
                  analysis.
                tags: [unit]
                justification: |
                  The ranking gives the key of such a word a label, so that a consumer can look up a resource by it.
                tests:
                  - MiniLMWordSenseModel_Classify_UntrainedPolysemousWord_KeyCarriesTheLabelOfTheTopRankedSense

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Options
                title: >-
                  MiniLMWordSenseModel shall accept an optional model directory and a maximum sequence length that
                  defaults to 128.
                tags: [unit]
                justification: |
                  Offline callers supply their own copy of the files; the weights were trained with the default length.
                tests:
                  - MiniLMWordSenseModel_Constructor_Defaults_UseStoreAnd128
                  - MiniLMWordSenseModel_Constructor_SequenceLengthOutOfRange_Throws
