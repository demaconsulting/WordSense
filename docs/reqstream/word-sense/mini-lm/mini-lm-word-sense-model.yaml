---
# MiniLMWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: MiniLM Requirements
        sections:
          - title: MiniLMWordSenseModel Requirements
            requirements:
              - id: WordSense-MiniLM-MiniLMWordSenseModel-Identity
                title: >-
                  MiniLMWordSenseModel shall identify itself as all-MiniLM-L6-v2-int8 with hidden size 384 and use an
                  uncased vocabulary.
                tags: [unit]
                justification: |
                  The identifier names the model's folder in the repository, on a mirror and in the store, and the
                  weights were trained for exactly this encoder.
                tests:
                  - MiniLMWordSenseModel_Identity_IsPinned

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Files
                title: >-
                  MiniLMWordSenseModel shall require the files model_int8.onnx and vocab.txt, each pinned by its SHA-256
                  digest.
                tags: [unit]
                justification: |
                  A model file that does not match the pinned digest could silently change results.
                tests:
                  - MiniLMWordSenseModel_Files_ArePinnedBySha256
                  - MiniLMWordSenseModel_EnsureModelAsync_ModelDirectory_VerifiesPinnedFiles
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_Throws
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_Throws

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Weights
                title: >-
                  MiniLMWordSenseModel shall use the trained weights and thresholds embedded in its assembly and answer
                  the ambiguous words of the trained lemmas with them, each at the level its thresholds allow.
                tags: [unit]
                justification: |
                  Embedded weights make the package self-contained apart from the model file.
                tests:
                  - MiniLMWordSenseModel_Classify_AmbiguousWord_ReturnsDeterministicResults
                  - MiniLMWordSenseModel_Classify_TrainedLemma_AnswersAtASenseOrGroupLevel
                  - WordSense_Classifier_EndToEnd_ClassifiesRecord

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Composition
                title: >-
                  MiniLMWordSenseModel shall wrap a FallbackWordSenseModel of its encoder model (primary) and a
                  BasicWordSenseModel (fallback), answer every ambiguous word that the encoder does not score with the
                  complete result of the Basic model (the analyses chosen in context at the part of speech level), make
                  EnsureModelAsync ensure the encoder files (the Basic model needs none) and make Dispose dispose both
                  models.
                tags: [unit]
                justification: |
                  Every word of a text must be answered, not only the lemmas the weights were trained for; the
                  composition lives in the model package so that the encoder base class needs no Basic model.
                tests:
                  - MiniLMWordSenseModel_Classify_UntrainedAmbiguousWord_AnswersFromBasicFallback
                  - MiniLMWordSenseModel_Assembly_ReferencesCoreOnnxAndBasic
                  - MiniLMWordSenseModel_Dispose_DisposesEncoderAndFallback

              - id: WordSense-MiniLM-MiniLMWordSenseModel-Options
                title: >-
                  MiniLMWordSenseModel shall accept an optional model directory and a maximum sequence length that
                  defaults to 128.
                tags: [unit]
                justification: |
                  Offline callers supply their own copy of the files; the weights were trained with the default length.
                tests:
                  - MiniLMWordSenseModel_Constructor_Defaults_UseStoreAnd128
                  - MiniLMWordSenseModel_Constructor_SequenceLengthOutOfRange_Throws
