---
# WordSenseTable unit requirements (the lexicon table, the weights table and the sense classifiers)

sections:
  - title: WordSenseTable Requirements
    requirements:
      - id: WordSense-Table-Format
        title: >-
          The lexicon table shall serialize to and read from a deterministic binary format without loss, with its
          context lemmas, forms, morphology rules and dictionary words in one file, and shall hold no model data.
        tags: [unit]
        justification: |
          The table is embedded in the assembly; identical content gives identical decoded content, which makes the
          build reviewable, and one file with one digest and one version keeps the vocabulary in one place. Keeping
          model data out of it lets every model package share the same lexicon.
        tests:
          - WordSenseTable_RoundTrip_PreservesAllValues
          - WordSenseTable_RoundTrip_WithDictionary_PreservesLemmasAndMorphology
          - WordSenseTable_ToArray_AndWrite_AreDeterministic
          - WordSenseTable_Constructor_InconsistentInput_Throws
          - LexicalIndex_CompressDecompress_RoundTrips

      - id: WordSense-Table-Senses
        title: >-
          The table shall represent every lemma as an entry of senses (a part of speech, an optional meaning and an
          optional respelling each), give a lemma that needs no context no pronunciation, expose one shared immutable
          answer per sense of an entry, and reject any other format version.
        tags: [unit]
        justification: |
          One entry model for every lemma lets one flow answer them all: the number of senses and whether the lemma
          needs context decide what can be answered. A lemma that cannot be disambiguated must not carry a
          pronunciation, and an older table must not be mistaken for a current one.
        tests:
          - WordSenseTable_Read_OtherVersion_Throws
          - WordSenseTable_RoundTrip_PreservesAllValues
          - WordSenseTable_LemmaEntry_BadSenseDefinitions_Throw
          - WordSenseTable_LemmaEntry_Dictionary_FollowsDictionaryRules
          - LemmaEntry_Constructor_InvalidSenseDefinition_Throws
          - LemmaEntry_NonHeteronym_HasNoPronunciation
          - LemmaEntry_SenseSet_Rules
          - LemmaEntry_MissingRespelling_IsNull
          - LemmaEntry_Candidates_MapSensesToDetails

      - id: WordSense-Table-Lexicon
        title: >-
          The table shall hold the dictionary words with their parts of speech, and shall report a word that is absent,
          or that is not made of the letters a to z, as absent.
        tags: [unit]
        justification: |
          The dictionary has well over a hundred thousand words, so it must stay small in the assembly and in
          memory, and a lookup of untrusted text must be cheap and safe.
        tests:
          - LexicalIndex_BuildAndFind_FindsEveryWord
          - LexicalIndex_TryFind_AbsentOrInvalid_ReturnsFalse
          - LexicalIndex_Build_InvalidInput_Throws
          - LexicalIndex_CompressDecompress_RoundTrips
          - WordSenseTable_RoundTrip_WithDictionary_PreservesLemmasAndMorphology

      - id: WordSense-Table-Resolve
        title: >-
          The table shall resolve a surface word to exactly one lemma entry or to unknown, a listed form or word
          always taking precedence over a derived one, report the entry of the lemma, let a table lookup by lemma find
          any entry, and ignore the dictionary when it is not requested.
        tags: [unit]
        justification: |
          Everything the classifier knows about a word must come from one place, so that the same word always gets
          the same entry, and a derived answer can never replace a listed one; the option to ignore the dictionary
          keeps the context-only behavior available. The ordered steps are in the unit design.
        tests:
          - TryResolve_FormExactAndDictionary_Resolve
          - TryResolve_Possessive_OnlyForWeightedEntries
          - TryResolve_DisabledRuleOrNoDictionary_DoesNotApply
          - Table_CountLemmasAndContextLemmas_Differ
          - WordSenseTable_TryGetLemma_EdgeCases

      - id: WordSense-Table-Morphology
        title: >-
          The table shall derive an entry for a word it does not contain only through the enabled suffix rules
          (plural and third person, adverb, and past tense when enabled), only from a dictionary entry that has no
          weights and satisfies the rule, narrowed to the derived sense, and never override a word the table contains.
        tags: [unit]
        justification: |
          A rule is accepted only where it was measured to be at least 95 % precise on real text (the past-tense rule
          is implemented but not enabled in the shipped table); confining it to absent words and to weight-less bases
          means that a derived answer can neither replace a listed word nor alter an answer of the trained
          classifier.
        tests:
          - TryResolve_Plural_GatedOnBase
          - TryResolve_PastTense_GatedOnVerbBase
          - TryResolve_Adverb_GatedOnAdjectiveOnlyBase
          - TryResolve_DisabledRuleOrNoDictionary_DoesNotApply

      - id: WordSense-Table-Integrity
        title: >-
          The lexicon table reader shall reject truncated, corrupted or foreign data (including weights table data),
          a malformed or oversized dictionary section, and a dictionary word that is also a context lemma or a form.
        tags: [unit]
        justification: |
          A damaged table would produce wrong answers silently; a trailing SHA-256 digest and strict structural
          checks, including a bound on the decompressed size and one namespace for lemmas and forms, detect any
          change and any hostile input.
        tests:
          - WordSenseTable_Read_TruncatedAtEveryLength_Throws
          - WordSenseTable_Read_AnyByteFlipped_Throws
          - WordSenseTable_Read_Garbage_Throws
          - WordSenseTable_Read_WeightsMagic_Throws
          - WordSenseTable_Read_MutatedBodyWithValidChecksum_ThrowsFormatExceptionOrLoads
          - WordSenseTable_Read_ResignedBadMagic_Throws
          - WordSenseTable_Read_ResignedBadCounts_Throws
          - WordSenseTable_Read_ResignedTrailingDataOrUndefinedFlags_Throws
          - WordSenseTable_Read_ResignedUndefinedPos_Throws
          - WordSenseTable_Read_ResignedUnorderedLemmas_Throws
          - WordSenseTable_Constructor_NullArguments_Throw
          - WordSenseTable_Constructor_ShadowingAndBadDictionaryWords_Throw
          - LexicalIndex_Decompress_InvalidData_Throws

      - id: WordSense-Table-Score
        title: The sense classifier of a lemma shall score a feature vector and return the best sense and its margin.
        tags: [unit]
        justification: |
          The margin drives abstention; binary lemmas and one-versus-rest lemmas must both be handled.
        tests:
          - SenseWeights_Score_Binary_UsesActivationSign
          - SenseWeights_Score_OneVersusRest_PicksBestRow
          - SenseWeights_Score_TiesAndZero_SelectDocumentedSense
          - SenseWeights_Scores_Binary_ReturnsNegatedAndActivation
          - SenseWeights_Scores_OneVersusRest_ReturnsPerRowActivation
          - SenseWeights_Scores_LengthMismatch_Throws
          - SenseWeights_Scores_OddDimension_MatchesScalarReference
          - SenseWeights_Constructor_BadShapes_Throw

      - id: WordSense-Table-WeightsFormat
        title: >-
          The weights table shall serialize to and read from a deterministic binary format without loss, holding the
          model identifier, the model file digest, the digest of the lexicon it belongs to, the vector size, the
          centering mean and the sense classifier of each context lemma.
        tags: [unit]
        justification: |
          A weights table must describe itself completely, so that a consumer can tell which model and lexicon it
          belongs to without any outside knowledge, and identical content must give identical bytes so the build is
          reviewable.
        tests:
          - WordSenseWeightsTable_RoundTrip_PreservesAllValues
          - WordSenseWeightsTable_RoundTrip_Empty_Works
          - WordSenseWeightsTable_Constructor_NormalizesDigestsAndCopiesMean
          - WordSenseWeightsTable_Constructor_InvalidArguments_Throw
          - WordSenseWeightsTable_ComputeSha256_ChangesWithContent

      - id: WordSense-Table-WeightsIntegrity
        title: >-
          The weights table reader shall reject truncated, corrupted or foreign data and structurally invalid content.
        tags: [unit]
        justification: |
          A damaged weights table would produce wrong answers silently; a trailing SHA-256 digest and strict
          structural checks detect any change and any hostile input.
        tests:
          - WordSenseWeightsTable_Read_TruncatedAtEveryLength_Throws
          - WordSenseWeightsTable_Read_AnyByteFlipped_Throws
          - WordSenseWeightsTable_Read_Garbage_Throws
          - WordSenseWeightsTable_Read_ResignedBadCounts_Throws
          - WordSenseWeightsTable_Read_ResignedBadHeaderOrTrailingData_Throws
          - WordSenseWeightsTable_Read_ResignedNonFiniteMean_Throws
          - WordSenseWeightsTable_Read_ResignedUnorderedLemmas_Throws

      - id: WordSense-Table-WeightsMatch
        title: >-
          The weights table shall verify that it belongs to a given lexicon table, by the lexicon digest, and that its
          lemmas and their sense counts agree with the lexicon's context lemmas.
        tags: [unit]
        justification: |
          Weights trained against one lexicon give wrong answers with another; the check must fail before use.
        tests:
          - WordSenseWeightsTable_EnsureMatches_MatchingTable_DoesNotThrow
          - WordSenseWeightsTable_EnsureMatches_OtherLexicon_Throws
          - WordSenseWeightsTable_EnsureMatches_LemmaOrSenseCountMismatch_Throws

      - id: WordSense-Table-Embedded
        title: >-
          The assembly shall contain an embedded lexicon table that loads, covers at least 344 context lemmas with a
          part of speech (and, for heteronyms, a pronunciation) per sense, maps every word form to a context lemma,
          and contains at least 100,000 dictionary words.
        tags: [unit]
        justification: |
          The library must work out of the box without an external table file, and the dictionary must be large
          enough that most common English words are covered.
        tests:
          - WordSenseTable_LoadEmbedded_ContainsSeedLemmas
          - WordSenseTable_LoadEmbedded_HeteronymSensesHavePronunciations
          - WordSenseTable_LoadEmbedded_ContainsDictionaryWords
          - WordSenseTable_LoadEmbedded_RoundTrips
