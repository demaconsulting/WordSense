---
# WordSenseTable unit requirements

sections:
  - title: WordSenseTable Requirements
    requirements:
      - id: WordSense-Table-Format
        title: The table shall serialize to and read from a deterministic binary format without loss.
        tags: [unit]
        justification: |
          The table is embedded in the assembly; identical bytes for identical content make the
          build reproducible and reviewable.
        tests:
          - WordSenseTable_RoundTrip_PreservesAllValues
          - WordSenseTable_ToArray_CalledTwice_ReturnsIdenticalBytes
          - WordSenseTable_Write_Stream_MatchesToArray
          - WordSenseTable_Constructor_InconsistentInput_Throws
          - WordSenseTable_LemmaModel_BadShapes_Throw
          - WordSenseTable_WriteAndTryGetLemma_EdgeCases

      - id: WordSense-Table-Senses
        title: The table shall store a tagged definition per sense and expose one shared immutable record per sense.
        tags: [unit]
        justification: |
          Tags describe what a sense is; storing them with the senses keeps one source of truth and lets
          callers compare senses by reference.
        tests:
          - WordSenseTable_Read_SensesWithSameTag_ShareTagInstance
          - WordSenseTable_Read_OldVersion_Throws
          - WordSenseTable_RoundTrip_PreservesGroups
          - WordSenseTable_LemmaModel_BadSenseDefinitions_Throw
          - WordSenseTable_LemmaModel_NullAndNonFiniteArguments_Throw
          - WordSenseTable_LemmaModel_UndefinedKind_Throws

      - id: WordSense-Table-Integrity
        title: The table reader shall reject truncated, corrupted or foreign data.
        tags: [unit]
        justification: |
          A damaged table would produce wrong senses silently; a trailing SHA-256 digest and
          structural checks detect any change.
        tests:
          - WordSenseTable_Read_TruncatedAtEveryLength_Throws
          - WordSenseTable_Read_AnyByteFlipped_Throws
          - WordSenseTable_Read_Garbage_Throws
          - WordSenseTable_Read_MutatedBodyWithValidChecksum_ThrowsFormatExceptionOrLoads
          - WordSenseTable_Read_ResignedBadMagic_Throws
          - WordSenseTable_Read_ResignedTrailingData_Throws
          - WordSenseTable_Read_ResignedDimensionAboveCap_Throws
          - WordSenseTable_Read_ResignedTagCountAboveCap_Throws
          - WordSenseTable_Read_ResignedUnknownModelKind_Throws
          - WordSenseTable_Read_ResignedUnsortedOrDuplicateTags_Throws
          - WordSenseTable_Constructor_NullArguments_Throw
          - WordSenseTable_Constructor_InvalidValues_Throw

      - id: WordSense-Table-Score
        title: The table shall score a feature vector per lemma and return the best sense and its margin.
        tags: [unit]
        justification: |
          The margin drives abstention; binary lemmas and one-versus-rest lemmas must both be handled.
        tests:
          - WordSenseTable_Score_Binary_UsesActivationSign
          - WordSenseTable_Score_OneVersusRest_PicksBestRow
          - WordSenseTable_Scores_Binary_ReturnsNegatedAndActivation
          - WordSenseTable_Scores_OneVersusRest_ReturnsPerRowActivation
          - WordSenseTable_Scores_LengthMismatch_Throws
          - WordSenseTable_Scores_OddDimension_MatchesScalarReference

      - id: WordSense-Table-Embedded
        title: >-
          The assembly shall contain an embedded table that loads, covers at least 344 lemmas with
          tagged senses, and maps every word form to a lemma that has a model.
        tags: [unit]
        justification: |
          The library must work out of the box without an external table file.
        tests:
          - WordSenseTable_LoadEmbedded_ContainsSeedLemmas
