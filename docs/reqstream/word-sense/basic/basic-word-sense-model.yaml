---
# BasicWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: Basic Requirements
        sections:
          - title: BasicWordSenseModel Requirements
            requirements:
              - id: WordSense-Basic-BasicWordSenseModel-NoFiles
                title: >-
                  BasicWordSenseModel shall complete its preparation step without files or network access, ignore any
                  mirror, and report cancellation requested before the call.
                tags: [unit]
                justification: |
                  The model has nothing to obtain, so preparation must never touch the network or the file system.
                tests:
                  - BasicWordSenseModel_EnsureModelAsync_CompletesWithoutFiles
                  - BasicWordSenseModel_EnsureModelAsync_IgnoresMirror
                  - BasicWordSenseModel_EnsureModelAsync_Cancelled_ReturnsCanceledTask

              - id: WordSense-Basic-BasicWordSenseModel-Classify
                title: >-
                  BasicWordSenseModel shall classify on demand, with or without a prior preparation call, answering
                  lexicon-only words without any preparation, and shall be safe for concurrent use.
                tags: [unit]
                justification: |
                  A model without resources should be as simple to use as a plain object.
                tests:
                  - BasicWordSenseModel_ClassifyAsync_ReturnsParallelResults
                  - BasicWordSenseModel_ClassifyAsync_WithoutEnsure_Works
                  - BasicWordSenseModel_ClassifyAsync_LexiconOnlyWords_NeverNeedEnsure
                  - BasicWordSenseModel_ClassifyAsync_IsThreadSafe

              - id: WordSense-Basic-BasicWordSenseModel-Dispose
                title: >-
                  BasicWordSenseModel shall tolerate repeated and concurrent disposal, and after disposal shall throw
                  ObjectDisposedException from its preparation step and from ClassifyAsync.
                tags: [unit]
                justification: |
                  The model honors the disposal contract of IWordSenseModel, so code that handles any model behaves the
                  same with the Basic model.
                tests:
                  - BasicWordSenseModel_Dispose_CalledTwice_IsHarmless
                  - BasicWordSenseModel_Dispose_Concurrent_IsHarmless
                  - BasicWordSenseModel_ClassifyAsync_AfterDispose_ThrowsObjectDisposed
                  - BasicWordSenseModel_EnsureModelAsync_AfterDispose_ThrowsObjectDisposed
