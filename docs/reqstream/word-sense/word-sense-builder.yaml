---
# WordSenseBuilder (build-time tool) unit requirements
#
# The builder is a repository tool and is never shipped in a package.

sections:
  - title: WordSense Requirements
    sections:
      - title: WordSenseBuilder Requirements
        requirements:
          - id: WordSense-WordSenseBuilder-Words
            title: >-
              The builder shall compile the flat word image of the core package deterministically from the
              authoritative tables of the data (entry, form, sense, group and sense label), holding every
              word of the dictionary (determiners, conjunctions and interjections included)
              with all its parts of speech, the inflected forms of every dictionary word (the generation of the forms
              is specified by the FormGenerator requirements), and the sense catalog: every single-token OEWN sense
              and its group (none when it is in no group) and its OEWN sense key (none for a project sense), the
              senses of each lemma and part of speech in the order of Open English WordNet (the
              position of the sense in its entry, then the homograph number of the entry, project senses last, then the
              sense id bytes; the WordNet 3.0 frequencies shall not order them), the WordNet 3.0 tag count of each
              sense (0 for a project sense and for a key without a count; a count that does not fit 16 bits fails the
              build) outside the inventory hash, and no spelling without a letter (a
              numeral such as 0 or 24/7), with no entry or sense of such a lemma, whether or not that sense has a
              label, and no analysis whose lemma has no letter; and
              shall write it in the compact binary format that the core package reads. The committed image shall be
              the compilation of the committed data, a dictionary word shall never be lost, and a sense without a
              label, a sense in two groups, a group of fewer than two senses (a declared group without any member
              included) or of all the senses of its lemma and part of speech, a group that mixes lemmas or parts of
              speech, or a group id that lacks the group marker
              (lemma#group:label) or equals a sense id shall fail
              the build. A modal or primary auxiliary listed in the committed auxiliary list shall gain an auxiliary
              analysis.
            tags: [unit]
            justification: |
              The shipped lexicon and catalog must be reproducible from committed inputs so that reviewers can verify
              them, and must never lose a dictionary word, a part of speech or a sense because of what was trained
              (the one exception is a numeral, a lemma or spelling without a letter, which the library never looks up as
              a word, so an analysis of such a lemma is left out even under a spelling with a letter). Running text uses
              inflected forms far more often than lemmas, so every form of every word with a letter has to be known.
            tests:
              - WordSenseBuilder_ImageCompiler_Build_IsDeterministic
              - WordSenseBuilder_ImageCompiler_Build_CatalogIsDeterministic
              - WordSenseBuilder_ImageCompiler_Build_SpellingWithoutALetter_IsLeftOut
              - WordSenseBuilder_ImageCompiler_Build_UnlabeledSpellingWithoutALetter_IsLeftOut
              - WordSenseBuilder_ImageCompiler_Build_AnalysisOfLemmaWithoutALetter_IsLeftOut
              - WordSenseBuilder_ImageCompiler_Build_GroupWithSpellingWithoutALetterMember_LeavesTheMemberOut
              - WordSenseBuilder_ImageCompiler_Build_SenseOrder_IsOewnPositionThenHomographThenProjectSenses
              - WordSenseBuilder_ImageCompiler_Build_SenseFrequency_IsTheTagCountOfEachSenseKey
              - WordSenseBuilder_ImageCompiler_Build_SenseFrequency_IsNotPartOfTheInventoryHash
              - WordSenseBuilder_ImageCompiler_Build_SenseFrequency_CountAboveSixteenBits_Fails
              - WordSenseBuilder_ImageCompiler_Build_SenseWithoutLabel_Fails
              - WordSenseBuilder_ImageCompiler_Build_SenseInTwoGroups_Fails
              - WordSenseBuilder_ImageCompiler_Build_GroupOfOneSenseOrAllSenses_Fails
              - WordSenseBuilder_ImageCompiler_Build_GroupWithoutMembers_Fails
              - WordSenseBuilder_ImageCompiler_Build_GroupMixingPartsOfSpeech_Fails
              - WordSenseBuilder_ImageCompiler_Build_GroupIdWithoutMarkerOrEqualToSenseId_Fails
              - WordSenseBuilder_Image_Spellings_AreSortedByUtf8Bytes
              - WordSenseBuilder_Image_Find_ReturnsOwnIndex
              - WordSenseBuilder_Image_Corruption_IsRejected
              - WordSenseBuilder_Image_TruncatedAtEverySectionBoundary_IsRejected
              - WordSenseBuilder_Image_WrongHash_IsRejectedByContentHashOnly
              - WordSenseBuilder_Image_CountMismatch_IsRejected
              - WordSenseBuilder_LexiconSource_ReadAuxiliaries_ReadsWordsAndRejectsBadLines
              - WordSenseBuilder_LexiconSource_Letters_CoverTheTenParts
              - WordSenseBuilder_Words_Committed_MatchesData
              - WordSenseBuilder_Words_Committed_AuxiliariesGainTheirAnalysis
              - WordSenseBuilder_Program_CompileImage_WritesImage
              - WordSenseBuilder_SenseInventory_ValidateRules_FlagsViolations
              - WordSenseBuilder_SenseInventory_Validate_CommittedCorpus_IsConsistent
              - WordSenseBuilder_Words_Committed_HoldsEveryDictionaryWord
              - WordSenseBuilder_Words_Committed_CatalogHoldsEveryOewnAndProjectSense

          - id: WordSense-WordSenseBuilder-ImageFormat
            title: >-
              The word image shall be of format version 5 and carry no respelling sections (the section ids 24 to 26
              are unused and the meta section has eight values) and one sense frequency section (id 38, a 16-bit count
              for each sense), the image reader shall reject an image of any other
              version, and the data schema shall not declare the retired table sense_respelling.
            tags: [unit]
            justification: |
              The respelling belonged to the removed pronunciation support and had no data; the sense frequency
              section added the usage prior of the senses; the format version lets a reader refuse an image of the
              earlier layout instead of misreading it, and the schema must not keep a
              table that nothing reads.
            tests:
              - WordSenseBuilder_Image_Version5_HasSenseFrequencyAndNoRespellingSections
              - WordSenseBuilder_Image_PreviousFormatVersion_IsRejected
              - WordSenseBuilder_Image_Corruption_IsRejected
              - WordSenseBuilder_DataSchema_Load_CommittedSchema_DeclaresTables

          - id: WordSense-WordSenseBuilder-Coverage
            title: >-
              The builder shall report, for a directory of plain-text files, the share of the running words that the
              word table knows (excluding the Project Gutenberg header and footer), the share of the known words whose
              lemma has trained fine senses, and list the unknown words, separating likely names from other words,
              most frequent first.
            tags: [unit]
            justification: |
              The completeness of the word table must be measured on real text, not assumed; a repeatable report is
              how obviously valid unknown words are found and how a regression is detected, and the trained share shows
              how much of real text a model can answer at a sense level.
            tests:
              - WordSenseBuilder_CoverageReport_Body_CutsAtMarkers
              - WordSenseBuilder_CoverageReport_AddText_ClassifiesTokens
              - WordSenseBuilder_CoverageReport_ReadAndRender_ListsFigures
              - WordSenseBuilder_CoverageReport_ReadAndRender_ListsTheTrainedShare
              - WordSenseBuilder_CoverageReport_Read_BadDirectory_Throws
              - WordSenseBuilder_CoverageReport_AuthoredSample_IsFullyKnown
              - WordSenseBuilder_Program_Coverage_ReportsAndWritesFile
              - WordSenseBuilder_Program_Coverage_WithoutText_Fails

          - id: WordSense-WordSenseBuilder-ImportDictionary
            title: >-
              The builder shall derive the dictionary word list from the pinned public-domain word list after
              verifying its checksum, keep every single lower-case word with all its parts of speech in the order of
              the source, including the determiners, conjunctions and interjections, and apply the committed
              corrections.
            tags: [unit]
            justification: |
              The word list the lexicon grows from must be reproducible and complete: dropping a class of words
              because a model is less accurate for it would make those words unknowable to every model.
            tests:
              - WordSenseBuilder_LexiconImporter_Import_KeepsEveryWordInCodeOrder
              - WordSenseBuilder_LexiconImporter_Import_AppliesParticipleAndGerundRule
              - WordSenseBuilder_LexiconImporter_Import_AppliesCorrections
              - WordSenseBuilder_LexiconImporter_Import_ChecksHash
              - WordSenseBuilder_LexiconImporter_Import_RejectsBadCorrection
              - WordSenseBuilder_LexiconSource_ReadWords_KeepsSenseOrderAndKnowsDeterminer
              - WordSenseBuilder_Program_ImportMoby_RequiresPinnedInput

          - id: WordSense-WordSenseBuilder-Weights
            title: >-
              The builder shall train, for a named encoder model and the shared corpus, one set of per-lemma weights
              deterministically (the same input gives byte-identical weights whatever the number of threads), scoring
              each fine sense of every lemma that has two or more senses with anchors
              (a sense with a single anchor still takes part in training, a lemma with fewer than two anchored senses
              gets no weights), in the span of the anchors of the lemma when it has fewer anchors than the encoder has
              dimensions (an exact reformulation of the feature-space fit, which stays available as the reference
              solver), and shall write it, naming the model, to the package of that model.
            tags: [unit]
            justification: |
              Each encoder package needs classifiers trained for its own embedding space; training every model from
              the one shared corpus keeps the models comparable, and a lemma with nothing to choose between gets no
              classifier that could only guess. The fit in the feature space took 11.5 minutes for 20 lemmas of the
              768-dimensional encoder, which does not scale to the corpus of 775 lemmas; the
              equivalent fit in the span of the anchors takes seconds.
            tests:
              - WordSenseBuilder_LogisticTrainer_SeparatesAndIsDeterministic
              - WordSenseBuilder_KernelBasis_Create_KeepsInnerProductsAndDropsDuplicates
              - WordSenseBuilder_KernelBasis_Create_Subset_UsesTheSubsetOnly
              - WordSenseBuilder_WeightsTrainer_Fit_KernelSolver_FindsThePrimalOptimum
              - WordSenseBuilder_WeightsTrainer_Fit_KernelSolver_IsDeterministic
              - WordSenseBuilder_LemmaFitter_Fit_IsIndependentOfTheThreadCount
              - WordSenseBuilder_WeightsTrainer_Fit_MoreSamplesThanDimensions_IsThePrimalSolver
              - WordSenseBuilder_WeightsBlobWriter_Write_RoundTripsThroughTheReader
              - WordSenseBuilder_Program_Weights_UnknownModel_ListsTheModels
              - WordSenseBuilder_WeightsTrainer_LemmaWithOneAnchoredSense_GetsNoWeights
              - WordSenseBuilder_WeightsTrainer_SenseWithOneAnchor_StaysInTraining

          - id: WordSense-WordSenseBuilder-FormChoosers
            title: >-
              The builder shall train a form chooser, deterministically, for every form whose rows in the chooser corpus
              (form, label, sentence) name at least two labels and give every analysis of the form a label, with its
              own fine threshold chosen by cross-validation on those rows only, shall store it with the first lemma of
              the form that has weights, shall reject a chooser row whose label stands for no analysis of its form, and
              shall report the forms that got no chooser and why.
            tags: [unit]
            justification: |
              A form shared by several lemmas or tenses (`left`, `used`, `read`) can only be answered at the sense level
              when a classifier first picks the lemma or the tense; the table refuses a chooser that does not cover
              every analysis of its form, so the builder must not write one, and a form without a chooser must be
              visible to the corpus author who has to supply the missing rows.
            tests:
              - WordSenseBuilder_ChooserCorpus_ReadSentences_ParsesRow
              - WordSenseBuilder_ChooserCorpus_ReadSentences_LemmaAndFeaturesLabel_IsAccepted
              - WordSenseBuilder_ChooserCorpus_ReadSentences_InvalidRows_AreDescribed
              - WordSenseBuilder_ChooserCorpus_ReadDirectory_MalformedRow_Throws_AndMissingDirectoryIsEmpty
              - WordSenseBuilder_ChooserCorpus_Validate_DuplicateSentence_IsAnError
              - WordSenseBuilder_ChooserCorpus_LabelIndexOf_PrefersTheExactLabel
              - WordSenseBuilder_WeightsTrainer_AttachChoosers_FormOfTwoLemmas_StoresTheChooserWithTheFirstTrainedLemma
              - WordSenseBuilder_WeightsTrainer_AttachChoosers_OnlyTheSecondLemmaTrained_StoresItThere_AndTheBlobRoundTrips
              - WordSenseBuilder_WeightsTrainer_AttachChoosers_TenseVariants_GetOneLabelEach
              - WordSenseBuilder_WeightsTrainer_AttachChoosers_UnusableForms_AreSkippedWithAReason
              - WordSenseBuilder_WeightsTrainer_AttachChoosers_IsDeterministic_AndNeedsOneFeaturePerRow

          - id: WordSense-WordSenseBuilder-Thresholds
            title: >-
              The builder shall choose for every trained lemma a first fine threshold, and for a lemma that has groups
              also a first group threshold, by cross-validation on the anchors of the lemma only, so that the answers
              above each threshold reach a configured precision target (95 percent by default), deterministically; a
              level for which no threshold reaches the target shall never be answered for that lemma. These first
              thresholds are the input of the real-text calibration (WordSense-WordSenseBuilder-RealCalibration), which
              is the only step that may read held-out sentences to move them.
            tags: [unit]
            justification: |
              Per-lemma thresholds make the confidence of each answer mean the same thing for every lemma and every
              model, and never answering a level that cannot meet the target keeps the promise honest. The anchor
              cross-validation is the conservative starting point and a lemma with no real calibration rows keeps it;
              it is optimistic on real text (its anchors are balanced and partly written), which is why the real-text
              calibration follows.
            tests:
              - WordSenseBuilder_Thresholds_Choose_MeetPrecisionTargetOnOutOfFoldAnswers
              - WordSenseBuilder_Thresholds_Choose_IsDeterministicForSeed
              - WordSenseBuilder_Thresholds_Choose_NeverReadsHoldoutOrEvaluationSentences
              - WordSenseBuilder_Thresholds_Choose_TargetNeverReached_NeverAnswersThatLevel
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_WritesBothThresholdsPerLemma

          - id: WordSense-WordSenseBuilder-RealCalibration
            title: >-
              The builder shall split the real-text held-out sentences (a provenance source that is real text) by
              document into a calibration split and a test split with a fixed, recorded rule (the first bit of the
              SHA-256 of the
              document identifier; a Tatoeba sentence is its own document), and shall move the thresholds of the
              trained lemmas so that the answers on the real calibration sentences reach the precision target: a
              lemma with enough calibration rows gets a threshold of its own that is never lower than its adjusted
              cross-validation threshold, every other lemma gets its cross-validation threshold plus one pooled shift
              that is fitted on the calibration rows of all those lemmas, a level that was never answered stays never
              answered, and the group threshold moves the same way only when the calibration rows can verify it. The
              test split and the written held-out sentences shall never influence a threshold, and the calibration shall
              be deterministic. The provenance files that decide the split shall be read strictly: a file whose header
              is not exact, a row without its four non-empty columns, a split or a source that is not allowed, or an id
              that repeats is refused with the file and line.
            tags: [unit]
            justification: |
              Thresholds chosen by cross-validation on the anchors are calibrated on a balanced corpus that is partly
              written, so on real text the sense answers fall about ten points short of the target (85.7 to 87.5
              percent against 95 percent measured on the held-out real sentences). Calibrating on held-out real
              sentences whose documents are disjoint from the test split keeps the headline real-text figures
              independent of the thresholds, and one pooled shift is the robust choice because a lemma has only a few
              calibration rows. A provenance row that is skipped silently would move a sentence between the real and
              the written sets, or between the calibration and the test side, without a trace.
            tests:
              - WordSenseBuilder_RealSplit_Classify_SplitsRealRowsByDocument
              - WordSenseBuilder_RealSplit_ReadProvenance_MalformedFile_IsRefusedWithPathAndLine
              - WordSenseBuilder_RealSplit_ReadProvenance_IdInTwoFiles_IsRefused
              - WordSenseBuilder_RealSplit_Classify_WrittenAndUnknownRows_AreNeverRealRows
              - WordSenseBuilder_RealSplit_Classify_ReportsTestRowsInDocumentsWithoutAnchors
              - WordSenseBuilder_RealCalibrator_Apply_RaisesThresholdsUntilThePooledPrecisionReachesTheTarget
              - WordSenseBuilder_RealCalibrator_Apply_LemmaWithEnoughRows_KeepsTheHigherOfItsOwnAndTheAdjustedThreshold
              - WordSenseBuilder_RealCalibrator_Apply_NoCalibrationRows_KeepsTheThresholds
              - WordSenseBuilder_RealCalibrator_Apply_NeverStaysNever_AndIsDeterministic
              - WordSenseBuilder_RealCalibrator_Apply_GroupThreshold_MovesOnlyWithEnoughAnswers
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_CalibrationRows_MoveTheThresholds

          - id: WordSense-WordSenseBuilder-CalibrationShift
            title: >-
              The one pooled shift of the real-text calibration shall be chosen as follows, for the fine level and, with
              its own answers, for the group level. The pooled answers are those of the calibration rows of the lemmas
              that have a finite first threshold and no threshold of their own, and an answer is usable when its
              distance (its margin minus the first threshold of its lemma) is finite and not negative; a shift keeps
              the usable answers whose distance is at least the shift, and answers of equal distance are kept or
              dropped together.
              The shift shall be the lowest non-negative shift whose kept answers reach the precision target while at
              least max(30, ceil(0.30 × n)) of the n usable answers are kept. When no shift reaches the target on that
              many answers, the shift shall be the largest one that keeps that many answers, and the training summary
              shall say that the target was not reached (for the fine level, and for the group level when it is
              verified). With fewer than 30 usable answers the shift shall be 0 and the target shall be reported as not
              reached, and a group level with fewer than 30 usable answers shall keep its thresholds and be reported as
              unverified. The default calibration target of a weights run shall be 0.97 (the option
              `--calibration-target` changes it), two points above the 95 percent that the cross-validation of the first
              thresholds and the real test text aim at.
            tags: [unit]
            justification: |
              The precision of the answers in a thin tail of the distances rests on a few dozen rows. A rule that takes
              the first crossing of the target there lets one wrong row move the shift by several units: on the
              calibration rows of the BertBaseCased model the shift was 8.10 and fell to 4.85 when the eight most
              confident wrong rows were removed. A minimum share of 30 percent of the usable answers (so that six rows
              move the precision of the kept answers by about two points at most) makes
              the shift stable (4.66 to 5.00 over 200 bootstrap resamples, and 4.88 to 4.85 when the eight rows are
              removed), and a documented fallback makes the result defined when the target is out of reach, as it is on
              the current corpus (the precision of the pooled answers stays near 95 percent). The target 0.97 is two
              points above the 95 percent aimed at because the precision of the whole pipeline is about two points below
              the lemma-level precision of the classifier.
            tests:
              - WordSenseBuilder_RealCalibrator_ChooseShift_ConfidentErrorsInTheTail_DoNotMoveTheShift
              - WordSenseBuilder_RealCalibrator_ChooseShift_TargetNotReachable_KeepsTheMinimumShareAndReportsIt
              - WordSenseBuilder_RealCalibrator_ChooseShift_TargetClearlyReachable_ReachesItOnEnoughAnswers
              - WordSenseBuilder_RealCalibrator_ChooseShift_FewPooledAnswers_TheMinimumCountDominatesTheShare
              - WordSenseBuilder_RealCalibrator_ChooseShift_FewerThanThirtyUsableAnswers_GiveShiftZeroNotReached
              - WordSenseBuilder_RealCalibrator_ChooseShift_TiesAtTheBoundary_AreKeptTogether
              - WordSenseBuilder_RealCalibrator_Defaults_ShareThirtyPercentTargetNinetySevenPercent
              - WordSenseBuilder_RealCalibrator_Apply_TargetNotReachable_ReportsItAndKeepsTheMinimumShare
              - WordSenseBuilder_RealCalibrator_Apply_GroupAnswersAboveOneHundred_UseTheShareAndReportTargetNotReached
              - WordSenseBuilder_RealCalibrator_Apply_InfiniteGroupDistances_AreNotUsableAndDoNotVerify

          - id: WordSense-WordSenseBuilder-UsagePrior
            title: >-
              The builder shall train the per-sense scores of every lemma so that the sense probabilities of a model
              reflect how often the senses are used, not how often the training sentences show them: it shall divide
              out the share of each sense among the anchors of its lemma and multiply in the usage of the sense, the
              WordNet 3.0 tag count with a constant added to every sense and tempered by an exponent (defaults 0.5 and
              0.5), where a sense without a count (a project sense) gets the constant alone. The correction shall add
              nothing to the size of the weights and nothing to the cost of classifying, shall give the same weights for
              the same input whatever the number of threads, shall be applied to the scores from which the first
              thresholds are chosen (so every threshold is derived from the corrected scores), shall be switched off or
              tuned by builder options, and shall be reported in the summary of the run and documented.
            tags: [unit]
            justification: |
              The classifiers are trained on anchors that are balanced by sense quota, so their raw probabilities carry
              the proportions of the training data instead of those of real use. Measured against the same classifiers
              without the correction, the correction raises the fine top-1 accuracy of the BertBaseCased model on
              SemCor, an independent human-annotated corpus, from 56.9 to 60.7 percent and that of the MiniLM model from
              47.5 to 53.6 percent, and the accuracy on real sentences weighted to the usage of the senses by 1.8 and
              2.6 points; the real test split, which is balanced like the training data, loses one point for
              BertBaseCased. An additive offset on the stored bias of each sense is exactly equivalent to rescaling the
              probabilities, so the shipped model needs no new code and no new data.
            tests:
              - WordSenseBuilder_SensePrior_Offsets_FollowTheDocumentedFormula
              - WordSenseBuilder_SensePrior_Offsets_SenseWithoutCount_UsesTheSmoothingAlone
              - WordSenseBuilder_SensePrior_Offsets_AlphaZero_RemovesOnlyTheTrainingShare
              - WordSenseBuilder_SensePrior_Offsets_AreDeterministic
              - WordSenseBuilder_SensePrior_ReadCounts_ReadsTheFrequencyTable
              - WordSenseBuilder_WeightsTrainer_TrainDense_UsagePrior_ShiftsTheBiasesByTheOffsets
              - WordSenseBuilder_WeightsTrainer_TrainDense_UsagePrior_IsDeterministicAndKeepsTheSize
              - WordSenseBuilder_Thresholds_Choose_Offsets_AreAppliedToTheOutOfFoldScores
              - WordSenseBuilder_FitCache_KeyOf_DependsOnThePriorOffsets
              - WordSenseBuilder_Program_TrainSettingsOf_ParsesThePriorOptions

          - id: WordSense-WordSenseBuilder-Tiers
            title: >-
              The builder shall report, for every sense of every trained lemma, the number of anchor and held-out
              sentences it should have, derived from its WordNet 3.0 tag count (five or more: 20 and 5; one to four, and
              a project sense: 10 and 3; none: 5 and 2), with the status of the sense (met, short or empty), and list
              the senses that fall short of their quota with the sentences that are missing.
            tags: [unit]
            justification: |
              Frequent senses need more evidence than rare ones, and the corpus can only be extended where it is
              known to be short; a repeatable quota report is how the authoring of the corpus is planned and how a
              sense that cannot be trained is made visible instead of silently missing.
            tests:
              - WordSenseBuilder_Tiers_Quota_FollowsTheTagCount
              - WordSenseBuilder_Tiers_Report_ListsShortAndEmptySensesWithTheMissingSentences
              - WordSenseBuilder_Program_Tiers_WritesReport

          - id: WordSense-WordSenseBuilder-EmbeddingCache
            title: >-
              When retraining the weights of an encoder model, the builder shall reuse the pooled vectors it computed
              before and encode only the sentences that are new or changed. A cached vector shall be bit-identical to
              a fresh encode, shall be valid only for the model files it was computed with, and a corrupt cache entry
              shall be ignored and encoded again without failing the run. The builder shall report the cache hits,
              the encoded sentences and the time, and shall let the cache be moved (--cache) or bypassed (--no-cache).
            tags: [unit]
            justification: |
              The encoder is deterministic for given model files, so encoding all anchor sentences on every run is
              wasted time; adding a few sentences to one lemma must not cost a full encode of the corpus, and a stale
              or damaged cache must never change the shipped weights.
            tests:
              - WordSenseBuilder_EmbeddingCache_KeyOf_DependsOnWordsAndTarget
              - WordSenseBuilder_EmbeddingCache_ComputeDigest_DependsOnEveryInput
              - WordSenseBuilder_EmbeddingCache_SaveAndOpen_RoundTripsBitIdentical
              - WordSenseBuilder_EmbeddingCache_Open_MissingFile_IsEmpty
              - WordSenseBuilder_EmbeddingCache_Open_OtherModelDigest_IsInvalidated
              - WordSenseBuilder_EmbeddingCache_Open_CorruptEntry_IsDiscardedAndOthersSurvive
              - WordSenseBuilder_EmbeddingCache_Open_TruncatedFile_KeepsCompleteEntries
              - WordSenseBuilder_EmbeddingCache_Open_DamagedHeader_IsEmptyAndInvalidated
              - WordSenseBuilder_EmbeddingCache_Add_OtherDimension_Throws
              - WordSenseBuilder_EmbeddingCache_Save_Failure_LeavesNoTemporaryFile
              - WordSenseBuilder_CachingEncoder_EncodeAsync_SecondCallIsAHitAndBitIdentical
              - WordSenseBuilder_CachingEncoder_EncodeAsync_NoCacheOrNoTokens_AlwaysEncodes
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_SecondRun_EncodesNothingAndReproducesBytes
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_AddedSentences_AreTheOnlyOnesEncoded
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_ChangedModelDigest_EncodesEverythingAgain
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_CorruptEntry_IsEncodedAgain
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_Progress_ReportsHitsAndMisses
              - WordSenseBuilder_Program_Weights_SwitchOptions_AreAcceptedWithoutValue
              - WordSenseBuilder_Program_Weights_CacheAndNoCache_AreRejected
              - WordSenseBuilder_Program_TrainSettingsOf_ResolvesCacheAndMean

          - id: WordSense-WordSenseBuilder-FitCache
            title: >-
              When retraining the weights of an encoder model, the builder shall fit again only the lemmas whose
              features, labels or training settings (the threshold settings included) changed and reuse the stored fit
              of every other lemma, so that
              changing the anchors of one lemma (with the frozen mean) costs the fit of that lemma only. A reused fit
              shall be bit-identical to a fresh one, a damaged cache entry shall be ignored and fitted again without
              failing the run, and the fits shall be independent of the number of threads that train the lemmas.
            tags: [unit]
            justification: |
              With the encoder output cached, fitting the classifiers of all lemmas becomes the longest step of a
              retraining; because the fit of a lemma depends on that lemma alone, it need not be repeated for the
              lemmas that did not change.
            tests:
              - WordSenseBuilder_FitCache_KeyOf_DependsOnEverythingTheFitDependsOn
              - WordSenseBuilder_FitCache_KeyOf_DependsOnTheThresholdSettings
              - WordSenseBuilder_FitCache_SaveAndOpen_RoundTripsBitIdentical
              - WordSenseBuilder_FitCache_Save_WritesOnlyUsedFits
              - WordSenseBuilder_FitCache_Open_CorruptEntry_DropsItAndTheRest
              - WordSenseBuilder_FitCache_Open_DamagedFile_IsHandled
              - WordSenseBuilder_FitCache_Save_Failure_LeavesNoTemporaryFile
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_UnchangedAnchors_ReusesEveryLemmaFit
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_FrozenMeanAndEditedLemma_FitsOnlyThatLemma
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_RecomputedMean_FitsEveryLemmaAgain
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_Progress_ReportsHitsAndMisses

          - id: WordSense-WordSenseBuilder-FrozenMean
            title: >-
              When retraining the weights of an encoder model, the builder shall reuse the global mean stored in the
              existing weights of that model instead of recomputing it, unless asked to recompute it (--recompute-mean),
              so that changing the anchors of one lemma changes the weights of that lemma only and unchanged anchors
              reproduce the committed weights byte for byte. It shall compute the mean from the anchors when there are
              no existing weights, they are unreadable, or they name another model or dimension.
            tags: [unit]
            justification: |
              A mean over all anchors couples every lemma to every other; freezing it keeps an edit local, keeps the
              shipped weights of untouched lemmas stable, and makes the retraining reproducible.
            tests:
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_FrozenMean_EditingOneLemmaLeavesOthersUnchanged
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_RecomputedMean_CouplesTheLemmas
              - WordSenseBuilder_ModelTrainer_TrainDataAsync_FrozenMeanOfOtherDimension_IsComputedInstead
              - WordSenseBuilder_ModelTrainer_ReadFrozenMean_SameModel_ReturnsStoredMean
              - WordSenseBuilder_ModelTrainer_ReadFrozenMean_MissingOtherOrUnreadable_ReturnsNull
              - WordSenseBuilder_Program_TrainSettingsOf_ResolvesCacheAndMean
              - WordSenseBuilder_Program_Weights_SwitchOptions_AreAcceptedWithoutValue

          - id: WordSense-WordSenseBuilder-Evaluate
            title: >-
              The builder shall measure a shipped model (an encoder model or the basic model) on the held-out
              sentences of the corpus, and report accuracy and coverage at each answer level (the share
              answered at the sense, group and part of speech level, and the accuracy at each level) and for
              the part of speech, with the real-text test split (the real held-out sentences of the test documents) as
              the headline set and the real calibration split, the written held-out sentences and the whole held-out
              set only as clearly labeled secondary sets, with a diagnostic set of the test sentences whose document
              supplies no anchor, and with a statement that no held-out set is representative running text; for the
              basic model it shall also report calibration, confidence thresholds, table
              size, latency and a fixed comparison table printed on every run.
            tags: [unit]
            justification: |
              Each model's accuracy claim must be checkable against a repeatable measurement on sentences that were
              never used for training or for the thresholds, and an answer that carries a level must be measured at that
              level. The written held-out sentences are about 17 points easier than real ones, so they must never be
              the headline.
            tests:
              - WordSenseBuilder_Evaluator_RunAsync_BasicModel_CountsHoldoutRows
              - WordSenseBuilder_Evaluator_RunAsync_ReportsShareAndAccuracyPerLevel
              - WordSenseBuilder_Evaluator_RunAsync_ProvenanceNamesTheOrigin_ReportsTheRealTestSplitFirst
              - WordSenseBuilder_Program_Evaluate_BasicModel_PrintsMeasurements
              - WordSenseBuilder_Program_Evaluate_UnknownModel_ReportsError
              - WordSenseBuilder_ModelTable_BasicRow_MatchesEvaluation
              - WordSenseBuilder_ModelTable_Update_ChangesOnlyTheCellsOfItsCommand
              - WordSenseBuilder_ModelTable_Update_UnknownColumn_IsRejected
              - WordSenseBuilder_EvaluationResult_Render_FormatsSetsAndMeasurements

          - id: WordSense-WordSenseBuilder-OpenCounts
            title: >-
              The builder shall count part-of-speech tag n-grams and word-tag pairs from the training split of the
              representative part of the open English part-of-speech corpus (every token, whatever its consensus status,
              with a split contraction joined into one token), read no other part of the corpus for them, and write the
              counts deterministically to the corpus.
            tags: [unit]
            justification: |
              The statistics of the basic model are usage statistics, so they must come from an unbiased sample of text
              (the representative part, never the targeted part or the balanced sentence corpus), and from a corpus
              whose annotations we own and release under CC0 1.0, so that the shipped table carries no share-alike
              license.
              The inputs are committed and the counts reproducible.
            children:
              - WordSense-WordSenseBuilder-OpenCounts-ClauseCounts
              - WordSense-WordSenseBuilder-OpenCounts-ClauseNonFinite
              - WordSense-WordSenseBuilder-OpenCounts-ClauseFile
              - WordSense-WordSenseBuilder-OpenCounts-ClauseCommand
              - WordSense-WordSenseBuilder-OpenCounts-ClauseMissing
              - WordSense-WordSenseBuilder-OpenCounts-ClauseMalformed
              - WordSense-WordSenseBuilder-OpenCounts-ClauseBigramAboveTotal
              - WordSense-WordSenseBuilder-OpenCounts-ClauseTrigramAboveTotal
            tests:
              - WordSenseBuilder_OpenCorpus_ReadFile_ReadsSentencesAndTokens
              - WordSenseBuilder_OpenCorpus_ReadSplit_FindsTheFileOfAPart
              - WordSenseBuilder_OpenCorpus_ReadFile_MissingFileAndMalformedLine_Throw
              - WordSenseBuilder_OpenCorpus_ToTagged_JoinsContractionsButNotPossessives
              - WordSenseBuilder_OpenCorpus_ToTagged_KeepsClitics_WhenTheJoinedFormIsNotInTheText
              - WordSenseBuilder_OpenCorpus_Committed_ReadsEverySplitAndKeepsTheStePartInTheChallengeSet
              - WordSenseBuilder_TaggerCounts_MapTag_MapsUniversalTags
              - WordSenseBuilder_TaggerCounts_KeyOf_AcceptsLettersAndApostrophes
              - WordSenseBuilder_TaggerCounts_Count_CountsNgramsAndWords
              - WordSenseBuilder_TaggerCounts_WriteAndRead_RoundTripsDeterministically
              - WordSenseBuilder_TaggerCounts_Read_MalformedFiles_Throw
              - WordSenseBuilder_Program_OpenCounts_WritesCountFiles

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseCounts
            title: >-
              The builder shall count, besides the totals, the bigram and trigram tag counts of the positions whose
              clause already has a verb, where a clause starts at the beginning of the sentence and after a conjunction
              or punctuation tag and has a verb from the first verb tag on.
            tags: [unit]
            justification: |
              The tagger conditions its transitions on the clause state, so the counts of the positions with a verb are
              needed; the counts of the positions without one are the difference to the totals.
            tests:
              - WordSenseBuilder_TaggerCounts_Count_CountsClauseNgrams

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseNonFinite
            title: >-
              The builder shall not let a sentence-initial word that the dictionary lists only as a non-finite verb (a
              gerund, or a participle that is not also a past tense) give its clause a verb when it counts the clause
              state.
            tags: [unit]
            justification: |
              The counts must be made with the rule that the tagger uses at run time, or the transitions of the two
              clause states would not describe the sentences that the tagger reads.
            tests:
              - WordSenseBuilder_TaggerCounts_Count_NonFiniteStartDoesNotSetTheClauseState

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseFile
            title: >-
              The builder shall write the clause counts deterministically to the clause count file of the corpus, in
              a form that reads back as written.
            tags: [unit]
            justification: |
              The inputs are committed and the counts reproducible, so equal data must give equal bytes.
            tests:
              - WordSenseBuilder_TaggerCounts_WriteAndRead_RoundTripsDeterministically

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseCommand
            title: >-
              The open-counts command shall write the clause count file with the other count files.
            tags: [unit]
            justification: |
              One command must make every count file that training reads.
            tests:
              - WordSenseBuilder_Program_OpenCounts_WritesCountFiles

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseMissing
            title: >-
              The builder shall report a missing clause count file as a missing file when it reads the counts.
            tags: [unit]
            justification: |
              Training without the clause counts would silently give a table without a clause state.
            tests:
              - WordSenseBuilder_TaggerCounts_Read_MissingClauseFile_Throws

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseMalformed
            title: >-
              The builder shall reject a clause count file with a wrong header or a malformed line as invalid data.
            tags: [unit]
            justification: |
              A damaged count file must fail loudly instead of giving a damaged table.
            tests:
              - WordSenseBuilder_TaggerCounts_Read_MalformedClauseFile_Throws

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseBigramAboveTotal
            title: >-
              The builder shall reject a clause count file with a bigram count above the total count of the same bigram
              as invalid data.
            tags: [unit]
            justification: |
              The counts of the positions without a verb are the difference to the totals, so a larger clause count is
              damage, not data.
            tests:
              - WordSenseBuilder_TaggerCounts_Read_ClauseBigramAboveTotal_Throws

          - id: WordSense-WordSenseBuilder-OpenCounts-ClauseTrigramAboveTotal
            title: >-
              The builder shall reject a clause count file with a trigram count above the total count of the same
              trigram as invalid data.
            tags: [unit]
            justification: |
              The counts of the positions without a verb are the difference to the totals, so a larger clause count is
              damage, not data.
            tests:
              - WordSenseBuilder_TaggerCounts_Read_ClauseTrigramAboveTotal_Throws

          - id: WordSense-WordSenseBuilder-TrainBasic
            title: >-
              The builder shall retrain the whole basic model with one command from the committed tag counts of the
              open corpus, the fine-sense anchors and the form-chooser anchors, rolling the analysis labels of the
              training sentences of the context cues up from the fine senses (a lemma and a part of speech) and from the
              chooser labels (a lemma or a tense of a form) without any analysis prior, and shall write the embedded
              table of the basic package deterministically; it shall name the command that makes the counts when they
              are missing.
            tags: [unit]
            justification: |
              One command from committed inputs to the shipped table lets reviewers reproduce and verify the model.
              The Basic model chooses analyses, so its labels follow from the senses and the choosers without a second
              labeling. The anchors are a balanced classifier corpus whose counts say nothing about how often an
              analysis occurs, so they must not set a prior.
            children:
              - WordSense-WordSenseBuilder-TrainBasic-TenseTable
              - WordSense-WordSenseBuilder-TrainBasic-TenseClasses
              - WordSense-WordSenseBuilder-TrainBasic-TenseWeights
              - WordSense-WordSenseBuilder-TrainBasic-TrainSplitOnly
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbTable
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbWritten
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbGrid
              - WordSense-WordSenseBuilder-TrainBasic-ClauseCounts
              - WordSense-WordSenseBuilder-TrainBasic-ClauseSmoothing
              - WordSense-WordSenseBuilder-TrainBasic-FormatWsb7
              - WordSense-WordSenseBuilder-TrainBasic-ClauseDeterministic
              - WordSense-WordSenseBuilder-TrainBasic-WordPrior
              - WordSense-WordSenseBuilder-TrainBasic-WordPriorOn
              - WordSense-WordSenseBuilder-TrainBasic-AllWords
              - WordSense-WordSenseBuilder-TrainBasic-AllWordsDefault
              - WordSense-WordSenseBuilder-TrainBasic-WordsLimit
              - WordSense-WordSenseBuilder-TrainBasic-WordsLimitTies
              - WordSense-WordSenseBuilder-TrainBasic-CueHeldOut
              - WordSense-WordSenseBuilder-TrainBasic-CueReliabilityFull
              - WordSense-WordSenseBuilder-TrainBasic-CueReliabilityChance
              - WordSense-WordSenseBuilder-TrainBasic-CueReliabilityBetween
              - WordSense-WordSenseBuilder-TrainBasic-CueReliabilityOff
              - WordSense-WordSenseBuilder-TrainBasic-CueReliabilityWritten
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningReliability
            tests:
              - WordSenseBuilder_BasicTrainer_ClosedMaskOf_AppliesThresholds
              - WordSenseBuilder_BasicTrainer_Train_SelectsWordsAndSuffixes
              - WordSenseBuilder_BasicTrainer_Train_CueTablePrefersSeenAnalysis
              - WordSenseBuilder_BasicTrainer_Train_AnalysisPriorIgnoresAnchorCounts
              - WordSenseBuilder_BasicTrainer_Train_ColumnsAreLemmaAndPartOfSpeech
              - WordSenseBuilder_BasicTrainer_Train_ChooserRowsMakeFormTablesWithTenseColumns
              - WordSenseBuilder_BasicTrainer_KeyOf_RollsTheRowUpToLemmaAndPartOfSpeech
              - WordSenseBuilder_BasicTrainer_KeyOf_ChooserLabel_StandsForOneAnalysisOrNone
              - WordSenseBuilder_BasicTablesWriter_Write_IsDeterministicAndReadsBack
              - WordSenseBuilder_BasicTablesWriter_Write_WithTenseTable_IsDeterministicAndCurrentFormat
              - WordSenseBuilder_BasicTablesWriter_Write_ShortHash_Throws
              - WordSenseBuilder_BasicModelData_Summary_NamesSizes
              - WordSenseBuilder_Program_Weights_BasicModel_PointsToTrainBasic
              - WordSenseBuilder_Program_TrainBasicAndEvaluateTagger_TinyCorpus_WriteAndScoreTable
              - WordSenseBuilder_Program_TrainBasic_WithoutCounts_ReportsError

          - id: WordSense-WordSenseBuilder-TrainBasic-ClauseCounts
            title: >-
              The builder shall write the clause counts of the open corpus into the table of the basic model.
            tags: [unit]
            justification: |
              The runtime reads the transitions of both clause states from these numbers.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_CarriesTheClauseCounts

          - id: WordSense-WordSenseBuilder-TrainBasic-ClauseSmoothing
            title: >-
              The builder shall write the smoothing of the clause state, a hyper-parameter, into the header of the
              table of the basic model.
            tags: [unit]
            justification: |
              The runtime mixes the transitions of each clause state with the unconditioned ones by this value, so
              the table must carry the value it was tuned with.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_CarriesTheClauseSmoothing

          - id: WordSense-WordSenseBuilder-TrainBasic-FormatWsb7
            title: >-
              The builder shall write the table of the basic model with the format revision WSB7, which differs from
              the previous revision.
            tags: [unit]
            justification: |
              The revision makes the previous format fail loudly in the runtime instead of being read as a current one.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_StartsWithTheMagicWsb7

          - id: WordSense-WordSenseBuilder-TrainBasic-WordPrior
            title: >-
              The builder shall write the word prior of its hyper-parameters into the header of the table of the basic
              model.
            tags: [unit]
            justification: |
              The runtime computes the prior from the word image and needs only its numbers, which are chosen on
              development data and must travel with the table.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_CarriesTheWordPrior

          - id: WordSense-WordSenseBuilder-TrainBasic-WordPriorOn
            title: >-
              The builder shall ship hyper-parameters whose word prior is on and is accepted by the runtime.
            tags: [unit]
            justification: |
              A table that the runtime rejects, or one with the prior off, would not deliver the tagger the model is
              meant to have.
            tests:
              - WordSenseBuilder_BasicHyperparameters_WordPrior_IsOnAndAccepted

          - id: WordSense-WordSenseBuilder-TrainBasic-AllWords
            title: >-
              The builder shall table every word of the open training counts that the dictionary lists with two or more
              parts of speech when no limit on their number is set.
            tags: [unit]
            justification: |
              A word with few counts is smoothed by the word prior, so tabling every ambiguous word gives the tagger the
              counts that exist for it.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_NoLimit_TablesEveryAmbiguousWord

          - id: WordSense-WordSenseBuilder-TrainBasic-AllWordsDefault
            title: >-
              The builder shall set no limit on the number of ambiguous words that it tables in its shipped
              hyper-parameters.
            tags: [unit]
            justification: |
              The shipped table must hold the counts of every ambiguous word of the training split.
            tests:
              - WordSenseBuilder_BasicHyperparameters_TopAmbiguousWords_IsUnlimitedByDefault

          - id: WordSense-WordSenseBuilder-TrainBasic-WordsLimit
            title: >-
              The builder shall table only the most frequent of the ambiguous words of the open training counts when a
              limit on their number is set.
            tags: [unit]
            justification: |
              A limit lets a table follow a size budget, and the most frequent words are the ones whose counts matter
              most.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_TopAmbiguousWordsBetween_KeepsTheMostFrequentThenBySpelling
              - WordSenseBuilder_BasicTrainer_Train_LimitZero_TablesNoAmbiguousWord

          - id: WordSense-WordSenseBuilder-TrainBasic-WordsLimitTies
            title: >-
              The builder shall select the same words from the same counts when a limit cuts through ambiguous words of
              equal frequency.
            tags: [unit]
            justification: |
              The table must be reproducible, so a limit that falls inside a group of words with the same count must not
              leave the choice to chance.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_TopAmbiguousWordsBetween_KeepsTheMostFrequentThenBySpelling

          - id: WordSense-WordSenseBuilder-TrainBasic-CueHeldOut
            title: >-
              The builder shall measure the accuracy of each cue table on training sentences of that table that the
              table was not trained on.
            tags: [unit]
            justification: |
              The accuracy of a table on its own training sentences says nothing about whether it generalizes. Held-out
              sentences of the same training data are legitimate evidence, and no development or test sentence is read.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_HeldOutAccuracy_IsMeasuredOnSentencesOutsideTheTable

          - id: WordSense-WordSenseBuilder-TrainBasic-CueReliabilityFull
            title: >-
              The builder shall give a cue table whose held-out accuracy reaches the target accuracy the full
              reliability.
            tags: [unit]
            justification: |
              A table that predicts well must keep its full voice.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_AccurateTable_IsFullyReliable

          - id: WordSense-WordSenseBuilder-TrainBasic-CueReliabilityChance
            title: >-
              The builder shall give a cue table whose held-out accuracy is at chance a reliability of 0.
            tags: [unit]
            justification: |
              A table that predicts its own held-out sentences at chance has weights that are the noise of a small
              sample.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_TableAtChance_HasNoReliability

          - id: WordSense-WordSenseBuilder-TrainBasic-CueReliabilityBetween
            title: >-
              The builder shall give a cue table whose held-out accuracy lies between chance and the target accuracy a
              reliability in proportion to its skill over chance.
            tags: [unit]
            justification: |
              A table that predicts somewhat well keeps part of its voice, so the damping is continuous.
            tests:
              - WordSenseBuilder_BasicTrainer_ReliabilityOf_ScalesTheSkillOverChance

          - id: WordSense-WordSenseBuilder-TrainBasic-CueReliabilityOff
            title: >-
              The builder shall leave every cue table fully reliable when the target accuracy is 0.
            tags: [unit]
            justification: |
              The damping must be switchable, so that its effect can be measured.
            tests:
              - WordSenseBuilder_BasicTrainer_Train_DampingOff_LeavesTheTableFullyReliable

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningReliability
            title: >-
              The builder shall lower the reliability of a cue table that turns more tokens of the training split of
              the open corpus wrong than right.
            tags: [unit]
            justification: |
              The anchors are a balanced corpus, so a measurement over them cannot see a table that is right on its
              anchors and wrong on running text. The training split of the open corpus is training data with gold tags.
            children:
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningMeasure
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningDeterministic
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningOff
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningFactor
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningCombine
              - WordSense-WordSenseBuilder-TrainBasic-CueRunningUncovered
            tests:
              - WordSenseBuilder_CueRunningReliability_MeasureAsync_MisleadingCues_HurtAndAreDamped

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningMeasure
            title: >-
              The builder shall count, for each cue table, the covered tokens of the training split that only the
              tagging with the cue tables gets right (helped) and those that only the tagging without them gets right
              (hurt).
            tags: [unit]
            justification: |
              The comparison with and without the cues isolates the effect of the table on running text.
            tests:
              - WordSenseBuilder_CueRunningReliability_MeasureAsync_TruthfulCues_HelpAndDoNotHurt
              - WordSenseBuilder_CueRunningReliability_MeasureAsync_MisleadingCues_HurtAndAreDamped

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningDeterministic
            title: >-
              The builder shall count the same helped and hurt tokens for the same inputs.
            tags: [unit]
            justification: |
              The table must be reproducible from the committed corpus.
            tests:
              - WordSenseBuilder_CueRunningReliability_MeasureAsync_IsDeterministic

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningOff
            title: >-
              The builder shall measure nothing and leave the model unchanged when the hyper-parameters switch the
              running-text measurement off.
            tags: [unit]
            justification: |
              The measurement must be switchable, so that its effect can be measured.
            tests:
              - WordSenseBuilder_CueRunningReliability_ApplyAsync_WithoutFolds_ReturnsTheModel

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningFactor
            title: >-
              The builder shall lower the reliability factor of a cue table as it hurts more tokens than it helps, and
              by less the fewer tokens it covers.
            tags: [unit]
            justification: |
              A table that helps at least as often as it hurts keeps its weight, and the evidence of a few tokens cannot
              judge a table.
            tests:
              - WordSenseBuilder_CueRunningReliability_FactorOf_ShrinksTheNetBenefitTowardOne

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningCombine
            title: >-
              The builder shall combine the factor of a cue table from running text with its reliability from the
              anchors as the product or as the minimum, as the hyper-parameters choose.
            tags: [unit]
            justification: |
              Both measurements say something about the table, and the choice of the combination is a setting that is
              tuned on development data.
            tests:
              - WordSenseBuilder_CueRunningReliability_Combine_UsesTheProductOrTheMinimum
              - WordSenseBuilder_CueRunningReliability_Apply_MeasuredTable_CombinesTheFactorWithTheAnchorReliability

          - id: WordSense-WordSenseBuilder-TrainBasic-CueRunningUncovered
            title: >-
              The builder shall leave a cue table that covers no training token at its reliability from the anchors.
            tags: [unit]
            justification: |
              A table without running-text evidence must not be damped by a measurement that did not see it.
            tests:
              - WordSenseBuilder_CueRunningReliability_Apply_UnmeasuredTable_KeepsTheAnchorReliability

          - id: WordSense-WordSenseBuilder-TrainBasic-CueReliabilityWritten
            title: >-
              The builder shall write the reliability of every cue table into the table of the basic model.
            tags: [unit]
            justification: |
              The runtime scales the scores of a table by its reliability, so the table must carry it.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_CarriesTheCueReliability

          - id: WordSense-WordSenseBuilder-TrainBasic-ClauseDeterministic
            title: >-
              The builder shall write a table with clause counts byte for byte the same each time for the same data.
            tags: [unit]
            justification: |
              One command from committed inputs to the shipped table lets reviewers reproduce and verify the model.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_WithClauseCounts_IsDeterministic

          - id: WordSense-WordSenseBuilder-TrainBasic-TenseTable
            title: >-
              The builder shall train the shared tense table of the basic model from every verb of the training split of
              the representative open corpus (with the lemma and the features of its tokens), from the context features
              only and without any word list, and shall write the weight of the tense model with it.
            tags: [unit]
            justification: |
              The tense of a verb is read from all verbs of running text, not from a list of the verbs that the author
              looked at.
            tests:
              - WordSenseBuilder_BasicTrainer_TrainTense_NeedsBothClassesAndIsDeterministic
              - WordSenseBuilder_BasicTrainer_Train_WithVerbs_WritesTheTenseTableAndWeight
              - WordSenseBuilder_OpenCorpus_ToTagged_CarriesTheLemmaAndFeaturesOfEveryToken

          - id: WordSense-WordSenseBuilder-TrainBasic-TenseClasses
            title: >-
              The builder shall take as a past example for the tense table a verb with Tense=Past, as a non-past
              example an infinitive, an imperative or a present of a person other than the third singular, and shall
              leave out the third person singular of the present, the gerund, the present participle and a token
              without features.
            tags: [unit]
            justification: |
              The third singular is spelled apart from the past, so it says nothing about the verbs that share a
              spelling; the gerund and the present participle are never spelled like a past.
            tests:
              - WordSenseBuilder_BasicTrainer_TenseClassOf_SeparatesPastFromTheFormsThatShareItsSpelling

          - id: WordSense-WordSenseBuilder-TrainBasic-TenseWeights
            title: >-
              The builder shall store for each hashed context feature of the tense table the log likelihood ratio of
              past against non-past in eighths of a nat, and the log odds of the two classes as the prior of the table.
            tags: [unit]
            justification: |
              The table is a naive Bayes model, and the runtime sums these numbers.
            tests:
              - WordSenseBuilder_BasicTrainer_TrainTense_LearnsTheContextOfPastAndNonPast

          - id: WordSense-WordSenseBuilder-TrainBasic-TrainSplitOnly
            title: >-
              The builder shall read no development or test split of the open corpus, of the representative or the
              targeted part, when it counts the tags (open-counts) and when it retrains the basic model (train-basic).
            tags: [unit]
            justification: |
              A table that has seen the development or the test sentences would make every reported accuracy and every
              choice of a setting dishonest.
            tests:
              - WordSenseBuilder_Program_TrainBasic_ReadsOnlyTheTrainSplit

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbTable
            title: >-
              The builder shall fit the shared noun/verb table of the basic model as the weights of a logistic
              regression of verb against noun over the hashed context features of each training word, with the log odds
              that the rest of the model gave the word as a fixed offset, so that a feature of words that the rest of
              the model got right gets a weight near 0 and a feature of words it got wrong gets a large one, and shall
              read no word list.
            tags: [unit]
            justification: |
              The tagger and the cue tables already read the neighbors of a word, so a table that learned the
              neighbors alone would count that evidence twice. Fitted against the odds of the rest of the model, the
              table learns only what that model gets wrong, and the weight of the model is near 1.
            tests:
              - WordSenseBuilder_NounVerbStacker_Fit_FeaturesOfTheClassesGetTheirSign
              - WordSenseBuilder_NounVerbStacker_Fit_LearnsOnlyWhatTheOffsetMisses
              - WordSenseBuilder_NounVerbStacker_Apply_FitsATableThatSeparatesTheNeighborWords
            children:
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbSamples
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbOutOfFold
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbCollisions
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbPenalty
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbVocabulary
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbDeterministic
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbNoFolds
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbArguments

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbSamples
            title: >-
              The builder shall use as the training words of the noun/verb table every word of the training split of the
              representative open corpus whose gold tag is noun or verb and that has a noun and a verb analysis in the
              lexicon, with its context features and its gold class.
            tags: [unit]
            justification: |
              Only a word that has both analyses poses the choice that the table settles.
            tests:
              - WordSenseBuilder_NounVerbStacker_Collect_OneSampleForEveryNounOrVerbWithBothAnalyses

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbOutOfFold
            title: >-
              The builder shall compute the offset of each training word of the noun/verb table with a model that has
              seen nothing of the fold of the word: the tagger counts and the running-text reliabilities of the cue
              tables come from the other folds alone, so that the offset depends on no gold tag of its own fold.
            tags: [unit]
            justification: |
              An offset that carried the answer of its own word would teach the table that the rest of the model is
              right, and the table would learn nothing of what it gets wrong.
            tests:
              - WordSenseBuilder_NounVerbStacker_Collect_OffsetsOfAFoldDoNotDependOnItsOwnGoldTags
              - WordSenseBuilder_NounVerbStacker_Collect_IgnoresTheReliabilitiesMeasuredOnTheWholeSplit

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbCollisions
            title: >-
              The builder shall count a weight of the noun/verb table once for each feature of a training word that has
              its hash when it fits the table, as the runtime adds the weight once for each extracted feature.
            tags: [unit]
            justification: |
              The table stores one weight per 16-bit hash; a fit that counted a shared hash once where the runtime
              counts it twice would score the same word differently in training and at run time.
            tests:
              - WordSenseBuilder_NounVerbStacker_Fit_CollidingFeaturesCountOnceEach

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbPenalty
            title: >-
              The builder shall shrink the weights of the noun/verb table toward 0 with the L2 penalty of the
              hyper-parameters, a larger penalty giving smaller weights.
            tags: [unit]
            justification: |
              The penalty is the setting that keeps the weights of rare contexts from fitting noise.
            tests:
              - WordSenseBuilder_NounVerbStacker_Fit_PenaltyShrinksTheWeights

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbVocabulary
            title: >-
              The builder shall give the noun/verb table only the features that occur in at least the minimum number of
              training words, and no table when no feature occurs often enough or when the training words are of one
              class.
            tags: [unit]
            justification: |
              A feature seen once is noise, and a table fitted on one class would only push every word toward it.
            tests:
              - WordSenseBuilder_NounVerbStacker_Fit_RareFeaturesAndOneClassGiveNothing

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbDeterministic
            title: >-
              The builder shall give equal training words and equal models the same noun/verb table and the same bytes.
            tags: [unit]
            justification: |
              The shipped table must be reproducible from the committed inputs.
            tests:
              - WordSenseBuilder_NounVerbStacker_Fit_IsDeterministic
              - WordSenseBuilder_NounVerbStacker_Apply_IsDeterministic

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbNoFolds
            title: >-
              The builder shall return the model as it is, without a noun/verb table, when the number of folds of the
              running-text measurement is less than two.
            tags: [unit]
            justification: |
              Without folds no word can be held out, and a table fitted on words the model has seen would be wrong.
            tests:
              - WordSenseBuilder_NounVerbStacker_Apply_WithoutFolds_ReturnsTheModelUnchanged

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbArguments
            title: >-
              The builder shall reject a null model, a null list of training words, a null list of samples and null
              hyper-parameters when it collects and fits the noun/verb table with an argument-null error.
            tags: [unit]
            justification: |
              Misuse must fail fast with the documented exception.
            tests:
              - WordSenseBuilder_NounVerbStacker_NullArguments_Throw

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbWritten
            title: >-
              The builder shall write the noun/verb table and the weight of the noun/verb model into the table of the
              basic model.
            tags: [unit]
            justification: |
              The runtime reads the table and the weight from the file.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_CarriesTheNounVerbTableAndWeight
            children:
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbNoSection
              - WordSense-WordSenseBuilder-TrainBasic-NounVerbWithCounts

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbNoSection
            title: >-
              The builder shall write no noun/verb section into the table of a model that has no noun/verb table.
            tags: [unit]
            justification: |
              A model without the table must load without one, so that the classifier leaves its words unchanged.
            tests:
              - WordSenseBuilder_BasicTablesWriter_Write_WithoutNounVerbTable_WritesNoNounVerbSection

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbWithCounts
            title: >-
              The builder shall leave the tense table and the noun/verb table out of a model that is given the tag
              counts of other sentences.
            tags: [unit]
            justification: |
              The running-text measurement of the cue tables trains the tagger on part of the split, so a table fitted
              on all of it must not leak into it.
            tests:
              - WordSenseBuilder_BasicTrainer_WithCounts_ReplacesTheStatisticsOnly

          - id: WordSense-WordSenseBuilder-TrainBasic-NounVerbGrid
            title: >-
              The builder shall ship hyper-parameters whose noun/verb weight and L2 penalty are values of the grids
              that the tuner scores, with the weights starting at the model turned off.
            tags: [unit]
            justification: |
              The shipped setting must be one that was scored on the development data.
            tests:
              - WordSenseBuilder_BasicHyperparameters_NounVerb_IsTuned

          - id: WordSense-WordSenseBuilder-TuneBasic
            title: >-
              The builder shall score a grid of basic-model hyperparameters on the development split of the
              representative open corpus and on the development subset of the anchor sentences only, print a stable
              table, write nothing, and never read the test splits, the targeted challenge set, the held-out or the
              real-text sentences.
            tags: [unit]
            justification: |
              Tuning on data that is also used for the final accuracy measurement would make the reported accuracy
              dishonest.
            children:
              - WordSense-WordSenseBuilder-TuneBasic-TenseWeight
              - WordSense-WordSenseBuilder-TuneBasic-NounVerbModel
              - WordSense-WordSenseBuilder-TuneBasic-ClauseSmoothing
              - WordSense-WordSenseBuilder-TuneBasic-TreebankDev
              - WordSense-WordSenseBuilder-TuneBasic-Sections
              - WordSense-WordSenseBuilder-TuneBasic-SectionsUnknown
              - WordSense-WordSenseBuilder-TuneBasic-WordPrior
              - WordSense-WordSenseBuilder-TuneBasic-WordPriorBaseline
              - WordSense-WordSenseBuilder-TuneBasic-NounVerb
              - WordSense-WordSenseBuilder-TuneBasic-ClosedOpen
              - WordSense-WordSenseBuilder-TuneBasic-StartingVerbs
            tests:
              - WordSenseBuilder_BasicHyperparameters_Default_IsConsistent
              - WordSenseBuilder_BasicTuner_SplitAnchors_IsDeterministicAndDisjoint
              - WordSenseBuilder_BasicTuner_ScoreTagger_CountsAmbiguousTokens
              - WordSenseBuilder_BasicTuner_RunAsync_MissingCounts_Throws

          - id: WordSense-WordSenseBuilder-TuneBasic-ClauseSmoothing
            title: >-
              The builder shall include the smoothing of the clause state among the hyper-parameters whose grid
              tune-basic scores, with the default value among the values of the grid.
            tags: [unit]
            justification: |
              The smoothing is a setting of the trained table, so it must be chosen on development data like the other
              hyper-parameters.
            tests:
              - WordSenseBuilder_BasicHyperparameters_ClauseSmoothing_IsTuned

          - id: WordSense-WordSenseBuilder-TuneBasic-Sections
            title: >-
              The builder shall let tune-basic run only the section of the grid, the tense weight, the word prior or the
              cue reliability that the caller names.
            tags: [unit]
            justification: |
              The sections differ in cost by an order of magnitude.
            tests:
              - WordSenseBuilder_Program_TuneBasic_SectionsPrior_RunsOnlyThePriorSection

          - id: WordSense-WordSenseBuilder-TuneBasic-SectionsUnknown
            title: >-
              The builder shall refuse a section of tune-basic that it does not know.
            tags: [unit]
            justification: |
              A misspelled section must not silently run nothing.
            tests:
              - WordSenseBuilder_BasicTuner_RunAsync_UnknownSection_Throws

          - id: WordSense-WordSenseBuilder-TuneBasic-WordPrior
            title: >-
              The builder shall score the values of the word prior, the number of tabled words and the target accuracy
              of the cue reliability on the development sets only.
            tags: [unit]
            justification: |
              The prior, the table size and the damping are settings of the trained table, so they are chosen on data
              that no reported figure is measured on.
            tests:
              - WordSenseBuilder_Program_TuneBasic_ScoresOnlyTheDevelopmentInputs

          - id: WordSense-WordSenseBuilder-TuneBasic-WordPriorBaseline
            title: >-
              The builder shall include the settings without the word prior in the grid of the word prior as its
              baseline.
            tags: [unit]
            justification: |
              A variant of the prior is worth keeping only if it beats the table without the prior on the same data.
            tests:
              - WordSenseBuilder_BasicHyperparameters_PriorGrid_HasTheBaseline

          - id: WordSense-WordSenseBuilder-TuneBasic-NounVerb
            title: >-
              The builder shall report the noun-verb accuracy of the classifier beside the accuracy of all and of the
              ambiguous tokens.
            tags: [unit]
            justification: |
              The noun-verb decision is the one that the word prior is meant to improve.
            tests:
              - WordSenseBuilder_TaggerEvaluator_EvaluateAsync_ScoresAnsweredWordTokens

          - id: WordSense-WordSenseBuilder-TuneBasic-ClosedOpen
            title: >-
              The builder shall report the accuracy of the words that have both a closed-class and an open-class
              analysis.
            tags: [unit]
            justification: |
              A prior built from the open-class counts of WordNet could do harm to these words, so each variant must
              show them.
            tests:
              - WordSenseBuilder_TaggerEvaluator_EvaluateAsync_CountsClosedAndOpenWords

          - id: WordSense-WordSenseBuilder-TuneBasic-StartingVerbs
            title: >-
              The builder shall report the accuracy of the verbs that start a sentence before a determiner.
            tags: [unit]
            justification: |
              A prior built from the open-class counts of WordNet could do harm to these verbs, so each variant must
              show them.
            tests:
              - WordSenseBuilder_TaggerEvaluator_EvaluateAsync_CountsStartingVerbs

          - id: WordSense-WordSenseBuilder-TuneBasic-TreebankDev
            title: >-
              The builder shall score the whole classifier of each variant of the grid on the development file of the
              treebank when it exists, and shall read no other file of the treebank while tuning.
            tags: [unit]
            justification: |
              The rule and the smoothing of the clause state change the part of speech of running text, so they are
              chosen on development data of running text that no reported figure is measured on.
            tests:
              - WordSenseBuilder_Program_TuneBasic_ScoresOnlyTheDevelopmentInputs

          - id: WordSense-WordSenseBuilder-TuneBasic-TenseWeight
            title: >-
              The builder shall score each weight of the tense model on the development split of the representative
              open corpus and the development file of the treebank only (a model trained from the training split), and
              shall never read the test file or the training file of the treebank or a test split of the open corpus
              while tuning.
            tags: [unit]
            justification: |
              The weight is a setting, so it must be chosen on data that no reported figure is measured on.
            tests:
              - WordSenseBuilder_Program_TuneBasic_ScoresOnlyTheDevelopmentInputs

          - id: WordSense-WordSenseBuilder-TuneBasic-NounVerbModel
            title: >-
              The builder shall score each L2 penalty and each weight of the noun/verb model on the development split of
              the representative open corpus and the development file of the treebank only (a model trained from the
              training split), when the section nounverb is named or no section is named, and shall print the scores of
              that section alone when only it is named.
            tags: [unit]
            justification: |
              The penalty and the weight are settings, so they must be chosen on data that no reported figure is
              measured on.
            tests:
              - WordSenseBuilder_Program_TuneBasic_SectionsNounVerb_RunsOnlyTheNounVerbSection
              - WordSenseBuilder_Program_TuneBasic_ScoresOnlyTheDevelopmentInputs

          - id: WordSense-WordSenseBuilder-EvaluateTagger
            title: >-
              The builder shall measure the part-of-speech accuracy of the basic classifier on the test split of the
              representative open corpus as the headline, report the test split of the targeted challenge set on its own
              line and an optional external gold file (the convention-mapped development and test files of a treebank
              that is downloaded for evaluation only) as a further line, with the share of ambiguous tokens, the
              tokens that are not answered and the tokens that are excluded, and print a stable table.
            tags: [unit]
            justification: |
              The accuracy of a tagger is only meaningful on running text that no count, threshold or weight has seen;
              the deliberately chosen challenge sentences must never be merged into the headline, and the external
              treebank is an evaluation source only: it is never committed and never trains anything.
            tests:
              - WordSenseBuilder_TaggerEvaluator_EvaluateAsync_ScoresAnsweredWordTokens
              - WordSenseBuilder_TaggerEvaluator_ReadGold_GroupsTokensBySentence
              - WordSenseBuilder_TaggerEvaluator_ReadGold_SixColumns_CarriesLemmaTagAndFeatures
              - WordSenseBuilder_TaggerEvaluator_ReadGold_MalformedLine_Throws
              - WordSenseBuilder_TaggerEvaluator_Render_FormatsRows

          - id: WordSense-WordSenseBuilder-CorpusLicenses
            title: >-
              The committed training corpus shall contain only sentences whose provenance source is one of the allowed
              sources, defined in one place (real text that is CC0 1.0 or public domain in the United States, and
              sentences written for the project and dedicated to CC0 1.0), shall record a provenance row with the
              columns id, split, source and source key for every sentence of the sense, chooser and real-text files, and
              shall contain no treebank data and no retired class-labeled corpus.
            tags: [unit]
            justification: |
              The shipped data must be free of share-alike and attribution-bound text, and a sentence of unknown origin
              cannot be shown to be free. The licence of a sentence follows from its source, so one list of allowed
              sources is the gate, and the evidence for each source is documented with the corpus. The treebank is used
              for evaluation only, so it must not be in the corpus.
            tests:
              - WordSenseBuilder_CorpusLicenses_Provenance_NamesOnlyAllowedSources
              - WordSenseBuilder_CorpusLicenses_ProvenanceSources_AllowsOnlyTheListedSources
              - WordSenseBuilder_CorpusLicenses_EverySentenceRow_HasProvenance
              - WordSenseBuilder_CorpusLicenses_Corpus_HasNoTreebankDataAndNoLegacyFolders

          - id: WordSense-WordSenseBuilder-Hyperparameters
            title: >-
              The builder shall keep all hyperparameters of the basic model in one place, with one consistent
              default set used by training and tuning.
            tags: [unit]
            justification: |
              A single definition prevents the trained model and the tuned grid from drifting apart.
            tests:
              - WordSenseBuilder_BasicHyperparameters_Default_IsConsistent

          - id: WordSense-WordSenseBuilder-Appendix
            title: >-
              The builder shall generate the senses appendix of the user guide deterministically from the sense
              catalog of the data (each trained lemma's senses with id, group, OEWN sense key and gloss), the forms of
              each lemma (every analysis of every form, the forms spelled like the lemma included, with the features),
              the explanation of the keys and the heteronym section, and the anchor sentences, shall reject incomplete
              input, and the committed appendix shall equal the generated one.
            tags: [unit]
            justification: |
              The list of supported lemmas with their senses, groups, keys and forms must always describe
              the trained corpus; generating it, and failing when the committed file is stale, makes drift impossible.
              A form spelled like its lemma (the past tense read) and the features tell the forms of one lemma apart.
            tests:
              - WordSenseBuilder_Appendix_Generate_ListsLemmasSensesAndForms
              - WordSenseBuilder_Appendix_Generate_ListsSensesWithGroupKeyAndGloss
              - WordSenseBuilder_Appendix_Generate_RejectsIncompleteInput
              - WordSenseBuilder_Program_Appendix_WritesFile
              - WordSenseBuilder_Program_Appendix_MissingCorpus_Fails
              - WordSenseBuilder_Appendix_Committed_MatchesCorpus

          - id: WordSense-WordSenseBuilder-Keys
            title: >-
              The builder shall provide the command keys --output FILE that writes every key of WordLexicon.Keys as
              UTF-8 text without a byte-order mark, one key for each line in ordinal order after a header comment line
              that gives the key format, the inventory version of the lexicon and the number of keys, and shall require
              the output option.
            tags: [unit]
            justification: |
              A downstream library builds its map from a file of all keys; the file is large and is generated where
              it is needed, so the command is the contract, and the version in the header says which inventory it
              lists.
            tests:
              - WordSenseBuilder_KeyExport_Render_SortsTheKeysAfterTheHeader
              - WordSenseBuilder_KeyExport_Write_ListsEveryKeyOfTheLexicon
              - WordSenseBuilder_Program_Keys_WritesTheKeyFile

          - id: WordSense-WordSenseBuilder-Heteronyms-EntryLevel
            title: >-
              The builder shall derive the entry level of the heteronyms (spellings whose analyses belong to entries of
              one lemma that sound different) from the normalized pronunciations of the entries of the data, in which a
              stress difference counts and the dialect differences, syllable marks and length marks do not, and shall
              leave a lemma and part of speech whose senses fall into different sound classes to the sense level.
            tags: [unit]
            justification: |
              What the pronunciations of the data can show needs no curation, and deriving it keeps it from drifting.
            tests:
              - WordSenseBuilder_Heteronyms_NormalizePronunciation_IgnoresDialectButNotStress
              - WordSenseBuilder_Heteronyms_Build_ListsTheKnownHeteronymsOfEachLevel

          - id: WordSense-WordSenseBuilder-Heteronyms-Curated
            title: >-
              The builder shall derive the tense level, the sense level and the cases of different lemmas of the
              heteronyms from the curated table corpus/curation/heteronyms.tsv (rows of level, group, class and a
              pattern lemma/Part[/Features][#label,label], with an optional note of the group), as classes of
              normalized spellings.
            tags: [unit]
            justification: |
              The sounds of these spellings are not in the data, so a curator names the classes by meaning; the table
              carries a note where the classes are merged in some dialects.
            tests:
              - WordSenseBuilder_Heteronyms_Build_ListsTheKnownHeteronymsOfEachLevel
              - WordSenseBuilder_Heteronyms_Build_ClassesCarryTheKeys
              - WordSenseBuilder_Heteronyms_Build_ReflectsTheLexicographerReview
              - WordSenseBuilder_Heteronyms_Build_NotesBelongToTheirGroup

          - id: WordSense-WordSenseBuilder-Heteronyms-Keys
            title: >-
              Every class of a heteronym shall list the keys that belong to it and no phoneme, and every key of the
              heteronym table shall be a key of WordLexicon.Keys that is spelled like its heteronym and listed once.
            tags: [unit]
            justification: |
              A downstream library maps keys to its own data, so the table must name keys that a model can return.
            tests:
              - WordSenseBuilder_Heteronyms_Build_ClassesCarryTheKeys
              - WordSenseBuilder_Heteronyms_Build_EveryKeyIsAKeyOfTheLexicon

          - id: WordSense-WordSenseBuilder-Heteronyms-Validation
            title: >-
              The builder shall report, with every problem found, a curated heteronym table that is missing, has a
              malformed row, an unknown level, a pattern that is not one or a label that the sense catalog does not
              have, a group with fewer than two classes or with two different notes, a key that two classes claim, or
              a group that matches no spelling.
            tags: [unit]
            justification: |
              A curated table that does not match the data would give wrong classes silently.
            tests:
              - WordSenseBuilder_Heteronyms_Build_InvalidCuratedTable_IsReported

          - id: WordSense-WordSenseBuilder-Heteronyms-Coverage
            title: >-
              The curated heteronym table shall list at the sense level every lemma whose senses the pronunciations of
              the data split into different sound classes, except the lemmas that the lexicographer review rejected
              (recorded in the curation README and in the test that checks it).
            tags: [unit]
            justification: |
              The curated table cannot fall behind the pronunciations of the data, and a rejected lemma is recorded
              rather than silently missing.
            tests:
              - WordSenseBuilder_Heteronyms_SenseSplitLemmas_AreCurated

          - id: WordSense-WordSenseBuilder-Heteronyms-Tsv
            title: >-
              The builder shall provide the command heteronyms --output FILE that writes the heteronym table as UTF-8
              text without a byte-order mark and with LF line ends: a header row, then one row of level, group,
              spelling, class, key and note for each key of a class.
            tags: [unit]
            justification: |
              A downstream library loads this file to know where the key, not the spelling, decides the word.
            tests:
              - WordSenseBuilder_Heteronyms_RenderTsv_WritesOneRowForEachKey
              - WordSenseBuilder_Heteronyms_Build_NotesBelongToTheirGroup
              - WordSenseBuilder_Program_Heteronyms_WritesTheTable

          - id: WordSense-WordSenseBuilder-Corpus
            title: >-
              The builder shall validate the corpus format (a lemma, a sense id, a part of speech and a sentence for
              every row), the agreement of the part of speech of a row with its sense, and, by normalized sentence, the
              disjointness of the training sentences (the anchors, the chooser anchors and the training split of the
              open corpus) from the held-out, chooser held-out, real-text and suite sentences, the development and test
              splits and the challenge set of the open corpus, the independent evaluation sentences and the example
              sentences of Open English WordNet, and of those evaluation sentences from each other; it shall report the
              sentences that two parts share and a run of eight words that they share, and fail when a sentence is
              shared by a training part and an evaluation part, by two evaluation parts, or by the corpus and a
              dictionary example of five words or more.
            tags: [unit]
            justification: |
              Leaked or malformed sentences invalidate the accuracy measurement, and a row whose part of speech
              disagrees with its sense is a labeling error that would train a wrong answer. A sentence of the CC0 corpus
              that is a CC BY dictionary example would break the license of the corpus.
            tests:
              - WordSenseBuilder_Corpus_ReadSentences_ParsesRow
              - WordSenseBuilder_Corpus_ReadSentences_RejectsMalformedRow
              - WordSenseBuilder_Corpus_ReadSentences_PartOfSpeechDisagreeingWithSense_IsRejected
              - WordSenseBuilder_Corpus_DirectoryAndDisjointness
              - WordSenseBuilder_Corpus_Leakage_TrainingSentenceInAnEvaluationPart_IsALeak
              - WordSenseBuilder_Corpus_Leakage_OnlyRealLeaksFail
              - WordSenseBuilder_Corpus_Leakage_SharedRunOfWords_IsInformational
              - WordSenseBuilder_Corpus_Disjointness_CoversSuiteEvaluationAndOewnExamples
              - WordSenseBuilder_Program_CheckLeakage_ExitsWithOneOnALeak
              - WordSenseBuilder_Corpus_ReadSentences_SplitsCompoundTarget

          - id: WordSense-WordSenseBuilder-SenseEval
            title: >-
              The builder shall measure a model on SemCor 3.0, downloaded to a cache that is not part of the repository
              after verifying its pinned checksum and never committed, with the WordNet 3.0 sense keys mapped to the
              senses of the catalog, leaving out a sentence that is also in the corpus or is an example of Open English
              WordNet, and report for the words of the trained lemmas the mapping coverage, the share answered at each
              level, the precision at each level, the accuracy of the most probable sense and of its group, the
              part-of-speech accuracy and the accuracy of the first-sense baseline (the first sense in Open English
              WordNet order, which is partly circular because it follows WordNet's counts, which include SemCor).
            tags: [unit]
            justification: |
              SemCor is human-annotated running text that no training or tuning step reads, so figures measured on it
              are the honest published accuracy; reporting them per level and against the baseline shows what the
              model adds, and the mapping coverage says how much of SemCor the figures describe.
            tests:
              - WordSenseBuilder_SenseEval_Parse_ReadsSingleWordAnnotationsAndCountsTheRest
              - WordSenseBuilder_SenseEval_MapKeys_WordNet30KeyToOewnSense
              - WordSenseBuilder_SenseEval_Run_ReportsShareAndPrecisionPerLevelAndBaseline
              - WordSenseBuilder_SenseEval_Render_FormatsTheFunnel
              - WordSenseBuilder_SenseEval_Download_WrongHash_IsRejected
              - WordSenseBuilder_SenseEval_ReadArchive_VerifiesTheHashAndReadsTheTagFiles
              - WordSenseBuilder_Program_EvaluateSenses_WithoutCache_ReportsUsage

          - id: WordSense-WordSenseBuilder-SenseEvalAllWords
            title: >-
              The builder shall, in the SemCor evaluation, select as the all-words set every mapped single-word
              annotation whose lemma is trained or, when untrained, has at least two senses in the catalog over all
              parts of speech, and shall count the words of an untrained lemma with one sense without measuring them.
            tags: [unit]
            justification: |
              The trained lemmas are a small part of running text; a figure that covers only them says nothing about
              the other ambiguous words. A word of an untrained lemma with one sense is answered at the sense level by
              every model and would only inflate the figures, so it is counted and left out.
            tests:
              - WordSenseBuilder_SenseEval_Select_AllWords_KeepsUntrainedPolysemousAndCountsTheRest

          - id: WordSense-WordSenseBuilder-SenseEvalAllWordsFigures
            title: >-
              The builder shall report, for each model, the share of the all-words set answered at the sense level,
              the precision of those answers and the fine top-1, separately for the words of trained lemmas, of
              untrained lemmas and of both, counting a word without ranked senses as a miss of the fine top-1.
            tags: [unit]
            justification: |
              The split shows how much of the all-words figure the trained lemmas carry and what a model gives for the
              lemmas it was not trained for; a word without ranked senses has no most probable sense, so it cannot be
              right at the fine top-1.
            tests:
              - WordSenseBuilder_SenseEval_Run_UntrainedLemma_CountsNoSenseAnswerAndFineTop1FromRankedSenses
              - WordSenseBuilder_SenseEval_Render_AllWords_ShowsTrainedShareAndCircularityCaveat

          - id: WordSense-WordSenseBuilder-SenseEvalAllWordsBaseline
            title: >-
              The builder shall report, for the all-words set, the accuracy of the most-frequent-sense baseline that
              chooses the sense of the gold lemma and part of speech with the highest WordNet 3.0 tag count (the first
              in inventory order on a tie), and shall state that the baseline is optimistic because those counts
              include SemCor.
            tags: [unit]
            justification: |
              A baseline gives the model figures a reference; labeled as circular, it is read as a reference and not
              as a competitor.
            tests:
              - WordSenseBuilder_SenseEval_Run_TagCountBaseline_UsesTheHighestCountAndInventoryOrderOnTies
              - WordSenseBuilder_SenseEval_Render_AllWords_ShowsTrainedShareAndCircularityCaveat

          - id: WordSense-WordSenseBuilder-SenseEvalAllWordsCircular
            title: >-
              The builder shall state, in the all-words section of the SemCor report, that the fine top-1 of the models
              on the untrained words is circular because their usage prior is made of the WordNet 3.0 tag counts that
              include SemCor, and shall point to the all-words gold set as the independent measurement.
            tags: [unit]
            justification: |
              A figure that a prior made from the answers produces must not be read as accuracy; the report says what
              the number shows (that the prior is applied) and where the honest measurement is.
            tests:
              - WordSenseBuilder_SenseEval_Render_AllWords_ShowsTrainedShareAndCircularityCaveat

          - id: WordSense-WordSenseBuilder-AllWordsGold
            title: >-
              The committed all-words gold set (corpus/allwords/dev.tsv and test.tsv) shall consist of tokens of
              untrained lemmas whose part of speech has two or more senses, each naming a sense of its lemma and part of
              speech and a word that is at its index.
            tags: [unit]
            justification: |
              SemCor cannot measure a prior that is made of its own counts; a gold set of tokens that no model was
              trained for, each with a sense that its lemma can have, can.
            tests:
              - WordSenseBuilder_AllWords_CommittedGold_TokensAreOfUntrainedPolysemousLemmasWithTheirSense

          - id: WordSense-WordSenseBuilder-AllWordsGold-Cardinality
            title: >-
              The committed all-words gold set shall have at most three tokens for a lemma and at most one for a
              sentence.
            tags: [unit]
            justification: |
              The cap on a lemma keeps the set spread over many lemmas and the cap on a sentence keeps one context from
              counting twice.
            tests:
              - WordSenseBuilder_AllWords_CommittedGold_HasAtMostThreeTokensPerLemmaAndOnePerSentence

          - id: WordSense-WordSenseBuilder-AllWordsGold-Splits
            title: >-
              The development half of the all-words gold set shall have tokens of the development split only, and the
              test half tokens of the test split only, of the representative open corpus.
            tags: [unit]
            justification: |
              One half chooses the smoothing constant and the other only reports, so each must come from its own split.
            tests:
              - WordSenseBuilder_AllWords_CommittedGold_TokensComeFromTheirOwnSplit

          - id: WordSense-WordSenseBuilder-AllWordsGold-Independence
            title: >-
              The two halves of the all-words gold set shall share no document.
            tags: [unit]
            justification: |
              Sentences of one document are alike; with a document in both halves the constant chosen on one half would
              flatter the figure of the other.
            tests:
              - WordSenseBuilder_AllWords_CommittedGold_HalvesShareNoDocument

          - id: WordSense-WordSenseBuilder-AllWordsGold-Columns
            title: >-
              The all-words gold reader shall reject a line that does not have the columns of the format, naming the
              file and the line.
            tags: [unit]
            justification: |
              A damaged file must fail loudly instead of being read as other data.
            tests:
              - WordSenseBuilder_AllWords_Gold_WrongNumberOfColumns_IsRejected

          - id: WordSense-WordSenseBuilder-AllWordsGold-Index
            title: >-
              The all-words gold reader shall reject a line whose word is not at its index, an index past the end of the
              sentence and a negative index included, with an InvalidDataException that names the file and the line.
            tags: [unit]
            justification: |
              The index names the token that the gold sense belongs to; a wrong or out-of-range index must be a data
              error and never an indexing failure.
            tests:
              - WordSenseBuilder_AllWords_Gold_WordNotAtItsIndex_IsRejected
              - WordSenseBuilder_AllWords_Gold_IndexOutsideTheSentence_IsRejected

          - id: WordSense-WordSenseBuilder-AllWordsGold-Agreement
            title: >-
              The all-words gold reader shall reject a line whose agreement is not high or low, naming the file and the
              line.
            tags: [unit]
            justification: |
              The agreement states the confidence of the labelers and has two values only.
            tests:
              - WordSenseBuilder_AllWords_Gold_AgreementNotHighOrLow_IsRejected

          - id: WordSense-WordSenseBuilder-AllWordsGold-Sense
            title: >-
              The all-words gold reader shall reject a line whose sense is not a sense of its lemma and part of speech,
              naming the file and the line.
            tags: [unit]
            justification: |
              A gold sense that the lemma cannot have would count every model wrong for the wrong reason.
            tests:
              - WordSenseBuilder_AllWords_Gold_SenseOfAnotherLemma_IsRejected

          - id: WordSense-WordSenseBuilder-AllWordsDraw
            title: >-
              The builder shall draw the tokens of the gold set reproducibly from a seed: the same seed shall give the
              same tokens.
            tags: [unit]
            justification: |
              A reproducible draw lets a reviewer repeat the sampling and check the set.
            tests:
              - WordSenseBuilder_AllWords_Draw_IsReproducibleFromTheSeed

          - id: WordSense-WordSenseBuilder-AllWordsDraw-Eligible
            title: >-
              The builder shall draw only the nouns, verbs, adjectives and adverbs of the representative open corpus
              whose lemma is not trained, whose part of speech has two or more senses and whose written form the lexicon
              lists with that lemma and part of speech.
            tags: [unit]
            justification: |
              Only a token of an untrained polysemous lemma tests the prior, and a token whose form the lexicon cannot
              analyze as its lemma could not be answered by any model.
            tests:
              - WordSenseBuilder_AllWords_Draw_TokensAreEligible

          - id: WordSense-WordSenseBuilder-AllWordsDraw-Limits
            title: >-
              The builder shall draw at most the given number of tokens for a lemma and at most one for a sentence.
            tags: [unit]
            justification: |
              Drawing tokens at random from running text weights the words by their frequency; the cap on a lemma keeps
              the sample spread over many lemmas.
            tests:
              - WordSenseBuilder_AllWords_Draw_RespectsTheLimitsOfLemmaAndSentence

          - id: WordSense-WordSenseBuilder-AllWordsLabeling
            title: >-
              The builder shall write the labeling batches with a group for every lemma and part of speech of the
              tokens, listing every sense of it (id, part of speech and gloss) in the order of the ids.
            tags: [unit]
            justification: |
              The labelers must not see the frequency order, which is the order of the inventory, or the gold would
              follow the prior.
            tests:
              - WordSenseBuilder_AllWords_Batches_ListEverySenseInTheOrderOfTheIds

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-NoCounts
            title: >-
              The labeling batches of the builder shall show no WordNet 3.0 tag count.
            tags: [unit]
            justification: |
              The counts are what the prior is made of; a labeler that saw them would follow the prior.
            tests:
              - WordSenseBuilder_AllWords_Batches_HaveNoTagCount

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-Agreement
            title: >-
              The builder shall keep in the gold set a token for which both of two independent labelers chose the same
              sense, whether or not both were highly confident, and shall drop a token for which they chose different
              senses.
            tags: [unit]
            justification: |
              Two independent labelers and their agreement are the check on the gold.
            tests:
              - WordSenseBuilder_AllWords_Merge_KeepsTheTokensBothLabelersAgreeOn
              - WordSenseBuilder_AllWords_Merge_Disagreement_DropsTheToken

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-Unsure
            title: >-
              The builder shall drop from the gold set a token that either labeler answered as unsure or did not answer.
            tags: [unit]
            justification: |
              A token whose sense a labeler could not tell has no reliable gold sense.
            tests:
              - WordSenseBuilder_AllWords_Merge_UnsureAnswer_DropsTheToken
              - WordSenseBuilder_AllWords_Merge_MissingAnswerLine_DropsTheToken

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-WrongSense
            title: >-
              The builder shall fail the merge of the answers when a labeler chose a sense that the token cannot have.
            tags: [unit]
            justification: |
              A sense of another lemma is a mistake of the labeler or of the file, and must not enter the gold.
            tests:
              - WordSenseBuilder_AllWords_Merge_WrongSense_Fails

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-MissingFile
            title: >-
              The builder shall fail the merge of the answers when the answer file of a labeler is missing.
            tags: [unit]
            justification: |
              A missing file would otherwise count as a labeler that answered nothing.
            tests:
              - WordSenseBuilder_AllWords_Merge_MissingAnswerFile_Fails

          - id: WordSense-WordSenseBuilder-AllWordsLabeling-Report
            title: >-
              The builder shall report the agreement of the labelers: the tokens sampled, answered by both, agreed on,
              agreed on with a high confidence by both, and answered unsure by each, and the share of the agreement.
            tags: [unit]
            justification: |
              The agreement is the evidence of the quality of the gold and is published with it.
            tests:
              - WordSenseBuilder_AllWords_Merge_ReportsTheAgreement

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation
            title: >-
              The builder shall measure each model on each half of the all-words gold set separately and report the
              counts of both halves.
            tags: [unit]
            justification: |
              The halves are different documents; one chooses the constant and the other only reports, so their figures
              are never pooled.
            tests:
              - WordSenseBuilder_Program_EvaluateAllWords_ReportsTheModelOnEachHalf

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-Levels
            title: >-
              The all-words measurement shall report the tokens answered at each level (sense, group and part of
              speech) and those of a word that the lexicon does not know.
            tags: [unit]
            justification: |
              The share of the answers at each level shows that the ranking is not an answer: they are those of the
              other evaluations.
            tests:
              - WordSenseBuilder_AllWords_Measure_CountsTheTokensAnsweredAtEachLevel

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-Precision
            title: >-
              The all-words measurement shall report the precision of the sense answers: the share of the tokens
              answered at the sense level whose answered sense is the gold sense.
            tags: [unit]
            justification: |
              The precision at the sense level is the figure of the other evaluations and must not move with the
              ranking.
            tests:
              - WordSenseBuilder_AllWords_Measure_ReportsThePrecisionOfTheSenseAnswers

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-FineTop1
            title: >-
              The all-words measurement shall count a token as a fine top-1 hit when the first ranked sense of the
              selected analysis is the gold sense.
            tags: [unit]
            justification: |
              The fine top-1 of the selected analysis is the new figure that the ranking changes.
            tests:
              - WordSenseBuilder_AllWords_Measure_FineTop1CountsTheFirstRankedSenseOfTheSelectedAnalysis

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-NoRanking
            title: >-
              The all-words measurement shall count as a fine top-1 miss a token whose selected analysis ranks no sense.
            tags: [unit]
            justification: |
              A model that ranks nothing has not found the sense, so it is not credited with it.
            tests:
              - WordSenseBuilder_AllWords_Measure_SelectedAnalysisWithoutRanking_IsAMiss

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-WrongAnalysis
            title: >-
              The all-words measurement shall count as a fine top-1 miss a token whose selected analysis is not the gold
              lemma and part of speech, whatever the other analyses rank.
            tags: [unit]
            justification: |
              A wrong analysis ranks the senses of another lemma or part of speech, and the ranking of an analysis that
              was not selected is not the answer of the model.
            tests:
              - WordSenseBuilder_AllWords_Measure_WrongSelectedAnalysis_IsAMiss

          - id: WordSense-WordSenseBuilder-AllWordsBaselines
            title: >-
              The builder shall report on each half of the all-words gold set the accuracy of the first sense in
              inventory order, told the gold lemma and part of speech.
            tags: [unit]
            justification: |
              The baselines give the model figures a reference; they do not pay for a wrong analysis, so they are an
              upper reference for the models.
            tests:
              - WordSenseBuilder_AllWords_Baselines_FirstSenseIsTheFirstInInventoryOrder

          - id: WordSense-WordSenseBuilder-AllWordsBaselines-TagCount
            title: >-
              The builder shall report on each half of the all-words gold set the accuracy of the sense with the highest
              WordNet 3.0 tag count (the first in inventory order on a tie), told the gold lemma and part of speech.
            tags: [unit]
            justification: |
              The most frequent sense is the reference that a usage prior has to match or beat.
            tests:
              - WordSenseBuilder_AllWords_Baselines_TagCountIsTheHighestCountWithInventoryOrderOnATie

          - id: WordSense-WordSenseBuilder-AllWordsBaselines-Random
            title: >-
              The builder shall report on each half of the all-words gold set the accuracy of a random sense, the mean
              of one over the number of senses of the gold lemma and part of speech.
            tags: [unit]
            justification: |
              The random sense is the floor that any ranking has to clear.
            tests:
              - WordSenseBuilder_AllWords_Baselines_RandomIsOneOverTheNumberOfSenses

          - id: WordSense-WordSenseBuilder-AllWordsBaselines-Report
            title: >-
              The all-words evaluation command shall report the three baselines on each half.
            tags: [unit]
            justification: |
              The figures of a model are read against the baselines of the same half.
            tests:
              - WordSenseBuilder_Program_EvaluateAllWords_ReportsTheBaselinesOnEachHalf

          - id: WordSense-WordSenseBuilder-AllWordsSmoothing
            title: >-
              The builder shall report the mean log loss of the gold sense under the usage prior for a grid of
              smoothing constants.
            tags: [unit]
            justification: |
              The ranking does not depend on the constant, so the choice only sets the probabilities, and the log loss
              of the gold sense is the measure for that.
            tests:
              - WordSenseBuilder_AllWords_Sweep_ReportsTheMeanLogLossOfTheGoldSense

          - id: WordSense-WordSenseBuilder-AllWordsSmoothing-DevOnly
            title: >-
              The all-words evaluation command shall report the smoothing sweep on the development half only.
            tags: [unit]
            justification: |
              Tuning on the test half would make its figure optimistic; the constant is chosen on the development half
              and the test half is only reported.
            tests:
              - WordSenseBuilder_Program_EvaluateAllWords_ReportsTheSweepOnTheDevelopmentHalfOnly

          - id: WordSense-WordSenseBuilder-AllWordsEvaluation-NoGold
            title: >-
              The all-words evaluation command shall fail with a message when the gold set is not in the corpus
              directory.
            tags: [unit]
            justification: |
              An evaluation of an absent gold set would report nothing and look like success.
            tests:
              - WordSenseBuilder_Program_EvaluateAllWords_WithoutGoldSet_Fails

          - id: WordSense-WordSenseBuilder-AllWordsLeakage
            title: >-
              The leakage check shall include the two halves of the all-words gold set.
            tags: [unit]
            justification: |
              The gold set is evaluation data; no training may read it, so it is checked with the other parts.
            tests:
              - WordSenseBuilder_Corpus_Disjointness_CoversSuiteEvaluationAndOewnExamples

          - id: WordSense-WordSenseBuilder-AllWordsLeakage-View
            title: >-
              The leakage check shall treat each half of the all-words gold set as a view of the split of the open
              corpus it is drawn from, so that the same sentences are no leak.
            tags: [unit]
            justification: |
              The gold sentences are sentences of the open corpus by design.
            tests:
              - WordSenseBuilder_Corpus_Leakage_AllWordsGold_IsAViewOfItsOpenSplit

          - id: WordSense-WordSenseBuilder-AllWordsLeakage-Training
            title: >-
              The leakage check shall report as a leak a sentence of the all-words gold set that a training part also
              has.
            tags: [unit]
            justification: |
              A model that trained on a gold sentence would be measured on its training data.
            tests:
              - WordSenseBuilder_Corpus_Leakage_AllWordsGoldSentenceInATrainingPart_IsALeak

          - id: WordSense-WordSenseBuilder-AllWordsLeakage-OtherSplit
            title: >-
              The leakage check shall report as a leak a sentence of a half of the all-words gold set that the other
              split of the open corpus has.
            tags: [unit]
            justification: |
              A half must not contain a sentence of the other split, or the halves would not be independent.
            tests:
              - WordSenseBuilder_Corpus_Leakage_AllWordsGoldSentenceOfTheOtherSplit_IsALeak

          - id: WordSense-WordSenseBuilder-RunningText
            title: >-
              The builder shall measure the part-of-speech accuracy of every model through its public interface on the
              test split of the representative open corpus (the headline), on the test file of the Universal
              Dependencies English-EWT corpus after the preparation script has verified its checksum and mapped its
              tags to the parts of speech of the library by a published convention (the development file being the one
              used for selection, never the one measured), and on the challenge set on its own line, report the
              accuracy on all tokens and on the ambiguous tokens, the tokens that are not answered and the tokens that
              the convention excludes, and keep each model above a recorded floor on the challenge set.
            tags: [unit]
            justification: |
              Part-of-speech accuracy on independent running text is the published measure for the models that answer
              at the part of speech level; a stated convention and the report of what it excludes keep the figure
              comparable and honest, and a floor on the challenge set keeps a model from regressing on its hard cases.
            tests:
              - WordSenseBuilder_RunningText_DefaultGold_IsTheTestFileAndNotTheDevelopmentFile
              - WordSenseBuilder_RunningText_Load_ReadsTheSetsAndNotesAMissingGoldFile
              - WordSenseBuilder_RunningText_Run_ReportsAllAndAmbiguousTokensForAModel
              - WordSenseBuilder_Program_EvaluateRunning_Basic_PrintsTableAndWritesTheCells
              - WordSenseBuilder_ChallengeSet_Basic_StaysAboveItsFloor
              - WordSenseBuilder_ChallengeSet_MiniLM_StaysAboveItsFloor
              - WordSenseBuilder_ChallengeSet_BertBaseCased_StaysAboveItsFloor

          - id: WordSense-WordSenseBuilder-TenseEvaluation
            title: >-
              The builder shall measure how well every model tells the tense of the verbs whose past and non-past
              share a spelling, through its public interface, as the child requirements state. The child requirements
              use these terms: a past analysis is a verb analysis with Tense=Past or VerbForm=Part, a non-past analysis
              is any other analysis, and a same-spelling verb is a gold verb token whose form has a past analysis and a
              non-past analysis among its verb analyses in the lexicon.
            tags: [unit]
            justification: |
              The tense of a verb is part of its analysis, so the analysis is wrong when the tense is; the figure is
              only meaningful against the majority baseline, on independent text, with the development sets kept for
              choosing settings, and the pooled treebank figure has enough tokens to see a difference of a few points.
              A parent requirement carries the terms once; the child requirements state each behavior that can be
              tested on its own.
            children:
              - WordSense-WordSenseBuilder-TenseEvaluation-Eligibility
              - WordSense-WordSenseBuilder-TenseEvaluation-Groups
              - WordSense-WordSenseBuilder-TenseEvaluation-GoldClass
              - WordSense-WordSenseBuilder-TenseEvaluation-Metrics
              - WordSense-WordSenseBuilder-TenseEvaluation-Sets
              - WordSense-WordSenseBuilder-TenseEvaluation-Pooling
              - WordSense-WordSenseBuilder-TenseEvaluation-Report
              - WordSense-WordSenseBuilder-TenseEvaluation-Cli

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Eligibility
            title: >-
              The builder shall score only the gold verb tokens whose form is a same-spelling verb (as defined in
              WordSense-WordSenseBuilder-TenseEvaluation), looking the form up case-insensitively, and shall leave out
              a token that the gold source does not call a verb and a form with no past or no non-past verb analysis.
            tags: [unit]
            justification: |
              Only the verbs that share a spelling between the classes test the model; a form that has one class
              cannot be wrong.
            tests:
              - WordSenseBuilder_TenseEvaluator_GroupsOf_ClassifiesTheSurfaceForm
              - WordSenseBuilder_TenseEvaluator_RunAsync_ScoresTheConfusionOfPastAgainstNonPast

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Groups
            title: >-
              The builder shall report each scored token in the group of all same-spelling verbs, in the group of the
              forms whose past and non-past analyses share a lemma when they do, and in the group of the forms of read
              and its prefixed compounds (and not of spread) when they are.
            tags: [unit]
            justification: |
              A split inside a slot decides only the forms of one lemma, and read is the textbook case.
            tests:
              - WordSenseBuilder_TenseEvaluator_GroupsOf_ClassifiesTheSurfaceForm

          - id: WordSense-WordSenseBuilder-TenseEvaluation-GoldClass
            title: >-
              The builder shall take the gold class of a token as past when its treebank tag is VBD or VBN, and, for a
              source without treebank tags, when its features have Tense=Past, and as non-past otherwise.
            tags: [unit]
            justification: |
              The treebank tags the meaning of the word in its sentence, never its sound.
            tests:
              - WordSenseBuilder_TenseEvaluator_IsGoldPast_UsesTheTreebankTagThenTheFeatures

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Metrics
            title: >-
              The builder shall report for each model, set and group the number of tokens, the accuracy of the class of
              the selected analysis (past or not) against the gold class, the majority baseline and the confusion of
              past against non-past, counting a token that the model does not answer as wrong.
            tags: [unit]
            justification: |
              The accuracy is only meaningful against the share of the more frequent class.
            tests:
              - WordSenseBuilder_TenseEvaluator_RunAsync_ScoresTheConfusionOfPastAgainstNonPast

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Sets
            title: >-
              The builder shall measure the test and the development split of the representative open corpus and the
              test, development and training file of the treebank (the files next to the gold file), and shall leave
              out with a note a treebank file that does not exist or has no lemma, tag and feature columns.
            tags: [unit]
            justification: |
              The test sets are the figures to report and the development sets are kept for choosing settings; a
              missing file must be visible and never a silent gap.
            tests:
              - WordSenseBuilder_TenseEvaluator_Load_ReadsTheSetsAndNotesWhatIsMissing
              - WordSenseBuilder_TenseEvaluator_Load_IncludesTheAdjacentTreebankTrainingFileForPooling

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Pooling
            title: >-
              The builder shall add a row that pools the test, development and training file of the treebank for each
              group when all three were measured, and shall skip a set whose gold has no features.
            tags: [unit]
            justification: |
              The pooled treebank figure has enough tokens to see a difference of a few points, and no model trains on
              the treebank.
            tests:
              - WordSenseBuilder_TenseEvaluator_RunAsync_PoolsTheTreebankFilesAndSkipsGoldWithoutFeatures
              - WordSenseBuilder_TenseEvaluator_Load_IncludesTheAdjacentTreebankTrainingFileForPooling

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Report
            title: >-
              The builder shall print the scores as a Markdown table with one row for each model, set and group,
              followed by the notes of the sets that were left out, using line feeds.
            tags: [unit]
            justification: |
              A stable table lets the figures be compared and committed.
            tests:
              - WordSenseBuilder_TenseEvaluator_Render_FormatsRowsAndNotes

          - id: WordSense-WordSenseBuilder-TenseEvaluation-Cli
            title: >-
              The evaluate-running command shall print the tense report after the part-of-speech report, restrict the
              output to the tense report or to the part-of-speech report with --report tense or --report running,
              reading only the inputs of the reports it prints, and refuse any other value of --report.
            tags: [unit]
            justification: |
              The part-of-speech report needs no treebank, and a misspelled option must not run the wrong report.
            tests:
              - WordSenseBuilder_Program_EvaluateRunning_Basic_ReportsTheTenseAndHonorsTheReportOption

          - id: WordSense-WordSenseBuilder-Suite
            title: >-
              The builder shall read the reviewed suite sentences, each with its expected analysis (lemma, part of
              speech and features) and acceptable fine senses, and the expectation of each model for each row (fine,
              answer or known miss), shall grade the answer of a model at the level it answered, and shall reject a
              malformed row, a row without an expectation for a model, and a sense that is not in the catalog or does
              not belong to the expected lemma and part of speech; the test project of each model shall fail when a
              row falls below the expectation of that model.
            tags: [unit]
            justification: |
              A reviewed suite with explicit per-model expectations lets the test projects fail the build when an
              expected pass regresses, while known misses stay visible instead of being forgotten.
            tests:
              - WordSenseBuilder_Suite_Read_ParsesRowsAndExpectations
              - WordSenseBuilder_Suite_Read_RowWithoutModelExpectation_IsRejected
              - WordSenseBuilder_Suite_Read_UnknownSenseOrSenseOfAnotherLemma_IsRejected
              - WordSenseBuilder_Suite_Read_MalformedRow_IsRejected
              - WordSenseBuilder_Suite_Read_RepeatedIdOrWrongHeader_IsRejected
              - WordSenseBuilder_Suite_Grade_JudgesTheAnswerAtItsOwnLevel
              - WordSenseBuilder_Suite_Grade_AnalysisOnlyRow_ChecksLemmaPartOfSpeechAndFeatures
              - WordSenseBuilder_Suite_Regressions_ListRowsBelowTheirExpectation_AndExpectationsRoundTrip
              - WordSenseBuilder_Suite_Committed_ReadsWithAnExpectationForEveryRow
              - WordSenseBuilder_Suite_GradeAsync_ClassifiesTheSentenceOfEveryRow
              - BasicSuite_ExpectedPasses_StillPass
              - MiniLMSuite_ExpectedPasses_StillPass
              - BertBaseCasedSuite_ExpectedPasses_StillPass

          - id: WordSense-WordSenseBuilder-Usage
            title: >-
              The builder shall provide the commands compile-image, import-moby, weights, evaluate, evaluate-senses,
              evaluate-allwords, allwords-sample, allwords-merge,
              evaluate-running, evaluate-suite, check-leakage, tiers, open-counts, evaluate-tagger, coverage,
              train-basic, tune-basic, label-senses, import-wn30-counts, appendix, keys and heteronyms, print
              usage when given no
              arguments, and shall report an unknown or removed command (the treebank commands ud-counts and
              ud-irregular included), a malformed option, an option value that is not a valid number or is out of range
              (as a one-line message without a stack trace) or a data error with a message and a non-zero exit code.
            tags: [unit]
            justification: |
              A build tool used in scripts must fail visibly and say why.
            tests:
              - WordSenseBuilder_Program_NoArguments_PrintsUsage
              - WordSenseBuilder_Program_RemovedCommand_IsUnknown
              - WordSenseBuilder_Program_ModelCommandWithoutModel_ReportsUsage
              - WordSenseBuilder_Program_CompileImage_MissingData_Fails
              - WordSenseBuilder_Program_MalformedOptions_ReportUsage
              - WordSenseBuilder_Program_MalformedNumberOption_ReportsOneLineError
              - WordSenseBuilder_Program_UnknownCommand_ReportsCommandAndUsage
              - WordSenseBuilder_Program_Usage_ListsTheSenseCommands
