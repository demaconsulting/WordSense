---
# WordSenseBuilder (build-time tool) unit requirements
#
# The builder is a repository tool and is never shipped in a package.

sections:
  - title: WordSense Requirements
    sections:
      - title: WordSenseBuilder Requirements
        requirements:
          - id: WordSense-WordSenseBuilder-Words
            title: >-
              The builder shall build the word lexicon of the core package deterministically from the corpus and
              the dictionary, with every sense of a trained lemma, the inflected forms of dictionary words and the
              generated forms, and shall write it in the compact binary format that the core package reads.
            tags: [unit]
            justification: |
              The shipped lexicon must be reproducible from committed inputs so that reviewers can verify it.
            tests:
              - WordSenseBuilder_Words_SameCorpus_IsByteIdentical
              - WordSenseBuilder_Words_TrainedLemma_ListsAllSenses
              - WordSenseBuilder_Words_GeneratedForm_NeverReplacesKnownWord
              - WordSenseBuilder_WordsBlobWriter_RoundTrip_ReadsBackThroughCoreReader

          - id: WordSense-WordSenseBuilder-Weights
            title: >-
              The builder shall train, for a named encoder model and the shared corpus, one set of per-lemma weights
              deterministically, and shall write it, naming the model, to the package of that model.
            tags: [unit]
            justification: |
              Each encoder package needs classifiers trained for its own embedding space; training every model from
              the one shared corpus keeps the models comparable.
            tests:
              - WordSenseBuilder_LogisticTrainer_SeparatesAndIsDeterministic
              - WordSenseBuilder_WeightsBlobWriter_RoundTrip_ReadsBackThroughOnnxReader
              - WordSenseBuilder_Program_Weights_UnknownModel_ReportsError

          - id: WordSense-WordSenseBuilder-Evaluate
            title: >-
              The builder shall measure a shipped model (an encoder model or the basic model) on the held-out and
              real-text sentences of the corpus, and report accuracy and coverage.
            tags: [unit]
            justification: |
              Each model's accuracy claim must be checkable against a repeatable measurement on sentences that were
              never used for training.
            tests:
              - WordSenseBuilder_Program_Evaluate_UnknownModel_ReportsError
              - WordSenseBuilder_Evaluator_Render_ReportsCountsAndAccuracy

          - id: WordSense-WordSenseBuilder-BasicPrecision
            title: >-
              The builder shall measure the precision of each rule of the basic model on the training anchors only,
              and report it next to the confidence the rule currently has.
            tags: [unit]
            justification: |
              The fixed rule confidences must be calibrated on data that is not used for the final accuracy
              measurement, so that the reported accuracy stays honest.
            tests:
              - WordSenseBuilder_BasicPrecision_Measure_CountsFiringsPerRule
              - WordSenseBuilder_BasicPrecision_Measure_UsesOnlyTrainingAnchors
              - WordSenseBuilder_BasicPrecision_Render_ListsConfidencePerRule

          - id: WordSense-WordSenseBuilder-Appendix
            title: >-
              The builder shall generate the senses appendix of the user guide deterministically from the sense
              inventory, the forms and the anchor sentences, shall reject incomplete input, and the committed
              appendix shall equal the generated one.
            tags: [unit]
            justification: |
              The list of supported lemmas with their parts of speech, meanings, respellings and forms must always
              describe the trained corpus; generating it, and failing when the committed file is stale, makes drift
              impossible.
            tests:
              - WordSenseBuilder_Appendix_Generate_ListsLemmasSensesAndForms
              - WordSenseBuilder_Appendix_Generate_RejectsIncompleteInput
              - WordSenseBuilder_Appendix_Run_WritesFileAndRequiresOptions
              - WordSenseBuilder_Appendix_Committed_MatchesCorpus

          - id: WordSense-WordSenseBuilder-Corpus
            title: The builder shall validate corpus format and the disjointness of training and evaluation data.
            tags: [unit]
            justification: |
              Leaked or malformed sentences invalidate the accuracy measurement.
            tests:
              - WordSenseBuilder_Corpus_ReadSentences_ParsesRow
              - WordSenseBuilder_Corpus_ReadSentences_RejectsMalformedRow
              - WordSenseBuilder_Corpus_DirectoryAndDisjointness
              - WordSenseBuilder_Corpus_ReadForms_ParsesLabels
              - WordSenseBuilder_Corpus_ReadSentences_SplitsCompoundTarget

          - id: WordSense-WordSenseBuilder-Usage
            title: >-
              The builder shall provide the commands words, weights, evaluate, basic-precision and appendix, and shall
              report an unknown command, a malformed option or a data error with a message and a non-zero exit code.
            tags: [unit]
            justification: |
              A build tool used in scripts must fail visibly and say why.
            tests:
              - WordSenseBuilder_Program_Run_ReportsErrors
              - WordSenseBuilder_Program_Run_NonNumericOption_ReportsErrorNamingOption
              - WordSenseBuilder_Program_Run_OptionNameAsValue_ReportsUsageError
              - WordSenseBuilder_Program_Run_UnknownCommand_ReportsUsage
