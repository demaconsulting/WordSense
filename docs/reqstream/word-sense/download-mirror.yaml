---
# DownloadMirror unit requirements

sections:
  - title: DownloadMirror Requirements
    requirements:
      - id: WordSense-Mirror-Validation
        title: The mirror shall accept only absolute http or https base URLs and safe, consistent credentials.
        tags: [unit]
        justification: |
          Credentials must not be sent over plain http to remote hosts, and a malformed mirror
          must fail at configuration time rather than during a download.
        tests:
          - DownloadMirror_Constructor_HttpsBase_IsAccepted
          - DownloadMirror_Constructor_InvalidBase_Throws
          - DownloadMirror_Constructor_RelativeBase_Throws
          - DownloadMirror_Constructor_BadAuthentication_Throws
          - DownloadMirror_Constructor_CredentialsOverPlainHttp_OnlyLoopbackAllowed

      - id: WordSense-Mirror-Environment
        title: The mirror configuration shall be readable from the WORDSENSE_MIRROR_* environment variables.
        tags: [unit]
        justification: |
          Deployments configure the mirror without code changes, as with the sibling Speech library.
        tests:
          - DownloadMirror_FromEnvironment_NoUrl_ReturnsNull
          - DownloadMirror_FromEnvironment_AllVariables_BuildsMirror
          - DownloadMirror_FromEnvironment_InvalidConfiguration_Throws

      - id: WordSense-Mirror-Redaction
        title: The mirror configuration shall never reveal secrets when converted to text.
        tags: [unit]
        justification: |
          Logs and exception messages must not leak passwords or tokens.
        tests:
          - DownloadMirror_ToString_RedactsSecrets
