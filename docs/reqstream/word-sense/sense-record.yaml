---
# SenseRecord unit requirements

sections:
  - title: SenseRecord Requirements
    requirements:
      - id: WordSense-Sense-Record
        title: >-
          The library shall represent each possible answer as an immutable value with a lemma, a part of speech and
          an optional pronunciation, shared once per sense, and shall report an analysis as an immutable value.
        tags: [unit]
        justification: |
          Callers compare, store and share answers and analyses across threads; they must not change after
          creation.
        tests:
          - LemmaModel_Candidates_MapSensesToDetails
          - ResultRecords_HaveValueEquality

      - id: WordSense-Sense-Pronunciation
        title: >-
          The library shall give a pronunciation (a meaning and an optional respelling) only to the senses of a
          heteronym, a lemma with at least two distinct meanings, and none to any other lemma.
        tags: [unit]
        justification: |
          Most lemmas are pronounced the same whatever they mean; reporting a pronunciation for them would be
          noise, and a heteronym is only meaningful when its meanings can be told apart.
        tests:
          - LemmaModel_NonHeteronym_HasNoPronunciation
          - LemmaModel_MissingRespelling_IsNull
          - LemmaModel_SenseSet_Rules

      - id: WordSense-Sense-Validation
        title: >-
          The library shall accept only well-formed sense definitions: a defined part of speech, a meaning
          identifier of bounded length in a simple syntax, and a bounded respelling in letters, hyphens and
          apostrophes that is given only together with a meaning.
        tags: [unit]
        justification: |
          Meanings are matched as plain strings and respellings are shown to people, so a simple syntax avoids
          lookalike, empty or oversized values.
        tests:
          - SenseDefinition_Validate_InvalidDefinitions_Throw
          - SenseDefinition_IsValidMeaning_ChecksSyntax
          - SenseDefinition_IsValidRespelling_ChecksSyntaxAndLength
          - LemmaModel_Constructor_InvalidSenseDefinition_Throws
          - PartOfSpeech_Values_ArePinned

      - id: WordSense-Sense-Abstain
        title: >-
          The library shall decide whether to answer or abstain with one rule, so that a margin or a threshold
          that is not a number never produces an answer.
        tags: [unit]
        justification: |
          One shared rule keeps every classification path consistent, and a degenerate margin must fail safe.
        tests:
          - AbstainRule_Abstains_NaNMarginOrThreshold_Abstains

      - id: WordSense-Sense-Words
        title: The library shall split text into word and non-word segments that tile the text.
        tags: [unit]
        justification: |
          Callers of the text overload map results back onto the original text.
        tests:
          - TextSplitter_SplitSegments_TileTheText
          - TextSplitter_SplitWords_ReturnsNonSpaceTilesWithOffsets
          - TextSplitter_SplitWords_InternalPunctuationAndMarks_StayOneWord
          - TextSplitter_SplitWords_SurrogatePairAndTrailingApostrophe_AreSeparateTiles
          - TextSplitter_SplitWords_TrailingHyphen_IsOwnTile
