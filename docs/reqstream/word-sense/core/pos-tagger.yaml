---
# PosTagger unit requirements (part-of-speech posteriors of the Basic model)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: PosTagger Requirements
            requirements:
              - id: WordSense-Core-PosTagger-Posteriors
                title: >-
                  PosTagger shall give, for every word of a segment, a probability for each part of speech that sums to
                  1, weighing the context of the sentence (the tests cover the effect of the preceding word), and
                  shall give certainty to a word that has only one possible
                  part of speech.
                tags: [unit]
                justification: |
                  Context decides the part of speech of an ambiguous word; the posteriors are the evidence that the
                  fusion step relies on.
                tests:
                  - PosTagger_Posteriors_AfterDeterminer_PrefersNoun
                  - PosTagger_Posteriors_AfterPronoun_PrefersVerb
                  - PosTagger_Posteriors_RowsSumToOne
                  - PosTagger_Posteriors_SingleTag_IsCertain
                  - PosTagger_Posteriors_EmptyAndSmallBuffer

              - id: WordSense-Core-PosTagger-UnknownWords
                title: >-
                  PosTagger shall estimate the possible parts of speech of a word it has no statistics for from its
                  capitalization and its ending.
                tags: [unit]
                justification: |
                  Words outside the tabled vocabulary still need a usable estimate so that their neighbors keep their
                  context.
                tests:
                  - PosTagger_Posteriors_UnknownWords_UseCapitalizationAndSuffix
                  - PosTagger_Posteriors_CapitalizedUnknownWord_IsNounInsideSentenceOnly

              - id: WordSense-Core-PosTagger-Deterministic
                title: >-
                  PosTagger shall give identical posteriors for identical input.
                tags: [unit]
                justification: |
                  Reproducible estimates make the classifier reproducible.
                tests:
                  - PosTagger_Posteriors_IsDeterministic
