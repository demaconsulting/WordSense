---
# BasicWordSenseModel unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: BasicWordSenseModel Requirements
            requirements:
              - id: WordSense-Core-BasicWordSenseModel-NoFiles
                title: >-
                  BasicWordSenseModel shall need no files, no network access and no preparation step, and shall not
                  offer the downloadable-model capability.
                tags: [unit]
                justification: |
                  The model has nothing to obtain, so it must never touch the network or the file system, and a
                  preparation step that does nothing would only mislead callers.
                tests:
                  - BasicWordSenseModel_IsNotDownloadable
                  - BasicWordSenseModel_ClassifyAsync_WithoutPreparation_Works

              - id: WordSense-Core-BasicWordSenseModel-Classify
                title: >-
                  BasicWordSenseModel shall classify on demand, answering lexicon-only words without any
                  preparation, and shall be safe for concurrent use.
                tags: [unit]
                justification: |
                  A model without resources should be as simple to use as a plain object.
                tests:
                  - BasicWordSenseModel_ClassifyAsync_ReturnsParallelResults
                  - BasicWordSenseModel_ClassifyAsync_WithoutPreparation_Works
                  - BasicWordSenseModel_ClassifyAsync_LexiconOnlyWords_NeverNeedEnsure
                  - BasicWordSenseModel_ClassifyAsync_IsThreadSafe
                  - BasicWordSenseModel_ClassifyAsync_NullWords_Throws
                  - BasicWordSenseModel_ClassifyAsync_Cancelled_Throws

              - id: WordSense-Core-BasicWordSenseModel-Dispose
                title: >-
                  BasicWordSenseModel shall tolerate repeated and concurrent disposal, let a classification that is
                  already running complete, and after disposal shall throw ObjectDisposedException from
                  ClassifyAsync.
                tags: [unit]
                justification: |
                  The model honors the disposal contract of IWordSenseModel, so code that handles any model behaves the
                  same with the Basic model.
                tests:
                  - BasicWordSenseModel_Dispose_CalledTwice_IsHarmless
                  - BasicWordSenseModel_Dispose_Concurrent_IsHarmless
                  - BasicWordSenseModel_Dispose_DuringClassification_RunningCallCompletes
                  - BasicWordSenseModel_ClassifyAsync_AfterDispose_ThrowsObjectDisposed
