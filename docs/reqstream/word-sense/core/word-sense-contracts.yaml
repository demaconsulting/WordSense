---
# WordSenseContracts unit requirements (IWordSenseModel, IDownloadableWordSenseModel, FallbackWordSenseModel,
# DownloadOptions, the typed exceptions, ClassifyResult, AnalysisCandidate, SenseCandidate, SenseLevel, WordDetails,
# PartOfSpeech, SenseInfo and SenseGroup)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: WordSenseContracts Requirements
            requirements:
              - id: WordSense-Core-WordSenseContracts-Classify
                title: >-
                  IWordSenseModel.ClassifyAsync shall classify a running text given as a list of words joined by
                  single spaces,
                  with punctuation as elements of their own, and return an array parallel to the input.
                tags: [unit]
                justification: |
                  Callers tokenize themselves; a fixed text convention gives every model the same context and lets
                  callers map each result to its input word by index.
                tests:
                  - WordSenseContracts_IWordSenseModel_TestDouble_IsUsableThroughTheInterface
                  - BasicWordSenseModel_ClassifyAsync_ReturnsParallelResults
                  - BasicWordSenseModel_ClassifyAsync_NullWords_Throws
                  - BasicWordSenseModel_ClassifyAsync_Cancelled_Throws
                  - BasicClassifier_ClassifyAsync_ResultsAreParallelToInput
                  - BasicClassifier_ClassifyAsync_NullWords_Throws
                  - BasicClassifier_ClassifyAsync_NullElement_Throws
                  - BasicClassifier_ClassifyAsync_Cancelled_Throws

              - id: WordSense-Core-WordSenseContracts-Result
                title: >-
                  ClassifyResult shall be an immutable value type carrying the word as given, whether the word is
                  known, the analyses with their probabilities, the selected analysis (none for an unknown word), the
                  level answered, a confidence at that level, and the group id and the sense id where the level carries
                  them (the sense id only at the sense level, the group id at the group level and at the sense level
                  when the sense is in a group, otherwise none), with value equality, plain properties that serialize
                  without custom code, and a default value that is valid (empty word, empty arrays).
                tags: [unit]
                justification: |
                  A value result is cheap to produce for every word, equality makes results easy to compare and test,
                  and ids that are present exactly where the level carries them let callers test the level instead of
                  guessing from a missing value. A default value that does not throw lets callers keep results in
                  arrays and fields without null checks. The result type is not named like its namespace, so a caller
                  never confuses the two.
                tests:
                  - WordSenseContracts_ClassifyResult_SameValues_AreEqual
                  - WordSenseContracts_ClassifyResult_NoDetails_HasNullDetails
                  - WordSenseContracts_ClassifyResult_LevelDecidesWhichIdsAreSet
                  - WordSenseContracts_ClassifyResult_Default_HasEmptyArraysAndDoesNotThrow

              - id: WordSense-Core-WordSenseContracts-Candidates
                title: >-
                  ClassifyResult shall expose its analyses as an immutable array of AnalysisCandidate (the analysis
                  with lemma, part of speech and features, its probability and, where the model scored them, its senses
                  as an immutable array of SenseCandidate, a sense id with its probability given the analysis), the
                  analyses sorted by the probability of their lemma and part of speech (the sum of the probabilities of
                  the analyses that share them, which differ only in features), largest first, and inside one lemma
                  and part of speech by their own probability, largest first, with ties in the order of the lexicon,
                  the probabilities from 0 to 1 and summing to one over the analyses of a word (and over the senses of
                  an analysis), never truncated, with the analyses empty only for an unknown word and the senses empty
                  when they were not scored; it shall reuse shared empty arrays for an unknown word and for a missing
                  list, never expose a default array, and compare the analyses and senses item by item in its equality.
                tags: [unit]
                justification: |
                  The analyses are the single source of truth of a result: a consumer that wants its own decision, for
                  example one that maps senses to categories of its own and sums analysis.Probability times
                  sense.Probability per category, needs every analysis and sense with its probability in rank order;
                  the senses belong to a lemma and part of speech, so the feature variants of one of them are listed
                  together and share its probability, and the first analysis is the best variant of the most probable
                  lemma and part of speech;
                  arrays that are never default need no null check, shared empty arrays keep unknown and
                  single-analysis words free of allocations, and equality that compares the contents keeps results
                  comparable in tests.
                tests:
                  - WordSenseContracts_ClassifyResult_Analyses_AreKeptInOrder
                  - WordSenseContracts_ClassifyResult_SameAnalyses_AreEqual
                  - WordSenseContracts_ClassifyResult_DifferentAnalyses_AreNotEqual
                  - WordSenseContracts_ClassifyResult_Unknown_SharesEmptyArrays
                  - WordSenseContracts_AnalysisCandidate_Senses_DefaultIsEmpty
                  - WordSenseContracts_AnalysisCandidate_SameValues_AreEqual
                  - WordSenseContracts_SenseCandidate_SameValues_AreEqual

              - id: WordSense-Core-WordSenseContracts-Candidates-RankingKind
                title: >-
                  AnalysisCandidate shall expose a read-only SensesRankedByUsage value that is true only when the model
                  built the candidate with the value true, to say that its senses are the context-free usage ranking of
                  the lemma and not scores from the context of the word.
                tags: [unit]
                justification: |
                  A consumer, and the FallbackWordSenseModel, must tell a ranking by usage from a score of the senses in
                  context; both are lists of senses with probabilities.
                tests:
                  - WordSenseContracts_AnalysisCandidate_SensesRankedByUsage_DefaultsToContextScored

              - id: WordSense-Core-WordSenseContracts-Candidates-RankingKind-Default
                title: >-
                  AnalysisCandidate shall have SensesRankedByUsage false for a default candidate and for a candidate
                  built without the value, so that a model that lists senses and does not say otherwise counts as
                  scoring them in context.
                tags: [unit]
                justification: |
                  The value is added to a pre-1.0 public type; a model written before it existed keeps working and
                  keeps being treated as scoring its senses.
                tests:
                  - WordSenseContracts_AnalysisCandidate_SensesRankedByUsage_DefaultsToContextScored

              - id: WordSense-Core-WordSenseContracts-Candidates-RankingKind-Equality
                title: >-
                  AnalysisCandidate shall include SensesRankedByUsage in its equality and its hash code.
                tags: [unit]
                justification: |
                  Two candidates that list the same senses but one ranked by usage and one scored are different
                  statements, and results are compared by value in tests and in consumers.
                tests:
                  - WordSenseContracts_AnalysisCandidate_SensesRankedByUsage_DefaultsToContextScored

              - id: WordSense-Core-WordSenseContracts-Level
                title: >-
                  SenseLevel shall name the four answer levels, None (unknown word), PartOfSpeech, Group and Sense,
                  in order of increasing precision, nested so that a group exists only between a part of speech and its
                  senses, and ClassifyResult shall use them so that None is only for an unknown word (not known, no
                  analysis, confidence 0), a known but uncertain word is at least at PartOfSpeech with a low
                  confidence, and the Group and Sense levels name a group or sense that lies in the selected analysis.
                tags: [unit]
                justification: |
                  Callers compare levels to decide how far to trust an answer; a fixed, ordered vocabulary makes the
                  comparison meaningful for every model, and a known word that is never reported as unknown lets a
                  caller tell a word the lexicon lacks from a word the model is unsure about.
                tests:
                  - WordSenseContracts_SenseLevel_Values_AreTheFourLevels
                  - WordSenseContracts_SenseLevel_Order_IncreasesWithPrecision
                  - WordSenseContracts_ClassifyResult_LevelDecidesWhichIdsAreSet

              - id: WordSense-Core-WordSenseContracts-Confidence
                title: >-
                  ClassifyResult.Confidence shall be the probability of the answer at its level, built on the
                  probability of the lemma and part of speech (the slot) of the selected analysis, which is the sum of
                  the probabilities of the analyses that share them and differ only in features, so that the split of
                  a slot among its feature variants never lowers it: for the part of speech level the probability of
                  that slot, for the group level that probability times the sum of the probabilities, within the slot,
                  of the member senses of the group, and for the sense level that probability times the probability of
                  the answered sense within the slot; it is 0 for an unknown word and 1 for a word with one lemma and
                  part of speech and one sense (and also 1, at the part of speech level, for a word with one lemma and
                  part of speech whose several senses are not decided), and is comparable only within one result.
                tags: [unit]
                justification: |
                  A single number per answer lets callers apply a threshold, and defining it from the slot and sense
                  probabilities that the result also lists keeps the summary and the full answer consistent; the
                  senses belong to a lemma and a part of speech and not to a feature variant, so the confidence in a
                  sense must not fall because the lexicon lists a form (cut, deer) in several variants; the
                  scale is not calibrated across models, words or levels, so each caller tunes its own threshold.
                tests:
                  - WordSenseContracts_ClassifyResult_LevelDecidesWhichIdsAreSet
                  - WordSenseContracts_ClassifyResult_NoDetails_HasNullDetails

              - id: WordSense-Core-WordSenseContracts-Fallback
                title: >-
                  FallbackWordSenseModel shall compose a primary and a fallback model: classify the whole word list
                  with both, answer each word with the complete result of the primary model when the primary model
                  scored senses for it (its selected analysis lists senses scored from the context, see
                  WordSense-Core-WordSenseContracts-FallbackUsage, or its level is Group or Sense) and
                  otherwise with the complete result of the fallback model, never a mixture of the probabilities of the
                  two (except the split of a tied slot that WordSense-Core-WordSenseContracts-FallbackSlotSplit states
                  and the combination of the slot probabilities that WordSense-Core-WordSenseContracts-FallbackReconcile
                  states),
                  ensure its
                  members as WordSense-Core-WordSenseContracts-FallbackEnsure states (every member that can be
                  prepared is prepared concurrently, and a failure of one is reported after all ran), dispose both
                  models once, reject a null model, a null list and a null element,
                  and reject a model whose result array is not parallel to the input.
                tags: [unit]
                justification: |
                  An encoder model scores fine senses only for the lemmas it was trained for, while a statistical
                  model chooses the analysis of every ambiguous word; composing them lets a caller use one model that
                  answers every word as precisely as it can, and a result that always belongs completely to one model
                  keeps its probabilities, level and confidence consistent.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryScoredSenses_UsesPrimary
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryChoseOnlyAnalysis_UsesFallback
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_EnsuresBoth
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_PrimaryFails_StillEnsuresFallback
                  - WordSenseContracts_FallbackWordSenseModel_Dispose_DisposesBothOnce
                  - WordSenseContracts_FallbackWordSenseModel_ClassifyAsync_InvalidArguments_Throw
                  - WordSenseContracts_FallbackWordSenseModel_ClassifyAsync_ResultNotParallel_Throws

              - id: WordSense-Core-WordSenseContracts-FallbackUsage
                title: >-
                  FallbackWordSenseModel shall answer a word with the complete result of the fallback model when the
                  senses that the selected analysis of the primary result lists are only ranked by usage
                  (SensesRankedByUsage is true) and its level is not Group or Sense, so that it never refines or
                  reconciles such a result.
                tags: [unit]
                justification: |
                  The usage prior of the Basic model is a context-free ranking of the lemma, not a score of the senses
                  in the context; a composite whose primary model is the Basic model (or any model that ranks by a
                  prior) must not treat the ranking as evidence of the context.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_BasicAsPrimary_UsageRankedSenses_AreNotRefinedOrReconciled
                  - WordSenseContracts_FallbackWordSenseModel_BasicWithBasic_ReturnsTheBasicAnswerAsItIs

              - id: WordSense-Core-WordSenseContracts-FallbackScored
                title: >-
                  FallbackWordSenseModel shall answer a word with the result of the primary model, refined and
                  reconciled as the requirements state, when the senses that the selected analysis of the primary
                  result lists are not marked as ranked by usage (the default of a candidate).
                tags: [unit]
                justification: |
                  A model that lists senses and says nothing about their ranking, as every model written before the
                  value existed, scores them in context; its result keeps being used.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryScoredSenses_UsesPrimary
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryWithContextScoredSenses_StillReconciled

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit
                title: >-
                  FallbackWordSenseModel shall re-split the tied variants of a slot of the primary result with the
                  proportions of the fallback result, as the child requirements state. The child requirements use
                  these terms: a slot is the analyses of a result with the same lemma and part of speech, and two
                  probabilities are equal when they differ by at most 1e-9.
                tags: [unit]
                justification: |
                  An encoder scores the senses of a slot and has no evidence for the split of the slot among its feature
                  variants (the past and the infinitive of put), so it gives them the same probability and the lexicon
                  order decided the tense; the Basic model reads the tense from the context, and the split inside a slot
                  does not change the slot probability, so using it cannot change what the answer says about the sense.
                  A parent requirement carries the terms once; the child requirements state each behavior that can be
                  tested on its own.
                children:
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-Eligible
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-FallbackSeparates
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-Proportions
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-Order
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-Selection
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-SlotTotal
                  - WordSense-Core-WordSenseContracts-FallbackSlotSplit-Answer

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-Eligible
                title: >-
                  FallbackWordSenseModel shall treat as tied, and so eligible for the split, only a slot of the primary
                  result that has two or more analyses whose probabilities are all equal (within 1e-9), and shall leave
                  a slot that the primary model split unequally, and a result with a single analysis, untouched.
                tags: [unit]
                justification: |
                  A slot that the primary model split unequally was decided by a trained form chooser, and the split of
                  a model that has evidence must never be overridden by one that has not.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_UnequalVariants_AreLeftAsThePrimaryModelSplitThem
                  - WordSenseContracts_FallbackWordSenseModel_TieTolerance_IsOneNanoUnit

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-FallbackSeparates
                title: >-
                  FallbackWordSenseModel shall re-split a tied slot only when the fallback result lists every analysis
                  of the slot and does not give them all the same probability (within 1e-9), and shall otherwise leave
                  the slot as the primary result has it.
                tags: [unit]
                justification: |
                  Without a distinction by the fallback model there is no evidence for a split, and an analysis that
                  the fallback does not list has no share to take.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_FallbackWithoutDistinction_LeavesThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-Proportions
                title: >-
                  FallbackWordSenseModel shall give the analyses of a re-split slot the relative proportions of the
                  fallback result and the probability of the slot as the primary result gave it, in every tied slot
                  that qualifies, whether or not the slot is the selected one.
                tags: [unit]
                justification: |
                  The proportions are the only thing taken from the fallback; the slot keeps what the primary model
                  says about the senses.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_TiedVariantsOfASlot_TakeTheProportionsOfTheFallback
                  - WordSenseContracts_FallbackWordSenseModel_TiedSlotThatIsNotSelected_IsSplitAndLeavesTheSelectedAnalysis

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-Order
                title: >-
                  FallbackWordSenseModel shall sort the analyses of a re-split slot again, the most probable first, a
                  tie keeping the order of the primary result.
                tags: [unit]
                justification: |
                  The analyses of a slot are listed by their probability, and equal shares must stay deterministic.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_TiedVariantsOfASlot_TakeTheProportionsOfTheFallback
                  - WordSenseContracts_FallbackWordSenseModel_TiedVariants_EqualShares_KeepTheOrderOfThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-Selection
                title: >-
                  FallbackWordSenseModel shall select the new first analysis of the result when the primary result
                  selected its first analysis, so that the tense of the fallback decides the selected analysis, and
                  shall otherwise keep the selected analysis of the primary result.
                tags: [unit]
                justification: |
                  The selected analysis follows the first analysis of the list, and a selection that was not the first
                  analysis (a noun beside a tied verb slot) is not the business of the split.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_TiedVariants_SelectedAnalysisFollowsTheFallbackSplit
                  - WordSenseContracts_FallbackWordSenseModel_TiedSlotThatIsNotSelected_IsSplitAndLeavesTheSelectedAnalysis

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-SlotTotal
                title: >-
                  FallbackWordSenseModel shall leave the probability of every slot as the primary result gave it, so
                  that the probabilities of the result still sum to one.
                tags: [unit]
                justification: |
                  The split is a prior inside a slot and cannot change what the answer says about the sense.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ManyInputs_KeepSlotTotalsLevelAndConfidence

              - id: WordSense-Core-WordSenseContracts-FallbackSlotSplit-Answer
                title: >-
                  FallbackWordSenseModel shall leave the level, the confidence, the group, the sense and the senses of
                  every analysis of the primary result as they are when it re-splits a slot.
                tags: [unit]
                justification: |
                  The sense figures of the encoder must not move when only the tense of a verb is decided.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_TiedVariantsOfASlot_TakeTheProportionsOfTheFallback
                  - WordSenseContracts_FallbackWordSenseModel_ManyInputs_KeepSlotTotalsLevelAndConfidence

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass
                title: >-
                  FallbackWordSenseModel shall treat the closed-class slots of a primary result that scored senses as
                  the child requirements state. The child requirements use these terms: a slot is the analyses of a
                  result with the same lemma and part of speech, a closed-class slot is a slot of a part of speech
                  other than noun, verb, adjective and adverb (an auxiliary, determiner, pronoun, preposition,
                  conjunction or interjection), and an open-class slot is any other slot.
                tags: [unit]
                justification: |
                  A closed class has no WordNet senses, so the mass of the senses of a trained lemma says nothing about
                  whether the word is an auxiliary, a determiner or a pronoun (the auxiliary have against the verb
                  have): the tagger of the Basic model decides the closed-class part of the probability, as it does for
                  a lemma without weights, and the encoder decides the senses inside the open-class part. A parent
                  requirement carries the terms once; the child requirements state each behavior that can be tested on
                  its own.
                children:
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-Probability
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-Weighted
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-OpenAnswer
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-ClosedAnswer
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-OwnEstimate
                  - WordSense-Core-WordSenseContracts-FallbackClosedClass-NothingToSplit
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlots_TakeTheProbabilityOfTheFallbackAndOpenClassKeepsTheSense

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-Probability
                title: >-
                  FallbackWordSenseModel shall take the probability of every closed-class slot of a primary result that
                  lists the closed-class slots without probability from the fallback result, normalized over the slots
                  of the primary result, and share the rest among the open-class slots in the proportions of the
                  primary result.
                tags: [unit]
                justification: |
                  The tagger of the Basic model is the evidence for the part of speech; the encoder keeps the evidence
                  for the senses inside the open-class part.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlots_TakeTheProbabilityOfTheFallbackAndOpenClassKeepsTheSense

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-Weighted
                title: >-
                  FallbackWordSenseModel shall keep the probability of every closed-class slot that the split gave it
                  (the probability of the fallback result) when the primary weight is below 1, and shall combine the
                  weighted slot probabilities of the primary and the fallback result among the open-class slots only,
                  which share the probability that the closed-class slots leave.
                tags: [unit]
                justification: |
                  The closed-class probability is the fallback's own estimate by construction; combining it again with
                  the fallback would count the fallback twice and move the closed-class mass away from its estimate.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlots_KeepTheFallbackProbabilityWhenWeighted

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-OpenAnswer
                title: >-
                  FallbackWordSenseModel shall keep the level, group, sense and selected analysis of the primary result
                  when an open-class slot is the most probable after the split, and shall scale its confidence by the
                  new probability of the slot.
                tags: [unit]
                justification: |
                  The confidence is the probability of the slot times the probability of the sense within it, so a new
                  slot probability must scale it.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlots_TakeTheProbabilityOfTheFallbackAndOpenClassKeepsTheSense

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-ClosedAnswer
                title: >-
                  FallbackWordSenseModel shall answer at the part-of-speech level with the new slot probabilities, the
                  first analysis of the slot selected and no sense or group when a closed-class slot is the most
                  probable after the split, even when the fallback names the only sense of the slot.
                tags: [unit]
                justification: |
                  The composite decided a part of speech, not a sense.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlotMostProbable_AnswersAtPartOfSpeechLevel
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSlotMostProbable_FallbackSelectedAnother_AnswersAtPartOfSpeechLevel

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-OwnEstimate
                title: >-
                  FallbackWordSenseModel shall leave a primary result that gives a closed-class slot a probability of
                  its own as it is.
                tags: [unit]
                justification: |
                  A model that has an estimate for a closed-class slot (a tagger, or a classifier that scored it)
                  needs no estimate from the fallback.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSplit_NotApplicable_LeavesThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackClosedClass-NothingToSplit
                title: >-
                  FallbackWordSenseModel shall leave a primary result without a closed-class slot, without an open-class
                  slot, or whose fallback result lists none of its slots as it is.
                tags: [unit]
                justification: |
                  There is nothing to split, and no estimate to take from the fallback.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_ClosedClassSplit_NotApplicable_LeavesThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackSingleSense
                title: >-
                  FallbackWordSenseModel shall treat a sense-level answer of the fallback result for a word that the
                  primary model did not score as the child requirements state. The child requirements use these terms:
                  a single-sense answer is a fallback result at the sense level whose selected analysis lists exactly
                  one sense, and the target is the confidence 0.97.
                tags: [unit]
                justification: |
                  The Basic model names the only sense of its most probable analysis at any confidence, which is the
                  right behavior for a model that makes no promise about its sense answers. The encoder models promise
                  sense answers that are calibrated to a precision target of 0.97 on real text, and a word whose own
                  lemma the encoder did not score (a form such as the adjective growing of the verb grow, or the
                  comparative more read as the adjective much) would otherwise carry a sense answer from a one-sense
                  analysis at a confidence of 0.2 or 0.5. A parent requirement carries the terms once; the child
                  requirements state each behavior that can be tested on its own.
                children:
                  - WordSense-Core-WordSenseContracts-FallbackSingleSense-BelowTarget
                  - WordSense-Core-WordSenseContracts-FallbackSingleSense-AtTarget
                  - WordSense-Core-WordSenseContracts-FallbackSingleSense-SingleSlot
                  - WordSense-Core-WordSenseContracts-FallbackSingleSense-OtherResults
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleSenseAnswerBelowTarget_AnswersAtPartOfSpeechLevel

              - id: WordSense-Core-WordSenseContracts-FallbackSingleSense-BelowTarget
                title: >-
                  FallbackWordSenseModel shall answer a single-sense answer of the fallback for a word with more than
                  one slot at the part-of-speech level when its confidence is below the target, with the same
                  analyses, selected analysis and confidence and no group or sense id.
                tags: [unit]
                justification: |
                  Below the target the composite answers the part of speech it has evidence for, with the same
                  analysis.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleSenseAnswerBelowTarget_AnswersAtPartOfSpeechLevel

              - id: WordSense-Core-WordSenseContracts-FallbackSingleSense-AtTarget
                title: >-
                  FallbackWordSenseModel shall keep a single-sense answer of the fallback with a confidence of at least
                  the target (the target itself included) as it is.
                tags: [unit]
                justification: |
                  An answer that reaches the target keeps the promise of the sense level.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleSenseAnswerAtTarget_StaysAtSenseLevel

              - id: WordSense-Core-WordSenseContracts-FallbackSingleSense-SingleSlot
                title: >-
                  FallbackWordSenseModel shall keep a single-sense answer of the fallback for a word with a single slot
                  (the probability of the slot is 1) as it is, at any confidence.
                tags: [unit]
                justification: |
                  A word without ambiguity of the part of speech needs no confidence to name its only sense.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleAnalysis_StaysAtSenseLevel

              - id: WordSense-Core-WordSenseContracts-FallbackSingleSense-OtherResults
                title: >-
                  FallbackWordSenseModel shall keep every other result of the fallback, including a sense-level result
                  whose selected analysis lists no sense or several, as it is.
                tags: [unit]
                justification: |
                  Only the single-sense rule of the Basic model is guarded.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SenseLevelWithoutExactlyOneSense_IsLeftAsItIs
              - id: WordSense-Core-WordSenseContracts-FallbackReconcile
                title: >-
                  FallbackWordSenseModel shall combine the slot probabilities of a primary result that committed to
                  no sense and no group with those of the fallback result, as the child requirements state. The child
                  requirements use these terms: a slot is the analyses of a result with the same lemma and part of
                  speech, the probability of a slot is the sum of the probabilities of its analyses, the primary
                  weight is the number w from 0 to 1 that a caller gives the composition (1 when it gives none), and
                  the floor is the probability 1e-6.
                tags: [unit]
                justification: |
                  The probability of a slot of an encoder is the mass of its senses, not an estimate of the part of
                  speech, so a word whose senses the encoder cannot tell apart (the part-of-speech level) can have the
                  wrong slot on top where the tagger of the Basic model is right (the verb use that MiniLM calls a
                  noun); combining the two estimates with a weight that is tuned on development text repairs it without
                  touching an answer at the sense or group level. A parent requirement carries the terms once; the child
                  requirements state each behavior that can be tested on its own.
                children:
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Default
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Report
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Range
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-Level
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-SingleSlot
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-FallbackAnalyses
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Product
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Union
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Floor
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Share
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Senses
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Kind
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Order
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Selection
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Level
                  - WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Sum
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_CombinesTheSlotProbabilities

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Default
                title: >-
                  FallbackWordSenseModel shall keep the primary result as it is, without combining any slot
                  probabilities, when the primary weight is 1 or none is given.
                tags: [unit]
                justification: |
                  A weight of 1 is the composition without reconciliation, so a caller that gives no weight sees no
                  change.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryWeight_OneKeepsThePrimaryZeroTakesTheFallback

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Report
                title: >-
                  FallbackWordSenseModel shall report the primary weight it was given, or 1 when it was given none.
                tags: [unit]
                justification: |
                  The weight is a hyperparameter that each model package tunes on its own development text; a caller
                  must be able to read the value in force.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryWeight_IsReported

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Weight-Range
                title: >-
                  FallbackWordSenseModel shall reject a primary weight below 0, above 1 or not a number.
                tags: [unit]
                justification: |
                  A weight outside 0 to 1 is not a blend of two estimates.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryWeight_OutsideZeroToOne_Throws

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-Level
                title: >-
                  FallbackWordSenseModel shall leave a primary result at the sense level or the group level exactly as
                  the primary result has it, whatever the primary weight.
                tags: [unit]
                justification: |
                  A result that names a sense or a group is decided by the encoder's thresholds and its figures must
                  not move.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SenseOrGroupLevel_IsLeftAsThePrimaryGaveIt

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-SingleSlot
                title: >-
                  FallbackWordSenseModel shall leave a primary result exactly as the primary result has it when the
                  primary and the fallback results together list a single slot.
                tags: [unit]
                justification: |
                  With one slot there is nothing to combine.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleSlotOrEmptyFallback_LeavesThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Scope-FallbackAnalyses
                title: >-
                  FallbackWordSenseModel shall leave a primary result exactly as the primary result has it when the
                  fallback result has no analyses.
                tags: [unit]
                justification: |
                  Without analyses the fallback has no estimate of the part of speech to combine.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SingleSlotOrEmptyFallback_LeavesThePrimaryResult

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Product
                title: >-
                  FallbackWordSenseModel shall give each slot of a combined result a probability proportional to
                  p_primary^w times p_fallback^(1-w), where p_primary and p_fallback are the probabilities of the slot
                  in the primary and in the fallback result.
                tags: [unit]
                justification: |
                  A tempered product (a geometric blend) lets the tagger overrule an encoder that has no evidence for a
                  part of speech without letting a confident tagger error overrule an encoder that is sure; w = 1 gives
                  the primary result and w = 0 the fallback result.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_CombinesTheSlotProbabilities
                  - WordSenseContracts_FallbackWordSenseModel_PrimaryWeight_OneKeepsThePrimaryZeroTakesTheFallback

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Union
                title: >-
                  FallbackWordSenseModel shall list in a combined result every slot that the primary result or the
                  fallback result lists, with the analyses of a slot that only the fallback result lists taken from the
                  fallback result.
                tags: [unit]
                justification: |
                  A part of speech that only the tagger proposes must be able to win when the encoder has no evidence
                  for it.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SlotOfOneResultOnly_CountsWithTheFloor

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Combination-Floor
                title: >-
                  FallbackWordSenseModel shall count a slot that a result does not list, or gives a probability below
                  the floor, with the floor in the combination.
                tags: [unit]
                justification: |
                  The floor keeps the combination defined for a slot that one of the two models does not list.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SlotOfOneResultOnly_CountsWithTheFloor

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Share
                title: >-
                  FallbackWordSenseModel shall give each analysis of a slot of a combined result the share of the slot
                  that it has in its own result, equal shares when the slot has no probability there.
                tags: [unit]
                justification: |
                  The combination decides the part of speech only; the split among the feature variants is evidence of
                  the encoder (or the tense split of the fallback) for the slot that stays.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_KeepsTheShareOfTheVariantsAndTheirSenses
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_KeepsTheTieSplitOfTheFallback

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Senses
                title: >-
                  FallbackWordSenseModel shall keep the senses of every analysis of the primary result in a combined
                  result.
                tags: [unit]
                justification: |
                  The ranked senses are the evidence of the encoder for the slot that stays.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_KeepsTheShareOfTheVariantsAndTheirSenses
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_ManyInputs_StayConsistent

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Variants-Kind
                title: >-
                  FallbackWordSenseModel shall keep, for every analysis of a combined result, whether its senses are
                  ranked by usage (the SensesRankedByUsage value of the analysis in the result it was taken from).
                tags: [unit]
                justification: |
                  A slot that only the fallback lists keeps the ranking by usage of the Basic model, and a slot of the
                  primary keeps its scores; losing the kind would let a later consumer take a ranking for a score.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_Reconcile_KeepsTheRankingKindOfEveryAnalysis

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Order
                title: >-
                  FallbackWordSenseModel shall list the analyses of a combined result by the probability of their slot,
                  the largest first, a tie keeping the order of the slots, and inside a slot by their own probability.
                tags: [unit]
                justification: |
                  The analyses of a result are listed by their probability, and equal values must stay deterministic.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_KeepsTheShareOfTheVariantsAndTheirSenses
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_ManyInputs_StayConsistent

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Selection
                title: >-
                  FallbackWordSenseModel shall select the first analysis of a combined result.
                tags: [unit]
                justification: |
                  The selected analysis is the best variant of the most probable slot.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_CombinesTheSlotProbabilities
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_ManyInputs_StayConsistent

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Level
                title: >-
                  FallbackWordSenseModel shall answer a combined result at the part-of-speech level, with the
                  probability of the selected slot as the confidence and no group and no sense.
                tags: [unit]
                justification: |
                  The result must still satisfy the contract of ClassifyResult: the confidence at the part-of-speech
                  level is the probability of the slot of the selected analysis.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_CombinesTheSlotProbabilities
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_ManyInputs_StayConsistent

              - id: WordSense-Core-WordSenseContracts-FallbackReconcile-Answer-Sum
                title: >-
                  FallbackWordSenseModel shall give the analyses of a combined result probabilities that sum to one.
                tags: [unit]
                justification: |
                  Every result of the contract is a distribution over its analyses.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_SlotOfOneResultOnly_CountsWithTheFloor
                  - WordSenseContracts_FallbackWordSenseModel_PartOfSpeechLevel_ManyInputs_StayConsistent

              - id: WordSense-Core-WordSenseContracts-FallbackEnsure
                title: >-
                  FallbackWordSenseModel shall implement IDownloadableWordSenseModel and forward its ensure step, with
                  the same download options and token, only to the members that implement
                  IDownloadableWordSenseModel (starting every such member before any failure is reported, and reporting
                  the exception of the first failed member unchanged), shall skip a member that lacks the capability,
                  and shall complete at once (or return a cancelled task for an already cancelled token) when no member
                  has it.
                tags: [unit]
                justification: |
                  The composition of an encoder model and the Basic model must offer the ensure step of the encoder
                  without forcing the Basic model to pretend to have files, and a typed failure of a member must reach
                  the caller unchanged so that it can be handled by type.
                tests:
                  - WordSenseContracts_FallbackWordSenseModel_IsDownloadable
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_OnlyCapableMemberEnsured
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_NoCapableMember_CompletesImmediately
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_NoCapableMemberCancelled_ReturnsCanceledTask
                  - WordSenseContracts_FallbackWordSenseModel_EnsureModelAsync_BothFail_ReportsAfterBothRan

              - id: WordSense-Core-WordSenseContracts-Model
                title: >-
                  IWordSenseModel shall provide a classification method that ensures what the model needs lazily on
                  first need and shall be disposable so that the model owns the lifetime of its resources, with
                  idempotent thread-safe disposal after which ClassifyAsync throws ObjectDisposedException, and
                  shall declare no preparation step.
                tags: [unit]
                justification: |
                  A single classification contract serves models with no files and models that download files; the
                  model owns the encoder session and downloader state, so one disposal point serves every model
                  without casts, and a model that needs no files is not forced to offer a preparation step that does
                  nothing.
                tests:
                  - WordSenseContracts_IWordSenseModel_IsDisposable
                  - WordSenseContracts_IWordSenseModel_HasNoEnsureMember
                  - WordSenseContracts_IWordSenseModel_TestDouble_IsUsableThroughTheInterface
                  - BasicWordSenseModel_ClassifyAsync_ReturnsParallelResults
                  - BasicWordSenseModel_Dispose_CalledTwice_IsHarmless
                  - BasicWordSenseModel_ClassifyAsync_AfterDispose_ThrowsObjectDisposed
                  - OnnxWordSenseModel_Dispose_CalledTwice_IsHarmless
                  - OnnxWordSenseModel_ClassifyAsync_AfterDispose_ThrowsObjectDisposed

              - id: WordSense-Core-WordSenseContracts-Downloadable
                title: >-
                  IDownloadableWordSenseModel shall extend IWordSenseModel with an asynchronous EnsureModelAsync that
                  takes optional DownloadOptions and a cancellation token and makes the files of the model available
                  and verified, so that a caller that holds only an IWordSenseModel can ask for the capability with a
                  type check, and a model that needs no files shall not offer it.
                tags: [unit]
                justification: |
                  Preparing files up front is optional (ClassifyAsync ensures lazily) and only meaningful for a model
                  that has files; a separate capability interface keeps the classification contract small, lets the
                  Basic model stay free of a no-op member, and lets code that is written against the contract reach the
                  preparation step without a concrete type.
                tests:
                  - WordSenseContracts_IDownloadableWordSenseModel_ExtendsIWordSenseModel
                  - WordSenseContracts_IDownloadableWordSenseModel_TestDouble_IsUsableThroughTheInterface
                  - BasicWordSenseModel_IsNotDownloadable
                  - OnnxWordSenseModel_IsDownloadable
                  - OnnxWordSenseModel_EnsureModelAsync_AfterDispose_ThrowsObjectDisposed

              - id: WordSense-Core-WordSenseContracts-DownloadOptions
                title: >-
                  DownloadOptions shall be an immutable sealed record describing a mirror base address, optional
                  credentials or bearer token, store location and timeout, shall accept any values at construction
                  (the model that uses them validates them), and shall never reveal secrets when converted to text.
                tags: [unit]
                justification: |
                  Logs and exception messages must not leak passwords or tokens, an immutable value is safe to share
                  between models, and validating in the model that uses the options (where the typed configuration
                  exception is produced) keeps one place that knows the rules.
                tests:
                  - WordSenseContracts_DownloadOptions_ToString_RedactsSecrets
                  - WordSenseContracts_DownloadOptions_ToString_HidesUserInfoQueryAndFragment
                  - WordSenseContracts_DownloadOptions_ToString_NeverPrintsTokenOrCredentials
                  - WordSenseContracts_DownloadOptions_IsSealedRecord
                  - WordSenseContracts_DownloadOptions_Defaults_AreNull
                  - WordSenseContracts_DownloadOptions_InvalidValues_AreNotRejectedByTheConstructor

              - id: WordSense-Core-WordSenseContracts-Exceptions
                title: >-
                  The core shall define the abstract WordSenseException and its three sealed derived types
                  ModelUnavailableException, ModelIntegrityException and DownloadConfigurationException (none of them
                  an ArgumentException), each with the constructors (), (string) and (string, Exception), so that a
                  failure of the model files or the download settings can be caught as one type or by cause and the
                  original exception is kept as the inner exception.
                tags: [unit]
                justification: |
                  Callers need to tell an unreachable model, a damaged model and a wrong setting apart without parsing
                  messages or catching platform exception types that differ between sources; one base type lets them
                  handle every such failure in one place, and keeping the original exception loses no detail.
                tests:
                  - WordSenseExceptions_WordSenseException_IsAbstractPublicException
                  - WordSenseExceptions_Hierarchy_DerivesFromWordSenseException
                  - WordSenseExceptions_Constructors_AreTheThreeStandardOnes
                  - WordSenseExceptions_Constructors_KeepMessageAndInnerException
                  - WordSenseExceptions_CatchBase_CatchesEveryTypedException

              - id: WordSense-Core-WordSenseContracts-Details
                title: >-
                  WordDetails shall describe one analysis by lemma, part of speech and inflection features, without
                  a sense id, shall find the value of a named feature (such as Tense) in its features, and
                  PartOfSpeech shall name ten parts of speech: the eight traditional ones, determiner and auxiliary.
                tags: [unit]
                justification: |
                  Callers (for example a text-to-speech front end) need the part of speech and the lemma first; the
                  sense is a separate, level-dependent part of the answer, and a feature lookup spares every caller
                  from parsing the feature string. The articles and possessives (the, a, his)
                  are among the most frequent words of English and fit none of the eight traditional values; modal and
                  primary auxiliaries (will, can, is, has) are told apart from the content verb and noun uses by an
                  auxiliary analysis.
                tests:
                  - WordSenseContracts_WordDetails_Construct_ExposesMembers
                  - WordSenseContracts_WordDetails_SameValues_AreEqual
                  - WordSenseContracts_WordDetails_TryGetFeature_FindsValue
                  - WordSenseContracts_WordDetails_TryGetFeature_MissingFeature_ReturnsFalse
                  - WordSenseContracts_PartOfSpeech_Values_AreTheTenClasses
                  - WordLexicon_Lookup_Auxiliaries_HaveAnAuxiliaryAnalysis

              - id: WordSense-Core-WordSenseContracts-SenseInfo
                title: >-
                  SenseInfo shall describe a sense by its id (lemma#label), its group id (none when the sense is in no
                  group), its lemma, its part of speech and its OEWN sense key (none for a project sense), and
                  SenseGroup shall describe a group by its id (lemma#group:label), its lemma, its part
                  of speech and the ids of its senses in inventory order (at least two, and never all the senses of
                  that lemma and part of speech), both as immutable values with value equality (a group compares the
                  content and order of its member ids), and neither shall expose a respelling.
                tags: [unit]
                justification: |
                  Callers resolve the ids of an answer to a sense or a group and read what they need (the key to reach
                  WordNet-keyed resources, the member senses of a group answer) without a model; the pronunciation-era
                  respelling has no data and is no part of the public surface.
                tests:
                  - WordSenseContracts_SenseInfo_Construct_ExposesMembers
                  - WordSenseContracts_SenseInfo_ProjectSense_HasNoKey
                  - WordSenseContracts_SenseInfo_HasNoRespellingMember
                  - WordSenseContracts_SenseGroup_Construct_ExposesMembers
                  - WordSenseContracts_SenseInfo_SameValues_AreEqual
                  - WordSenseContracts_SenseGroup_SameMembers_AreEqual

              - id: WordSense-Core-WordSenseContracts-Key-Format
                title: >-
                  ClassifyResult shall expose a computed Key that, for a known word with a selected analysis, is the
                  normalized spelling (lower case, straight apostrophe), the lemma of the selected analysis with its
                  case, the name of its part of speech and its features (left out when empty), written as
                  {spelling}|{lemma}/{Part}[/{Features}][#{label}] and derived only from the Word, IsKnown, Details,
                  Level, SenseId and Analyses of the result, so that it is the same for every model.
                tags: [unit]
                justification: |
                  A consumer that attaches its own data to an answer (for example the phonemes of a speech front end)
                  needs one stable string for each answer; deriving it from the fields of the result alone makes it
                  the same for every model, including models of third parties.
                tests:
                  - ClassifyResult_Key_SenseLevel_HasTheLabelOfTheAnsweredSense
                  - ClassifyResult_Key_EmptyFeatures_LeaveOutTheFeatureSegment
                  - ClassifyResult_Key_CapitalizedWordAndLemma_NormalizeOnlyTheSpelling
                  - ClassifyResult_Key_ContractionAndPossessive_AreKeyedBySpelling

              - id: WordSense-Core-WordSenseContracts-Key-Label
                title: >-
                  The label of the Key of a ClassifyResult shall be the label of the answered sense at the sense level,
                  otherwise that of the most probable ranked sense of the selected analysis (on equal probabilities the
                  first listed one, which is the first in inventory order) when the model ranked senses for that
                  analysis,
                  otherwise none, and never a group id.
                tags: [unit]
                justification: |
                  The sense is what tells the readings of a spelling apart, so the key names it whenever the result
                  gives or ranks one; ignoring the group ids keeps the key independent of them, which are versioned per
                  data release. The senses are listed in the order of the ranking, ties in inventory order, so the first
                  listed one is the top-ranked sense also where the usage prior gives equal probabilities (a lemma
                  without a count), and the key never names another sense than the ranking puts first.
                tests:
                  - ClassifyResult_Key_SenseLevel_HasTheLabelOfTheAnsweredSense
                  - ClassifyResult_Key_GroupId_IsNeverUsed
                  - ClassifyResult_Key_RankedSenses_FallBackToTheTopRankedSense
                  - ClassifyResult_Key_TiedRankedSenses_TakeTheFirstListed
                  - ClassifyResult_Key_RankingOfAnotherAnalysis_IsNotUsed
                  - ClassifyResult_Key_PartOfSpeechLevelWithoutRanking_HasNoLabel

              - id: WordSense-Core-WordSenseContracts-Key-Null
                title: >-
                  The Key of a ClassifyResult shall be null for an unknown word and for a result without a selected
                  analysis.
                tags: [unit]
                justification: |
                  A word that WordSense cannot analyze has no meaning to name; a null key says so without inventing a
                  string that a consumer could mistake for an answer.
                tests:
                  - ClassifyResult_Key_UnknownOrUnanswered_IsNull

              - id: WordSense-Core-WordSenseContracts-WordKey-Value
                title: >-
                  WordKey shall hold the spelling, lemma, part of speech, features and label of a key as an immutable
                  value with value equality.
                tags: [unit]
                justification: |
                  A key is used as a dictionary key and compared by consumers, so equal parts must be equal keys.
                tests:
                  - WordKey_Value_SameParts_AreEqual

              - id: WordSense-Core-WordSenseContracts-WordKey-Text
                title: >-
                  WordKey shall write its parts as {spelling}|{lemma}/{Part}[/{Features}][#{label}], with a backslash
                  before each backslash, vertical bar, slash and number sign inside a part and no other escape.
                tags: [unit]
                justification: |
                  Lemmas such as A/C contain the separators, so the text form needs an escaping rule that is
                  unambiguous.
                tests:
                  - WordKey_ToString_Parts_AreWrittenInTheCanonicalOrder
                  - WordKey_ToString_SeparatorsInParts_AreEscaped

              - id: WordSense-Core-WordSenseContracts-WordKey-Parse
                title: >-
                  WordKey.TryParse shall parse the text of a key back into the parts that WordKey wrote it from, so that
                  formatting the parsed key gives the same text.
                tags: [unit]
                justification: |
                  A consumer that stores keys parses them to read the analysis and the sense.
                tests:
                  - WordKey_TryParse_ValidKey_RoundTrips
                  - WordKey_TryParse_EscapedKey_GivesTheUnescapedParts

              - id: WordSense-Core-WordSenseContracts-WordKey-CanonicalOnly
                title: >-
                  WordKey.TryParse shall refuse a text that is not a key in canonical form: a missing or empty part,
                  an unknown part of speech, an unescaped or wrongly escaped separator, and a spelling that is not its
                  own normalized form (upper case, a typographic apostrophe or no letter).
                tags: [unit]
                justification: |
                  A parse that accepts a non-canonical text would give two keys to one meaning.
                tests:
                  - WordKey_TryParse_NotAKey_IsRefused

              - id: WordSense-Core-WordSenseContracts-KeyCompleteness-Sample
                title: >-
                  Every key that a model of this repository gives for the words of the reviewed suite and of a sample of
                  corpus sentences shall be a member of WordLexicon.Keys.
                tags: [unit]
                justification: |
                  The enumeration is guaranteed to be a superset of the keys of every model by construction: a key of a
                  result is built (WordKey.KeyOf) from an analysis of the lookup of its word and at most a catalog sense
                  of that analysis, and the enumeration (WordImage.Keys) lists the key of every analysis of every
                  spelling and of every catalog sense of its lemma and part of speech, through the same WordKey.Format
                  and normalization. The check against the real answers of the three models on real sentences is a
                  sample verification of that guarantee, not a proof; it catches a spelling, a feature or a label that
                  the construction forgot.
                tests:
                  - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated
                  - MiniLMKeys_SuiteAndCorpusSentences_AreAllEnumerated
                  - BertBaseCasedKeys_SuiteAndCorpusSentences_AreAllEnumerated

              - id: WordSense-Core-WordSenseContracts-KeyCompleteness-KnownHasKey
                title: >-
                  For the words of the reviewed suite and of a sample of corpus sentences, a model of this repository
                  shall give a word a key exactly when the word is known.
                tags: [unit]
                justification: |
                  A sample verification that the Key of a result is null only for an unknown word, so that a consumer
                  can rely on a known answer having a key.
                tests:
                  - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated
                  - MiniLMKeys_SuiteAndCorpusSentences_AreAllEnumerated
                  - BertBaseCasedKeys_SuiteAndCorpusSentences_AreAllEnumerated

              - id: WordSense-Core-WordSenseContracts-Independent
                title: The core assembly shall reference no ONNX Runtime, weights or vector library.
                tags: [unit]
                justification: |
                  Keeps the core package free of native and model dependencies.
                tests:
                  - WordSenseContracts_CoreAssembly_HasNoOnnxOrWeightsReferences
