---
# WordLexicon unit requirements (the lexicon and its embedded blob reader)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: WordLexicon Requirements
            requirements:
              - id: WordSense-Core-WordLexicon-Words
                title: >-
                  WordLexicon shall map each known lower-case surface word, including the inflected forms (plural,
                  verb, comparative and adverb forms, irregular forms included) of every dictionary word generated at
                  build time, to the immutable list of senses (lemma, part of speech, meaning and respelling) it can
                  have, so that a caller cannot change what any other caller sees.
                tags: [unit]
                justification: |
                  Callers and models look words up by their surface form; resolving inflections at build time keeps
                  look-up a single dictionary access, and the lexicon is shared by every caller in the process.
                tests:
                  - WordLexicon_Words_KnownWord_ReturnsItsSenses
                  - WordLexicon_Words_PublishedValues_CannotBeMutated
                  - WordLexicon_Words_InflectedForm_ReturnsSensesOfBase
                  - WordLexicon_Words_InflectedFormOfAnyDictionaryWord_ResolvesToLemma
                  - WordLexicon_Words_IrregularFormInDictionary_IsKnown
                  - WordLexicon_Words_WrongRegularFormOfIrregularWord_IsAbsent
                  - WordLexicon_Words_Keys_AreLowerCase
                  - WordLexicon_Words_UnknownWord_IsAbsent

              - id: WordSense-Core-WordLexicon-Complete
                title: >-
                  WordLexicon shall hold every word of the dictionary the library is built from, including the
                  determiners, the conjunctions and the interjections, each with all of its parts of speech, whatever
                  the accuracy of any model for them, and every sense of a word shall have the lemma of its first sense.
                tags: [unit]
                justification: |
                  A model's accuracy decides which sense it may choose, never whether a word exists; a word that the
                  lexicon lacks cannot be classified by any model, and the single lemma per word lets the weights of
                  one lemma cover its word.
                tests:
                  - WordLexicon_Words_ClosedClassWord_HasItsPartOfSpeechAlone
                  - WordLexicon_Words_SoAndWill_ListTheirParts
                  - WordLexicon_Words_EverySense_SharesTheLemma
                  - WordLexicon_Words_ListedFormOfHeteronym_HasOnlyItsLabeledSenses
                  - WordLexicon_Words_ReadForms_SplitByLabels
                  - WordLexicon_Words_RestrictedForm_NeverOffersExcludedSense
                  - WordSenseBuilder_Words_Committed_HoldsEveryDictionaryWord

              - id: WordSense-Core-WordLexicon-Embedded
                title: WordLexicon shall read its data from a resource embedded in the core assembly.
                tags: [unit]
                justification: |
                  An embedded lexicon needs no file, no network access and no configuration.
                tests:
                  - WordLexicon_Words_EmbeddedBlob_LoadsAndIsNotEmpty

              - id: WordSense-Core-WordLexicon-LazyLoad
                title: >-
                  WordLexicon shall load its data on first use, once, safely when many threads ask at the same time.
                tags: [unit]
                justification: |
                  Applications that never classify must not pay for loading, and a concurrent first use must neither
                  fail nor load twice.
                tests:
                  - WordLexicon_Words_ConcurrentAccess_ReturnsSameInstance

              - id: WordSense-Core-WordLexicon-Format
                title: >-
                  WordLexicon shall reject a corrupt or foreign data blob and shall share one instance among equal
                  senses.
                tags: [unit]
                justification: |
                  A damaged blob must fail loudly instead of producing wrong senses, and sharing equal senses keeps
                  the loaded lexicon small.
                tests:
                  - WordsBlob_Read_CorruptData_Throws
                  - WordsBlob_Read_UnknownMagic_Throws
                  - WordsBlob_Read_InvalidSense_Throws
                  - WordsBlob_Read_ValidBlob_SharesEqualSenses
                  - WordsBlob_Read_BrokenPayload_Throws
                  - WordsBlob_Read_MinimalValidBlob_IsAccepted
