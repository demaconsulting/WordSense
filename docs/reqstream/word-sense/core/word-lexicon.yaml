---
# WordLexicon unit requirements (the lexicon and its embedded blob reader)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: WordLexicon Requirements
            requirements:
              - id: WordSense-Core-WordLexicon-Words
                title: >-
                  WordLexicon shall map each known spelling, including the inflected forms (plural,
                  verb, comparative and adverb forms, irregular forms included) of every dictionary word generated at
                  build time, to the immutable list of analyses (sense id, lemma, part of speech and features) it can
                  have, so that a caller cannot change what any other caller sees, and shall find a word by its exact
                  spelling first and by its lower-case folding second.
                tags: [unit]
                justification: |
                  Callers and models look words up by their surface form; resolving inflections at build time keeps
                  look-up a binary search, and the lexicon is shared by every caller in the process.
                tests:
                  - WordLexicon_Lookup_KnownWord_ReturnsItsAnalyses
                  - WordLexicon_Lookup_InflectedForm_ReturnsEntryLemmaAndFeatures
                  - WordLexicon_Lookup_InflectedFormOfAnyDictionaryWord_ResolvesToLemma
                  - WordLexicon_Contains_IrregularFormInDictionary_IsKnown
                  - WordLexicon_Contains_WrongRegularFormOfIrregularWord_IsAbsent
                  - WordLexicon_FormsOf_Forms_AreLowerCase
                  - WordLexicon_Lookup_Case_FoldsToLowerCase
                  - WordLexicon_Lookup_UnknownWord_IsAbsent
                  - WordLexicon_Lookup_NullWord_Throws
                  - WordLexicon_FormsOf_Lemma_ListsItsForms
                  - WordSenseBuilder_Image_Spellings_AreSortedByUtf8Bytes
                  - WordSenseBuilder_Image_Find_ReturnsOwnIndex

              - id: WordSense-Core-WordLexicon-Possessives
                title: >-
                  WordLexicon shall, when a possessive spelling (a word plus 's, or a plural word plus a closing
                  apostrophe, with a straight or typographic apostrophe) is not stored but its stem is known, return the
                  analyses of the stem with the possessive feature added to their features, and shall keep contractions
                  a closed list of stored words.
                tags: [unit]
                justification: |
                  A possessive is a regular, open-ended pattern; the 's is a separate token by the tokenizer
                  contract, so the fallback only serves callers that look up whole spellings.
                tests:
                  - WordLexicon_Lookup_PossessiveOfKnownWord_AddsPossessiveFeature
                  - WordLexicon_Lookup_StoredContractionOrUnknownStem_IsNotPossessive

              - id: WordSense-Core-WordLexicon-Facts
                title: >-
                  WordLexicon shall resolve the linguistic facts of a fixed test set derived from dictionary sources
                  (irregular forms, participles and gerunds, possessives, contractions and words an earlier rebuild
                  lost) to the lemma, part of speech and features the set lists.
                tags: [unit]
                justification: |
                  The facts are independent of any evaluation sentence, so they guard the lexicon without rewarding
                  tuning to a score.
                tests:
                  - WordLexicon_Lookup_Fact_Holds
                  - LexiconFacts_File_CoversEveryCategory
                  - WordLexicon_Lookup_FormsLostByEarlierRebuild_ResolveToTheirLemma

              - id: WordSense-Core-WordLexicon-Complete
                title: >-
                  WordLexicon shall hold every word of the dictionary the library is built from, including the
                  determiners, the conjunctions and the interjections, each with all of its parts of speech, whatever
                  the accuracy of any model for them, and every sense of a word shall have the lemma of its first sense
                  or be the word's own extra (the word itself as lemma, no sense id).
                tags: [unit]
                justification: |
                  A model's accuracy decides which sense it may choose, never whether a word exists; a word that the
                  lexicon lacks cannot be classified by any model, and the single lemma of the trained senses lets the
                  weights of one lemma cover its word. A form may have several lemmas (<c>lives</c> is a verb of
                  <c>live</c> and the plural of <c>life</c>), so a part of speech that its labels do not cover is
                  an untrained extra of the form itself, never a sense of the lemma that the labels excluded.
                tests:
                  - WordLexicon_Lookup_ClosedClassWord_HasItsPartOfSpeechAlone
                  - WordLexicon_Lookup_SoAndWill_ListTheirParts
                  - WordLexicon_Lookup_FormWithSeveralLemmas_ListsEach
                  - WordLexicon_Lookup_FormOfHeteronym_HasOnlyItsSenses
                  - WordLexicon_Lookup_ReadForms_SplitBySense
                  - WordLexicon_Lookup_RestrictedForm_NeverOffersExcludedSense
                  - WordLexicon_Lookup_FormsWithTrainedLemmaDifferentFromEntry_UseFixedLemmas
                  - WordLexicon_Lookup_Auxiliaries_HaveTrailingAuxiliaryAnalysis
                  - WordSenseBuilder_Words_Committed_HoldsEveryDictionaryWord
                  - WordSenseBuilder_Words_Committed_FormSensesFollowLabelsThenOwnExtras
                  - WordSenseBuilder_Words_Committed_RestrictedFormsGainTheirOwnExtra

              - id: WordSense-Core-WordLexicon-Embedded
                title: WordLexicon shall read its data from a resource embedded in the core assembly.
                tags: [unit]
                justification: |
                  An embedded lexicon needs no file, no network access and no configuration.
                tests:
                  - WordLexicon_Count_EmbeddedImage_LoadsAndIsNotEmpty

              - id: WordSense-Core-WordLexicon-LazyLoad
                title: >-
                  WordLexicon shall load its data on first use, once, safely when many threads ask at the same time.
                tags: [unit]
                justification: |
                  Applications that never classify must not pay for loading, and a concurrent first use must neither
                  fail nor load twice.
                tests:
                  - WordLexicon_Lookup_ConcurrentAccess_ReturnsSameAnswers

              - id: WordSense-Core-WordLexicon-Format
                title: >-
                  WordLexicon shall reject a corrupt or foreign word image (wrong magic or version, content hash
                  mismatch, invalid section).
                tags: [unit]
                justification: |
                  A damaged image must fail loudly instead of producing wrong senses.
                tests:
                  - WordSenseBuilder_Image_Corruption_IsRejected
                  - WordSenseBuilder_Image_TruncatedAtEverySectionBoundary_IsRejected
                  - WordSenseBuilder_Image_WrongHash_IsRejectedByContentHashOnly
                  - WordSenseBuilder_Image_CountMismatch_IsRejected
