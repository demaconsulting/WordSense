---
# BasicTables unit requirements (the embedded statistics of the Basic model)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: BasicTables Requirements
            requirements:
              - id: WordSense-Core-BasicTables-Load
                title: >-
                  BasicTables shall read the transition statistics, the tabled words with their closed-class masks,
                  the suffix statistics and the cue statistics, keyed by training lemma with the analyses (lemma, part
                  of speech and features) as columns, from the compressed table, shall find the cue table of a word
                  first by the normalized word and then by the lemma of its first analysis, shall match an analysis
                  to the column of its lemma and part of speech whose feature items are all contained in the features
                  of the analysis, the column with the most items winning, so that a column with empty features, which
                  stands for any features, serves every analysis of that lemma and part of speech that no column of more
                  specific features claims, and shall reject a table with a wrong
                  signature (the magic WSB3), no compression, missing data, extra data or unordered entries as invalid
                  data, and a table
                  built for another analysis inventory (inventory hash), an unknown analysis or a duplicate analysis.
                tags: [unit]
                justification: |
                  A damaged or foreign table must fail loudly at load time instead of producing wrong answers, and a
                  table that names its analyses must be rebuilt whenever the inventory changes. A form that spans
                  lemmas (left, bases) needs a table of its own, and an analysis with features (the past participle of
                  read) must not fall into the column of a different analysis of the same lemma.
                tests:
                  - BasicTables_Load_ToyTable_ReadsContent
                  - BasicTables_Load_Transitions_AreDistributions
                  - BasicTables_FindSuffix_KnownAndUnknown
                  - BasicTables_Load_BadMagic_Throws
                  - BasicTables_Load_NotCompressed_Throws
                  - BasicTables_Load_Truncated_Throws
                  - BasicTables_Load_TruncatedAtEveryLength_Throws
                  - BasicTables_Load_WrongVersionOrTagCount_Throws
                  - BasicTables_Load_TrailingBytes_Throws
                  - BasicTables_Load_UnorderedHashes_Throws
                  - BasicTables_Load_OtherInventoryHash_ThrowsNamingBothHashes
                  - BasicTables_Load_UnknownAnalysis_Throws
                  - BasicTables_Load_DuplicateAnalysis_Throws
                  - LemmaCue_RowOf_Analysis_UsesTheColumnOfItsFeatures
                  - FeatureRef_Hash_PrefixAndDeterminism

              - id: WordSense-Core-BasicTables-Embedded
                title: >-
                  BasicTables shall provide a default instance read from the table embedded in the package, without
                  files or network access.
                tags: [unit]
                justification: |
                  The package must work with nothing but its own assembly.
                tests:
                  - BasicTables_Default_LoadsEmbeddedTable
                  - BasicTables_Default_ShippedTable_ResolvesEveryCueClass
