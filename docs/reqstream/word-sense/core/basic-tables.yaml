---
# BasicTables unit requirements (the embedded statistics of the Basic model)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: BasicTables Requirements
            requirements:
              - id: WordSense-Core-BasicTables-Load
                title: >-
                  BasicTables shall read the transition statistics, the tabled words with their closed-class masks,
                  the suffix statistics and the cue statistics, keyed by training lemma with the analyses (lemma, part
                  of speech and features) as columns, from the compressed table, shall find the cue table of a word
                  first by the normalized word and then by the lemma of its first analysis, shall match an analysis
                  to the column of its lemma and part of speech whose feature items are all contained in the features
                  of the analysis, the column with the most items winning, so that a column with empty features, which
                  stands for any features, serves every analysis of that lemma and part of speech that no column of more
                  specific features claims, and shall reject a table with a wrong
                  signature (the magic WSB7), no compression, missing data, extra data or unordered
                  entries as invalid
                  data, and a table
                  built for another analysis inventory (inventory hash), an unknown analysis or a duplicate analysis.
                tags: [unit]
                justification: |
                  A damaged or foreign table must fail loudly at load time instead of producing wrong answers, and a
                  table that names its analyses must be rebuilt whenever the inventory changes. A form that spans
                  lemmas (left, bases) needs a table of its own, and an analysis with features (the past participle of
                  read) must not fall into the column of a different analysis of the same lemma.
                tests:
                  - BasicTables_Load_ToyTable_ReadsContent
                  - BasicTables_Load_Transitions_AreDistributions
                  - BasicTables_TryFindSuffix_KnownAndUnknown
                  - BasicTables_Load_BadMagic_Throws
                  - BasicTables_Load_NotCompressed_Throws
                  - BasicTables_Load_Truncated_Throws
                  - BasicTables_Load_TruncatedAtEveryLength_Throws
                  - BasicTables_Load_WrongVersionOrTagCount_Throws
                  - BasicTables_Load_TrailingBytes_Throws
                  - BasicTables_Load_BytesAfterCompressedStream_Throws
                  - BasicTables_Load_UnorderedHashes_Throws
                  - BasicTables_Load_OtherInventoryHash_ThrowsNamingBothHashes
                  - BasicTables_Load_UnknownAnalysis_Throws
                  - BasicTables_Load_DuplicateAnalysis_Throws
                  - LemmaCue_RowOf_Analysis_UsesTheColumnOfItsFeatures
                  - FeatureRef_Hash_PrefixAndDeterminism

              - id: WordSense-Core-BasicTables-Tense
                title: >-
                  BasicTables shall carry the tense model of the Basic model in its table: the weight of the model in
                  the header and the shared tense table (a signed quantized prior, ascending feature hashes and one
                  signed quantized weight per hash), as the child requirements state.
                tags: [unit]
                justification: |
                  The tense of a verb is decided from this table for every verb whose past and non-past share a
                  spelling; a damaged section must fail at load time, not give wrong tenses. A parent requirement
                  carries the statement once; the child requirements state each behavior that can be tested on its
                  own.
                children:
                  - WordSense-Core-BasicTables-Tense-Load
                  - WordSense-Core-BasicTables-Tense-ReadOnly
                  - WordSense-Core-BasicTables-Tense-NoTable
                  - WordSense-Core-BasicTables-Tense-Malformed
                  - WordSense-Core-BasicTables-Tense-Truncated
                  - WordSense-Core-BasicTables-Tense-Wsb3

              - id: WordSense-Core-BasicTables-Tense-Load
                title: >-
                  BasicTables shall read the weight of the tense model from the header and, from the tense section,
                  the prior, the ascending feature hashes and the weights of the shared tense table, and expose them.
                tags: [unit]
                justification: |
                  The classifier scores the context of a verb from exactly these values.
                tests:
                  - BasicTables_Load_TenseTable_ReadsWeightPriorHashesAndWeights

              - id: WordSense-Core-BasicTables-Tense-ReadOnly
                title: >-
                  BasicTables shall expose the hashes and weights of the tense table only as read-only views, and the
                  tense table shall refuse default (uninitialized) arrays and arrays of different lengths.
                tags: [unit]
                justification: |
                  One table is shared by every classifier and thread in the process; a consumer that could change an
                  exposed array would change the answers of all the others.
                tests:
                  - BasicTables_Properties_ExposeNoArrays
                  - TenseCue_Constructor_DefaultOrUnequalArrays_Throws

              - id: WordSense-Core-BasicTables-Tense-NoTable
                title: >-
                  BasicTables shall give a table without a tense section no tense table (null) and the default tense
                  weight 1.
                tags: [unit]
                justification: |
                  A table without the model must load, and the classifier leaves its words unchanged.
                tests:
                  - BasicTables_Load_WithoutTenseSection_HasNoTenseTableAndTheDefaultWeight

              - id: WordSense-Core-BasicTables-Tense-Malformed
                title: >-
                  BasicTables shall reject a tense section with an unknown flag, without a feature, with unordered
                  hashes or with fewer weights than hashes as invalid data.
                tags: [unit]
                justification: |
                  A damaged section must fail at load time, not give wrong tenses.
                tests:
                  - BasicTables_Load_InvalidTenseSection_Throws

              - id: WordSense-Core-BasicTables-Tense-Truncated
                title: >-
                  BasicTables shall reject a table with a tense section that is cut at any byte as invalid data.
                tags: [unit]
                justification: |
                  A truncated download or file must never be read as a smaller valid table.
                tests:
                  - BasicTables_Load_TenseTableTruncatedAtEveryLength_Throws

              - id: WordSense-Core-BasicTables-Tense-Wsb3
                title: >-
                  BasicTables shall reject a table with the retired signature WSB3, which has no tense weight and no
                  tense table, as an unknown format whatever else it holds.
                tags: [unit]
                justification: |
                  A table that was trained before the tense model must never be read as a current one.
                tests:
                  - BasicTables_Load_PreviousFormatWsb3_ThrowsUnknownFormat

              - id: WordSense-Core-BasicTables-Clause
                title: >-
                  BasicTables shall carry the clause state of the tagger in its table: the smoothing of the clause state
                  in the header and the bigram and trigram counts of the positions whose clause already has a verb, and
                  the transition probabilities of both clause states derived from them, as the child requirements
                  state.
                tags: [unit]
                justification: |
                  A verb follows a determiner and a noun four times as often in a clause without a verb as in one with
                  a verb, so the tagger needs the transitions of each state. A parent requirement carries the statement
                  once; the child requirements state each behavior that can be tested on its own.
                children:
                  - WordSense-Core-BasicTables-Clause-Counts
                  - WordSense-Core-BasicTables-Clause-Smoothing
                  - WordSense-Core-BasicTables-Clause-Transition
                  - WordSense-Core-BasicTables-Clause-TransitionCounts
                  - WordSense-Core-BasicTables-Clause-NoCounts
                  - WordSense-Core-BasicTables-Clause-SmoothingWeight
                  - WordSense-Core-BasicTables-Clause-BigramAboveTotal
                  - WordSense-Core-BasicTables-Clause-TrigramAboveTotal
                  - WordSense-Core-BasicTables-Clause-Wsb4

              - id: WordSense-Core-BasicTables-Clause-Counts
                title: >-
                  BasicTables shall read the bigram and trigram counts of the positions whose clause already has a verb
                  from the table and expose them next to the total counts.
                tags: [unit]
                justification: |
                  The counts of the positions without a verb are the difference to the totals, and the transitions of
                  both clause states are derived from exactly these numbers.
                tests:
                  - BasicTables_Load_ClauseCounts_AreExposed

              - id: WordSense-Core-BasicTables-Clause-Smoothing
                title: >-
                  BasicTables shall read the smoothing of the clause state from the header of the table and expose it.
                tags: [unit]
                justification: |
                  The smoothing is a hyper-parameter of the trained table, so the runtime must use the value that the
                  table carries.
                tests:
                  - BasicTables_Load_ClauseSmoothing_IsRead

              - id: WordSense-Core-BasicTables-Clause-Transition
                title: >-
                  BasicTables shall derive for each clause state transition probabilities that are a probability
                  distribution over the next tag for every context that has been observed.
                tags: [unit]
                justification: |
                  The tagger multiplies and adds these probabilities along every path of a sentence, so each row must be
                  a distribution.
                tests:
                  - BasicTables_Load_ClauseTransitions_AreDistributions

              - id: WordSense-Core-BasicTables-Clause-TransitionCounts
                title: >-
                  BasicTables shall derive the transition probabilities of a clause state from the counts of that state,
                  so that a tag that follows a context more often in one state than in the other is more probable in
                  the first state.
                tags: [unit]
                justification: |
                  A verb follows a determiner and a noun more often in a clause without a verb than in a clause that has
                  one; the state must carry that difference.
                tests:
                  - BasicTables_Load_ClauseTransitions_FollowTheClauseCounts

              - id: WordSense-Core-BasicTables-Clause-NoCounts
                title: >-
                  BasicTables shall give both clause states the unconditioned transition probabilities when the table
                  has no clause counts.
                tags: [unit]
                justification: |
                  A table without clause counts must behave like a tagger without the clause state.
                tests:
                  - BasicTables_Load_ClauseTransitions_WithoutClauseCounts_AreTheUnconditioned

              - id: WordSense-Core-BasicTables-Clause-SmoothingWeight
                title: >-
                  BasicTables shall mix the transition probabilities of a clause state with the unconditioned
                  transition probabilities by the weight m / (m + smoothing), where m is the number of trigram counts
                  of the context in that state, so that a larger smoothing moves them toward the unconditioned
                  probabilities.
                tags: [unit]
                justification: |
                  A context that was seen rarely in a state must not be estimated from a handful of counts; the weight
                  is 0 where the state has no count, and a finite smoothing approaches but never reaches the
                  unconditioned probabilities where it has.
                tests:
                  - BasicTables_Load_ClauseSmoothing_MovesTheTransitionsTowardTheUnconditioned
                  - BasicTables_Load_ClauseSmoothing_WeighsTheContextByItsCountInTheState

              - id: WordSense-Core-BasicTables-Clause-BigramAboveTotal
                title: >-
                  BasicTables shall reject a table with a clause bigram count that is larger than the total count of the
                  same bigram as invalid data.
                tags: [unit]
                justification: |
                  The counts of the positions without a verb are the difference to the totals, so a larger clause count
                  is damage, not data.
                tests:
                  - BasicTables_Load_ClauseBigramAboveTotal_Throws

              - id: WordSense-Core-BasicTables-Clause-TrigramAboveTotal
                title: >-
                  BasicTables shall reject a table with a clause trigram count that is larger than the total count of
                  the same trigram as invalid data.
                tags: [unit]
                justification: |
                  The counts of the positions without a verb are the difference to the totals, so a larger clause count
                  is damage, not data.
                tests:
                  - BasicTables_Load_ClauseTrigramAboveTotal_Throws

              - id: WordSense-Core-BasicTables-Clause-Wsb4
                title: >-
                  BasicTables shall reject a table with the retired signature WSB4, which has no clause counts and no
                  clause smoothing, as an unknown format whatever else it holds.
                tags: [unit]
                justification: |
                  A table that was trained before the clause state must never be read as a current one.
                tests:
                  - BasicTables_Load_PreviousFormatWsb4_ThrowsUnknownFormat

              - id: WordSense-Core-BasicTables-Prior-Share
                title: >-
                  BasicTables shall expose the share of the word prior that its header carries.
                tags: [unit]
                justification: |
                  The prior is computed at run time from the word image, so only its numbers travel with the table.
                tests:
                  - BasicTables_Load_PriorShare_ReadBack

              - id: WordSense-Core-BasicTables-Prior-Smoothing
                title: >-
                  BasicTables shall expose the smoothing of each lemma and part of speech of the word prior that its
                  header carries.
                tags: [unit]
                justification: |
                  The number is chosen with the other hyper-parameters of the table and must be read back exactly.
                tests:
                  - BasicTables_Load_PriorSmoothing_ReadBack

              - id: WordSense-Core-BasicTables-Prior-Senses
                title: >-
                  BasicTables shall expose the weight of each sense of the word prior that its header carries.
                tags: [unit]
                justification: |
                  The number is chosen with the other hyper-parameters of the table and must be read back exactly.
                tests:
                  - BasicTables_Load_PriorSenses_ReadBack

              - id: WordSense-Core-BasicTables-Prior-Exponent
                title: >-
                  BasicTables shall expose the exponent of the word prior that its header carries.
                tags: [unit]
                justification: |
                  The number is chosen with the other hyper-parameters of the table and must be read back exactly.
                tests:
                  - BasicTables_Load_PriorExponent_ReadBack

              - id: WordSense-Core-BasicTables-Prior-ShareInvalid
                title: >-
                  BasicTables shall reject a table whose word prior share is outside 0 to 1 as invalid data.
                tags: [unit]
                justification: |
                  A share outside its range would make a probability negative or above its bound.
                tests:
                  - BasicTables_Load_PriorShareOutOfRange_Throws

              - id: WordSense-Core-BasicTables-Prior-SmoothingInvalid
                title: >-
                  BasicTables shall reject a table whose word prior has a negative smoothing as invalid data.
                tags: [unit]
                justification: |
                  A negative smoothing could make the weight of a part of speech negative.
                tests:
                  - BasicTables_Load_PriorSmoothingNegative_Throws

              - id: WordSense-Core-BasicTables-Prior-SensesInvalid
                title: >-
                  BasicTables shall reject a table whose word prior has a negative sense weight as invalid data.
                tags: [unit]
                justification: |
                  A negative sense weight could make the weight of a part of speech negative.
                tests:
                  - BasicTables_Load_PriorSensesNegative_Throws

              - id: WordSense-Core-BasicTables-Prior-ExponentInvalid
                title: >-
                  BasicTables shall reject a table whose word prior exponent is not positive or is above 16 as invalid
                  data.
                tags: [unit]
                justification: |
                  An exponent that is not positive inverts or removes the evidence, and a very large one overflows the
                  weights.
                tests:
                  - BasicTables_Load_PriorExponentOutOfRange_Throws
                  - BasicTables_Load_LargestPriorExponent_Loads

              - id: WordSense-Core-BasicTables-Prior-WeightInvalid
                title: >-
                  BasicTables shall reject a table whose word prior share is above 0 and whose smoothing and sense
                  weight are both 0 as invalid data.
                tags: [unit]
                justification: |
                  A prior that is on needs a positive weight for every part of speech, or a part of speech could
                  weigh 0.
                tests:
                  - BasicTables_Load_PriorOnWithoutWeight_Throws

              - id: WordSense-Core-BasicTables-Reliability
                title: >-
                  BasicTables shall expose the reliability of every cue table as a factor from 0 to 1.
                tags: [unit]
                justification: |
                  The classifier scales the scores of a cue table by its reliability, so it needs the value with the
                  table.
                tests:
                  - BasicTables_Load_CueReliability_ReadBack

              - id: WordSense-Core-BasicTables-Wsb5
                title: >-
                  BasicTables shall reject a table with the retired signature WSB5, which has no word prior and no
                  reliability of the cue tables, as an unknown format whatever else it holds.
                tags: [unit]
                justification: |
                  The header of that format is shorter, so reading it as a current table would shift every later
                  value; a table in that format must never be read as a current one.
                tests:
                  - BasicTables_Load_PreviousFormatWsb5_ThrowsUnknownFormat

              - id: WordSense-Core-BasicTables-Wsb6
                title: >-
                  BasicTables shall reject a table with the retired signature WSB6, which has no noun/verb weight and
                  no noun/verb table, as an unknown format whatever else it holds.
                tags: [unit]
                justification: |
                  The header of that format is shorter, so reading it as a current table would shift every later
                  value; a table in that format must never be read as a current one.
                tests:
                  - BasicTables_Load_PreviousFormatWsb6_ThrowsUnknownFormat

              - id: WordSense-Core-BasicTables-NounVerb
                title: >-
                  BasicTables shall read the weight of the noun/verb model from the header and, from the noun/verb
                  section, the ascending feature hashes and the one signed quantized weight per hash of the shared
                  noun/verb table, and expose them.
                tags: [unit]
                justification: |
                  The noun slot and the verb slot of a word that has both are shifted from exactly these values.
                tests:
                  - BasicTables_Load_NounVerbTable_ReadsWeightHashesAndWeights
                children:
                  - WordSense-Core-BasicTables-NounVerb-ReadOnly
                  - WordSense-Core-BasicTables-NounVerb-NoTable
                  - WordSense-Core-BasicTables-NounVerb-Malformed
                  - WordSense-Core-BasicTables-NounVerb-Truncated
                  - WordSense-Core-BasicTables-NounVerb-WeightInvalid
                  - WordSense-Core-BasicTables-NounVerb-Shipped
                  - WordSense-Core-BasicTables-Wsb6

              - id: WordSense-Core-BasicTables-NounVerb-ReadOnly
                title: >-
                  BasicTables shall expose the hashes and weights of the noun/verb table only as read-only views, and
                  the noun/verb table shall refuse default (uninitialized) arrays and arrays of different lengths.
                tags: [unit]
                justification: |
                  One table is shared by every classifier and thread in the process; a consumer that could change an
                  exposed array would change the answers of all the others.
                tests:
                  - BasicTables_Properties_ExposeNoArrays
                  - NounVerbCue_Constructor_DefaultOrUnequalArrays_Throws

              - id: WordSense-Core-BasicTables-NounVerb-NoTable
                title: >-
                  BasicTables shall give a table without a noun/verb section no noun/verb table (null).
                tags: [unit]
                justification: |
                  A table without the model must load, and the classifier leaves its words unchanged.
                tests:
                  - BasicTables_Load_WithoutNounVerbSection_HasNoNounVerbTable

              - id: WordSense-Core-BasicTables-NounVerb-Malformed
                title: >-
                  BasicTables shall reject a noun/verb section with an unknown flag, without a feature, with unordered
                  hashes or with fewer weights than hashes as invalid data.
                tags: [unit]
                justification: |
                  A damaged section must fail at load time, not give wrong parts of speech.
                tests:
                  - BasicTables_Load_InvalidNounVerbSection_Throws

              - id: WordSense-Core-BasicTables-NounVerb-Truncated
                title: >-
                  BasicTables shall reject a table with a noun/verb section that is cut at any byte as invalid data.
                tags: [unit]
                justification: |
                  A truncated download or file must never be read as a smaller valid table.
                tests:
                  - BasicTables_Load_NounVerbTableTruncatedAtEveryLength_Throws

              - id: WordSense-Core-BasicTables-NounVerb-WeightInvalid
                title: >-
                  BasicTables shall reject a table whose header carries a negative weight of the noun/verb model as
                  invalid data.
                tags: [unit]
                justification: |
                  A negative weight would turn the evidence of the context upside down.
                tests:
                  - BasicTables_Load_NounVerbWeightNegative_Throws

              - id: WordSense-Core-BasicTables-NounVerb-Shipped
                title: >-
                  BasicTables shall provide, in the default instance, the shared tense table and the shared noun/verb
                  table with a positive weight each.
                tags: [unit]
                justification: |
                  The embedded table is what every application runs; a table without the two shared models would
                  silently lose their evidence.
                tests:
                  - BasicTables_Default_CarriesTheTenseAndNounVerbTables

              - id: WordSense-Core-BasicTables-Immutable
                title: >-
                  BasicTables shall expose its statistics, and those of its word entries and cue tables, only as
                  read-only views that a consumer cannot write through, and shall give a loaded table that does not
                  depend on the blob it was read from.
                tags: [unit]
                justification: |
                  One table is shared by every classifier and thread in the process; a consumer that could change an
                  exposed array would change the answers of all the others.
                tests:
                  - BasicTables_Properties_ExposeNoArrays
                  - BasicTables_Load_Views_AreIndependentOfTheBlob
                  - BasicTables_Constructors_DefaultArray_Throws

              - id: WordSense-Core-BasicTables-Embedded
                title: >-
                  BasicTables shall provide a default instance read from the table embedded in the package, without
                  files or network access.
                tags: [unit]
                justification: |
                  The package must work with nothing but its own assembly.
                tests:
                  - BasicTables_Default_LoadsEmbeddedTable
                  - BasicTables_Default_ShippedTable_ResolvesEveryCueClass

              - id: WordSense-Core-BasicTables-Integrity
                title: >-
                  BasicTables shall report a missing, corrupt or foreign embedded table as ModelIntegrityException that
                  carries the original InvalidDataException as inner exception.
                tags: [unit]
                justification: |
                  The embedded table is part of the built-in model; a damaged or mismatched package must surface as the
                  typed integrity failure that callers handle.
                tests:
                  - BasicTables_LoadEmbedded_EmbeddedResource_Loads
                  - BasicTables_LoadEmbedded_MissingResource_ThrowsModelIntegrity
                  - BasicTables_LoadEmbedded_CorruptOrForeignResource_ThrowsModelIntegrity
                  - BasicTables_LoadEmbedded_RealTableWithAlteredRegion_ThrowsModelIntegrity
