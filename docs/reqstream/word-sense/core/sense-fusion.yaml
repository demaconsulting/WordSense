---
# SenseFusion unit requirements (combination of evidence in the Basic model)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: SenseFusion Requirements
            requirements:
              - id: WordSense-Core-SenseFusion-Fuse
                title: >-
                  SenseFusion shall combine the part-of-speech probabilities and the cue scores of the candidate
                  analyses into one probability per analysis, each greater than 0 and at most 1 and summing to 1,
                  and identify the most probable analysis (the winner), with ties going to the lowest index; the
                  candidates of one lemma and part of speech that have no cue score are not separated by the
                  context, so together they shall weigh as one candidate, and a part of speech shall never be favored
                  merely because its analyses differ in features. The confidence of a result is built from these
                  probabilities by the classifier, as the probability of the lemma and part of speech of the selected
                  analysis.
                tags: [unit]
                justification: |
                  Both kinds of evidence are needed: part of speech separates analyses of different parts of speech and
                  cues separate analyses within one. Without cue evidence the feature variants of a part of speech
                  (cut as an infinitive and as a past tense) carry the same evidence, which must not be counted once per
                  variant.
                tests:
                  - SenseFusion_Fuse_PosPosteriorDecides
                  - SenseFusion_Fuse_CuesSeparateSamePartOfSpeechAnalyses
                  - SenseFusion_Fuse_NoPosMass_IsUniform
                  - SenseFusion_Fuse_VariantsWithoutCues_ShareTheWeightOfOneCandidate
                  - SenseFusion_Fuse_VariantsWithCues_KeepTheirWeights
                  - SenseFusion_Fuse_VariantsOfWhichOneHasNoCue_ShareTheFillWeight

              - id: WordSense-Core-SenseFusion-Stable
                title: >-
                  SenseFusion shall give finite probabilities that stay above 0 and sum to 1 for extreme scores, and
                  shall reject a default (uninitialized) analysis array with an argument-null error.
                tags: [unit]
                justification: |
                  Large score differences must not produce invalid confidences or a probability of exactly zero, and
                  misuse must fail fast with the documented exception.
                tests:
                  - SenseFusion_Fuse_ExtremeScores_StayFinite
                  - SenseFusion_Fuse_ExtremeScores_StayAboveZeroAndSumToOne
                  - SenseFusion_Fuse_DefaultAnalyses_Throws
