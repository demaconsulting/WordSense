---
# BasicClassifier unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: BasicClassifier Requirements
            requirements:
              - id: WordSense-Core-BasicClassifier-Unknown
                title: >-
                  BasicClassifier shall answer a word that has no lexicon entry, or no letter, as unknown (not known, no
                  analysis, no details, level none and confidence 0).
                tags: [unit]
                justification: |
                  An unknown word must be distinguishable from a known one.
                tests:
                  - BasicClassifier_ClassifyAsync_UnknownWord_ReturnsNoDetails
                  - BasicClassifier_ClassifyAsync_UnknownWord_HasNoAnalyses
                  - BasicClassifier_ClassifyAsync_CapitalizedWordNotInLexicon_IsUnknown

              - id: WordSense-Core-BasicClassifier-Known
                title: >-
                  BasicClassifier shall answer every word that has a lexicon entry, a number word such as one or twenty
                  included, with details.
                tags: [unit]
                justification: |
                  A known word must never be reported as unknown; the test is the presence of a lexicon entry, not the
                  kind of token.
                tests:
                  - BasicClassifier_ClassifyAsync_NumberWord_ReturnsDetails

              - id: WordSense-Core-BasicClassifier-SingleSense
                title: >-
                  BasicClassifier shall answer a word whose selected analysis has exactly one sense (a lemma and part
                  of speech with a single sense, a determiner such as the among them) at the sense level with that
                  sense, and shall list that sense with probability 1 in every analysis that has exactly one sense,
                  whatever the case of the word.
                tags: [unit]
                justification: |
                  A sense without alternatives needs no context and no evidence.
                tests:
                  - BasicClassifier_ClassifyAsync_SingleSenseWord_ReturnsEntryWithFullConfidence
                  - BasicClassifier_ClassifyAsync_SingleSenseAnalysis_ListsThatSenseWithProbabilityOne
                  - BasicWordSenseModel_ClassifyAsync_LexiconOnlyWords_NeverNeedEnsure

              - id: WordSense-Core-BasicClassifier-Resolve
                title: >-
                  BasicClassifier shall give every word with several analyses a probability for each analysis from the
                  fused part-of-speech and context-cue evidence, with the best analysis of the most probable lemma and
                  part of speech (slot) as the selected analysis and the probability of that slot (the sum of the
                  probabilities of its feature variants) as the confidence, and shall give a word with a single
                  analysis that analysis with probability 1 and confidence 1.
                tags: [unit]
                justification: |
                  This is the statistical disambiguation that the package provides; the probabilities let callers apply
                  their own policy instead of the classifier abstaining, and a word with one analysis needs no
                  evidence. The confidence is the probability of the slot because the slot owns the senses and the
                  split of a slot among feature variants must not lower it.
                tests:
                  - BasicClassifier_ClassifyAsync_AmbiguousWord_AlwaysAnswersWithProbability
                  - BasicClassifier_ClassifyAsync_Context_ChoosesPartOfSpeech
                  - BasicClassifier_ClassifyAsync_Context_SelectsTheMostProbableAnalysis
                  - BasicClassifier_ClassifyAsync_SingleAnalysisWithManySenses_AnswersItWithConfidenceOne
                  - BasicWordSenseModel_ClassifyAsync_AuxiliaryContext_AnswersAuxiliary
                  - BasicWordSenseModel_ClassifyAsync_CopulaBe_AnswersMainVerb
                  - BasicWordSenseModel_ClassifyAsync_NounContext_StaysNoun
                  - BasicWordSenseModel_ClassifyAsync_NeedAsMainVerb_IsNotAuxiliary
                  - SenseFusion_Fuse_AuxiliaryPosterior_SelectsAuxiliaryAnalysis
                  - BasicClassifier_ClassifyAsync_SamePartOfSpeechAnalyses_UsesCues

              - id: WordSense-Core-BasicClassifier-Level
                title: >-
                  BasicClassifier shall state the level of every answer: the part of speech level, with the probability
                  of the lemma and part of speech (the sum of the probabilities of the feature variants) of the selected
                  analysis as confidence, for an analysis chosen statistically whose lemma and part of speech have
                  several senses; the sense level, with the same confidence, only when the selected analysis
                  has exactly one sense; and level none for an unknown word; it shall never answer at the group level.
                tags: [unit]
                justification: |
                  The statistical model has no evidence that separates fine senses or groups; stating the level honestly
                  lets callers treat its answers for what they are, and a known word is never left unanswered. The
                  confidence is built on the lemma and part of speech because they own the senses: the split of a
                  slot among feature variants (deer as a singular and a plural) must not halve it.
                tests:
                  - BasicClassifier_ClassifyAsync_AmbiguousWord_AnswersPartOfSpeechLevel
                  - BasicClassifier_ClassifyAsync_SingleSensePart_AnswersSenseLevel
                  - BasicClassifier_ClassifyAsync_NeverAnswersGroupLevel
                  - BasicClassifier_ClassifyAsync_UnknownWord_AnswersLevelNone
                  - BasicClassifier_ClassifyAsync_VariantsOfTheOnlySlot_AreAnsweredWithConfidenceOne

              - id: WordSense-Core-BasicClassifier-Candidates
                title: >-
                  BasicClassifier shall list the analyses of every known word never truncated and summing to one, the
                  lemmas and parts of speech (slots) by the sum of the probabilities of their analyses, the largest
                  first, and the analyses of one slot (feature variants that share its senses and its probability) by
                  their own probability, the largest first, with ties in lexicon order, so that the first analysis is
                  the best variant of the most probable slot.
                tags: [unit]
                justification: |
                  The full ranked analyses let a consumer make its own choice among them. The variants of a slot are
                  listed together, so that a part of speech with several feature variants neither wins nor loses the
                  selection because of their number.
                tests:
                  - BasicClassifier_ClassifyAsync_AmbiguousWord_ListsAnalysesAndNoSenses
                  - BasicClassifier_ClassifyAsync_TiesKeepLexiconOrder
                  - BasicClassifier_ClassifyAsync_VariantsOfASlot_ShareItsProbabilityAndStayTogether

              - id: WordSense-Core-BasicClassifier-Candidates-SingleSense
                title: >-
                  BasicClassifier shall list in an analysis whose lemma and part of speech have exactly one sense that
                  sense with probability 1.
                tags: [unit]
                justification: |
                  The one sense of a single-sense analysis is certain and needs no evidence.
                tests:
                  - BasicClassifier_ClassifyAsync_SingleSenseAnalysis_ListsThatSenseWithProbabilityOne

              - id: WordSense-Core-BasicClassifier-Candidates-NoSenses
                title: >-
                  BasicClassifier shall list no senses in an analysis whose lemma and part of speech have none.
                tags: [unit]
                justification: |
                  An empty sense list states that nothing was ranked; inventing senses for a lemma without any would
                  mislead a consumer.
                tests:
                  - BasicClassifier_ClassifyAsync_AnalysisWithoutSenses_ListsNoSenses

              - id: WordSense-Core-BasicClassifier-UsagePrior
                title: >-
                  BasicClassifier shall list in every analysis whose lemma and part of speech have two or more senses
                  those senses ranked by the usage prior.
                tags: [unit]
                justification: |
                  About 83 percent of the ambiguous words of running text have a lemma that no encoder model scores the
                  senses of, so without the usage prior the analyses of those words list no senses; the usage of the
                  senses is the one piece of evidence that exists for every lemma, it is the strongest single predictor
                  of the sense of a word (the most frequent sense is right for about two thirds of the words of the
                  independent gold set), and ranking by it gives a consumer the likely senses and a key with a label
                  without claiming that the context decided. The encoder models score senses only for the lemmas they
                  were trained for; the usage prior is what Basic ranks for all the others.
                tests:
                  - BasicClassifier_ClassifyAsync_PolysemousWord_ListsTheSensesRankedByUsage
                  - UsagePrior_RankOf_PolysemousLemma_RanksEverySenseOfTheSlot

              - id: WordSense-Core-BasicClassifier-UsagePrior-Formula
                title: >-
                  The probability that the usage prior gives a sense shall be its WordNet 3.0 tag count plus the
                  smoothing constant, which is 1, over the sum of that over the senses of the lemma and part of speech.
                tags: [unit]
                justification: |
                  Add-k smoothing keeps a sense that was never tagged possible while the counts decide the
                  probabilities.
                tests:
                  - UsagePrior_Rank_ProbabilityIsTheCountPlusKOverTheSum
                  - UsagePrior_RankOf_UsesTheSmoothingConstantOne

              - id: WordSense-Core-BasicClassifier-UsagePrior-Normalized
                title: >-
                  The probabilities of the senses that the usage prior ranks for a lemma and part of speech shall sum to
                  one.
                tags: [unit]
                justification: |
                  A consumer that sums over the analyses gets the probability of the slot times the probability of the
                  sense only if the probabilities of the senses of a slot sum to one.
                tests:
                  - UsagePrior_Rank_ProbabilitiesSumToOne

              - id: WordSense-Core-BasicClassifier-UsagePrior-Order
                title: >-
                  The usage prior shall sort the senses by probability, the largest first.
                tags: [unit]
                justification: |
                  The first sense of the list is the top-ranked sense, which names the key.
                tests:
                  - UsagePrior_Rank_SortsByProbabilityLargestFirst

              - id: WordSense-Core-BasicClassifier-UsagePrior-Ties
                title: >-
                  The usage prior shall keep the inventory order among senses of equal probability.
                tags: [unit]
                justification: |
                  The inventory order is the order of Open English WordNet, which puts the common senses first, so it
                  decides among equal counts and for a lemma without any count.
                tests:
                  - UsagePrior_Rank_EqualCounts_KeepInventoryOrder
                  - UsagePrior_Rank_NoCounts_IsUniformInInventoryOrder

              - id: WordSense-Core-BasicClassifier-UsagePrior-ProjectSense
                title: >-
                  The usage prior shall count a project sense, which has no sense key, as a sense that was never tagged,
                  with the count 0.
                tags: [unit]
                justification: |
                  A project sense has no WordNet 3.0 sense key to count by, so it ranks after the senses that were
                  tagged.
                tests:
                  - UsagePrior_RankOf_ProjectSense_CountsZero

              - id: WordSense-Core-BasicClassifier-UsagePrior-Smoothing
                title: >-
                  The smoothing constant of the usage prior shall never change the order of the ranked senses.
                tags: [unit]
                justification: |
                  The constant is chosen on the development half of the independent gold set by the log loss of the
                  gold sense; the ranking (and so the fine top-1 and the key) must not depend on that choice.
                tests:
                  - UsagePrior_Rank_SmoothingConstant_NeverChangesTheOrder

              - id: WordSense-Core-BasicClassifier-UsagePrior-Validation-Smoothing
                title: >-
                  The usage prior shall reject a smoothing constant that is not a positive number.
                tags: [unit]
                justification: |
                  A zero, negative or non-finite constant would give probabilities that do not sum to one or are not
                  defined.
                tests:
                  - UsagePrior_Rank_SmoothingNotPositive_Throws

              - id: WordSense-Core-BasicClassifier-UsagePrior-Validation-Count
                title: >-
                  The usage prior shall reject a negative tag count.
                tags: [unit]
                justification: |
                  A negative count is damaged data and would give a negative probability.
                tests:
                  - UsagePrior_Rank_NegativeCount_Throws

              - id: WordSense-Core-BasicClassifier-UsagePrior-Validation-MissingList
                title: >-
                  The usage prior shall reject a missing list of senses.
                tags: [unit]
                justification: |
                  A missing argument is a mistake of the caller that must fail at once.
                tests:
                  - UsagePrior_Rank_MissingList_Throws

              - id: WordSense-Core-BasicClassifier-UsagePrior-Validation-MissingLemma
                title: >-
                  The usage prior shall reject a missing lemma.
                tags: [unit]
                justification: |
                  A missing argument is a mistake of the caller that must fail at once.
                tests:
                  - UsagePrior_RankOf_MissingLemma_Throws

              - id: WordSense-Core-BasicClassifier-UsagePrior-Slots
                title: >-
                  BasicClassifier shall ask for the usage prior only for a lemma and part of speech that have two or
                  more senses.
                tags: [unit]
                justification: |
                  A single sense is listed with probability 1 and needs no prior, and an empty slot has nothing to rank.
                tests:
                  - BasicClassifier_ClassifyAsync_PriorIsAskedOnlyForSlotsWithTwoOrMoreSenses

              - id: WordSense-Core-BasicClassifier-UsagePrior-FewerSenses
                title: >-
                  The usage prior shall give no ranking to a lemma and part of speech that have fewer than two senses,
                  one that is not in the catalog included.
                tags: [unit]
                justification: |
                  A ranking of fewer than two senses says nothing; the empty answer lets the classifier list the single
                  sense or none.
                tests:
                  - UsagePrior_RankOf_SingleSense_IsEmpty
                  - UsagePrior_RankOf_NotInTheCatalog_IsEmpty

              - id: WordSense-Core-BasicClassifier-UsagePrior-Stable
                title: >-
                  The usage prior shall give the same ranking on every call for the same lemma and part of speech.
                tags: [unit]
                justification: |
                  The ranking is cached; a consumer and a test rely on the same list every time.
                tests:
                  - UsagePrior_RankOf_RepeatedCalls_GiveTheSameRanking

              - id: WordSense-Core-BasicClassifier-UsagePrior-ContextFree
                title: >-
                  The ranking of the senses of a lemma and part of speech shall be the same in every sentence.
                tags: [unit]
                justification: |
                  The ranking is evidence about the lemma and not about the sentence.
                tests:
                  - BasicClassifier_ClassifyAsync_RankingDoesNotDependOnContext

              - id: WordSense-Core-BasicClassifier-UsagePrior-Marked
                title: >-
                  BasicClassifier shall mark the senses that it lists in an analysis by the usage prior as ranked by
                  usage (SensesRankedByUsage true).
                tags: [unit]
                justification: |
                  The ranking is a base rate of the lemma and not a score of the context; the mark lets a composite and
                  a consumer tell the two apart.
                tests:
                  - BasicClassifier_ClassifyAsync_UsagePrior_MarksTheSensesAsRankedByUsage

              - id: WordSense-Core-BasicClassifier-UsagePrior-Marked-Other
                title: >-
                  BasicClassifier shall not mark the senses of an analysis that is not ranked by the usage prior (the
                  only sense of a single-sense analysis, no senses, or no ranking function configured) as ranked by
                  usage.
                tags: [unit]
                justification: |
                  The only sense of a lemma is certain and nothing is ranked when there are no senses; marking them
                  would misstate what the classifier did.
                tests:
                  - BasicClassifier_ClassifyAsync_UsagePrior_MarksTheSensesAsRankedByUsage
                  - BasicClassifier_ClassifyAsync_WithoutAPrior_MarksNothingAsRankedByUsage

              - id: WordSense-Core-BasicClassifier-UsagePrior-ShortRanking
                title: >-
                  BasicClassifier shall treat a usage ranking of fewer than two senses for an analysis with two or more
                  senses as no ranking: the analysis lists no senses and is not marked as ranked by usage.
                tags: [unit]
                justification: |
                  A ranking of one sense would read as the one-sense answer of a polysemous slot, and the usage prior
                  must never answer a sense.
                tests:
                  - BasicClassifier_ClassifyAsync_RankingOfFewerThanTwoSenses_IsNoRanking

              - id: WordSense-Core-BasicClassifier-UsagePrior-NoAnswer
                title: >-
                  The usage prior shall never answer a sense or a group: the level, the confidence, the sense id and the
                  group id of a result shall be those of the classifier without the prior.
                tags: [unit]
                justification: |
                  Claiming a sense answer from the ranking would turn a base rate into a false decision; only the sense
                  lists of the analyses gain content, so every consumer of the level and of the confidence sees the same
                  answer as before.
                tests:
                  - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheAnswer
                  - BasicClassifier_ClassifyAsync_PolysemousWord_AnswersAtThePartOfSpeechLevelWithoutSenseOrGroup

              - id: WordSense-Core-BasicClassifier-UsagePrior-NoAnswer-Selection
                title: >-
                  The usage prior shall never change the selected analysis of a result.
                tags: [unit]
                justification: |
                  The selection is made from the context; the prior is no evidence about the context.
                tests:
                  - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheSelectedAnalysis

              - id: WordSense-Core-BasicClassifier-UsagePrior-NoAnswer-Probabilities
                title: >-
                  The usage prior shall never change the probability of any analysis of a result.
                tags: [unit]
                justification: |
                  Only the sense lists of the analyses gain content, so every consumer of the analyses sees the same
                  distribution as before.
                tests:
                  - BasicClassifier_ClassifyAsync_UsagePrior_NeverChangesTheAnalysisProbabilities

              - id: WordSense-Core-BasicClassifier-UsagePrior-Key
                title: >-
                  The key of the result of a polysemous word shall carry the label of the top-ranked sense of the
                  selected analysis.
                tags: [unit]
                justification: |
                  The key names the meaning where a model ranked one (rule b of the key).
                tests:
                  - BasicClassifier_ClassifyAsync_PolysemousWord_KeyCarriesTheLabelOfTheTopRankedSense

              - id: WordSense-Core-BasicClassifier-UsagePrior-Key-Enumerated
                title: >-
                  The key of the result of a polysemous word shall be a member of the keys of the lexicon.
                tags: [unit]
                justification: |
                  The keys of all senses are in the enumeration, so the guarantee that every key a model gives is
                  enumerated still holds with the ranking.
                tests:
                  - BasicClassifier_ClassifyAsync_PolysemousWord_KeyIsOneOfTheEnumeratedKeys
                  - BasicKeys_SuiteAndCorpusSentences_AreAllEnumerated

              - id: WordSense-Core-BasicClassifier-Segments
                title: >-
                  BasicClassifier shall treat the words after a period, exclamation mark or question mark as a new
                  segment, so that words in different segments do not influence each other.
                tags: [unit]
                justification: |
                  The words of one sentence do not tell anything about the part of speech of a word in the next.
                tests:
                  - BasicClassifier_ClassifyAsync_Segments_AreIndependent
                  - BasicClassifier_SegmentOf_FindsBounds

              - id: WordSense-Core-BasicClassifier-Possessive-Stem
                title: >-
                  BasicClassifier shall pass a word whose analyses all carry Poss=Yes and whose key ends in 's or ' to
                  the tagger as a token that carries the stem of the word and is flagged as a possessive.
                tags: [unit]
                justification: |
                  The documented tokenization keeps the possessive marker inside the token, but the tagger was trained
                  on text with a separate marker; the stem and the flag let the tagger read the pattern it knows.
                tests:
                  - BasicClassifier_MakeToken_Possessive_HasTheStem

              - id: WordSense-Core-BasicClassifier-Possessive-Whole
                title: >-
                  BasicClassifier shall pass a contraction, a word with an analysis that is not a possessive, a word
                  that does not end in 's or ' and an unknown word to the tagger as a whole token that is not flagged as
                  a possessive.
                tags: [unit]
                justification: |
                  Only a word that is a possessive in every analysis may be read as a stem and a marker; any other
                  word would be given a reading that it does not have.
                tests:
                  - BasicClassifier_MakeToken_NotPossessive_IsAWholeToken

              - id: WordSense-Core-BasicClassifier-Possessive-Rows
                title: >-
                  BasicClassifier shall answer a possessive token with its own analysis at its own position, so that
                  the results stay parallel to the words of the caller.
                tags: [unit]
                justification: |
                  Reading the stem and the marker must not change the tokens or the answers of the caller.
                tests:
                  - BasicClassifier_ClassifyAsync_Possessive_KeepsTheTokensOfTheCaller

              - id: WordSense-Core-BasicClassifier-NonFinite-Flag
                title: >-
                  BasicClassifier shall flag a tagger token as non-finite when the lexicon lists the word as a verb and
                  every verb analysis is a gerund (VerbForm=Ger) or a participle that is not also a past tense
                  (VerbForm=Part without Tense=Past).
                tags: [unit]
                justification: |
                  The tagger lets such a word at the start of a segment leave the clause without a verb; the decision
                  comes from the lexicon, not from the ending of the word.
                tests:
                  - BasicClassifier_MakeToken_NonFiniteVerb_IsFlagged

              - id: WordSense-Core-BasicClassifier-NonFinite-NoFlag
                title: >-
                  BasicClassifier shall not flag a tagger token as non-finite for an infinitive, a past tense, a
                  present, a word without a verb analysis or an unknown word.
                tags: [unit]
                justification: |
                  Imperatives such as bring and ring keep the verb of their clause, so only the words that are never the
                  finite verb of a clause are flagged.
                tests:
                  - BasicClassifier_MakeToken_FiniteOrNoVerb_IsNotFlagged

              - id: WordSense-Core-BasicClassifier-Deterministic
                title: >-
                  BasicClassifier shall give identical results for identical input on repeated calls and when called
                  from several threads at once.
                tags: [unit]
                justification: |
                  A classifier whose only shared state is a cache of immutable entries can be shared by all callers of
                  an application.
                tests:
                  - BasicClassifier_ClassifyAsync_IsDeterministicAndThreadSafe

              - id: WordSense-Core-BasicClassifier-Case
                title: |-
                  BasicClassifier shall treat the case in which a word is written as evidence for the case of the lemma
                  of a word that has both capitalized lemmas (a lemma whose first letter is upper case, such as Polish
                  or August) and lower-case lemmas (polish, august) among its analyses: it shall multiply the
                  probability of each analysis whose lemma has the other case than the evidence by 0.1, after the other
                  evidence has been combined, and then scale the probabilities of all analyses of the word to sum to 1,
                  so that the analyses are listed as always (the lemma and part of speech with the largest probability
                  first, equal probabilities in lexicon order). The cases of the child requirements use these terms:
                  a segment is a run of consecutive tokens that ends after a token of ".", "!" or "?" (or at the end of
                  the input); a word is a token with at least one letter; the first word of a segment is its first
                  word, so a punctuation token such as a quotation mark before it does not change that; the shape of a
                  word is read from its letters only: lower case (no upper-case letter), upper case (every letter is
                  upper case, so a single capital letter such as I is upper case), capitalized (two or more letters,
                  the first upper case and no other), and mixed case (any other word, such as pOlIsh or McDonald); the
                  neighbors of a word are the token directly before it and the token directly after it in the same
                  segment, and a neighbor is capitalized when it is a word that is not the first word of the segment and
                  whose shape is not lower case (a punctuation token is a neighbor but is never capitalized, so it ends
                  a run, and the first word of the segment is never a capitalized neighbor); a run is a capitalized word
                  together with its capitalized neighbors; a segment is a title-case segment when it has at least two
                  words and every word is not written in lower case or is one of the small words a, an, and, as, at,
                  but,
                  by, for, in, of, on, or, the, to, with in lower case. A heading is not a separate kind of input, so a
                  heading is covered by these rules only where it is a run, upper case or a title-case segment.
                tags: [unit]
                justification: |
                  A writer capitalizes a proper name and not a common word, so the case separates the language Polish
                  from the shoe polish and the month August from the adjective august where the context alone is a near
                  tie (0.52 against 0.47 for the sentence "My neighbor speaks fluent Polish"). The evidence is a prior,
                  not a rule, because a name can be typed in lower case and a common word capitalized for emphasis, so
                  the other analyses keep a tenth of their weight and a clear context can still outweigh it. A parent
                  requirement carries the terms and the effect once; the child requirements state each case that can
                  be tested on its own.
                children:
                  - WordSense-Core-BasicClassifier-Case-Lower
                  - WordSense-Core-BasicClassifier-Case-Capitalized
                  - WordSense-Core-BasicClassifier-Case-SentenceStart
                  - WordSense-Core-BasicClassifier-Case-CapitalizedRun
                  - WordSense-Core-BasicClassifier-Case-TitleCaseSegment
                  - WordSense-Core-BasicClassifier-Case-UpperOrMixed
                  - WordSense-Core-BasicClassifier-Case-SameCaseLemmas
                tests:
                  - BasicClassifier_ClassifyAsync_EmbeddedLexicon_SelectsTheLemmaOfTheWrittenCase
                  - BasicClassifier_ClassifyAsync_LowerCaseWordInsideSentence_ListsTiedAnalysesInLexiconOrder

              - id: WordSense-Core-BasicClassifier-Case-Lower
                title: >-
                  BasicClassifier shall, for a word written in lower case (as defined in
                  WordSense-Core-BasicClassifier-Case) that is not in a title-case segment, whatever its position in
                  its segment (the first word included), give the analyses whose lemma is capitalized a tenth of the
                  weight of the analyses whose lemma is in lower case, so that the lower-case lemma is selected when the
                  other evidence is equal.
                tags: [unit]
                justification: |
                  A proper name is not written without its capital, so a lower-case word is evidence for a common
                  lemma in any position, and the shoe polish is not mistaken for the language Polish.
                tests:
                  - BasicClassifier_ClassifyAsync_LowerCaseWordInsideSentence_PrefersTheLowerCaseLemma
                  - BasicClassifier_ClassifyAsync_LowerCaseWordAtTheStart_PrefersTheLowerCaseLemma

              - id: WordSense-Core-BasicClassifier-Case-Capitalized
                title: >-
                  BasicClassifier shall, for an isolated capitalized word (a capitalized word, as defined in
                  WordSense-Core-BasicClassifier-Case, that is not the first word of its segment, is not in a
                  title-case segment and has no capitalized neighbor), give the analyses whose lemma is in lower case a
                  tenth of the weight of the analyses whose lemma is capitalized, so that the capitalized lemma is
                  selected when the other evidence is equal; a punctuation token next to the word does not make it part
                  of a run.
                tags: [unit]
                justification: |
                  A capital inside a sentence marks a proper name, so the language Polish is not mistaken for the shoe
                  polish in "fluent Polish and a little German".
                tests:
                  - BasicClassifier_ClassifyAsync_CapitalizedWordInsideSentence_PrefersTheCapitalizedLemma
                  - BasicClassifier_ClassifyAsync_CapitalizedWordNextToPunctuation_PrefersTheCapitalizedLemma
                  - BasicClassifier_ClassifyAsync_SegmentWithLowerCaseContentWord_IsNotTitleCase
                  - BasicClassifier_ClassifyAsync_SentenceInitialWord_DoesNotMakeARun
                  - BasicClassifier_ClassifyAsync_SentenceInitialWordAfterQuotationMark_DoesNotMakeARun

              - id: WordSense-Core-BasicClassifier-Case-SentenceStart
                title: >-
                  BasicClassifier shall treat the capital letter of the first word of a segment (as defined in
                  WordSense-Core-BasicClassifier-Case: at the start of the input, after a sentence-ending token, or
                  after punctuation tokens only such as a quotation mark) as no evidence for the lemma, leaving the
                  probabilities of the analyses of that word as the other evidence gives them.
                tags: [unit]
                justification: |
                  Every sentence starts with a capital, so it says nothing about whether the word is a name, and the
                  context has to decide.
                tests:
                  - BasicClassifier_ClassifyAsync_SentenceInitialCapital_AtTheStartOfTheText_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_SentenceInitialCapital_AfterQuotationMark_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_SentenceInitialCapital_InLaterSegment_CarriesNoCaseEvidence

              - id: WordSense-Core-BasicClassifier-Case-CapitalizedRun
                title: >-
                  BasicClassifier shall treat a capitalized word that has a capitalized neighbor (as defined in
                  WordSense-Core-BasicClassifier-Case: the word directly before or directly after it, not the first
                  word of the segment, in capitalized, upper-case or mixed-case shape) as no evidence for the lemma,
                  leaving the probabilities of its analyses as the other evidence gives them.
                tags: [unit]
                justification: |
                  A run of capitalized words is a name or a title (State Department, Polish Prime Minister), in which
                  a common word is capitalized as part of the name and its lemma stays the common one.
                tests:
                  - BasicClassifier_ClassifyAsync_CapitalizedWordBeforeCapitalizedWord_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_CapitalizedWordAfterCapitalizedWord_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_CapitalizedWordNextToUpperCaseWord_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_CapitalizedWordNextToMixedCaseWord_CarriesNoCaseEvidence

              - id: WordSense-Core-BasicClassifier-Case-TitleCaseSegment
                title: >-
                  BasicClassifier shall treat every word of a title-case segment (as defined in
                  WordSense-Core-BasicClassifier-Case) as no evidence for the lemma, leaving the probabilities of
                  their analyses as the other evidence gives them.
                tags: [unit]
                justification: |
                  A title capitalizes every word by convention, so the case of a word in it says nothing about its
                  lemma.
                tests:
                  - BasicClassifier_ClassifyAsync_TitleCaseSegment_CarriesNoCaseEvidence

              - id: WordSense-Core-BasicClassifier-Case-UpperOrMixed
                title: >-
                  BasicClassifier shall treat a word written in upper case (a single capital letter such as I included)
                  or in mixed case (as defined in WordSense-Core-BasicClassifier-Case) as no evidence for the lemma,
                  leaving the probabilities of its analyses as the other evidence gives them.
                tags: [unit]
                justification: |
                  An upper-case word is emphasis or an acronym, the capital letter I is spelled so in every sentence,
                  and a mixed-case word (pOlIsh, eBay) follows no convention of proper names.
                tests:
                  - BasicClassifier_ClassifyAsync_AllCapsWord_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_SingleCapitalLetter_CarriesNoCaseEvidence
                  - BasicClassifier_ClassifyAsync_MixedCaseWord_CarriesNoCaseEvidence

              - id: WordSense-Core-BasicClassifier-Case-SameCaseLemmas
                title: >-
                  BasicClassifier shall leave the analyses and the probabilities of a word unchanged by its written
                  case when all its analyses have capitalized lemmas or all have lower-case lemmas, so that a name
                  written in lower case, a capitalized word with only lower-case lemmas and a word with a single
                  analysis keep every analysis.
                tags: [unit]
                justification: |
                  The case only separates lemmas that differ in case; a word must never lose its only reading because
                  it is written in an unusual case.
                tests:
                  - BasicClassifier_ClassifyAsync_OnlyCapitalizedLemmas_KeepEveryAnalysisInLowerCase
                  - BasicClassifier_ClassifyAsync_OnlyCapitalizedLemma_StaysKnownInLowerCase
                  - BasicClassifier_ClassifyAsync_CapitalizedWordWithoutCapitalizedLemma_IsAnsweredLikeLowerCase

              - id: WordSense-Core-BasicClassifier-Tense
                title: >-
                  BasicClassifier shall split the probability of a verb slot between its past and its non-past
                  analyses by the tense that the shared tense table of the Basic model reads from the context of the
                  word, as the child requirements state. The child requirements use these terms: a verb slot is the
                  analyses of the word that have one lemma and the part of speech Verb; a past analysis is a verb
                  analysis with Tense=Past or VerbForm=Part; a non-past analysis is any other analysis of the slot;
                  L is the log odds of past against non-past that the tense table gives the tense features of the
                  word; and TenseWeight is the weight of the tense model in the table.
                tags: [unit]
                justification: |
                  The senses belong to the lemma and part of speech, so the cue tables have no column for the tense of
                  most verbs and the non-past analysis was selected for every put, cut and set whatever the sentence
                  said. The tense of a word is part of its analysis, so the analysis is wrong when the tense is. A
                  parent requirement carries the terms once; the child requirements state each step that can be
                  tested on its own.
                children:
                  - WordSense-Core-BasicClassifier-Tense-Slot
                  - WordSense-Core-BasicClassifier-Tense-Context
                  - WordSense-Core-BasicClassifier-Tense-EqualStart
                  - WordSense-Core-BasicClassifier-Tense-Weight
                  - WordSense-Core-BasicClassifier-Tense-Bound
                  - WordSense-Core-BasicClassifier-Tense-SlotTotal
                  - WordSense-Core-BasicClassifier-Tense-Answer
                  - WordSense-Core-BasicClassifier-Tense-SelectsPast
                  - WordSense-Core-BasicClassifier-Tense-SelectsNonPast
                  - WordSense-Core-BasicClassifier-Tense-NoTable
                  - WordSense-Core-BasicClassifier-Tense-WeightZero
                  - WordSense-Core-BasicClassifier-Tense-NonVerbSlot

              - id: WordSense-Core-BasicClassifier-Tense-Slot
                title: >-
                  BasicClassifier shall apply the tense split (as defined in WordSense-Core-BasicClassifier-Tense) to
                  each verb slot of a word that has both a past analysis and a non-past analysis, a participle
                  (VerbForm=Part without a tense) counting as a past analysis.
                tags: [unit]
                justification: |
                  The lexicon lists the participle of a verb such as come as a separate analysis, and it is a past
                  form for the question the model answers.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_ParticipleCountsAsPast

              - id: WordSense-Core-BasicClassifier-Tense-Context
                title: >-
                  BasicClassifier shall take L (as defined in WordSense-Core-BasicClassifier-Tense) from the tense
                  features of the word in its segment: the prior of the tense table plus the weights of the features
                  that the table knows, in nats, so that a context that the table weighs at 3 nats makes the past
                  analysis e^3 times as probable as the non-past analysis.
                tags: [unit]
                justification: |
                  The tense of a verb is read from its context and not from the verb, so one table serves every verb.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_ContextFeaturesSetTheLogOdds

              - id: WordSense-Core-BasicClassifier-Tense-EqualStart
                title: >-
                  BasicClassifier shall, after the other evidence has been combined, give the variants of a qualifying
                  slot equal shares of the probability of the slot before the tense weight applies, so that the
                  probabilities that a form table of the word (the past and present columns of read) gave to the
                  variants do not enter the split: with the weight 1 and L of 1 nat the past analysis is e times as
                  probable as the non-past analysis, whatever the form table said.
                tags: [unit]
                justification: |
                  The form table and the tense table read the same context features, so combining their splits would
                  count the context twice; on the development data the shared table alone was never worse than the
                  product of the two.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_ReplacesTheSplitOfTheFormTable

              - id: WordSense-Core-BasicClassifier-Tense-Weight
                title: >-
                  BasicClassifier shall multiply the share of each past analysis of a qualifying slot by
                  exp(TenseWeight * L) (as defined in WordSense-Core-BasicClassifier-Tense), so that with L of 3 nats
                  the weight 2 makes the past analysis e^6 times as probable as the non-past analysis and the weight
                  0.5 makes it e^1.5 times as probable.
                tags: [unit]
                justification: |
                  The weight lets the table scale how far the context moves the split, and the exponential turns
                  log odds into the odds of the two classes.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_WeightScalesTheLogOdds

              - id: WordSense-Core-BasicClassifier-Tense-Bound
                title: >-
                  BasicClassifier shall bound L, and then the product TenseWeight * L (both as defined in
                  WordSense-Core-BasicClassifier-Tense), each to the range from -30 to 30 nats before the
                  exponential, so that every probability stays finite and the analyses of the word still sum to one,
                  whatever the weight and the weights of the table.
                tags: [unit]
                justification: |
                  The table is data, and a weight or a context weighing more than about 700 nats would overflow the
                  exponential and turn the probabilities into infinity or NaN.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_LargeWeight_KeepsProbabilitiesFinite
                  - BasicClassifier_ClassifyAsync_TenseTable_LargeLogOdds_AreBoundedTo30Nats

              - id: WordSense-Core-BasicClassifier-Tense-SlotTotal
                title: >-
                  BasicClassifier shall scale the shares of the variants of a qualifying slot so that they sum to the
                  probability that the slot had before the tense split, so that the probability of every slot (the sum
                  of the probabilities of its analyses) and the order of the slots are as they are without the split.
                tags: [unit]
                justification: |
                  The split is a prior inside a slot, as the case prior is between lemmas; the probability of a slot
                  is the evidence for its senses and must not move when only the tense of a verb is decided.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_KeepsSlotProbabilityLevelAndConfidence
                  - BasicClassifier_ClassifyAsync_TenseTable_ReplacesTheSplitOfTheFormTable

              - id: WordSense-Core-BasicClassifier-Tense-Answer
                title: >-
                  BasicClassifier shall give the level, the confidence, the group and the sense of the answer of a word
                  whose slot was split by tense the values that it gives without the split, so that the split changes
                  only the probabilities and the order of the analyses inside a slot and the features of the selected
                  analysis.
                tags: [unit]
                justification: |
                  The part of speech and sense figures, and every confidence, must not move when only the tense of a
                  verb is decided.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_KeepsSlotProbabilityLevelAndConfidence

              - id: WordSense-Core-BasicClassifier-Tense-SelectsPast
                title: >-
                  BasicClassifier shall select the past analysis of a verb whose past and non-past share a spelling
                  (put, cut, set, come, read) when the context of the word makes it more probable (L above 0), as the
                  past analysis, although the lexicon lists the non-past analysis first.
                tags: [unit]
                justification: |
                  A past context must give the past analysis; before the tense model the non-past analysis was
                  selected for every put, cut and set whatever the sentence said.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_PastContext_SelectsThePastAnalysis

              - id: WordSense-Core-BasicClassifier-Tense-SelectsNonPast
                title: >-
                  BasicClassifier shall select the non-past analysis of a verb whose past and non-past share a
                  spelling when the context of the word makes it more probable (L below 0), as in the context of an
                  infinitive, a present or an imperative.
                tags: [unit]
                justification: |
                  The tense model must not turn every such verb into a past: a non-past context gives the non-past
                  analysis.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseTable_InfinitiveContext_SelectsTheNonPastAnalysis

              - id: WordSense-Core-BasicClassifier-Tense-NoTable
                title: >-
                  BasicClassifier shall leave the probabilities of every word unchanged by the tense model when the
                  table has no tense table.
                tags: [unit]
                justification: |
                  A table without the model must behave as it did before the model existed.
                tests:
                  - BasicClassifier_ClassifyAsync_NoTenseTable_LeavesProbabilitiesUnchanged

              - id: WordSense-Core-BasicClassifier-Tense-WeightZero
                title: >-
                  BasicClassifier shall leave the probabilities of every word unchanged by the tense model when the
                  TenseWeight of the table is 0.
                tags: [unit]
                justification: |
                  The weight 0 is the documented way to turn the model off.
                tests:
                  - BasicClassifier_ClassifyAsync_TenseWeightZero_LeavesProbabilitiesUnchanged

              - id: WordSense-Core-BasicClassifier-Tense-NonVerbSlot
                title: >-
                  BasicClassifier shall leave the probabilities of a slot unchanged by the tense model when it is not a
                  verb slot or does not have both a past and a non-past analysis (the singular and the plural of a
                  noun).
                tags: [unit]
                justification: |
                  A word never changes for a model that does not apply to it.
                tests:
                  - BasicClassifier_ClassifyAsync_NonVerbSlot_LeavesProbabilitiesUnchanged

              - id: WordSense-Core-BasicClassifier-Normalization
                title: >-
                  BasicClassifier shall look words up case-insensitively (in lower case), read the curly apostrophe
                  as a straight one
                  and treat a token without a letter as unknown.
                tags: [unit]
                justification: |
                  Callers pass words as written in their text, including capitalization and typographic punctuation.
                tests:
                  - BasicClassifier_ClassifyAsync_MixedCaseAndCurlyApostrophe_AreNormalized
                  - BasicClassifier_ClassifyAsync_CapitalizedWordInsideSentence_IsLookedUpInLowerCase
                  - BasicClassifier_ClassifyAsync_Punctuation_IsUnknown

              - id: WordSense-Core-BasicClassifier-Validation
                title: >-
                  BasicClassifier shall return an empty array for an empty list, keep results parallel to the input,
                  and reject a null list, a null element and a cancelled call, also when the cancellation happens
                  while the words are read.
                tags: [unit]
                justification: |
                  Misuse must fail fast with a documented exception, and results must map onto the input by index.
                tests:
                  - BasicClassifier_ClassifyAsync_EmptyList_ReturnsEmpty
                  - BasicClassifier_ClassifyAsync_ResultsAreParallelToInput
                  - BasicClassifier_ClassifyAsync_NullWords_Throws
                  - BasicClassifier_ClassifyAsync_NullElement_Throws
                  - BasicClassifier_ClassifyAsync_Cancelled_Throws
                  - BasicClassifier_ClassifyAsync_CancelledWhileReadingWords_Throws
