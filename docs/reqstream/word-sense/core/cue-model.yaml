---
# CueModel unit requirements (context cues of the Basic model)

sections:
  - title: WordSense Requirements
    sections:
      - title: Core Requirements
        sections:
          - title: CueModel Requirements
            requirements:
              - id: WordSense-Core-CueModel-Extract
                title: >-
                  CueModel shall extract the context cues of a target word from its immediate neighbors and the words
                  within a limited window around it, listing each cue once and handling targets at either edge of a
                  segment.
                tags: [unit]
                justification: |
                  The words around a target carry the evidence for its meaning; bounding and deduplicating them keeps
                  the evidence balanced.
                tests:
                  - CueModel_Extract_WindowAndNeighbors
                  - CueModel_Extract_DedupesAndLimitsWindow
                  - CueModel_Extract_Edges

              - id: WordSense-Core-CueModel-Score
                title: >-
                  CueModel shall score each candidate analysis of a form from the stored weights of the cues, mark
                  analyses without statistics, and give the prior score when no cue is known, and reject a null table
                  or a default (uninitialized) analysis array with an argument-null error.
                tags: [unit]
                justification: |
                  Analyses that share a part of speech are separated by the cues alone; without cues the answer must
                  fall back to the analysis frequencies; misuse must fail fast with the documented exception.
                tests:
                  - CueModel_Score_UsesWeightsAndMarksMissingAnalyses
                  - CueModel_Score_UnknownFeature_GivesPrior
                  - CueModel_Score_NullTableOrDefaultAnalyses_Throws

              - id: WordSense-Core-CueModel-Tense
                title: >-
                  CueModel shall extract the tense features of a target word and score a context from a tense table, as
                  the child requirements state. The child requirements use these terms: a word is a token with at least
                  one letter; the first word of a segment is its first word and the last word of a segment is its last
                  word, so that a punctuation token before the first word or after the last word does not make the
                  target an inner word.
                tags: [unit]
                justification: |
                  The tense of a verb is read from its context and not from the verb, so one table serves every verb. A
                  parent requirement carries the terms once; the child requirements state each behavior that can be
                  tested on its own.
                children:
                  - WordSense-Core-CueModel-Tense-Extract
                  - WordSense-Core-CueModel-Tense-Sides
                  - WordSense-Core-CueModel-Tense-Edge
                  - WordSense-Core-CueModel-Tense-Governor
                  - WordSense-Core-CueModel-Tense-Capacity
                  - WordSense-Core-CueModel-Tense-FeatureKinds
                  - WordSense-Core-CueModel-Tense-Score
                  - WordSense-Core-CueModel-Tense-Quantization
                  - WordSense-Core-CueModel-Tense-NullTable

              - id: WordSense-Core-CueModel-Tense-Extract
                title: >-
                  CueModel shall include the cue features of the target (the features of
                  WordSense-Core-CueModel-Extract) in its tense features, and never the target token itself.
                tags: [unit]
                justification: |
                  The model must read only the context, so that it cannot learn one verb from another.
                tests:
                  - CueModel_ExtractTense_IncludesTheCueFeaturesAndNeverTheTarget

              - id: WordSense-Core-CueModel-Tense-Sides
                title: >-
                  CueModel shall add to the tense features each distinct word within five positions of the target as a
                  left-window feature when it stands before the target and as a right-window feature when it stands
                  after it, so that a word on both sides gives both features.
                tags: [unit]
                justification: |
                  An auxiliary before a verb and a word after it say different things about the tense.
                tests:
                  - CueModel_ExtractTense_WindowTokensAreToldApartBySide

              - id: WordSense-Core-CueModel-Tense-Edge
                title: >-
                  CueModel shall add the segment edge as the left neighbor of the target when no word stands before it
                  in the segment (the target is the first word), and as the right neighbor of the target when no word
                  stands after it (the target is the last word), whatever punctuation tokens stand before or after the
                  target, and never for a target that has a word on that side.
                tags: [unit]
                justification: |
                  The first word of a sentence is mostly an imperative or a past, never governed by an auxiliary, and a
                  quotation mark or the closing period of a sentence must not hide that.
                tests:
                  - CueModel_ExtractTense_SegmentEdgesAreNeighbors

              - id: WordSense-Core-CueModel-Tense-Governor
                title: >-
                  CueModel shall add as the governing feature the nearest token to the left of the target within six
                  positions that is a function word of the closed class of tense carriers (the forms of be, have and do,
                  the modals, to, the negations and their contractions), and none when no such token is there.
                tags: [unit]
                justification: |
                  The function word that governs a verb phrase carries its tense; the class is closed and holds no verb
                  list.
                tests:
                  - CueModel_ExtractTense_GovernorIsTheNearestFunctionWordWithinTheRadius
                  - CueModel_IsGovernor_ClosedClassOfFunctionWords

              - id: WordSense-Core-CueModel-Tense-Capacity
                title: >-
                  CueModel shall write no more tense features than the size of the buffer that it documents, also for a
                  target with a full window on both sides.
                tags: [unit]
                justification: |
                  A caller allocates the buffer once; a longer list would write past it.
                tests:
                  - CueModel_ExtractTense_FullWindow_FitsTheBuffer

              - id: WordSense-Core-CueModel-Tense-FeatureKinds
                title: >-
                  CueModel shall hash the left-window, right-window and governing features with kind prefixes of their
                  own, so that the same token as a window feature, a left-window feature, a right-window feature and a
                  governing feature has different hashes.
                tags: [unit]
                justification: |
                  The table stores one weight per hash; features of different kinds must not share a weight.
                tests:
                  - FeatureRef_Hash_TenseKindsHaveOwnPrefixes

              - id: WordSense-Core-CueModel-Tense-Score
                title: >-
                  CueModel shall score a context from a tense table as the prior plus the weights of the features that
                  the table knows, ignoring the features that it does not know, positive when the context says past.
                tags: [unit]
                justification: |
                  The table is a naive Bayes model: the log odds of the classes plus the log likelihood ratio of each
                  known feature.
                tests:
                  - CueModel_ScoreTense_SumsPriorAndKnownWeights

              - id: WordSense-Core-CueModel-Tense-Quantization
                title: >-
                  CueModel shall give the score of a context in eighths of a nat, one stored unit being 1/8 nat.
                tags: [unit]
                justification: |
                  The table stores signed bytes; the scale turns them back into nats.
                tests:
                  - CueModel_ScoreTense_ResultIsInEighthsOfANat

              - id: WordSense-Core-CueModel-Tense-NullTable
                title: >-
                  CueModel shall reject a null tense table with an argument-null error.
                tags: [unit]
                justification: |
                  Misuse must fail fast with the documented exception.
                tests:
                  - CueModel_ScoreTense_NullTable_Throws

              - id: WordSense-Core-CueModel-NounVerb
                title: >-
                  CueModel shall extract as the noun/verb features of a target word the word and the class of each of
                  the two tokens before it and of the two tokens after it, eight features in a fixed order.
                tags: [unit]
                justification: |
                  Whether a word that can be a noun or a verb is one or the other is read from its neighbors and not
                  from the word, so one table serves every such word. The words next to a word and their grammatical
                  classes (an auxiliary after it, a determiner before it) separate its noun use from its verb use.
                tests:
                  - CueModel_ExtractNounVerb_WordAndClassOfTheTwoNeighborsOnEachSide
                children:
                  - WordSense-Core-CueModel-NounVerb-Edge
                  - WordSense-Core-CueModel-NounVerb-Class
                  - WordSense-Core-CueModel-NounVerb-NoTarget
                  - WordSense-Core-CueModel-NounVerb-FeatureKinds
                  - WordSense-Core-CueModel-NounVerb-Score
                  - WordSense-Core-CueModel-NounVerb-NullTable
                  - WordSense-Core-CueModel-NounVerb-NullLexicon

              - id: WordSense-Core-CueModel-NounVerb-Edge
                title: >-
                  CueModel shall give a neighbor that is outside the segment the segment edge as its word and the edge
                  class as its class, and a neighbor without a letter its own text as its word and the punctuation class
                  as its class.
                tags: [unit]
                justification: |
                  The edge of a sentence is evidence too (the first word of a sentence is often a verb), and a comma is
                  not a word of any class.
                tests:
                  - CueModel_ExtractNounVerb_EdgeAndPunctuationNeighbors

              - id: WordSense-Core-CueModel-NounVerb-Class
                title: >-
                  CueModel shall name the class of a neighbor from its lexicon analyses: auxiliary when one is an
                  auxiliary, verb when every analysis is a verb that can be finite, nonfinite when every analysis is a
                  gerund or a participle, ambiguous-verb or ambiguous when there are several parts of speech with or
                  without a verb, the name of the part of speech when there is one, and unknown when the lexicon has no
                  analysis.
                tags: [unit]
                justification: |
                  The class is a closed set of grammatical classes derived from the lexicon, so that the model decides
                  for a neighbor it never saw without a word list.
                tests:
                  - CueModel_ContextClassOf_NamesTheClassOfTheAnalyses

              - id: WordSense-Core-CueModel-NounVerb-NoTarget
                title: >-
                  CueModel shall not read the target word itself for its noun/verb features.
                tags: [unit]
                justification: |
                  The model must read only the context, so that it cannot learn one word from another.
                tests:
                  - CueModel_ExtractNounVerb_DoesNotReadTheTarget

              - id: WordSense-Core-CueModel-NounVerb-FeatureKinds
                title: >-
                  CueModel shall hash the second-neighbor features and the class features with kind prefixes of their
                  own, so that the same token in each place of the noun/verb model has a different hash.
                tags: [unit]
                justification: |
                  The table stores one weight per hash; features of different kinds must not share a weight.
                tests:
                  - FeatureRef_Hash_NounVerbKindsHaveOwnPrefixes

              - id: WordSense-Core-CueModel-NounVerb-Score
                title: >-
                  CueModel shall score a context from a noun/verb table as the sum of the weights of the features that
                  the table knows, with no prior, ignoring the features that it does not know, in eighths of a nat and
                  positive when the context says verb.
                tags: [unit]
                justification: |
                  The table adds its weights to the log odds that the rest of the model gives; the scale turns the
                  stored signed bytes back into nats.
                tests:
                  - CueModel_ScoreNounVerb_SumsKnownWeightsWithoutPrior

              - id: WordSense-Core-CueModel-NounVerb-NullTable
                title: >-
                  CueModel shall reject a null noun/verb table when scoring with an argument-null error.
                tags: [unit]
                justification: |
                  Misuse must fail fast with the documented exception.
                tests:
                  - CueModel_ScoreNounVerb_NullTable_Throws

              - id: WordSense-Core-CueModel-NounVerb-NullLexicon
                title: >-
                  CueModel shall reject a null lexicon when extracting the noun/verb features with an argument-null
                  error.
                tags: [unit]
                justification: |
                  Misuse must fail fast with the documented exception.
                tests:
                  - CueModel_ExtractNounVerb_NullLexicon_Throws
