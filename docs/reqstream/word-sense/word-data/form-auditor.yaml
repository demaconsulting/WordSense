---
# FormAuditor unit requirements (the repeatable quality gate of the generated forms)

sections:
  - title: WordSense Requirements
    sections:
      - title: WordData Requirements
        sections:
          - title: FormAuditor Requirements
            requirements:
              - id: WordSense-WordData-FormAuditor-Interval
                title: >-
                  FormAuditor shall report the error rate of every sampled stratum with its 95% Wilson confidence
                  interval.
                tags: [unit]
                justification: |
                  A sample proves nothing without the uncertainty of its estimate.
                tests:
                  - WordSenseBuilder_FormAuditor_Wilson_NoErrors_StartsAtZero
                  - WordSenseBuilder_FormAuditor_Wilson_SomeErrors_BracketsRate
                  - WordSenseBuilder_FormAuditor_Wilson_EmptySample_IsWholeRange
                  - WordSenseBuilder_FormAuditor_ReadAdjudications_FeatureColumn_RestrictsTheKey

              - id: WordSense-WordData-FormAuditor-Gate
                title: >-
                  FormAuditor shall fail when the error rate of any generated stratum reaches the limit, counting a
                  disagreement of the independent checker as an error unless a recorded adjudication says the form is
                  valid, and shall leave out rows that the checker cannot judge, whether or not an adjudication lists
                  them (an adjudication only settles a disagreement). It shall reject a sample size below
                  one, an empty or malformed oracle file (a line that has other than exactly five non-empty fields), an
                  oracle file that gives one row two verdicts, an oracle or
                  adjudication verdict it does not know and a
                  sampled row without an oracle verdict, and shall fail when a generated stratum has no checked row.
                tags: [unit]
                justification: |
                  The audit is a regression gate; it has to stop a change that makes the generated forms worse.
                tests:
                  - WordSenseBuilder_FormAuditor_Evaluate_AllGood_Passes
                  - WordSenseBuilder_FormAuditor_Evaluate_UnadjudicatedDisagreement_Fails
                  - WordSenseBuilder_FormAuditor_Evaluate_ValidAdjudication_Clears
                  - WordSenseBuilder_FormAuditor_Evaluate_SkippedRows_AreNotChecked
                  - WordSenseBuilder_FormAuditor_Evaluate_SkippedAndAdjudicatedRow_IsNotCounted
                  - WordSenseBuilder_FormAuditor_Evaluate_InvalidAdjudicationOfDisagreement_IsAnError
                  - WordSenseBuilder_FormAuditor_ReadAdjudications_SkipsComments
                  - WordSenseBuilder_FormAuditor_ReadAdjudications_NoFile_IsEmpty
                  - WordSenseBuilder_FormAuditor_Evaluate_OracleAcceptedRow_IsNotAnError
                  - WordSenseBuilder_FormAuditor_Evaluate_FeatureRestrictedVerdict_AppliesToThoseFeaturesOnly
                  - WordSenseBuilder_FormAuditor_Evaluate_GeneratedStratumWithoutCheckedRows_Fails
                  - WordSenseBuilder_FormAuditor_Evaluate_EmptySample_Fails
                  - WordSenseBuilder_FormAuditor_Evaluate_MissingVerdict_Throws
                  - WordSenseBuilder_FormAuditor_ReadVerdicts_EmptyFile_Throws
                  - WordSenseBuilder_FormAuditor_ReadVerdicts_MalformedLine_Throws
                  - WordSenseBuilder_FormAuditor_ReadVerdicts_ValidFile_IsRead
                  - WordSenseBuilder_FormAuditor_ReadVerdicts_DuplicateRow_Throws
                  - WordSenseBuilder_FormAuditor_ReadAdjudications_BadVerdict_Throws
                  - WordSenseBuilder_Program_AuditForms_NonPositiveSample_Fails
                  - WordSenseBuilder_Program_AuditForms_EmptyOracleFile_Fails
