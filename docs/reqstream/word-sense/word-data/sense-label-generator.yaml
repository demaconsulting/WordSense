---
# SenseLabelGenerator unit requirements (the readable sense labels of the word data)

sections:
  - title: WordSense Requirements
    sections:
      - title: WordData Requirements
        sections:
          - title: SenseLabelGenerator Requirements
            requirements:
              - id: WordSense-WordData-SenseLabelGenerator-Generate
                title: >-
                  SenseLabelGenerator shall give every sense that has no curated label a readable, deterministic label
                  that is unique among the senses of its lemma: the part of speech name for the only sense of a lemma
                  and part of speech (lemma#noun), otherwise the first synonym of its synset, otherwise the first
                  usable member of its first hypernym synset that has one, made unique by a numeric suffix where two
                  senses would otherwise share one; it shall create no group, and shall report a table it cannot read
                  as invalid data with the file and line.
                tags: [unit]
                justification: |
                  Callers can use any sense of any word, not only the curated ones, so every sense needs an id that
                  reads like what it means; a fixed rule makes the ids reproducible and reviewable. A group exists only
                  when it is curated, so the generator never makes one.
                tests:
                  - WordSenseBuilder_SenseLabelGenerator_Generate_OnlySenseOfPartOfSpeech_UsesThePartOfSpeechName
                  - WordSenseBuilder_SenseLabelGenerator_Generate_UsesTheFirstSynonym
                  - WordSenseBuilder_SenseLabelGenerator_Generate_NoSynonym_UsesTheHypernymHead
                  - WordSenseBuilder_SenseLabelGenerator_Generate_FirstHypernymMemberIsSelf_UsesNextMemberOfThatHypernym
                  - WordSenseBuilder_SenseLabelGenerator_Generate_DuplicateLabels_GetNumericSuffixes
                  - WordSenseBuilder_SenseLabelGenerator_Generate_LabelsAreWellFormedAndUniquePerLemma
                  - WordSenseBuilder_SenseLabelGenerator_Run_Slice_LabelsOneTokenSensesAndCreatesNoGroup
                  - WordSenseBuilder_SenseLabelGenerator_Run_UnreadableRows_ThrowInvalidDataWithLocation

              - id: WordSense-WordData-SenseLabelGenerator-Preserve
                title: >-
                  SenseLabelGenerator shall never change or remove a label that already exists, curated or generated,
                  and shall never assign a label that an existing or retired id of the lemma already uses.
                tags: [unit]
                justification: |
                  A published id is a promise to the callers who stored it; regenerating the labels must not break
                  that promise, whatever else in the data has changed. Group ids (lemma#group:label) are in their own
                  namespace, so a group never takes a sense label and is left as it is.
                tests:
                  - WordSenseBuilder_SenseLabelGenerator_Generate_ExistingLabels_AreKept
                  - WordSenseBuilder_SenseLabelGenerator_Run_ExistingLabels_KeepValueAndOrigin
                  - WordSenseBuilder_SenseLabelGenerator_Generate_NewSenseOfLemma_NeverTakesAnExistingOrRetiredLabel
                  - WordSenseBuilder_SenseLabelGenerator_Generate_ChangedSourceData_KeepsPublishedLabels
                  - WordSenseBuilder_SenseLabelGenerator_Run_ExistingGroup_IsKeptAndItsLabelStaysAvailable

              - id: WordSense-WordData-SenseLabelGenerator-Reproducible
                title: >-
                  SenseLabelGenerator shall give identical output bytes for the same inputs, in an order that depends
                  on nothing but those inputs.
                tags: [unit]
                justification: |
                  Labels that cannot be regenerated from the committed inputs cannot be reviewed; rerunning the
                  generator then shows any drift as a normal data diff.
                tests:
                  - WordSenseBuilder_SenseLabelGenerator_Run_SameInputs_GiveIdenticalBytes
                  - WordSenseBuilder_SenseLabelGenerator_Run_ReorderedInput_GivesIdenticalBytes
