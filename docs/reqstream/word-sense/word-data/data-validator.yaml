---
# DataValidator unit requirements (the validation of the committed tables)

sections:
  - title: WordSense Requirements
    sections:
      - title: WordData Requirements
        sections:
          - title: DataValidator Requirements
            requirements:
              - id: WordSense-WordData-DataValidator-Format
                title: >-
                  DataValidator shall check the file set, the header, the cell count, the byte-order mark, line ends,
                  the final line feed, blank lines, UTF-8 validity, Unicode normalization, edge spaces, cell types,
                  enumerations and features of every table file, and report a violation per defect.
                tags: [unit]
                justification: |
                  A file that deviates from the format would break the determinism that makes the data reviewable.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_ImportedSlice_IsValid
                  - WordSenseBuilder_DataValidator_Validate_MissingDirectory_ReportsSchema
                  - WordSenseBuilder_DataValidator_Validate_BrokenSchema_ReportsSchema
                  - WordSenseBuilder_DataValidator_Validate_UnexpectedFiles_ViolateFileSet
                  - WordSenseBuilder_DataValidator_Validate_MissingSourceFile_ViolatesFileSet
                  - WordSenseBuilder_DataValidator_Validate_EmptyPartitionFile_Violates
                  - WordSenseBuilder_DataValidator_Validate_FormatDefects_AreReported
                  - WordSenseBuilder_DataValidator_Validate_CellDefects_AreReported
                  - WordSenseBuilder_DataValidator_Validate_EmptyRequiredCell_Violates
                  - WordSenseBuilder_DataValidator_Validate_SenseTableFeatures_AreChecked
                  - WordSenseBuilder_DataValidator_Validate_ManyViolations_AreCappedPerRule

              - id: WordSense-WordData-DataValidator-Integrity
                title: >-
                  DataValidator shall check the primary and unique keys, the foreign keys, the strictly ascending
                  sort order, the placement of each row in the file of its lemma, and the relation conventions (one
                  stored direction, symmetric order, no self-relation, subtype only for other).
                tags: [unit]
                justification: |
                  Keys, references and placement are what make the tables a relational model rather than loose text.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_UnsortedRows_ViolateSort
                  - WordSenseBuilder_DataValidator_Validate_DuplicateHomograph_ViolatesUnique
                  - WordSenseBuilder_DataValidator_Validate_DanglingReference_ViolatesForeignKey
                  - WordSenseBuilder_DataValidator_Validate_RowInWrongFile_ViolatesPlacement
                  - WordSenseBuilder_DataValidator_Validate_SplitPlanMismatch_ViolatesFileSet
                  - WordSenseBuilder_DataValidator_Validate_RelationDefects_AreReported

              - id: WordSense-WordData-DataValidator-Consistency
                title: >-
                  DataValidator shall check the cross-table rules: satellite synsets have an adjective head and others
                  have none, every entry and synset has a sense and a gloss, sense positions are 1 to n, parts of speech
                  of entries and synsets fit, token counts and head indexes fit the lemma, and examples name senses of
                  their own synset.
                tags: [unit]
                justification: |
                  These rules catch the edits that are well-formed but wrong, which is what a reviewer cannot see in a
                  diff of rows.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_HeadDefects_ViolateSynset
                  - WordSenseBuilder_DataValidator_Validate_TokenDefects_ViolateEntry
                  - WordSenseBuilder_DataValidator_Validate_SenseDefects_ViolateSense
                  - WordSenseBuilder_DataValidator_Validate_EntryWithoutSense_Violates
                  - WordSenseBuilder_DataValidator_Validate_ExampleOfOtherSynset_Violates
                  - WordSenseBuilder_DataValidator_Validate_SynsetWithoutGloss_Violates

              - id: WordSense-WordData-DataValidator-Senses
                title: >-
                  DataValidator shall check that every sense has exactly one label, that the labels of the senses of a
                  lemma are unique and well formed, that a sense id never collides with the id of a group, that a
                  published label is neither changed nor reused unless the id map records it, and that a project sense
                  has no sense key and an authored gloss.
                tags: [unit]
                justification: |
                  Sense ids are stored by callers; the rules that keep them readable, unique, stable and unambiguous
                  must fail a pull request, not a user.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_SenseWithoutLabel_Violates
                  - WordSenseBuilder_DataValidator_Validate_DuplicateLabelInLemma_ViolatesUnique
                  - WordSenseBuilder_DataValidator_Validate_SenseIdEqualToGroupId_Violates
                  - WordSenseBuilder_DataValidator_Validate_ChangedPublishedLabel_ViolatesStability
                  - WordSenseBuilder_DataValidator_Validate_ReusedRetiredId_Violates
                  - WordSenseBuilder_DataValidator_Validate_ProjectSenseWithKey_Violates

              - id: WordSense-WordData-DataValidator-Groups
                title: >-
                  DataValidator shall check that the senses of a curated lemma are partitioned among its groups (every
                  sense in exactly one group), that each group has one lemma and one part of speech and no two
                  respellings, and that a lemma that is not curated has one default group for each of its parts of
                  speech.
                tags: [unit]
                justification: |
                  A group answer must be unambiguous; the partition rules are what make it so, and they cannot be
                  seen in a diff of rows.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_CompleteGroups_IsValid
                  - WordSenseBuilder_DataValidator_Validate_UncoveredSense_ViolatesPartition
                  - WordSenseBuilder_DataValidator_Validate_SenseInTwoGroups_ViolatesUnique
                  - WordSenseBuilder_DataValidator_Validate_GroupAcrossPartsOfSpeech_Violates
                  - WordSenseBuilder_DataValidator_Validate_GroupWithTwoRespellings_Violates
                  - WordSenseBuilder_DataValidator_Validate_OtherLemma_NeedsOneDefaultGroupPerPartOfSpeech

              - id: WordSense-WordData-DataValidator-LegacyMap
                title: >-
                  DataValidator shall check that every row of the legacy class map names an existing group or sense of
                  the stated level and that no old class id appears twice.
                tags: [unit]
                justification: |
                  A migration map with a dangling target or an ambiguous source would send callers to a wrong or missing
                  sense.
                tests:
                  - WordSenseBuilder_DataValidator_Validate_LegacyMapTargetMissing_Violates
                  - WordSenseBuilder_DataValidator_Validate_LegacyMapDuplicateClass_Violates
                  - WordSenseBuilder_DataValidator_Validate_LegacyMapLevelMismatch_Violates
