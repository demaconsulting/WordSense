---
# OnnxWordSenseModel unit requirements (the abstract base class of the encoder models)

sections:
  - title: WordSense Requirements
    sections:
      - title: Onnx Requirements
        sections:
          - title: OnnxWordSenseModel Requirements
            requirements:
              - id: WordSense-Onnx-OnnxWordSenseModel-Ensure
                title: >-
                  OnnxWordSenseModel shall, in its preparation step, verify every model file in a caller-supplied
                  directory without network access, or otherwise obtain the files into the per-user store, and shall
                  reject a missing or altered file.
                tags: [unit]
                justification: |
                  A user-supplied directory is as untrusted as a download; a stale, truncated or tampered model would
                  silently produce wrong senses.
                tests:
                  - OnnxWordSenseModel_EnsureModelAsync_ModelDirectory_VerifiesEveryFile
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity

              - id: WordSense-Onnx-OnnxWordSenseModel-Downloadable
                title: >-
                  OnnxWordSenseModel shall implement IDownloadableWordSenseModel, so that its preparation step is
                  available through the capability interface to code that holds only an IWordSenseModel.
                tags: [unit]
                justification: |
                  The encoder models are the models that have files; the capability interface is how callers that are
                  written against the contract reach the optional up-front preparation.
                tests:
                  - OnnxWordSenseModel_IsDownloadable

              - id: WordSense-Onnx-OnnxWordSenseModel-Failures
                title: >-
                  OnnxWordSenseModel shall report, from its preparation step and from the lazy preparation of
                  ClassifyAsync, a model file that no source could deliver, or that is missing from a supplied
                  directory, as ModelUnavailableException, a file that fails its pinned SHA-256 in a supplied
                  directory, a corrupt or foreign embedded weights resource or part-of-speech head and an ONNX or
                  vocabulary file that
                  cannot be used (including an ONNX model whose hidden size differs from the model description) as
                  ModelIntegrityException, and an invalid mirror address, credential, timeout,
                  store location or
                  WORDSENSE_MIRROR_* environment setting as DownloadConfigurationException, each carrying the original
                  exception as inner exception, and shall leave cancellation, disposal and argument exceptions
                  unchanged.
                tags: [unit]
                justification: |
                  Callers handle a failure by its cause: retry or switch to a directory when files are unavailable,
                  reinstall when they are damaged, fix the setting when it is wrong. A hash mismatch of a download is a
                  failed source, and the next source is tried, so it surfaces as unavailable when none delivers.
                tests:
                  - OnnxWordSenseModel_EnsureModelAsync_MissingFile_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_AlteredFile_ThrowsModelIntegrity
                  - OnnxWordSenseModel_EnsureModelAsync_AllSourcesFail_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_DownloadedHashMismatch_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_InvalidOptions_ThrowsDownloadConfiguration
                  - OnnxWordSenseModel_EnsureModelAsync_InvalidEnvironment_ThrowsDownloadConfiguration
                  - OnnxWordSenseModel_EnsureModelAsync_ModelDirectory_IgnoresInvalidOptions
                  - OnnxWordSenseModel_ClassifyAsync_MissingDirectory_ThrowsModelUnavailable
                  - OnnxWordSenseModel_ClassifyAsync_InvalidMirrorEnvironment_ThrowsDownloadConfiguration
                  - OnnxWordSenseModel_ClassifyAsync_WeightsOfAnotherImage_ThrowsModelIntegrity
                  - OnnxWordSenseModel_ClassifyAsync_DamagedOrMismatchedHead_ThrowsModelIntegrity
                  - OnnxWordSenseModel_ClassifyAsync_UnreadableOnnxFile_ThrowsModelIntegrity
                  - OnnxWordSenseModel_ClassifyAsync_VocabularyWithoutRequiredToken_ThrowsModelIntegrity
                  - OnnxWordSenseModel_ClassifyAsync_EncoderHiddenSizeMismatch_ThrowsModelIntegrity

              - id: WordSense-Onnx-OnnxWordSenseModel-Concurrent
                title: >-
                  OnnxWordSenseModel shall let concurrent preparation calls share one download and shall allow a
                  failed preparation to be retried.
                tags: [unit]
                justification: |
                  Services start several tasks at once; they must neither download twice nor be stuck after a
                  transient network failure.
                tests:
                  - OnnxWordSenseModel_EnsureModelAsync_Concurrent_SharesOneDownload
                  - OnnxWordSenseModel_EnsureModelAsync_AllSourcesFail_ThrowsModelUnavailable
                  - OnnxWordSenseModel_EnsureModelAsync_CancelledCaller_DoesNotCancelSharedWork

              - id: WordSense-Onnx-OnnxWordSenseModel-Classify
                title: >-
                  OnnxWordSenseModel shall classify with one shared encoder session and one set of weights, shall
                  ensure its model files lazily on first need (with the default and environment mirror settings,
                  sharing one ensure between concurrent callers and allowing a failed ensure to be retried), and shall
                  answer words that need no model (unknown, single-sense, or ambiguous without trained weights)
                  without touching model files or the encoder, an ambiguous word without weights getting the
                  lexicon analyses at the part of speech level (every lemma and part of speech equally likely, the
                  feature variants of one sharing its probability, no scored senses).
                tags: [unit]
                justification: |
                  Loading a session and weights is expensive and must happen once; a model that is never needed must
                  never be downloaded, and callers should not have to sequence preparation and use themselves.
                tests:
                  - OnnxWordSenseModel_ClassifyAsync_LexiconOnlyWords_NeverTouchesModelFiles
                  - OnnxWordSenseModel_ClassifyAsync_UntrainedAmbiguousWords_AnswerPartOfSpeechWithoutModelFiles
                  - OnnxWordSenseModel_ClassifyAsync_WithoutEnsure_EnsuresLazily
                  - OnnxWordSenseModel_ClassifyAsync_Concurrent_ShareOneLazyEnsure
                  - OnnxWordSenseModel_ClassifyAsync_AfterFailedLazyEnsure_CanBeRetried
                  - OnnxWordSenseModel_ClassifyAsync_MissingDirectory_ThrowsModelUnavailable
                  - OnnxWordSenseModel_ClassifyAsync_Repeated_ShareTheEncoder

              - id: WordSense-Onnx-OnnxWordSenseModel-Head
                title: >-
                  OnnxWordSenseModel shall load and check the part-of-speech head embedded in its package together with
                  the embedded weights, without any model file, shall have no head when its model description names
                  none, and shall report a missing, damaged or mismatched head as ModelIntegrityException with the
                  original exception as inner exception.
                tags: [unit]
                justification: |
                  The head and the weights are shipped in the package, so a defect in either is a defect of the
                  installation that must surface at load, as an integrity failure, not as wrong answers later.
                tests:
                  - OnnxWordSenseModel_ClassifyAsync_EmbeddedHead_LoadsWithoutModelFiles
                  - OnnxWordSenseModel_GetHead_NoHeadResource_ReturnsNull
                  - OnnxWordSenseModel_ClassifyAsync_DamagedOrMismatchedHead_ThrowsModelIntegrity

              - id: WordSense-Onnx-OnnxWordSenseModel-Dispose
                title: >-
                  OnnxWordSenseModel shall release its encoder session on disposal, tolerate repeated and concurrent
                  disposal, defer the release while a classification is running (the running call completes and the
                  last one to finish releases the session; new calls are refused at once), cancel a download that its
                  preparation step has in flight (the pending call then throws OperationCanceledException and leaves
                  no partial file), and throw ObjectDisposedException from EnsureModelAsync and ClassifyAsync after
                  disposal.
                tags: [unit]
                justification: |
                  The ONNX session holds native memory; its release must be deterministic and must never happen under
                  a running inference, a disposal must never hang on a running download or classification, and use
                  after disposal must fail clearly.
                tests:
                  - OnnxWordSenseModel_Dispose_CalledTwice_IsHarmless
                  - OnnxWordSenseModel_Dispose_Concurrent_IsHarmless
                  - OnnxWordSenseModel_Dispose_DuringEnsure_CancelsDownload
                  - OnnxWordSenseModel_Dispose_DuringClassification_DefersEncoderRelease
                  - OnnxWordSenseModel_Dispose_Idle_ReleasesEncoderImmediately
                  - InFlightTracker_Close_Idle_ReleasesOnce
                  - InFlightTracker_Close_WithRunningOperations_ReleasesAfterLastExit
                  - InFlightTracker_Enter_AfterClose_ThrowsObjectDisposed
                  - InFlightTracker_Close_DoesNotWaitForRunningOperation
                  - InFlightTracker_ConcurrentEnterExitClose_ReleasesExactlyOnce
                  - OnnxWordSenseModel_ClassifyAsync_AfterDispose_ThrowsObjectDisposed
                  - OnnxWordSenseModel_EnsureModelAsync_AfterDispose_ThrowsObjectDisposed

              - id: WordSense-Onnx-OnnxWordSenseModel-Identity
                title: >-
                  OnnxWordSenseModel shall expose the model identifier and the hidden size of the encoder before any
                  file is downloaded.
                tags: [unit]
                justification: |
                  Callers and tests need the identity to name folders and size buffers without waiting for a download.
                tests:
                  - OnnxWordSenseModel_ModelIdAndHiddenSize_AreAvailableBeforeEnsure

              - id: WordSense-Onnx-OnnxWordSenseModel-Options
                title: >-
                  OnnxWordSenseModel shall accept a maximum sequence length from 8 to 512 and reject any other value.
                tags: [unit]
                justification: |
                  The encoders cannot accept sequences outside that range, so a bad value must fail at construction.
                tests:
                  - OnnxWordSenseModel_Constructor_SequenceLengthOutOfRange_Throws
