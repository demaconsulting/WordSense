---
# DownloadMirror unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: Onnx Requirements
        sections:
          - title: DownloadMirror Requirements
            requirements:
              - id: WordSense-Onnx-DownloadMirror-Validation
                title: >-
                  The mirror shall accept only absolute http or https base URLs and consistent, safe credentials:
                  Basic credentials or a bearer token but not both, a bearer token that is not blank, and credentials
                  only over https unless the host is a loopback address.
                tags: [unit]
                justification: |
                  Credentials must not be sent over plain http to remote hosts, and a malformed mirror must fail at
                  configuration time rather than during a download.
                tests:
                  - DownloadMirror_Constructor_HttpsBase_IsAccepted
                  - DownloadMirror_Constructor_InvalidBase_Throws
                  - DownloadMirror_Constructor_UserInfoInBase_Throws
                  - DownloadMirror_Constructor_RelativeBase_Throws
                  - DownloadMirror_Constructor_BadAuthentication_Throws
                  - DownloadMirror_Constructor_CredentialsOverPlainHttp_OnlyLoopbackAllowed
                  - DownloadMirror_Constructor_LoopbackNames_AllowSecretsOverHttp

              - id: WordSense-Onnx-DownloadMirror-Environment
                title: >-
                  The mirror configuration shall be readable from the WORDSENSE_MIRROR_URL, WORDSENSE_MIRROR_USER,
                  WORDSENSE_MIRROR_PASSWORD and WORDSENSE_MIRROR_BEARER_TOKEN environment variables.
                tags: [unit]
                justification: |
                  Deployments configure the mirror without code changes, for example in a container or CI job where
                  only the environment can be set.
                tests:
                  - DownloadMirror_FromEnvironment_NoUrl_ReturnsNull
                  - DownloadMirror_FromEnvironment_AllVariables_BuildsMirror
                  - DownloadMirror_FromEnvironment_InvalidConfiguration_Throws
                  - DownloadMirror_FromEnvironment_BearerWithoutUrlOrPasswordWithoutUser_Throws
                  - DownloadMirror_FromEnvironment_WhitespaceOnlyCredentials_AreUnset

              - id: WordSense-Onnx-DownloadMirror-Redaction
                title: >-
                  The mirror configuration shall never reveal secrets when converted to text, and a configuration
                  error shall never repeat a secret or the rejected URL.
                tags: [unit]
                justification: |
                  Logs and exception messages must not leak passwords or tokens.
                tests:
                  - DownloadMirror_ToString_RedactsSecrets
                  - DownloadMirror_FromEnvironment_InvalidConfiguration_Throws
