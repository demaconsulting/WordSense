---
# LemmaWeights unit requirements (the weights blob, the weighted lemma table and scoring)

sections:
  - title: WordSense Requirements
    sections:
      - title: Onnx Requirements
        sections:
          - title: LemmaWeights Requirements
            requirements:
              - id: WordSense-Onnx-LemmaWeights-Format
                title: >-
                  The weights reader shall read the binary weights blob of a model: its model identifier, the class
                  hash of the word image, dimension, mean vector and, per lemma, its class ids, bias, abstain margin and
                  weights.
                tags: [unit]
                justification: |
                  The trained classifiers ship as one compact blob per model; the reader must reproduce exactly what
                  the build tool wrote.
                tests:
                  - WordSenseBuilder_WeightsBlobWriter_Write_RoundTripsThroughTheReader
                  - WordSenseBuilder_WeightsBlobWriter_Write_NoLemmas_RoundTrips
                  - WeightsBlob_Read_OneVersusRestLemma_KeepsClassIds
                  - WeightsBlob_Read_NoLemmas_ReturnsEmptyWeights

              - id: WordSense-Onnx-LemmaWeights-Integrity
                title: >-
                  The weights reader shall reject a corrupt, truncated or foreign blob, a lemma whose class count does
                  not fit its kind (a Binary lemma needs exactly two classes), an empty or duplicate class id, a zero
                  dimension and trailing bytes, and the reader and the writer shall reject any lemma, of every model
                  kind, whose number of class ids differs from the sense count of its weights.
                tags: [unit]
                justification: |
                  A damaged blob must fail loudly instead of producing silently wrong answers.
                tests:
                  - WeightsBlob_Read_NotCompressed_Throws
                  - WeightsBlob_Read_UnknownMagic_Throws
                  - WeightsBlob_Read_Truncated_Throws
                  - WeightsBlob_Read_WrongSenseCountForKind_Throws
                  - WeightsBlob_Read_BinaryLemmaWithTwoClasses_IsAccepted
                  - WeightsBlob_Read_EmptyOrDuplicateClassId_Throws
                  - WeightsBlob_Read_MalformedUtf8Lemma_Throws
                  - WeightsBlob_Read_ZeroDimension_Throws
                  - WeightsBlob_Read_TrailingBytes_Throws
                  - WordSenseBuilder_WeightsBlobWriter_Write_BinaryWithThreeSenses_Throws
                  - WordSenseBuilder_WeightsBlobWriter_Write_OneVersusRestClassCountMismatch_Throws

              - id: WordSense-Onnx-LemmaWeights-Match
                title: >-
                  The weighted lemma table shall resolve the class ids of the weights against the word image at load,
                  shall refuse weights trained for another class inventory (class hash), an unknown class, a duplicate
                  class or lemma, and a class count that differs from the weights.
                tags: [unit]
                justification: |
                  Weights score senses by class; a table that silently disagreed with the image would assign scores to
                  the wrong senses, so every disagreement must fail loudly at load.
                tests:
                  - WeightedLemmaTable_Constructor_KnownClasses_AreFoundById
                  - WeightedLemmaTable_Constructor_OtherClassHash_ThrowsNamingBothHashes
                  - WeightedLemmaTable_Constructor_UnknownClass_Throws
                  - WeightedLemmaTable_Constructor_DuplicateClass_Throws
                  - WeightedLemmaTable_Constructor_DuplicateLemma_Throws
                  - WeightedLemmaTable_Constructor_ClassCountMismatch_Throws
                  - WeightedLemmaTable_LoadEmbedded_WrongModelId_Throws

              - id: WordSense-Onnx-LemmaWeights-Scoring
                title: >-
                  Lemma weights shall score each sense of a lemma for a feature vector, rank the senses, and map the
                  margin between the best and the second-best score to a confidence that is monotonic in the margin
                  and bounded to 0 to 1.
                tags: [unit]
                justification: |
                  The confidence is the contract callers rely on; a monotonic, bounded mapping makes thresholds
                  meaningful.
                tests:
                  - LemmaWeights_Scores_Binary_ReturnsSymmetricScores
                  - LemmaWeights_Scores_OneVersusRest_ReturnsOneScorePerRow
                  - LemmaWeights_Rank_ReturnsBestAndMargin
                  - LemmaWeights_Confidence_IsMonotonicAndClamped

              - id: WordSense-Onnx-LemmaWeights-Embedded
                title: >-
                  The weights embedded in each model package shall resolve completely against the shipped word image:
                  the class hash matches and every class of every lemma is known.
                tags: [unit]
                justification: |
                  A weights blob trained against another class inventory would score the wrong senses; the shipped image
                  and weights must always have been built together.
                tests:
                  - EmbeddedWeights_MiniLM_MatchesWordImage
                  - EmbeddedWeights_BertBaseCased_MatchesWordImage
