---
# OnnxClassifier unit requirements

sections:
  - title: WordSense Requirements
    sections:
      - title: Onnx Requirements
        sections:
          - title: OnnxClassifier Requirements
            requirements:
              - id: WordSense-Onnx-OnnxClassifier-Lookup
                title: >-
                  OnnxClassifier shall look a word up without regard to its case, and answer a word with no lexicon
                  entry as unknown: not known, no analysis, no details, level none and confidence 0.
                tags: [unit]
                justification: |
                  Words that need no context must cost no inference and must be answered identically in every model,
                  whatever their capitalization.
                tests:
                  - OnnxClassifier_ClassifyAsync_UnknownWord_IsAnsweredAsUnknown
                  - OnnxClassifier_ClassifyAsync_CapitalizedWord_ResolvesLikeLowerCase
                  - OnnxWordSenseModel_ClassifyAsync_LexiconOnlyWords_NeverTouchesModelFiles

              - id: WordSense-Onnx-OnnxClassifier-SingleSense
                title: >-
                  OnnxClassifier shall answer a word with exactly one analysis whose lemma and part of speech have
                  exactly one sense (a determiner such as the, for example) at the sense level with that analysis
                  (probability 1), that sense (probability 1) and confidence 1, without running the encoder.
                tags: [unit]
                justification: |
                  A word without ambiguity needs no context; it must cost no inference and must be answered
                  identically in every model.
                tests:
                  - OnnxClassifier_ClassifyAsync_SingleAnalysisSingleSense_AnswersTheSense
                  - OnnxClassifier_ClassifyAsync_SingleSenseWord_DoesNotEncode

              - id: WordSense-Onnx-OnnxClassifier-Encode
                title: >-
                  OnnxClassifier shall read the words as one running text joined by single spaces, and shall run the
                  encoder only when at least one word needs it: a word that has several senses and intact lemma
                  weights or, for a classifier with a part-of-speech head, a known word of two or more distinct parts
                  of speech whatever its lemma; a text of unknown words, words of one sense and known words of one part
                  of speech whose senses are not scored shall be answered without running the encoder, whatever the
                  head.
                tags: [unit]
                justification: |
                  Encoding is the expensive step; a text without ambiguous words must not pay for it. With a head the
                  part of speech of every word of several parts of speech is decided from the sentence, so such a
                  word needs the encoder, and the model needs its files, even when the senses of its lemma are not
                  scored; this cannot be turned off.
                tests:
                  - OnnxClassifier_ClassifyAsync_NoAmbiguousWords_DoesNotEncode
                  - OnnxClassifier_ClassifyAsync_AmbiguousWords_UseTheEncoder
                  - OnnxClassifier_ClassifyAsync_OnlyAmbiguousWordsAreEncoded
                  - OnnxClassifier_NeedsEncoder_PendingWordsAndWordsOfSeveralPartsOfSpeech_AreTrue
                  - OnnxClassifier_ClassifyAsync_WordsOfOnePartOfSpeech_DoNotRunTheEncoder

              - id: WordSense-Onnx-OnnxClassifier-AnalysisSenses
                title: >-
                  OnnxClassifier shall score the fine senses of every analysis of the looked-up word that has an
                  open-class part of speech (noun, verb, adjective, adverb), so that a sense of each of those parts of
                  speech the word can have is reachable, and no sense of any other lemma.
                tags: [unit]
                justification: |
                  A word that is a verb and a noun must be able to be answered as each; answering with a sense of a
                  lemma that the word cannot be would be wrong.
                tests:
                  - OnnxClassifier_ClassifyAsync_WordWithSeveralAnalyses_RanksTheSensesOfEveryAnalysis
                  - OnnxClassifier_ClassifyAsync_InflectedForm_RanksTheSensesOfItsLemma

              - id: WordSense-Onnx-OnnxClassifier-AnalysisProbability
                title: >-
                  OnnxClassifier shall derive the probability of each analysis from the same scores as the senses, so
                  that the senses of an analysis are its probabilities given the analysis.
                tags: [unit]
                justification: |
                  Deriving the analysis probabilities from the sense scores keeps the analyses and the senses of one
                  result consistent with each other.
                tests:
                  - OnnxClassifier_ClassifyAsync_WordWithSeveralAnalyses_RanksTheSensesOfEveryAnalysis

              - id: WordSense-Onnx-OnnxClassifier-ClosedClass
                title: >-
                  OnnxClassifier shall list an analysis of a closed class (auxiliary, determiner, pronoun,
                  preposition, conjunction, interjection) without senses, and its senses shall not compete with the
                  senses of the open-class analyses; for a classifier without a part-of-speech head the probability of
                  such a slot shall be 0 and no fallback of the probability (a chooser label without mass, a word
                  without mass) shall give a closed-class slot any, and a chooser label that stands for closed-class
                  slots only shall give its probability to no slot; for a classifier with a head the probability of the
                  slot is the head's (WordSense-Onnx-OnnxClassifier-PartOfSpeech).
                tags: [unit]
                justification: |
                  A closed class has no WordNet senses and its project senses are few, so the mass of its senses says
                  nothing about whether the word is used in that way. Without a head the tagger of the fallback model
                  decides it (WordSense-Core-WordSenseContracts-FallbackClosedClass); with a head the classifier has an
                  estimate of its own for the slot.
                tests:
                  - OnnxClassifier_ClassifyAsync_ClosedClassUseOfLike_IsNotScored
                  - OnnxClassifier_ClassifyAsync_ClosedOnlyChooserLabel_GivesItsProbabilityToNoSlot
                  - OnnxClassifier_ClassifyAsync_EveryLabelClosedOnly_SharesEquallyAndIsFinite
                  - OnnxClassifier_ClassifyAsync_ClosedClassSlots_GetPartOfSpeechMassAndNoSenses
              - id: WordSense-Onnx-OnnxClassifier-SharedCandidates
                title: >-
                  OnnxClassifier shall provide to the build tool the candidate selection that it uses itself for the
                  form of a word and a trained lemma (the open-class senses of the parts of speech that the form has
                  for the lemma, and whether the encoder runs for the form), and the scores of a word for a lemma as
                  it works them out before any threshold decides a level.
                tags: [unit]
                justification: |
                  The thresholds, the calibration and the precision gate that the build tool computes are only valid
                  when they rank the senses that inference ranks, so the rule has one implementation that both use.
                tests:
                  - OnnxClassifier_CandidatesOf_FormColumnsAndPlan_AreThoseOfInference
                  - OnnxClassifier_EncoderRuns_FormOfSeveralLemmas_NeedsItsChooser
              - id: WordSense-Onnx-OnnxClassifier-SharedOutcome
                title: >-
                  OnnxClassifier shall tell the build tool, for a word and a lemma, whether the threshold of the lemma
                  decides the level of the answer, by the one decision that it uses itself to answer: the encoder does
                  not run for the form, the lemma is not scored, the chooser is not confident, the selected analysis
                  is of another lemma, or the best sense is of another part of speech than the selected analysis; for
                  every outcome but the threshold deciding it answers at the part-of-speech level.
                tags: [unit]
                justification: |
                  The calibration may only observe the rows on which a threshold is applied at run time, so the early
                  exits of the classifier are named once and the build tool reads the same decision.
                tests:
                  - OnnxClassifier_ScoreForm_ChooserBelowItsThreshold_TheLemmaThresholdDoesNotDecide
                  - OnnxClassifier_ScoreForm_OtherEarlyExits_AreOutcomesThatInferenceShares
              - id: WordSense-Onnx-OnnxClassifier-Candidates
                title: >-
                  OnnxClassifier shall list, for a trained lemma, the senses of every open-class analysis of the word in
                  the Senses of that analysis, ranked by the softmax-normalized per-lemma fine scores given the analysis
                  so that their probabilities sum to one, keeping the inventory order on equal probabilities, never
                  truncated and whatever level is answered, shall list no senses for an analysis of a closed class
                  (see WordSense-Onnx-OnnxClassifier-ClosedClass), and shall list no scored senses for a lemma without
                  weights (the single sense with probability 1 of an analysis with exactly one sense excepted).
                tags: [unit]
                justification: |
                  The fine scores exist for every open-class sense of the form whatever level is answered; listing them
                  ranked inside their analyses lets a consumer apply its own grouping, and a lemma without scores, or
                  a closed-class use that has no WordNet senses, has nothing honest to list. A non-empty list for the
                  selected analysis is also what makes a composite model use the result of the encoder instead of its
                  fallback.
                tests:
                  - OnnxClassifier_ClassifyAsync_TrainedLemma_ListsRankedCandidatesSummingToOne
                  - OnnxClassifier_ClassifyAsync_ClosedClassUseOfLike_IsNotScored
                  - OnnxClassifier_ClassifyAsync_ClosedClassSlotOfAnUnscoredLemma_HasNoProbability
                  - OnnxClassifier_ClassifyAsync_SingleSenseWord_ListsItsOneUnscoredSense
                  - OnnxClassifier_ClassifyAsync_LemmaWithoutWeights_ListsNoCandidates

              - id: WordSense-Onnx-OnnxClassifier-Slots
                title: >-
                  OnnxClassifier shall compute the probabilities per lemma and part of speech (a slot), never per
                  feature variant: the probability of a slot is the mass of its senses (for a form with a chooser,
                  the share of the chooser's labels that its analyses carry; with a part-of-speech head this mass is
                  the share of the slot among the slots of its part of speech, see
                  WordSense-Onnx-OnnxClassifier-PartOfSpeech), the probability of a sense given its slot
                  is its mass renormalized in the slot, the analyses of one slot that differ only in features split the
                  probability of the slot (by the chooser when it has a label for each of them, otherwise equally,
                  ties in lexicon order), and the selected analysis is the best variant of the most probable slot, so
                  that the number of feature variants never lowers a confidence and never moves the selection to
                  another part of speech.
                tags: [unit]
                justification: |
                  The senses belong to a lemma and a part of speech, not to a feature variant (cut as an infinitive and
                  as a past tense, deer as a singular and a plural). Dividing the mass of a slot by its number of
                  variants halved the confidence in a sense for no reason in the evidence and let a part of speech with
                  one analysis beat a more probable one with several.
                tests:
                  - OnnxClassifier_ClassifyAsync_FeaturesOfOneLemmaAndPartOfSpeech_ShareTheSlotProbability
                  - OnnxClassifier_ClassifyAsync_SlotWithSeveralVariants_IsSelectedByItsTotalProbability
                  - OnnxClassifier_ClassifyAsync_VariantsOfTheOnlySlot_AreConfidentAtThePartOfSpeech
                  - OnnxClassifier_ClassifyAsync_ReadPastVersusPresent_ChoosesTheTenseFeatures

              - id: WordSense-Onnx-OnnxClassifier-Confidence
                title: >-
                  OnnxClassifier shall report the confidence of an answer as the probability of its level (the
                  probability of the slot of the selected analysis, times the probability of the answered sense or the
                  summed probability of the member senses of the answered group, within that slot), from 0 to 1,
                  growing monotonically with the margin of the best fine score over the others.
                tags: [unit]
                justification: |
                  A monotonic confidence lets a caller choose a threshold, and defining it from the probabilities that
                  the result also lists keeps the summary and the full answer consistent.
                tests:
                  - OnnxClassifier_ClassifyAsync_LargerMargin_GivesHigherConfidence
                  - OnnxClassifier_ClassifyAsync_ConfidenceIsWithinZeroAndOne

              - id: WordSense-Onnx-OnnxClassifier-BestCandidate
                title: >-
                  OnnxClassifier shall keep the best sense and the best group of a trained lemma visible, in the ranked
                  Senses of the selected analysis, whatever level it answers, so that a coarser answer still tells
                  which senses and groups are likely.
                tags: [unit]
                justification: |
                  Callers that accept a coarser answer, or that group the senses their own way, must not lose the
                  model's ranking because the model stepped up to a coarser level.
                tests:
                  - OnnxClassifier_ClassifyAsync_LowMargin_KeepsTheBestSenseAndGroupVisibleInTheRankedSenses

              - id: WordSense-Onnx-OnnxClassifier-FineThreshold
                title: >-
                  OnnxClassifier shall answer the best fine sense at the sense level, with the sense id and, when the
                  sense is in a group, its group id, when the margin of the best fine sense reaches the lemma's fine
                  threshold, and the best sense lies in the selected analysis.
                tags: [unit]
                justification: |
                  The fine threshold is the lemma's own measured point above which a fine answer meets the precision
                  target; at or above it the model is allowed to name the sense.
                tests:
                  - OnnxClassifier_ClassifyAsync_MarginAboveFineThreshold_AnswersSense
                  - OnnxClassifier_ClassifyAsync_MarginAtFineThreshold_AnswersSense

              - id: WordSense-Onnx-OnnxClassifier-GroupThreshold
                title: >-
                  OnnxClassifier shall, for a lemma that has groups, when the fine threshold is not met but the best
                  sense is in a group and the margin of that group reaches the lemma's group threshold, answer the
                  group at the group level, with the group id only (the member senses stay listed in the Senses of the
                  selected analysis).
                tags: [unit]
                justification: |
                  Two close fine senses of one group are often not separable, but the group is; naming the group is
                  more useful than a coin toss between its senses. A lemma without groups has no group to name.
                tests:
                  - OnnxClassifier_ClassifyAsync_FineBelowAndGroupAboveThreshold_AnswersGroup

              - id: WordSense-Onnx-OnnxClassifier-StepToPartOfSpeech
                title: >-
                  OnnxClassifier shall, when the fine threshold is not met and no group can be answered (the lemma has
                  no groups, the best sense is in no group, or the group margin does not reach the group threshold),
                  answer at the part of speech level with the selected analysis and its probability as the confidence,
                  never as unknown, and shall never answer at the group level for a lemma that has no groups or for a
                  group whose threshold is not met.
                tags: [unit]
                justification: |
                  Levels nest as part of speech, group and sense, and a group exists only where it was curated; a
                  model that is unsure between senses, and not sure of their shared group either, can honestly state
                  only the part of speech, while the ranked senses of the analysis still show which senses and groups
                  are likely. Such a model must never invent a group or name one that missed its precision target.
                tests:
                  - OnnxClassifier_ClassifyAsync_LemmaWithoutGroups_StepsFromSenseToPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_BothBelowThreshold_AnswersPartOfSpeech

              - id: WordSense-Onnx-OnnxClassifier-Untrained
                title: >-
                  OnnxClassifier shall answer a known word whose senses it does not score (its lemma has no usable
                  trained weights, and no form chooser applies to it) from the lexicon alone, except that a classifier
                  with a part-of-speech head gives the parts of speech of such a word of several parts of speech the
                  probabilities of the head (WordSense-Onnx-OnnxClassifier-PartOfSpeech): a single analysis with
                  probability 1 (at the sense level with
                  that sense listed with probability 1 when its lemma and part of speech have exactly one sense, else at
                  the part of speech level), and several analyses with the uniform probability 1/s for each of the s
                  lemmas and parts of speech (for a classifier without a head, or a word without a usable vector),
                  shared equally by the analyses of one of them that differ only in
                  features, listed by lemma and part of speech in lexicon order with the first analysis as the
                  selected analysis, at the part of speech level with the probability of the lemma and part of speech
                  of the selected analysis as confidence and no scored senses, and never a guessed fine sense.
                tags: [unit]
                justification: |
                  A word must never vanish because a model was not trained for it, and a first-sense guess presented as
                  a sense misleads callers; the encoder model owns no statistical model, so it states honestly what the
                  lexicon says and leaves the choice between analyses to the fallback model of a composition, whose
                  turn it is exactly when no senses were scored.
                tests:
                  - OnnxClassifier_ClassifyAsync_LemmaWithoutWeights_AnswersAnalysesWithoutScoredSenses
                  - OnnxClassifier_ClassifyAsync_LemmaWithoutWeights_NeverAnswersAFineSense
                  - OnnxClassifier_ClassifyAsync_SingleAnalysisSeveralSenses_AnswersPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_SeveralAnalysesFirstWithOneSense_StaysAtPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_SeveralAnalysesLaterWithOneSense_StaysAtPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_VariantsOfTheOnlySlot_AreConfidentAtThePartOfSpeech

              - id: WordSense-Onnx-OnnxClassifier-NoVector
                title: >-
                  OnnxClassifier shall answer a word that has trained weights but no usable encoder vector like a word
                  without trained weights, from the lexicon at the part of speech level, not as unknown, and shall
                  answer a word of several parts of speech that has no vector, or a vector that does not have the
                  hidden size of the head, from the lexicon alone, with equal probabilities.
                tags: [unit]
                justification: |
                  Without evidence for the fine decision a guess would look like a trained answer; the analyses are
                  still known, and the level tells the caller that no sense was decided. A vector of another size
                  cannot be fed to the head.
                tests:
                  - OnnxClassifier_ClassifyAsync_DimensionMismatch_FallsBackToPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_WordWithoutVector_IsAnsweredFromTheLexicon
                  - OnnxClassifier_ClassifyAsync_VectorOfAnotherSize_IsAnsweredFromTheLexicon

              - id: WordSense-Onnx-OnnxClassifier-MultiLemmaForm
                title: >-
                  OnnxClassifier shall answer a form whose analyses belong to several lemmas (left, bases, rows,
                  found) or to several tenses of one lemma (read, reread) that has a chooser from the sentence
                  context: the chooser gives each of its labels (a lemma, or a lemma and its features) a
                  probability, which is shared among the lemma-and-part-of-speech slots of the analyses of the label
                  by the mass of their scored senses (equally when none of them has scored senses, as for a lemma
                  without trained weights, whose analyses list no scored senses) and, inside a slot, equally among
                  its analyses; the selected analysis is the best analysis of the most probable slot; the level is the
                  part of speech, with the probability of that slot as confidence, when the chooser is not confident
                  (its margin is below its threshold) or when the lemma of the selected analysis has no scored senses,
                  and otherwise the sense, group or part of speech level decided with the thresholds of the lemma of
                  the selected analysis, with the probability of that level as confidence. A form of several lemmas
                  that has no chooser is answered from the lexicon alone, as a word without trained weights.
                tags: [unit]
                justification: |
                  One classifier per lemma cannot be applied before the lemma is known; a form such as left is a
                  verb of leave or an adjective of left, and the wrong lemma would answer with senses the word does not
                  have in that sentence. Naming what happens when only one of the lemmas of a form has trained weights
                  keeps the probabilities of one result consistent: an untrained lemma never gets a guessed sense.
                tests:
                  - OnnxClassifier_ClassifyAsync_FormOfTwoLemmas_ChoosesTheLemmaFromContext
                  - OnnxClassifier_ClassifyAsync_ReadPastVersusPresent_ChoosesTheTenseFeatures
                  - OnnxClassifier_ClassifyAsync_FormChooserBelowThreshold_AnswersPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_FormOfTrainedAndUntrainedLemma_ChooserPicksTrained_AnswersTheSense
                  - OnnxClassifier_ClassifyAsync_FormOfTrainedAndUntrainedLemma_ChooserPicksUntrained_AnswersPartOfSpeech
                  - OnnxClassifier_ClassifyAsync_FormOfSeveralLemmasWithoutChooser_IsAnsweredFromTheLexicon

              - id: WordSense-Onnx-OnnxClassifier-PartOfSpeech
                title: >-
                  OnnxClassifier with a part-of-speech head shall give a known word of two or more distinct parts of
                  speech the probability of each part of speech from the head, the posterior restricted to the parts of
                  speech that the lexicon lists for the word and renormalized, and shall give each slot (lemma and part
                  of speech) the probability of its part of speech times the share of the slot among the slots of that
                  part of speech: the share of the mass of its senses (or of its chooser labels) when its lemma is
                  scored, else equal; the analyses shall be listed by slot, the most probable slot first, the
                  probabilities of the analyses summing to one, and the selected analysis shall be the best analysis of
                  the most probable slot.
                tags: [unit]
                justification: |
                  The part of speech of a word is decided by the sentence, not by the senses of its lemma: the mass of
                  the senses of an untrained or a closed-class slot says nothing about it. The head reads the sentence;
                  restricting it to the parts of speech of the lexicon removes impossible answers, and the shares keep
                  the evidence of the senses for the choice between slots of one part of speech.
                tests:
                  - OnnxClassifier_ClassifyAsync_UntrainedWordOfSeveralPartsOfSpeech_TakesTheRestrictedPosterior
                  - OnnxClassifier_ClassifyAsync_UntrainedWord_FollowsTheHead
                  - OnnxClassifier_ClassifyAsync_SeveralSlotsOfOnePartOfSpeech_ShareItsProbabilityEqually
                  - OnnxClassifier_ClassifyAsync_ManyWords_KeepTheInvariants

              - id: WordSense-Onnx-OnnxClassifier-PartOfSpeechClosedClass
                title: >-
                  OnnxClassifier with a part-of-speech head shall give a closed-class slot of a word of several parts
                  of speech the probability of its part of speech from the head and no senses, whether or not the
                  lemma of the word has trained weights.
                tags: [unit]
                justification: |
                  A closed class has no WordNet senses to give it mass; the head estimates it from the sentence (the
                  auxiliary have against the verb have), so that no other model has to.
                tests:
                  - OnnxClassifier_ClassifyAsync_ClosedClassSlots_GetPartOfSpeechMassAndNoSenses

              - id: WordSense-Onnx-OnnxClassifier-PartOfSpeechSenses
                title: >-
                  OnnxClassifier with a part-of-speech head shall leave the scores of the senses, the ranked senses of
                  every analysis and the sense and the group of an answer independent of the head, shall keep the
                  level of an answer whose slot the head ranks first, with the probability of the part of speech
                  times the probability of the sense (or of the group) within the slot as confidence, and shall answer
                  at the part-of-speech level, with the probability of the slot as confidence and the senses of every
                  slot still listed, when the best sense lies in a slot that the head does not rank first.
                tags: [unit]
                justification: |
                  The head decides the part of speech only; the sense is decided by the weights of the lemma and the
                  thresholds that were calibrated for them, so an answer is never finer than the evidence for its
                  part of speech.
                tests:
                  - OnnxClassifier_ClassifyAsync_TrainedLemma_HeadAgrees_KeepsTheSenseLevelWithTheHeadProbability
                  - OnnxClassifier_ClassifyAsync_TrainedLemma_HeadDisagrees_StepsDownToThePartOfSpeech
                  - OnnxClassifier_ClassifyAsync_TrainedLemma_SensesInsideASlotDoNotDependOnTheHead

              - id: WordSense-Onnx-OnnxClassifier-PartOfSpeechContext
                title: >-
                  OnnxClassifier with a part-of-speech head shall encode every word of the text with one call of the
                  encoder in the possessive view (a possessive that is written as one token as its stem and its
                  marker), and shall feed the head the vectors of the word and of its previous and next token in that
                  view, the first word having no previous vector and the last no next one.
                tags: [unit]
                justification: |
                  The head was trained on the vectors of the neighbors in the form of the open corpus, which separates
                  the possessive marker; the cost of the text is one encoder run, not one per word.
                tests:
                  - OnnxClassifier_ClassifyAsync_Neighbors_AreThoseOfThePossessiveView
                  - OnnxClassifier_ClassifyAsync_NextWord_ReachesTheHead

              - id: WordSense-Onnx-OnnxClassifier-PartOfSpeechVector
                title: >-
                  OnnxClassifier with a part-of-speech head shall score the senses of a word of a trained lemma with
                  the vector of the word pooled over all its word pieces: the vector of the possessive view when the
                  view keeps the word whole, and a second encoder pass for the word when the view splits it (a
                  possessive that is written as one token).
                tags: [unit]
                justification: |
                  The weights were trained on the vector of a whole word; the stem of a possessive alone would score
                  the senses on other evidence.
                tests:
                  - OnnxClassifier_ClassifyAsync_PendingPossessive_UsesTheJoinedVector
                  - OnnxClassifier_ClassifyAsync_PendingWordKeptWhole_UsesTheViewVector

              - id: WordSense-Onnx-OnnxClassifier-Validation
                title: >-
                  OnnxClassifier shall return an empty array for an empty list and results parallel to the input, and
                  shall reject a null list, a null element and a cancelled call, and a head without both encoders.
                tags: [unit]
                justification: |
                  Misuse must fail fast with a documented exception, and results must map onto the input by index.
                tests:
                  - OnnxClassifier_ClassifyAsync_EmptyList_ReturnsEmpty
                  - OnnxClassifier_ClassifyAsync_NullWords_Throws
                  - OnnxClassifier_ClassifyAsync_NullElement_Throws
                  - OnnxClassifier_ClassifyAsync_Cancelled_Throws
                  - OnnxClassifier_Constructor_HeadWithoutEncoders_Throws

              - id: WordSense-Onnx-OnnxClassifier-Tense
                title: >-
                  OnnxClassifier with a tense head shall give, with ClassifyWithTenseAsync and for every word that is a
                  same-spelling verb (a verb with a past and a non-past analysis) and has a usable vector, the
                  probability that the word is past from the tense head, parallel to the results, and no probability
                  for any other word, for a word without a usable vector and for a classifier without a tense head.
                  The results shall not depend on the tense head.
                tags: [unit]
                justification: |
                  The tense of read, put and found cannot be decided by the lexicon; the encoder reads it from the
                  sentence, and the composite model combines it with the tense split of Basic.
                tests:
                  - OnnxClassifier_ClassifyWithTenseAsync_SameSpellingVerb_GivesTheProbabilityOfPast
                  - OnnxClassifier_ClassifyWithTenseAsync_WithoutTenseHead_GivesNoProbabilityAndTheSameResults
                  - OnnxClassifier_ClassifyWithTenseAsync_WordWithoutVector_HasNoProbability

              - id: WordSense-Onnx-OnnxClassifier-TenseEncoder
                title: >-
                  OnnxClassifier shall need the encoder for a same-spelling verb only when it judges tense, and shall
                  reject a request to judge tense when the head has no tense head.
                tags: [unit]
                justification: |
                  A text without such words must still be answered without model files, and a head without the tense
                  section must fail loudly instead of giving no tense.
                tests:
                  - OnnxClassifier_NeedsEncoder_SameSpellingVerb_NeedsTheEncoderOnlyWithTense
                  - OnnxClassifier_Constructor_TenseWithoutTenseHead_Throws
