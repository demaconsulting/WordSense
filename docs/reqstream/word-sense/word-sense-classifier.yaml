---
# WordSenseClassifier unit requirements

sections:
  - title: WordSenseClassifier Requirements
    requirements:
      - id: WordSense-Classifier-Tiles
        title: The classifier shall return tokens that tile the input text exactly.
        tags: [unit]
        justification: |
          Callers rebuild or annotate the text from the tokens; no character may be lost or duplicated.
        tests:
          - WordSenseClassifier_ClassifyAsync_Text_TokensTileInput
          - WordSenseClassifier_ClassifyAsync_NoKnownWords_DoesNotEncode

      - id: WordSense-Classifier-Senses
        title: The classifier shall assign senses only to known lemmas and their inflected forms.
        tags: [unit]
        justification: |
          Unknown words carry no sense, and a single encoder pass per text keeps latency low.
        tests:
          - WordSenseClassifier_ClassifyAsync_Sentence_AssignsSenseToKnownWordOnly
          - WordSenseClassifier_ClassifyAsync_ManyTargets_EncodesOnce
          - WordSenseClassifier_ClassifyAsync_Words_ResolvesForms
          - WordSenseClassifier_ClassifyAsync_Words_EdgeCases
          - WordSenseClassifier_KnownLemmas_And_GetSenses_AreExposed
          - WordSenseClassifier_ClassifyAsync_InfiniteAbstainMarginScale_AlwaysAbstains

      - id: WordSense-Classifier-Abstain
        title: The classifier shall return no sense when the margin is below the per-lemma threshold.
        tags: [unit]
        justification: |
          Abstaining is better than a low-confidence guess.
        tests:
          - WordSenseClassifier_ClassifyAsync_LowMargin_Abstains

      - id: WordSense-Classifier-Detail
        title: >-
          The classifier shall report, on request, a WordSenseDetail with the best sense, the runner-up sense,
          the margin of the best over the runner-up, the margin of the runner-up over the third-best sense and
          whether the classifier abstained, including for words it abstained from.
        tags: [unit]
        justification: |
          Callers that apply their own confidence policy need the evidence behind a decision, including
          decisions the classifier abstained from. The margin is a score difference that is comparable only
          within one lemma, so the runner-up and the abstained flag are reported with it.
        tests:
          - WordSenseClassifier_ClassifyDetailAsync_ReportsMarginsAndRunnerUp
          - WordSenseClassifier_ClassifyDetailAsync_ThreeSenses_ReportsRunnerUpMargin
          - WordSenseClassifier_ClassifyDetailAsync_LowMargin_IsFlaggedAbstained

      - id: WordSense-Classifier-Tags
        title: >-
          The classifier shall answer tag-level queries, scoring a tag by the best sense that carries it,
          and return no answer when the tag is absent or the tag-level margin is too small.
        tags: [unit]
        justification: |
          Callers often need only a coarse property such as noun versus verb; senses that agree on the
          tag must not weaken each other, and an absent tag must never be guessed.
        tests:
          - WordSenseClassifier_ClassifyTagAsync_ReturnsTagOrNull
          - WordSenseClassifier_IsTagAsync_ReturnsBoolOrNull
          - WordSenseClassifier_TagQueries_InvalidArguments_Throw

      - id: WordSense-Classifier-LongText
        title: The classifier shall classify texts longer than the model limit using a window around each target.
        tags: [unit]
        justification: |
          Real documents are longer than the model input limit.
        tests:
          - WordSenseClassifier_ClassifyAsync_LongText_UsesWindowPerTarget

      - id: WordSense-Classifier-Validation
        title: >-
          The classifier shall reject invalid arguments, a table that does not match the encoder model,
          and a user-supplied model directory whose files do not match the pinned model digests.
        tags: [unit]
        justification: |
          A mismatched table and model silently produce wrong senses, and an unverified model directory
          could supply a different model than the table was trained with.
        tests:
          - WordSenseClassifier_Constructor_InvalidArguments_Throw
          - WordSenseClassifier_Constructor_ModelMismatch_Throws
          - WordSense_Classifier_CreateAsync_RejectsUnverifiedDirectory
          - WordSense_Classifier_CreateAsync_ValidatesOptionsBeforeModel

      - id: WordSense-Classifier-Lifetime
        title: The classifier shall support cancellation, concurrent use and disposal of an owned encoder.
        tags: [unit]
        justification: |
          Services call the classifier from many threads and need to cancel long requests.
        tests:
          - WordSenseClassifier_ClassifyAsync_Cancelled_Throws
          - WordSenseClassifier_ClassifyAsync_Concurrent_IsConsistent
          - WordSenseClassifier_Dispose_OwnedEncoder_IsDisposed
