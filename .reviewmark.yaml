# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"  # Verification documentation files
  - "docs/user_guide/**/*.md"    # User guide documentation
  - "docs/sysml2/**/*.sysml"     # SysML2 architecture model
  - "tools/real-text/**"          # Real-text harvest tooling
  - "tools/open-corpus/**"        # Scripts that built the open part-of-speech corpus
  - "corpus/provenance/**"        # Provenance of the sentences of the fine-sense corpus
  - "corpus/open/**"              # Open English POS corpus (CC0 1.0 annotations) and the Basic tagger counts
  - "corpus/lexicon/**"           # Derived part-of-speech lexicon (Moby, public domain) and its provenance
  - "data/schema.yaml"            # Word data schema
  - "data/README.md"              # Word data guide
  - "data/PROVENANCE.md"          # Word data provenance (Open English WordNet, CC BY 4.0)
  - "data/MAPPING.md"             # Coarse class mapping notes
  - "!tools/real-text/cache/**"   # Exclude raw downloaded texts
  - "!tools/open-corpus/cache/**"  # Exclude raw downloaded texts
  - "!tools/open-corpus/work/**"   # Exclude scratch work
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!**/generated/**"            # Exclude generated documentation
  - "!node_modules/**"           # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/WordSense/reviews/index.json

# Global context shown to every reviewer for orientation (not fingerprinted).
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"                              # exclude design intro from user-facing review
    paths:
      - "README.md"                                                 # project readme
      - "docs/user_guide/**/*.md"                                   # user guide
      - "test/DemaConsulting.WordSense.MiniLM.Tests/ReadmeSample.cs"       # README sample code, compiled and run
      - "test/DemaConsulting.WordSense.MiniLM.Tests/ReadmeSampleTests.cs"  # keeps README code and output in sync
      - "test/DemaConsulting.WordSense.MiniLM.Tests/DocSampleText.cs"      # text helpers of the doc-check tests
      - "test/DemaConsulting.WordSense.Basic.Tests/BasicReadmeSample.cs"       # Basic README sample, compiled and run
      - "test/DemaConsulting.WordSense.Basic.Tests/BasicReadmeSampleTests.cs"  # keeps Basic README in sync
      - "test/DemaConsulting.WordSense.Basic.Tests/ModelTableReadmeTests.cs"  # keeps README model table in sync

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that WordSense Decomposition Addresses the Stated Purpose
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "requirements.yaml"                                         # root requirements file
      - "docs/design/introduction.md"                               # design introduction
      - "docs/sysml2/**/*.sysml"                                    # SysML2 model (authoritative structure)

  # WordSense-Architecture Review (one per system)
  - id: WordSense-Architecture
    title: Review that WordSense Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/word-sense.yaml"                      # system requirements
      - "docs/design/introduction.md"                         # design introduction
      - "docs/design/word-sense.md"                           # system design
      - "docs/verification/introduction.md"                   # verification introduction
      - "docs/verification/word-sense.md"                     # system verification
      - "test/DemaConsulting.WordSense.MiniLM.Tests/ReadmeSampleTests.cs"  # end-to-end sample test
      - "test/DemaConsulting.WordSense.Tests/CatalogTests.cs"              # system-level sense catalog tests
      - "test/DemaConsulting.WordSense.Onnx.Tests/ModelAssets.cs"          # integration test helper

  # WordSense-Design Review (one per system)
  - id: WordSense-Design
    title: Review that WordSense Design is Consistent and Complete
    context:
      - "docs/reqstream/word-sense.yaml"
    paths:
